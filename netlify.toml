[build]
  command = "rm -rf _site && mkdir -p _site && cp kyiv-air-alerts-grafana/pages-preview/index.html kyiv-air-alerts-grafana/pages-preview/styles.css kyiv-air-alerts-grafana/pages-preview/app.js kyiv-air-alerts-grafana/pages-preview/features.json kyiv-air-alerts-grafana/pages-preview/chart-share.js kyiv-air-alerts-grafana/pages-preview/brand-mark.svg kyiv-air-alerts-grafana/pages-preview/brand-horizontal-uk-dark.svg kyiv-air-alerts-grafana/pages-preview/brand-horizontal-en-dark.svg kyiv-air-alerts-grafana/pages-preview/favicon.svg kyiv-air-alerts-grafana/pages-preview/favicon-32.png _site/ && cp kyiv-air-alerts-grafana/pages-preview/kpi-range.js kyiv-air-alerts-grafana/pages-preview/weekday-distribution.js kyiv-air-alerts-grafana/pages-preview/weekday-ui.js kyiv-air-alerts-grafana/pages-preview/weekday-dayparts.json kyiv-air-alerts-grafana/pages-preview/active-23-provisional.js kyiv-air-alerts-grafana/pages-preview/active-23-chart-overlay.js _site/ && if [ -s historical-daily-kpi.json ]; then cp historical-daily-kpi.json _site/; fi && cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json && python3 kyiv-air-alerts-grafana/scripts/build_bilingual_html.py --source kyiv-air-alerts-grafana/pages-preview/index.html --output-dir _site && python3 kyiv-air-alerts-grafana/scripts/build_historical_static_archive.py --source historical-daily-kpi.json --output-dir _site"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
