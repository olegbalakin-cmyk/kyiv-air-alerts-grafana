name: H2 isolated PG18 application-role transactional ACL A-B
on:
  push:
    branches: [research-h2-pg18-security-closure-2026-10-20]
    paths:
      - '.github/workflows/h2-pg18-app-role-v3-ab-2026-10-20.yml'
      - 'research/h2_pg18_security_closure_2026-10-20/003_candidate_app_role_v3_atomic.sql'
      - 'research/h2_pg18_security_closure_2026-10-20/test_app_role_v3_pg18.py'
permissions:
  contents: read
jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local PG client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12"
      - name: Execute synthetic PostgreSQL 18 privilege checks
        env:
          H2_COPY: ${{ matrix.copy }}
        run: python research/h2_pg18_security_closure_2026-10-20/test_app_role_v3_pg18.py
      - name: Preserve failure and success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-pg18-v3-${{ matrix.copy }}
          path: /tmp/h2_v3_${{ matrix.copy }}.json
          retention-days: 30
