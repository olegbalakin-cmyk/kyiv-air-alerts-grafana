name: Active23 production current-day browser diagnostic (read only)
on:
  push:
    branches:
      - diagnostics/active23-stale-day-20261121
    paths:
      - ".github/workflows/active23-prod-browser-diagnostic.yml"
      - "tests/active23_prod_browser_diagnostic.py"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspect actual production, never mutate or deploy
        run: python tests/active23_prod_browser_diagnostic.py
      - name: Save read-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active23-live-browser-diagnostic
          path: _active23_diagnostic/
          if-no-files-found: warn
          retention-days: 7
