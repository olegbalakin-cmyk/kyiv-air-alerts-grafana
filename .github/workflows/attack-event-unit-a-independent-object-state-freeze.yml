name: Unit A independent shadow evidence
on:
  push:
    branches:
      - attack-event-unit-a-independent-shadow-gap-evidence-2026-10-10
    paths:
      - .github/workflows/attack-event-unit-a-independent-object-state-freeze.yml
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch authoritative immutable inputs
        run: |
          set -euo pipefail
          git fetch --no-tags origin multicity-wip-2026-09-16
          for sha in d8fe91fdbfdcf8d1b851a52358d7eb441308e0ee 1422e8482303ec9262647ca55fef753a9aa2b3ea 2d07c81147932d39cb3a9d9934830f6eb707ee37 a0eb594dd4240d1d923ca5262725fc42f4807338 6a891372d4d59f9f2454123afcac2a21ef042d68 41bec58604420333dc71910ec38f4a785f6b108e 51adc76b715669e46e8c2c936906022d4d96ed44 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 41ee8d160c34145b9d9a51b9da095084cf342824; do
            git fetch --no-tags origin "$sha"
          done
          test "$(git merge-base HEAD bc29c2ad343b13a3823d37489277a81b689e31d1)" = bc29c2ad343b13a3823d37489277a81b689e31d1
          test "$(git rev-parse origin/main)" = bc29c2ad343b13a3823d37489277a81b689e31d1
          test "$(git rev-parse origin/main:PROJECT_STATE.md)" = 99def0ee6b5d5399af0501f0043f11c63be75ae2
          test "$(git rev-parse origin/main:CHANGELOG.md)" = bd57e7832181bd203095ea62a79dc26f46134d45
      - name: Offline A3 canonical universe
        env:
          GIT_NO_LAZY_FETCH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B .github/proof/attack_event_unit_a_a4_resume3.py --offline
          python3 -c 'import json; r=json.load(open(".github/proof/.unit_a_shadow_offline_gate.tmp.json")); assert r["A4_OFFLINE_PROJECTION_GATE"]=="PASS" and r["A4_CANONICAL_PROJECTION_GATE"]=="PASS" and not r["neon"]["contacted"]'
      - name: Install psycopg
        if: success()
        run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'
      - name: Independent read-only Neon snapshot
        if: success()
        env:
          PHASE1_PROD_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          PHASE1_PROD_SHADOW_BRANCH_ID: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B .github/proof/attack_event_unit_a_independent_shadow_object_state.py
      - name: Freeze proof and remove temporary scripts
        if: always()
        run: |
          set -euo pipefail
          artifact=research/attack_event_unit_a_independent_shadow_gap_state_evidence_2026-10-10.json
          test -f "$artifact"
          python3 -c 'import json; r=json.load(open("research/attack_event_unit_a_independent_shadow_gap_state_evidence_2026-10-10.json")); assert r["A5_AUTHORIZED"]=="NO" and r["A4_ACCEPTANCE_GATE"]=="NOT_RUN" and r["neon"]["committed_writes"]==0; assert (r["coverage"]["total"]==6698 and r["hashes"]["equality"]=="PASS") if r["OBJECT_STATE_EVIDENCE_GATE"]=="PASS" else bool(r["first_failing_gate"])'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze independent Unit A Neon object-state evidence"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_SHA256=$(sha256sum "$artifact" | cut -d' ' -f1)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          before="$(git hash-object "$artifact")"
          rm -f .github/proof/attack_event_unit_a_a4_resume3.py .github/proof/attack_event_unit_a_independent_shadow_object_state.py .github/proof/.unit_a_independent_projection.tmp.json .github/proof/.unit_a_shadow_offline_gate.tmp.json .github/workflows/attack-event-unit-a-independent-object-state-freeze.yml
          git add -A .github/proof/attack_event_unit_a_a4_resume3.py .github/proof/attack_event_unit_a_independent_shadow_object_state.py .github/workflows/attack-event-unit-a-independent-object-state-freeze.yml
          git commit -m "Clean temporary Unit A snapshot runner"
          test "$before" = "$(git hash-object "$artifact")"
          test "$(git diff --name-status bc29c2ad343b13a3823d37489277a81b689e31d1..HEAD)" = "$(printf 'A\tresearch/attack_event_unit_a_independent_shadow_gap_state_evidence_2026-10-10.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "TEMP_WORKFLOW_REMOVED=YES"
          echo "TEMP_HARNESS_REMOVED=YES"
          git push origin HEAD:attack-event-unit-a-independent-shadow-gap-evidence-2026-10-10
