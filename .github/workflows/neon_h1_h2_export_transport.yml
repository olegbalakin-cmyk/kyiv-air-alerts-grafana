name: Disposable H1 H2 exact Git export inspection
on:
  push:
    branches:
      - neon-h1-h2-large-export-authority-transport-2026-10-11
    paths:
      - .github/workflows/neon_h1_h2_export_transport.yml
permissions:
  contents: read
jobs:
  inspect-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact bytes and inspect structure without database access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tempfile
          def git(*args):
              return subprocess.check_output(["git",*args],text=True,stderr=subprocess.STDOUT).strip()
          targets=[
            ("H2","03a04d33f7616b77181741fd77a776c490391d07","research/attack_event_18city_persistence_identity_export_v2_2026-10-04.json","a240f1950748afcb9fc974c49ac58da07adfff65",60509907),
            ("H1","02ad2e8fadee78442753567bc2d3a540345d8e8a","research/attack_event_5city_persistence_identity_export_v2_2026-10-04.json","a2e34c4a114ad335d35068d6c6a3a4606b09db7f",29774541),
            ("COMBINED","efefa399e69eadd3d7fc8393ac1553cfde35f138","research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json","8a2f6bd33f879be9db978da59c12c34e61f6f843",90282029)
          ]
          for label,commit,path,blob,size in targets:
              subprocess.check_call(["git","fetch","--no-tags","--depth=1","origin",commit],stdout=subprocess.DEVNULL)
          def shape(x,level=0):
              if isinstance(x,dict):
                  v={"type":"object","keys":list(x.keys())[:80],"length":len(x)}
                  if level<3:
                      v["children"]={k:shape(val,level+1) for k,val in list(x.items())[:35]}
                  return v
              if isinstance(x,list):
                  v={"type":"array","length":len(x)}
                  if x and level<4:v["first"]=shape(x[0],level+1)
                  return v
              return {"type":type(x).__name__}
          def metacandidates(o):
              if not isinstance(o,dict):return {}
              out={}
              pat=re.compile(r'^(schema_version|created_at|creation_timestamp|generated_at|generated_by|methodology|source|source_inputs|origin|database|neon|branch|classifier|source_head|provenance|commit|production|snapshot|input_manifest|reference|authority|as_of|export_date|run_id)$',re.I)
              for k,v in o.items():
                  if pat.search(k):
                      if isinstance(v,(int,float,bool)) or v is None:out[k]=v
                      elif isinstance(v,str):out[k]=v[:400]
                      elif isinstance(v,dict):out[k]={"keys":list(v.keys())[:50]}
                      elif isinstance(v,list):out[k]={"length":len(v),"sample_type":type(v[0]).__name__ if v else None}
              return out
          output={"runner_git_commit":git("rev-parse","HEAD"),"objects":{}}
          for label,commit,path,blob,size in targets:
              v=git("rev-parse",commit+":"+path)
              observed_size=int(git("cat-file","-s",blob))
              if v!=blob or observed_size!=size:raise RuntimeError(label+" SHA/size mismatch")
              with tempfile.NamedTemporaryFile(delete=False) as tmp:
                  subprocess.run(["git","cat-file","blob",blob],check=True,stdout=tmp)
                  fn=tmp.name
              sh=hashlib.sha256()
              with open(fn,"rb") as f:
                  while True:
                      b=f.read(4*1024*1024)
                      if not b:break
                      sh.update(b)
              file_size=os.stat(fn).st_size
              objhash=git("hash-object",fn)
              if file_size!=size or objhash!=blob:raise RuntimeError(label+" content rehash mismatch")
              with open(fn,"r",encoding="utf-8") as f:data=json.load(f)
              info={"commit":commit,"path":path,"expected_blob":blob,"observed_blob":v,"bytes":file_size,
                    "content_sha256":sh.hexdigest(),"retrieved_exact":True,"parsed":True,
                    "structure":shape(data),"metadata_candidates":metacandidates(data),
                    "producing_commit_info":git("show","-s","--format=%H | %P | %aI | %cI | %s",commit),
                    "producing_commit_files":git("diff-tree","--no-commit-id","--name-status","-r",commit).splitlines()[:30]}
              output["objects"][label]=info
              os.unlink(fn)
          print("EXACT_EXPORT_INSPECTION_JSON="+json.dumps(output,ensure_ascii=False,sort_keys=True,separators=(",",":")))
          PY
