name: Temporary Sumy remaining v2 rule gaps proof

on:
  push:
    branches:
      - sumy-v2-remaining-rule-gaps-proof-2026-09-27
    paths:
      - ".github/workflows/sumy-v2-remaining-rule-gaps-proof-temp.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r kyiv-air-alerts-grafana/requirements.txt pytest

      - name: Prepare exact baseline and implementation worktrees
        shell: bash
        run: |
          set -euo pipefail
          BASE=29364ca6d1275e9fbbca657f5f20a2ec4f7eb179
          POST=626c7ae5f686cfd06a876b99f4d7ad9dbe27f39f
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          git worktree add "$RUNNER_TEMP/post" "$POST"
          test "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" = "$BASE"
          test "$(git -C "$RUNNER_TEMP/post" rev-parse HEAD)" = "$POST"
          test "$(git rev-parse origin/historical-attack-event-backfill-2026-09-27)" = "5809bd677a93e6c2f6a1bff9cb7f6b5bde0c7c1e"

      - name: Run focused and inherited regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             "$RUNNER_TEMP/post/kyiv-air-alerts-grafana/tests/test_historical_replay_remaining_v2_roles.py"             "$RUNNER_TEMP/post/kyiv-air-alerts-grafana/tests/test_historical_replay_strike_roles.py"
          python "$RUNNER_TEMP/post/kyiv-air-alerts-grafana/scripts/replay_explosion_history.py" --self-test
          python "$RUNNER_TEMP/post/kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py" --self-test

      - name: Run real Sumy baseline replay
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/base/kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"             --repo-root "$RUNNER_TEMP/base/kyiv-air-alerts-grafana"             --city sumy --through 2026-09-17             --input-head 29364ca6d1275e9fbbca657f5f20a2ec4f7eb179             --read-only --output "$RUNNER_TEMP/sumy-baseline.json"

      - name: Run real Sumy post-fix replay
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/post/kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"             --repo-root "$RUNNER_TEMP/post/kyiv-air-alerts-grafana"             --city sumy --through 2026-09-17             --input-head 626c7ae5f686cfd06a876b99f4d7ad9dbe27f39f             --read-only --output "$RUNNER_TEMP/sumy-post.json"

      - name: Run same cross-city replay regression
        shell: bash
        run: |
          set -euo pipefail
          for city in sevastopol lviv; do
            python "$RUNNER_TEMP/base/kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"               --repo-root "$RUNNER_TEMP/base/kyiv-air-alerts-grafana"               --city "$city" --through 2026-09-17               --input-head 29364ca6d1275e9fbbca657f5f20a2ec4f7eb179               --read-only --output "$RUNNER_TEMP/$city-baseline.json"
            python "$RUNNER_TEMP/post/kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"               --repo-root "$RUNNER_TEMP/post/kyiv-air-alerts-grafana"               --city "$city" --through 2026-09-17               --input-head 626c7ae5f686cfd06a876b99f4d7ad9dbe27f39f               --read-only --output "$RUNNER_TEMP/$city-post.json"
          done

      - name: Build and assert exact proof delta
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_TEMP="$RUNNER_TEMP" python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import subprocess
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          base_root = tmp / "base"
          post_root = tmp / "post"
          baseline = json.loads((tmp / "sumy-baseline.json").read_text(encoding="utf-8"))
          post = json.loads((tmp / "sumy-post.json").read_text(encoding="utf-8"))

          targets = {
              "2b3df2af5d1a6eb3a0a5b5e6",
              "57813e54f364c6ea1c31b79d",
              "b350026329e2fb7dee324d0b",
              "bc17e3913b1f9a7b78cf8af7",
              "d4ca36a6f8fdb93684f7b2c2",
          }
          out_scope = {
              "2c7ad2e0b42e1350e305a18f",
              "402035df8980628fa245c4e8",
              "45050b31bdcf42a5f8054e8d",
              "90a484f51b321e0950e31b60",
              "c69285b7ffb05693c3393895",
          }

          def cmap(payload):
              return {row["episode_id"]: row for row in payload.get("changed_episodes", [])}

          bmap, pmap = cmap(baseline), cmap(post)
          b_ids, p_ids = set(bmap), set(pmap)
          removed = sorted(b_ids - p_ids)
          added = sorted(p_ids - b_ids)

          def event_types(row):
              out = []
              for code in row.get("reason_codes", []):
                  if code.startswith("ATTACK_EVENT_TYPES:"):
                      out.extend(x for x in code.split(":", 1)[1].split(",") if x)
              return sorted(set(out))

          def load_replay(root, name):
              path = root / "kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              spec.loader.exec_module(mod)
              return mod

          def audit(root, wanted, name):
              repo_root = root / "kyiv-air-alerts-grafana"
              replay = load_replay(root, name)
              monitor = replay.import_monitor(repo_root)
              baseline_data = replay.load_json(repo_root / "data/explosion_audited_baseline.json")
              episodes, _ = replay.load_historical_episodes(repo_root, "sumy", monitor)
              episodes = replay.filter_window(
                  episodes,
                  str(baseline_data["cities"]["sumy"]["coverage_start"]),
                  "2026-09-17",
                  monitor,
              )
              evidence = replay.load_json(
                  repo_root / "data/explosion_research/sumy/final_evidence.json"
              )
              out = {}
              for bucket in ("strict_events", "sensitivity_only_events", "review_events"):
                  for row in evidence.get(bucket) or []:
                      binding = replay.bind_evidence_record(row, episodes, monitor)
                      eid = binding.get("episode_id")
                      if eid not in wanted:
                          continue
                      candidate = replay.candidate_from_history("sumy", row, bucket, eid, monitor)
                      decision = monitor.classify_candidate(
                          candidate, "sumy", episodes, replay.manual_matching(eid)
                      )
                      out[eid] = {
                          "bucket": bucket,
                          "binding": binding,
                          "evidence": replay.evidence_text(row),
                          "proposed_outcome": decision.get("proposed_outcome"),
                          "event_types": (
                              decision.get("strict_explosion_evidence") or {}
                          ).get("event_types") or [],
                          "reason_codes": decision.get("reason_codes") or [],
                          "same_attack_basis": (
                              (decision.get("review_provenance_adapter") or {})
                              .get("same_attack_context") or {}
                          ).get("basis"),
                          "sensitivity_basis": decision.get("sensitivity_basis"),
                      }
              return out

          audit_ids = targets | out_scope
          base_audit = audit(base_root, audit_ids, "replay_base_remaining")
          post_audit = audit(post_root, audit_ids, "replay_post_remaining")

          cross = {}
          cross_clean = True
          for city in ("sevastopol", "lviv"):
              a = json.loads((tmp / f"{city}-baseline.json").read_text(encoding="utf-8"))
              b = json.loads((tmp / f"{city}-post.json").read_text(encoding="utf-8"))
              fields = (
                  "episodes_checked",
                  "replayed_strict_episodes",
                  "replayed_sensitivity_episodes",
                  "changed_episodes",
                  "errors",
                  "protected_files_unchanged",
              )
              clean = all(a.get(k) == b.get(k) for k in fields)
              cross[city] = {
                  "clean": clean,
                  "strict_before": a.get("replayed_strict_episodes"),
                  "strict_after": b.get("replayed_strict_episodes"),
                  "sensitivity_before": a.get("replayed_sensitivity_episodes"),
                  "sensitivity_after": b.get("replayed_sensitivity_episodes"),
                  "qa_before": len(a.get("changed_episodes", [])),
                  "qa_after": len(b.get("changed_episodes", [])),
              }
              cross_clean = cross_clean and clean

          diff_files = subprocess.check_output(
              ["git", "-C", str(post_root), "diff", "--name-only",
               "29364ca6d1275e9fbbca657f5f20a2ec4f7eb179",
               "626c7ae5f686cfd06a876b99f4d7ad9dbe27f39f"],
              text=True,
          ).splitlines()
          allowed_files = {
              ".github/workflows/sumy-v2-remaining-rule-gaps-proof-temp.yml",
              "kyiv-air-alerts-grafana/scripts/replay_explosion_history.py",
              "kyiv-air-alerts-grafana/tests/test_historical_replay_remaining_v2_roles.py",
          }
          protected_tree_clean = set(diff_files) == allowed_files

          result = {
              "baseline": {
                  "denominator": baseline.get("episodes_checked"),
                  "qa_count": len(baseline.get("changed_episodes", [])),
                  "qa_ids": sorted(b_ids),
                  "strict": baseline.get("replayed_strict_episodes"),
                  "sensitivity": baseline.get("replayed_sensitivity_episodes"),
                  "protected_files_unchanged": baseline.get("protected_files_unchanged"),
              },
              "post": {
                  "denominator": post.get("episodes_checked"),
                  "qa_count": len(post.get("changed_episodes", [])),
                  "qa_ids": sorted(p_ids),
                  "strict": post.get("replayed_strict_episodes"),
                  "sensitivity": post.get("replayed_sensitivity_episodes"),
                  "protected_files_unchanged": post.get("protected_files_unchanged"),
              },
              "removed_qa_ids": removed,
              "added_qa_ids": added,
              "added_qa_rows": {eid: pmap[eid] for eid in added},
              "targets_removed": targets == set(removed),
              "out_of_scope_qa_unchanged": (
                  out_scope == p_ids
                  and all(
                      bmap[eid].get("category") == pmap[eid].get("category")
                      and bmap[eid].get("reason_codes") == pmap[eid].get("reason_codes")
                      for eid in out_scope
                  )
              ),
              "target_classification_before": {
                  eid: base_audit.get(eid) for eid in sorted(targets)
              },
              "target_classification_after": {
                  eid: post_audit.get(eid) for eid in sorted(targets)
              },
              "out_of_scope_audit_before": {
                  eid: base_audit.get(eid) for eid in sorted(out_scope)
              },
              "out_of_scope_audit_after": {
                  eid: post_audit.get(eid) for eid in sorted(out_scope)
              },
              "cross_city": cross,
              "cross_city_clean": cross_clean,
              "implementation_diff_files": diff_files,
              "protected_tree_clean": protected_tree_clean,
              "unexplained_drift": False,
          }

          print("ACTUAL_PROOF_RESULT=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          expected_baseline = {
              "denominator": 2297,
              "qa_count": 10,
              "strict": 197,
              "sensitivity": 228,
          }
          for key, value in expected_baseline.items():
              assert result["baseline"][key] == value, (key, result["baseline"][key], value)
          assert b_ids == targets | out_scope
          assert result["post"]["denominator"] == 2297
          assert result["post"]["qa_count"] == 5
          assert result["removed_qa_ids"] == sorted(targets)
          assert not added
          assert result["targets_removed"]
          assert result["out_of_scope_qa_unchanged"]
          assert result["post"]["strict"] == 201
          assert result["post"]["sensitivity"] == 233
          assert baseline.get("protected_files_unchanged") is True
          assert post.get("protected_files_unchanged") is True
          assert protected_tree_clean
          assert cross_clean

          expected_after = {
              "2b3df2af5d1a6eb3a0a5b5e6": ("approved_strict", ["explosion"]),
              "57813e54f364c6ea1c31b79d": ("approved_strict", ["strike"]),
              "b350026329e2fb7dee324d0b": ("approved_strict", ["strike"]),
              "bc17e3913b1f9a7b78cf8af7": ("approved_sensitivity", ["impact"]),
              "d4ca36a6f8fdb93684f7b2c2": ("approved_strict", ["impact"]),
          }
          for eid, (outcome, types) in expected_after.items():
              row = post_audit[eid]
              assert row["proposed_outcome"] == outcome, (eid, row)
              assert row["event_types"] == types, (eid, row)
          assert post_audit["bc17e3913b1f9a7b78cf8af7"]["sensitivity_basis"] == "near_boundary"

          (tmp / "proof-summary.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumy-v2-remaining-rule-gaps-proof
          path: |
            ${{ runner.temp }}/sumy-baseline.json
            ${{ runner.temp }}/sumy-post.json
            ${{ runner.temp }}/sevastopol-baseline.json
            ${{ runner.temp }}/sevastopol-post.json
            ${{ runner.temp }}/lviv-baseline.json
            ${{ runner.temp }}/lviv-post.json
            ${{ runner.temp }}/proof-summary.json
          if-no-files-found: warn
          retention-days: 30
