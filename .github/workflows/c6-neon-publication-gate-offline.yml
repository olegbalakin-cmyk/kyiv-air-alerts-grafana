name: C6 six-JSON publication gate offline (READ-ONLY)
on:
  push:
    branches: [research-c6-neon-json-publication-gate-2026-11-12]
    paths:
      - "scripts/c6_neon_publication_gate.py"
      - "tests/test_c6_neon_publication_gate.py"
      - ".github/workflows/c6-neon-publication-gate-offline.yml"
permissions:
  contents: read
  actions: read
jobs:
  proof-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      C6_PINNED_PHYSICAL_PROOF: /tmp/c6-publication-physical-proof
    steps:
      - name: Checkout isolated research guard only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download accepted C6 physical proof; no DB or source HTTP
        run: |
          mkdir -p "$C6_PINNED_PHYSICAL_PROOF" /tmp/c6-pub-gate
          gh run download 43187464328 -R "$GITHUB_REPOSITORY" -n isolated-neon-shadow-43187464328-1 -D "$C6_PINNED_PHYSICAL_PROOF"
      - name: Verify complete SHA evidence and explicit non-publishing verdict
        run: |
          python scripts/c6_neon_publication_gate.py \
            --proof-dir "$C6_PINNED_PHYSICAL_PROOF" \
            --as-of "2026-11-12T08:59:49.698119+00:00" \
            --report /tmp/c6-pub-gate/VERDICT.json
          python - <<'PY'
          import json
          v=json.load(open('/tmp/c6-pub-gate/VERDICT.json'))
          assert v['status']=='PASS_SCOPED_PROOF_NO_PUBLICATION'
          assert v['production_publication_allowed'] is False
          assert len(v['candidate_files'])==6
          print('C6_PUBLICATION_PREFLIGHT_PASS; PRODUCTION_PUBLICATION_BLOCKED')
          PY
      - name: Negative and fail-closed regression against real proof
        run: python -m unittest discover -s tests -p test_c6_neon_publication_gate.py -v
      - name: Save credential-free acceptance verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-neon-publication-preflight-${{ github.run_id }}
          path: /tmp/c6-pub-gate/VERDICT.json
          retention-days: 30
          if-no-files-found: warn
