name: H2 restricted CAS and rollback synthetic PG18 A-B
on:
  push:
    branches: [research-h2-restricted-cas-rollback-pg18-2026-10-20]
    paths:
      - '.github/workflows/h2-restricted-cas-rollback-pg18-2026-10-20.yml'
      - 'research/h2_pg18_full_offline_2026-10-20/restricted_cas/**'
permissions:
  contents: read
jobs:
  synthetic-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
      H2_PG18_OWNER_DSN: postgresql://h2_local:synthetic_only@127.0.0.1:5432/postgres
      H2_PG18_WRITER_DSN: postgresql://h2_app_writer_test:synthetic_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic PostgreSQL test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
      - name: Verify original v3 A/B archives (Git only)
        run: python research/h2_pg18_full_offline_2026-10-20/v3_original_artifacts/verify_v3_original.py
      - name: Actual restricted app writer, transaction and main E2E
        run: python research/h2_pg18_full_offline_2026-10-20/restricted_cas/test_restricted_cas_pg18.py
      - name: Full schema, ACL, role and owner rollback negative and positive tests
        if: always()
        run: python research/h2_pg18_full_offline_2026-10-20/restricted_cas/test_full_rollback_pg18.py
      - name: Preserve original execution report on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-restricted-cas-${{ matrix.copy }}
          path: |
            /tmp/h2_restricted_cas_${{ matrix.copy }}.json
            /tmp/h2_full_rollback_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
