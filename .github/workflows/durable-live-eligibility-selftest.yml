name: Durable live eligibility self-test

on:
  push:
    branches: [attack-event-live-durable-eligibility-2026-10-07]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt
      - name: Durable eligibility and classifier wiring self-test
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/monitor_explosion_candidates.py --self-test
