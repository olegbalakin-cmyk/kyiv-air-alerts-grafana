name: Attack-event partitioned classification recovery audit
# Isolated read-only recovery-planning audit. Never merge into production.

on:
  push:
    branches: [attack-event-partitioned-classification-recovery-audit-2026-10-06]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: attack-event-partitioned-classification-recovery-audit-2026-10-06
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUDIT_BRANCH: attack-event-partitioned-classification-recovery-audit-2026-10-06
      FROZEN_COMMIT: 48099cd6d93c2b911e331e79b5141dd482d242a8
      HISTORICAL_BRANCH: historical-attack-event-backfill-2026-09-27
      HISTORICAL_HEAD: 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453
      LIVE_BRANCH: multicity-wip-2026-09-16
      OUT_PATH: research/attack_event_partitioned_classification_recovery_audit_2026-10-06.json
      SUMMARY_PATH: /tmp/attack_event_partitioned_classification_recovery_audit_summary.json

    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_BRANCH }}
          fetch-depth: 0

      - name: Fetch pinned authorities and immutable history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin             "$HISTORICAL_BRANCH:$HISTORICAL_BRANCH"             "$LIVE_BRANCH:$LIVE_BRANCH"
          test "$(git rev-parse "$FROZEN_COMMIT^{commit}")" = "$FROZEN_COMMIT"
          test "$(git rev-parse "$HISTORICAL_HEAD^{commit}")" = "$HISTORICAL_HEAD"
          test "$(git rev-parse "$HISTORICAL_BRANCH")" = "$HISTORICAL_HEAD"

      - name: Verify frozen continuity artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$FROZEN_COMMIT:research/attack_event_classification_continuity_audit_2026-10-06.json")" = "57240aa3569b342f317f077b026928c2de21cfc8"
          actual="$(git show "$FROZEN_COMMIT:research/attack_event_classification_continuity_audit_2026-10-06.json" | sha256sum | awk '{print $1}')"
          test "$actual" = "6bf02b2686f3f37de31965ebda786969cdcc83a80a27cf2a452f3de31158932c"

      - name: Assert zero database access configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB environment variable: $key"; exit 1; }
          done

      - name: Run read-only partitioned recovery audit
        id: audit
        shell: bash
        env:
          RECOVERY_SUMMARY_FALLBACK: ${{ env.SUMMARY_PATH }}
        run: |
          set +e
          python .github/proof/attack_event_partitioned_classification_recovery_audit.py             --out "$OUT_PATH"             --summary "$SUMMARY_PATH"             --run-id "$GITHUB_RUN_ID"             --job-id "$GITHUB_JOB"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -s "$SUMMARY_PATH"
          cat "$SUMMARY_PATH"
          exit 0

      - name: Upload compact summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-partitioned-recovery-summary-${{ github.run_id }}
          path: ${{ env.SUMMARY_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit durable recovery audit artifact on isolated branch
        if: steps.audit.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_PATH"
          git commit -m "Freeze partitioned classification recovery audit"
          git push origin HEAD:"$AUDIT_BRANCH"

      - name: Emit durable artifact identity
        if: steps.audit.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          blob="$(git rev-parse "HEAD:$OUT_PATH")"
          sha="$(sha256sum "$OUT_PATH" | awk '{print $1}')"
          echo "DURABLE_COMMIT=$commit"
          echo "DURABLE_PATH=$OUT_PATH"
          echo "DURABLE_BLOB=$blob"
          echo "DURABLE_SHA256=$sha"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ["SUMMARY_PATH"])
          d=json.loads(p.read_text(encoding="utf-8"))
          d["durable_artifact_commit"]=os.popen("git rev-parse HEAD").read().strip()
          d["durable_artifact_path"]=os.environ["OUT_PATH"]
          d["durable_artifact_blob"]=os.popen(f"git rev-parse HEAD:{os.environ['OUT_PATH']}").read().strip()
          d["durable_artifact_sha256"]=hashlib.sha256(Path(os.environ["OUT_PATH"]).read_bytes()).hexdigest()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload final compact summary with durable identity
        if: steps.audit.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-partitioned-recovery-final-${{ github.run_id }}
          path: ${{ env.SUMMARY_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail blocked or invalid audit after preserving summary
        if: steps.audit.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Partitioned recovery audit blocked or invalid; see compact summary artifact."
          exit 1
