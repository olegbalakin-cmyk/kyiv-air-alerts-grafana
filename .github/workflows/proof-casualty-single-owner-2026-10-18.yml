name: Isolated casualty UkraineAlarm single-owner offline proof
on:
  push:
    branches: [proof-casualty-ukrainealarm-single-owner-2026-10-18]
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_casualty_candidates.py"
      - "research/casualty_single_owner_2026-10-18/**"
      - ".github/workflows/proof-casualty-single-owner-2026-10-18.yml"
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline runtime dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify pinned baseline and synthetic local-only proof
        run: |
          python research/casualty_single_owner_2026-10-18/test_offline.py > "$RUNNER_TEMP/casualty-proof.json"
          python -m json.tool "$RUNNER_TEMP/casualty-proof.json" > /dev/null
          cat "$RUNNER_TEMP/casualty-proof.json"
      - name: Upload synthetic proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: casualty-single-owner-offline-receipt
          path: ${{ runner.temp }}/casualty-proof.json
