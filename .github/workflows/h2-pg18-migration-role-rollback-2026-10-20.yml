name: H2 isolated PG18 migration role rollback A-B
on:
  push:
    branches: [research-h2-pg18-migration-role-rollback-2026-10-20]
    paths:
      - 'research/h2_pg18_migration_role_rollback_2026-10-20/**'
      - '.github/workflows/h2-pg18-migration-role-rollback-2026-10-20.yml'
permissions:
  contents: read
jobs:
  synthetic-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup PostgreSQL client and psycopg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12"
      - name: Execute A-B migration and role checks
        env:
          H2_COPY: ${{ matrix.copy }}
        run: python research/h2_pg18_migration_role_rollback_2026-10-20/test_migration_pg18.py
      - name: Archive original reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-pg18-migration-${{ matrix.copy }}
          path: /tmp/h2_migration_${{ matrix.copy }}.json
          retention-days: 30
