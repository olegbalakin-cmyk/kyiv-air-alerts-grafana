name: Unit A A4 v5 independent offline re-acceptance
on:
  push:
    branches:
      - attack-event-unit-a-a4-independent-reacceptance-v5-2026-10-10
    paths:
      - .github/workflows/attack-event-unit-a-a4-independent-reacceptance-v5.yml
permissions:
  contents: write
jobs:
  a4-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch frozen Git authorities, no database
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin multicity-wip-2026-09-16
          for sha in \
            36a5989229ed5c1ad1cd07fbb61df5033af22681 \
            e41a704e9ebb0ff673d5d46510f805d668598df1 \
            d8fe91fdbfdcf8d1b851a52358d7eb441308e0ee \
            1422e8482303ec9262647ca55fef753a9aa2b3ea \
            2d07c81147932d39cb3a9d9934830f6eb707ee37 \
            a0eb594dd4240d1d923ca5262725fc42f4807338 \
            6a891372d4d59f9f2454123afcac2a21ef042d68 \
            41bec58604420333dc71910ec38f4a785f6b108e \
            51adc76b715669e46e8c2c936906022d4d96ed44 \
            71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 \
            41ee8d160c34145b9d9a51b9da095084cf342824; do
            git fetch --no-tags origin "$sha"
          done
          test "$(git merge-base HEAD 3268213ef1d59db8069a588ba1d6d115a98ea825)" = 3268213ef1d59db8069a588ba1d6d115a98ea825
      - name: Execute independent offline proof (no secrets or DB)
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test -z "${PHASE1_PROD_SHADOW_DATABASE_URL:-}"
          python3 -B .github/proof/attack_event_unit_a_a4_independent_reacceptance_v5.py
          python3 - <<'PY'
          import json
          p="research/attack_event_execution_unit_a_a4_independent_reacceptance_v5_2026-10-10.json"
          r=json.load(open(p))
          assert r["A5_AUTHORIZED"] == "NO"
          assert all(v == 0 for k,v in r["safety"].items() if k!="production_mutation")
          assert r["safety"]["production_mutation"]=="NO"
          if r["A4_ACCEPTANCE_GATE"]=="PASS":
              assert r["A5_MANIFEST_ACCEPTED"]=="YES"
              assert r["preconditions"]["checked"] == r["preconditions"]["complete"]
              assert r["preconditions"]["incomplete"] == 0
          else:
              assert r["first_failing_gate"], "blocked report must name first gate"
          PY
      - name: Freeze exact result, cleanup temporary proof, verify single-file diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact=research/attack_event_execution_unit_a_a4_independent_reacceptance_v5_2026-10-10.json
          if ! test -f "$artifact"; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/attack_event_execution_unit_a_a4_independent_reacceptance_v5_2026-10-10.json")
          r={"schema_version":1,"kind":"unit_a_a4_independent_offline_reacceptance_v5",
             "verdict":"ATTACK-EVENT EXECUTION UNIT A A4 CHECKPOINT ACCEPTANCE = BLOCKED",
             "A4_ACCEPTANCE_GATE":"FAIL","A5_MANIFEST_ACCEPTED":"NO",
             "A5_AUTHORIZED":"NO","first_failing_gate":"PREFLIGHT_OR_RUNNER_FAILURE",
             "execution_base_main":"3268213ef1d59db8069a588ba1d6d115a98ea825",
             "safety":{"neon_connections":0,"sql_queries":0,"db_writes":0,"a5_executions":0,
                       "production_mutation":"NO"}}
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(r,sort_keys=True,indent=2)+"\n")
          PY
          fi
          python3 - <<'PY'
          import json
          r=json.load(open("research/attack_event_execution_unit_a_a4_independent_reacceptance_v5_2026-10-10.json"))
          assert r["A5_AUTHORIZED"]=="NO"
          assert r["A4_ACCEPTANCE_GATE"] in ("PASS","FAIL")
          if r["A4_ACCEPTANCE_GATE"]=="FAIL":assert r["first_failing_gate"]
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze independent Unit A A4 v5 acceptance result"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          echo "ARTIFACT_SHA256=$(sha256sum "$artifact" | cut -d' ' -f1)"
          before="$(git hash-object "$artifact")"
          rm -f .github/proof/attack_event_unit_a_a4_independent_reacceptance_v5.py
          rm -f .github/workflows/attack-event-unit-a-a4-independent-reacceptance-v5.yml
          git add -A .github/proof/attack_event_unit_a_a4_independent_reacceptance_v5.py .github/workflows/attack-event-unit-a-a4-independent-reacceptance-v5.yml
          git commit -m "Remove temporary Unit A A4 v5 proof harness and workflow"
          test "$before" = "$(git hash-object "$artifact")"
          test "$(git diff --name-status 3268213ef1d59db8069a588ba1d6d115a98ea825..HEAD)" = "$(printf 'A\tresearch/attack_event_execution_unit_a_a4_independent_reacceptance_v5_2026-10-10.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "TEMP_WORKFLOW_REMOVED=YES"
          echo "TEMP_HARNESS_REMOVED=YES"
          echo "PRODUCTION_MUTATION=NO"
          git push origin HEAD:attack-event-unit-a-a4-independent-reacceptance-v5-2026-10-10
