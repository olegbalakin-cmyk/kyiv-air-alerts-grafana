name: Attack-event classifier hardening

on:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/audit_attack_event_classifier.py"
      - ".github/workflows/attack-event-classifier-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Run classifier regression self-test
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/monitor_explosion_candidates.py --self-test

      - name: Run read-only old-vs-new queue control replay
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/audit_attack_event_classifier.py
