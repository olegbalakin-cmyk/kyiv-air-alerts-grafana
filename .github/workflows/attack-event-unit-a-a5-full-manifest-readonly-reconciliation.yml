name: Unit A A5 read-only full-manifest reconciliation
on:
  push:
    branches:
      - unit-a-a5-full-manifest-readonly-reconciliation-2026-10-10
    paths:
      - .github/workflows/attack-event-unit-a-a5-full-manifest-readonly-reconciliation.yml
      - .github/proof/attack_event_unit_a_a5_full_manifest_readonly_reconciliation.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-readonly:
    if: github.ref == 'refs/heads/unit-a-a5-full-manifest-readonly-reconciliation-2026-10-10'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check proof isolation and fetch all pinned frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD f068de2132c4d1e2ce2d0b3489edecade3fa345c)" = f068de2132c4d1e2ce2d0b3489edecade3fa345c
          for sha in \
            b3708f2d3b18ca4e877e8fae0e923ada72f845a7 \
            3bd876ef0f81f6138c0665d8e41ed5843fb44894 \
            bca72a36986581730eb966ff95849dca19aa1574 \
            01b5e4933f5aa717a844c1ac57ed7a525b68e5ae \
            6bf16057f57fa7949e17c658b560032b3cd57f0f \
            36a5989229ed5c1ad1cd07fbb61df5033af22681 \
            e41a704e9ebb0ff673d5d46510f805d668598df1 \
            d8fe91fdbfdcf8d1b851a52358d7eb441308e0ee \
            1422e8482303ec9262647ca55fef753a9aa2b3ea \
            2d07c81147932d39cb3a9d9934830f6eb707ee37 \
            a0eb594dd4240d1d923ca5262725fc42f4807338 \
            6a891372d4d59f9f2454123afcac2a21ef042d68 \
            41bec58604420333dc71910ec38f4a785f6b108e \
            51adc76b715669e46e8c2c936906022d4d96ed44 \
            71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 \
            41ee8d160c34145b9d9a51b9da095084cf342824; do
            git fetch --no-tags origin "$sha"
          done
      - name: Install bounded PostgreSQL client
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'
      - name: Reconstruct exact frozen A5 manifest and inspect read-only Neon snapshot
        shell: bash
        env:
          PHASE1_PROD_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          PHASE1_PROD_SHADOW_BRANCH_ID: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          python3 -B .github/proof/attack_event_unit_a_a5_full_manifest_readonly_reconciliation.py
      - name: Freeze deterministic read-only evidence on proof branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact=research/attack_event_unit_a_a5_full_manifest_readonly_reconciliation_2026-10-10.json
          test -f "$artifact"
          python3 - <<'PY'
          import json
          p="research/attack_event_unit_a_a5_full_manifest_readonly_reconciliation_2026-10-10.json"
          v=json.load(open(p))
          assert v["safety"]["sql_write_statements"] == 0
          assert v["safety"]["a5_executed"] is False
          assert v["historical_A5_COMMITTED_preserved"] is True
          assert v["CONCURRENCY_SAFETY"] == "UNPROVEN"
          assert v["verdict"] in (
            "UNIT A A5 FULL-MANIFEST RECONCILIATION = PASS",
            "UNIT A A5 FULL-MANIFEST RECONCILIATION = PARTIAL",
            "UNIT A A5 FULL-MANIFEST RECONCILIATION = CONTRADICTION",
            "UNIT A A5 FULL-MANIFEST RECONCILIATION = BLOCKED")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze Unit A A5 read-only full-manifest result"
          echo "PROOF_ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "PROOF_ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          sha256sum "$artifact"
          git push origin HEAD:unit-a-a5-full-manifest-readonly-reconciliation-2026-10-10
