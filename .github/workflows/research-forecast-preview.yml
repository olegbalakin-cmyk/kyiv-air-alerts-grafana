name: Research EWMA two-bar preview (non-production)

on:
  push:
    branches: [research-forecast-bars-preview-2026-11-11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ewma-preview
  cancel-in-progress: true

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research commit
        uses: actions/checkout@v4

      - name: JS syntax and forecast unit tests
        run: |
          node --check kyiv-air-alerts-grafana/pages-preview/forecast-trend.js
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node --test kyiv-air-alerts-grafana/tests/test_forecast_trend.js

      - name: Validate research branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "research-forecast-bars-preview-2026-11-11"
          grep -q 'forecast-trend.js' kyiv-air-alerts-grafana/pages-preview/index.html
          echo "Preview branch only; no production write or source switch"

      - name: Prepare isolated static draft preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/{index.html,styles.css,app.js,features.json,chart-share.js,kpi-range.js,forecast-trend.js,brand-mark.svg,brand-horizontal-uk-dark.svg,brand-horizontal-en-dark.svg,favicon.svg,favicon-32.png} _site/
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Deploy unpromoted Netlify draft
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy \
            --dir=_site \
            --site=b5aafc46-7468-4070-baf1-db80a4d30501 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="research-EWMA-two-bars-$GITHUB_SHA" \
            --json > netlify-forecast-preview.json
          python - <<'PY'
          import json
          x = json.load(open("netlify-forecast-preview.json", encoding="utf-8"))
          print("DRAFT_PREVIEW_URL", x.get("deploy_url") or x.get("url") or "unavailable")
          PY

      - name: Upload non-production deploy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ewma-preview-receipt
          path: netlify-forecast-preview.json
          if-no-files-found: ignore
