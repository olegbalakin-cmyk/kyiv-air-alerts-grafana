name: Isolated Neon frozen preview and source rollback
on:
  push:
    branches: [research-neon-preview-rollback-2026-10-31]
    paths:
      - research/neon_preview_rollback_2026_10_31/**
      - .github/workflows/neon-preview-rollback.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-neon-preview-rollback
  cancel-in-progress: false
jobs:
  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/neon_cutover_work_2026_10_30
            research/neon_preview_rollback_2026_10_31
            research/c6_oct184_b1_source_priority_2026_10_29
            research/c6_23city_integrated_shadow_2026_10_30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation client
        run: python -m pip install playwright==1.64.1
      - name: Retrieve immutable assembled package (no generator or parity replay)
        uses: actions/download-artifact@v4
        with:
          name: neon-preview-browser-and-rollback
          run-id: 41138360643
          github-token: ${{ github.token }}
          path: assembled-artifact
      - name: Verify exact frozen consumer package
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          with zipfile.ZipFile('assembled-artifact/preview-package.zip') as z:
              assert not z.testzip()
              z.extractall('preview')
          app=Path('preview/app.js')
          anchor='function updateUrl() {\n  const params = new URLSearchParams();'
          source=app.read_text()
          assert source.count(anchor)==1
          app.write_text(source.replace(anchor,anchor+'\n  params.set("preview_source", window.PREVIEW_CONFIG.source);'))
          m=json.loads(Path('preview/preview-manifest.json').read_text())
          for p,v in m['data_files'].items():
              assert hashlib.sha256((Path('preview')/p).read_bytes()).hexdigest()==v['sha256'],p
          expected=json.loads(Path('research/neon_preview_rollback_2026_10_31/expected-package-manifest.json').read_text())
          assert m==expected
          files=json.loads(Path('research/neon_preview_rollback_2026_10_31/expected-preview-files.json').read_text())
          actual={str(p.relative_to('preview')):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('preview').rglob('*') if p.is_file()}
          assert actual==files
          PY
      - name: Browser QA and source-only rollback on runner loopback
        run: |
          python research/neon_preview_rollback_2026_10_31/browser_qa.py --preview preview --out browser-proof --chrome /usr/bin/google-chrome
      - name: Pack reusable self-contained preview
        if: always()
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          if Path('preview').exists():shutil.make_archive('preview-package','zip','preview')
          PY
      - name: Save browser proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-preview-browser-and-rollback
          path: |
            browser-proof/
            preview/preview-manifest.json
            preview/preview-config.js
            preview-package.zip
          retention-days: 30
