name: Differentiated alert runtime gates proof

on:
  push:
    branches:
      - differentiated-alert-shadow-runtime-gates-proof-2026-09-29
    paths:
      - ".github/workflows/differentiated-alert-runtime-gates-proof.yml"
      - "kyiv-air-alerts-grafana/scripts/proof_differentiated_alert_*.py"
      - "kyiv-air-alerts-grafana/tests/test_differentiated_alert_shadow_*.py"
      - "kyiv-air-alerts-grafana/tests/fixtures/differentiated_alert_shadow/**"

permissions:
  contents: write

jobs:
  runtime-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install frozen dependencies
        run: pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Execute three runtime gates
        id: proof
        shell: bash
        env:
          FROZEN_BASE: 93a7e702657a272b9bc3ffba6a5b843e75b66383
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/differentiated-alert-runtime-proof"
          set +e
          python kyiv-air-alerts-grafana/scripts/proof_differentiated_alert_runtime_gates.py \
            --repo-root "$GITHUB_WORKSPACE/kyiv-air-alerts-grafana" \
            --frozen-base "$FROZEN_BASE" \
            --output "$RUNNER_TEMP/differentiated-alert-runtime-proof/runtime_gates.json" \
            --raw-output "$RUNNER_TEMP/differentiated-alert-runtime-proof/kyiv_live_raw.json"
          rc=$?
          set -e
          echo "proof_rc=$rc" >> "$GITHUB_OUTPUT"
          test -f "$RUNNER_TEMP/differentiated-alert-runtime-proof/runtime_gates.json"

      - name: Fresh authoritative guard and drift classification
        if: always()
        shell: bash
        env:
          FROZEN_BASE: 93a7e702657a272b9bc3ffba6a5b843e75b66383
          AUTH_BRANCH: multicity-wip-2026-09-16
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/differentiated-alert-runtime-proof/runtime_gates.json"
          test -f "$ART"
          final="$(git ls-remote origin "refs/heads/$AUTH_BRANCH" | awk '{print $1}')"
          test -n "$final"
          git fetch --no-tags origin "$final"
          git diff --name-only "$FROZEN_BASE" "$final" > "$RUNNER_TEMP/differentiated-alert-runtime-proof/authoritative_drift_files.txt"
          AUTH_FINAL="$final" python - <<'PY'
          import json, os
          from pathlib import Path
          art=Path(os.environ["RUNNER_TEMP"])/"differentiated-alert-runtime-proof/runtime_gates.json"
          p=json.loads(art.read_text(encoding="utf-8"))
          frozen=p["frozen_authoritative_head"]
          final=os.environ["AUTH_FINAL"]
          files=(Path(os.environ["RUNNER_TEMP"])/"differentiated-alert-runtime-proof/authoritative_drift_files.txt").read_text(encoding="utf-8").splitlines()
          relevant_exact={
            "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py",
            "kyiv-air-alerts-grafana/scripts/replay_explosion_history.py",
            "kyiv-air-alerts-grafana/scripts/update_explosion_metric_live.py",
            "kyiv-air-alerts-grafana/data/explosion_audited_baseline.json",
            "kyiv-air-alerts-grafana/data/explosion_daily_alert_seed.json",
            "kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json",
            "kyiv-air-alerts-grafana/data/alerts_combined.json",
            "kyiv-air-alerts-grafana/data/sevastopol_events.json",
          }
          runtime_exact={
            "kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json",
            "kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json",
            "kyiv-air-alerts-grafana/data/explosion_review_queue.json",
            "kyiv-air-alerts-grafana/data/explosions_test.json",
            "kyiv-air-alerts-grafana/data/dashboard_data.json",
          }
          relevant=[f for f in files if f in relevant_exact or "/data/explosion_metric_handoff/source_slices/" in f or "/data/explosion_research/" in f]
          runtime=[f for f in files if f in runtime_exact]
          if final==frozen:
              classification="NO_DRIFT"
          elif relevant:
              classification="RELEVANT_CODE_DRIFT"
          elif runtime and len(runtime)==len(files):
              classification="RUNTIME_DATA_DRIFT"
          else:
              classification="UNRELATED_DRIFT"
          p["final_observed_authoritative_head"]=final
          p["authoritative_drift"]={
              "classification":classification,
              "changed_files":files,
              "relevant_files":relevant,
              "runtime_data_files":runtime,
              "proof_remains_valid_against_frozen_base": not bool(relevant),
          }
          if relevant:
              p["verdict"]="SHADOW INGESTION PROOF NOT READY"
              if "current-authoritative compatibility after relevant drift" not in p["remaining_open_gates"]:
                  p["remaining_open_gates"].append("current-authoritative compatibility after relevant drift")
          art.write_text(json.dumps(p,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - name: Record machine-readable proof and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/differentiated-alert-runtime-proof/runtime_gates.json"
          test -f "$ART"
          mkdir -p research
          cp "$ART" research/differentiated_alert_shadow_runtime_gates_2026-09-29.json
          git rm .github/workflows/differentiated-alert-runtime-gates-proof.yml
          git add research/differentiated_alert_shadow_runtime_gates_2026-09-29.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: record differentiated-alert runtime gate proof"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload raw and proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differentiated-alert-shadow-runtime-gates-2026-09-29
          path: |
            ${{ runner.temp }}/differentiated-alert-runtime-proof/runtime_gates.json
            ${{ runner.temp }}/differentiated-alert-runtime-proof/kyiv_live_raw.json
            ${{ runner.temp }}/differentiated-alert-runtime-proof/authoritative_drift_files.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          art=Path(os.environ["RUNNER_TEMP"])/"differentiated-alert-runtime-proof/runtime_gates.json"
          p=json.loads(art.read_text(encoding="utf-8"))
          print(json.dumps({"verdict":p.get("verdict"),"remaining_open_gates":p.get("remaining_open_gates")},ensure_ascii=False,indent=2))
          raise SystemExit(0 if p.get("verdict")=="READY FOR PRODUCTION SHADOW INTEGRATION PROOF" else 1)
          PY
