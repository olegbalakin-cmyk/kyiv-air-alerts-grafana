name: Kharkiv boundary repair proof (temporary)

on:
  push:
    branches:
      - kharkiv-boundary-repair-proof-2026-10-01

permissions:
  contents: read

jobs:
  kharkiv-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - run: pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Structural guards and target binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import subprocess
          from pathlib import Path

          repo = Path("kyiv-air-alerts-grafana")
          checkout = Path(".")
          replay_path = repo / "scripts/replay_explosion_history.py"
          spec = importlib.util.spec_from_file_location("replay_mod", replay_path)
          replay = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(replay)
          monitor = replay.import_monitor(repo)
          monitor.self_test()

          city = "kharkiv"
          through = "2026-09-17"
          baseline = replay.load_json(repo / "data/explosion_audited_baseline.json")
          baseline_city = baseline["cities"][city]
          slice_path = repo / "data/explosion_metric_handoff/source_slices/kharkiv-historical-recovery_alerts.json"
          slice_data = replay.load_json(slice_path)
          slice_eps = slice_data["episodes"]

          old_id = "cb4d84c97db70f7a08cdc74b"
          new_id = "0fc4be61b3b03eb9027c2536"
          target_idx = next(i for i, ep in enumerate(slice_eps) if ep.get("episode_id") in {old_id, new_id})
          target = slice_eps[target_idx]
          prev_ep = slice_eps[target_idx - 1]
          next_ep = slice_eps[target_idx + 1]

          all_eps, source_files = replay.load_historical_episodes(repo, city, monitor)
          eps = replay.filter_window(all_eps, str(baseline_city["coverage_start"]), through, monitor)
          by_id = {str(ep["episode_id"]): ep for ep in eps}
          ids = [str(ep["episode_id"]) for ep in eps]
          starts = [str(ep["alert_start"]) for ep in eps]
          ordered = sorted(eps, key=lambda ep: monitor.parse_dt(ep["alert_start"]))
          overlaps = []
          for a, b in zip(ordered, ordered[1:]):
              if monitor.parse_dt(a["alert_end"]) > monitor.parse_dt(b["alert_start"]):
                  overlaps.append([a["episode_id"], b["episode_id"]])

          source = replay.validate_city_sources(repo, city, baseline_city, through, monitor)
          evidence = replay.load_json(repo / source["inventory"]["final_evidence"])
          validated = replay.evidence_validation(evidence, baseline_city, eps, monitor, city)
          target_record = "2725fd45c6f6a33d61fe04a8"
          target_bindings = []
          for bucket, rows in (validated.get("bindings") or {}).items():
              for item in rows:
                  if str(item.get("parent_record_id") or "") == target_record:
                      target_bindings.append({
                          "bucket": bucket,
                          "parent_record_id": item.get("parent_record_id"),
                          "observation_id": item.get("observation_id"),
                          "binding": item.get("binding"),
                      })

          def blob(path):
              return subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()

          guard = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "slice_count": len(slice_eps),
              "denominator": len(eps),
              "baseline_denominator": int(baseline_city["total_alerts"]),
              "duplicate_episode_ids": len(ids) - len(set(ids)),
              "duplicate_starts": len(starts) - len(set(starts)),
              "overlaps": overlaps,
              "candidate_id_collision_count": ids.count(new_id) - (1 if target.get("episode_id") == new_id else 0),
              "target": target,
              "previous": prev_ep,
              "next": next_ep,
              "previous_expected_unchanged": (
                  prev_ep.get("episode_id") == "9f95bd0f8468d38a72062fd6"
                  and prev_ep.get("alert_start") == "2025-03-05T18:06:45Z"
                  and prev_ep.get("alert_end") == "2025-03-05T18:31:03Z"
              ),
              "next_expected_unchanged": (
                  next_ep.get("episode_id") == "dca187e3bd85404598b1b6f9"
                  and next_ep.get("alert_start") == "2025-03-06T09:12:46Z"
                  and next_ep.get("alert_end") == "2025-03-06T09:34:27Z"
              ),
              "source_status": source.get("source_status"),
              "blockers": [x.get("code") for x in source.get("blocking_reasons") or []],
              "strict_bound_count": len(validated.get("strict_ids") or []),
              "sensitivity_bound_count": len(validated.get("sensitivity_ids") or []),
              "target_bindings": target_bindings,
              "blobs": {
                  "replay": blob("kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"),
                  "monitor": blob("kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"),
                  "evidence": blob("kyiv-air-alerts-grafana/data/explosion_research/kharkiv/final_evidence.json"),
                  "slice": blob("kyiv-air-alerts-grafana/data/explosion_metric_handoff/source_slices/kharkiv-historical-recovery_alerts.json"),
              },
              "source_files": source_files,
          }
          Path("/tmp/kharkiv_guard.json").write_text(
              json.dumps(guard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(guard, ensure_ascii=False, indent=2))
          PY

      - name: Accepted focused replay path
        id: replay
        shell: bash
        run: |
          set +e
          python kyiv-air-alerts-grafana/scripts/replay_explosion_history.py \
            --repo-root "$GITHUB_WORKSPACE/kyiv-air-alerts-grafana" \
            --city kharkiv \
            --through 2026-09-17 \
            --input-head "$GITHUB_SHA" \
            --read-only \
            --output /tmp/kharkiv_replay.json
          rc=$?
          set -e
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          test -f /tmp/kharkiv_replay.json

      - name: Summarize proof
        shell: bash
        env:
          REPLAY_RC: ${{ steps.replay.outputs.return_code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          guard = json.loads(Path("/tmp/kharkiv_guard.json").read_text(encoding="utf-8"))
          replay = json.loads(Path("/tmp/kharkiv_replay.json").read_text(encoding="utf-8"))
          summary = {
              "head": guard["head"],
              "replay_return_code": int(os.environ["REPLAY_RC"]),
              "slice_count": guard["slice_count"],
              "denominator": guard["denominator"],
              "baseline_denominator": guard["baseline_denominator"],
              "canonical_integrity": {
                  "duplicate_episode_ids": guard["duplicate_episode_ids"],
                  "duplicate_starts": guard["duplicate_starts"],
                  "overlaps": guard["overlaps"],
                  "candidate_id_collision_count": guard["candidate_id_collision_count"],
                  "previous_expected_unchanged": guard["previous_expected_unchanged"],
                  "next_expected_unchanged": guard["next_expected_unchanged"],
              },
              "target": guard["target"],
              "target_bindings": guard["target_bindings"],
              "source_status": guard["source_status"],
              "blockers": guard["blockers"],
              "source_strict_bound_count": guard["strict_bound_count"],
              "source_sensitivity_bound_count": guard["sensitivity_bound_count"],
              "replay": {
                  "status": replay.get("status"),
                  "verdict": replay.get("verdict"),
                  "episodes_checked": replay.get("episodes_checked"),
                  "baseline_strict_episodes": replay.get("baseline_strict_episodes"),
                  "replayed_strict_episodes": replay.get("replayed_strict_episodes"),
                  "baseline_sensitivity_episodes": replay.get("baseline_sensitivity_episodes"),
                  "replayed_sensitivity_episodes": replay.get("replayed_sensitivity_episodes"),
                  "changed_count": len(replay.get("changed_episodes") or []),
                  "error_count": len(replay.get("errors") or []),
                  "errors": replay.get("errors") or [],
                  "reconciliation_counts": replay.get("reconciliation_counts") or {},
                  "strict_episode_identity": replay.get("strict_episode_identity") or {},
                  "protected_files_unchanged": replay.get("protected_files_unchanged"),
              },
              "blobs": guard["blobs"],
          }
          Path("/tmp/kharkiv_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kharkiv-boundary-proof-${{ github.sha }}
          path: |
            /tmp/kharkiv_guard.json
            /tmp/kharkiv_replay.json
            /tmp/kharkiv_summary.json
          if-no-files-found: error
          retention-days: 30
