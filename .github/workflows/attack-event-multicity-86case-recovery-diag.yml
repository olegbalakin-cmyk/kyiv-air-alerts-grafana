name: Attack-event multicity 86-case recovery diagnostic

on:
  push:
    branches:
      - attack-event-multicity-86case-representability-recovery-2026-10-07
    paths:
      - ".github/proof/attack_event_multicity_86case_recovery_diag.py"
      - ".github/workflows/attack-event-multicity-86case-recovery-diag.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attack-event-multicity-86case-representability-recovery-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install classifier import dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Assert zero database access configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB environment variable: $key"; exit 1; }
          done
      - name: Run bounded 86-case diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/attack_event_multicity_86case_recovery_diag.py /tmp/recover86-diagnostic.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: recover86-diagnostic-${{ github.run_id }}
          path: /tmp/recover86-diagnostic.json
          if-no-files-found: error
          retention-days: 30
