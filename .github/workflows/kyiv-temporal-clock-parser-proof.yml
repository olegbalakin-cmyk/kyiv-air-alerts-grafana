name: Kyiv temporal clock parser proof

on:
  push:
    branches:
      - kyiv-temporal-clock-parser-proof-2026-10-04

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run focused temporal parser proof
        working-directory: kyiv-air-alerts-grafana
        run: python -m pytest -q tests/test_kyiv_temporal_clock_parser.py

      - name: Run full repository pytest
        working-directory: kyiv-air-alerts-grafana
        run: python -m pytest -q tests

      - name: Run monitor self-test
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/monitor_explosion_candidates.py --self-test
