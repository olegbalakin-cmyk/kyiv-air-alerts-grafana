name: Live RSS durability shadow validation

on:
  push:
    branches:
      - live-rss-durability-shadow-actions-2026-10-04
    paths:
      - ".github/workflows/live-rss-durability-shadow-actions.yml"

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPAIRED_HEAD: "d2030cb88051f05ed7692d3af7c908a87048f549"
      WORKFLOW_PATH: ".github/workflows/live-rss-durability-shadow-actions.yml"
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert proof-only scope and snapshot protected files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$REPAIRED_HEAD" HEAD)" = "$REPAIRED_HEAD"
          test "$(git rev-parse "$REPAIRED_HEAD:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")" = "$(git rev-parse "HEAD:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")"

          changed="$(git diff --name-only "$REPAIRED_HEAD"...HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = "$WORKFLOW_PATH"

          test -z "$(git status --porcelain=v1 --untracked-files=no)"

          mkdir -p /tmp/live-rss-shadow
          git ls-files -z             'kyiv-air-alerts-grafana/data/**'             'kyiv-air-alerts-grafana/research/**'             'research/**'             | sort -z | xargs -0 -r sha256sum > /tmp/live-rss-shadow/protected.before.sha256

          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Database environment unexpectedly present: $key"; exit 1; }
          done

          git rev-parse "HEAD:kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json" > /tmp/live-rss-shadow/state_blob.txt
          git rev-parse "HEAD:kyiv-air-alerts-grafana/data/explosion_review_queue.json" > /tmp/live-rss-shadow/review_queue_blob.txt
          git rev-parse "HEAD:kyiv-air-alerts-grafana/data/alerts_combined.json" > /tmp/live-rss-shadow/canonical_alerts_blob.txt
          if git cat-file -e "HEAD:kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json" 2>/dev/null; then
            git rev-parse "HEAD:kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json" > /tmp/live-rss-shadow/last_run_blob.txt
          else
            printf 'ABSENT\n' > /tmp/live-rss-shadow/last_run_blob.txt
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: python -m pip install -r requirements.txt

      - name: Self-test repaired monitor code
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/monitor_explosion_candidates.py --self-test

      - name: Run one-shot live RSS shadow observation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import math
          import os
          import re
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path.cwd() / "kyiv-air-alerts-grafana"
          sys.path.insert(0, str(root / "scripts"))
          import monitor_explosion_candidates as monitor

          out_dir = Path("/tmp/live-rss-shadow")
          out_dir.mkdir(parents=True, exist_ok=True)

          started = monitor.now_utc()
          state = monitor.load_json(monitor.STATE_FILE, {})
          assert isinstance(state, dict) and state.get("schema_version") == 1
          due = monitor.due_checks(state, started)

          temporal_patterns = [
              re.compile(r"\b(?:о|близько|приблизно)\s*\d{1,2}[:.]\d{2}\b", re.I),
              re.compile(r"(?<!\d)\d{1,2}:\d{2}\b", re.I),
              re.compile(r"\bпісля\s+\d{1,2}(?:(?:[:.]\d{2})|\s+ранку)?\b", re.I),
              re.compile(r"\bстаном\s+на\s+\d{1,2}[:.]\d{2}\b", re.I),
              re.compile(r"\b(?:вже\s+)?за\s+\d{1,3}\s+хвилин\w*\b", re.I),
          ]

          def temporal_tokens(text: str | None) -> list[str]:
              value = " ".join(str(text or "").split())
              hits = []
              for pattern in temporal_patterns:
                  hits.extend(" ".join(m.group(0).split()).casefold() for m in pattern.finditer(value))
              return sorted(set(hits))

          def strict_temporal(decision: dict) -> bool:
              temporal = ((decision.get("candidate_evidence") or {}).get("temporal_binding") or {})
              return bool(
                  temporal.get("present")
                  and temporal.get("episode_specific")
                  and temporal.get("episode_id")
              )

          def temporal_payload(decision: dict) -> dict:
              temporal = ((decision.get("candidate_evidence") or {}).get("temporal_binding") or {})
              return {
                  "present": bool(temporal.get("present")),
                  "code": temporal.get("code"),
                  "evidence_type": temporal.get("evidence_type"),
                  "episode_specific": bool(temporal.get("episode_specific")),
                  "episode_id": temporal.get("episode_id"),
                  "supported_episode_ids": list(temporal.get("supported_episode_ids") or []),
                  "event_time": temporal.get("event_time"),
                  "event_interval": temporal.get("event_interval"),
              }

          original_session_request = monitor.requests.sessions.Session.request
          fetch_records: list[dict] = []
          bodies_by_rss_url: dict[str, str] = {}

          def instrumented_publisher_fetch(rss_url: str):
              trace: dict = {"rss_url": rss_url}
              response_holder: dict = {}

              def traced_request(session_self, method, request_url, *args, **kwargs):
                  try:
                      response = original_session_request(session_self, method, request_url, *args, **kwargs)
                      response_holder["response"] = response
                      return response
                  except Exception as exc:
                      response_holder["exception"] = exc
                      raise

              monitor.requests.sessions.Session.request = traced_request
              try:
                  body, resolved_url = monitor.fetch_publisher_fulltext(rss_url)
              finally:
                  monitor.requests.sessions.Session.request = original_session_request

              response = response_holder.get("response")
              exc = response_holder.get("exception")
              final_url = str(getattr(response, "url", "") or "")
              status_code = getattr(response, "status_code", None)
              content_type = str((getattr(response, "headers", {}) or {}).get("Content-Type") or "")
              final_host = (urlparse(final_url).hostname or "").casefold()
              exception_url = str(getattr(getattr(exc, "request", None), "url", "") or "")
              exception_host = (urlparse(exception_url).hostname or "").casefold()

              resolution_success = bool(
                  final_url
                  and final_host
                  and final_host != "google.com"
                  and not final_host.endswith(".google.com")
              )
              body_success = bool(body and resolved_url)

              failure = None
              if not body_success:
                  if exc is not None and isinstance(exc, monitor.requests.Timeout):
                      failure = "TIMEOUT"
                  elif exc is not None:
                      failure = (
                          "GOOGLE_REDIRECT_RESOLUTION_FAILED"
                          if (not exception_host or exception_host == "news.google.com" or exception_host.endswith(".google.com"))
                          else "PUBLISHER_HTTP_FAILURE"
                      )
                  elif status_code is not None and int(status_code) >= 400:
                      failure = (
                          "GOOGLE_REDIRECT_RESOLUTION_FAILED"
                          if (not final_host or final_host == "news.google.com" or final_host.endswith(".google.com"))
                          else "PUBLISHER_HTTP_FAILURE"
                      )
                  elif not resolution_success:
                      failure = "GOOGLE_REDIRECT_RESOLUTION_FAILED"
                  elif "html" not in content_type.casefold():
                      failure = "EMPTY_OR_UNUSABLE_BODY"
                  else:
                      try:
                          extracted_again = monitor.extract_article_text(str(getattr(response, "text", "") or ""))
                          failure = "EMPTY_OR_UNUSABLE_BODY" if not extracted_again else "EXTRACTION_FAILED"
                      except Exception:
                          failure = "EXTRACTION_FAILED"

              record = {
                  "rss_url": rss_url,
                  "resolved_url": str(resolved_url or final_url or "") or None,
                  "status_code": int(status_code) if status_code is not None else None,
                  "content_type": content_type or None,
                  "resolution_success": resolution_success,
                  "body_extraction_success": body_success,
                  "body_chars": len(body or ""),
                  "failure_mechanism": failure,
                  "exception_type": type(exc).__name__ if exc is not None else None,
                  "exception_message": str(exc)[:500] if exc is not None else None,
              }
              fetch_records.append(record)
              if body_success:
                  bodies_by_rss_url[rss_url] = body
              return body, resolved_url

          aggregate = Counter()
          city_metrics: dict[str, Counter] = {}
          publisher_metrics: dict[str, Counter] = defaultdict(Counter)
          ledger = []
          search_errors = {}
          discovery_stats = {}
          durability_cache = {}

          due_cities = sorted(due)
          for city_key in due_cities:
              city_due = due[city_key]
              city_counter = Counter()
              city_metrics[city_key] = city_counter
              earliest = min(
                  monitor.parse_dt(ep.get("alert_start")) or started
                  for ep, _ in city_due
              )
              try:
                  rows, query_url, stats = monitor.search_city_news(city_key, earliest, started)
                  discovery_stats[city_key] = {
                      "due_checks": len(city_due),
                      "earliest_due_episode_start": monitor.iso(earliest),
                      "query_url": query_url,
                      "query_urls": stats.get("query_urls") or {},
                      "query_family_result_counts": stats.get("query_family_result_counts") or {},
                      "results_after_family_merge": int(stats.get("results_after_family_merge") or 0),
                      "discovery_fulltext_fetches": int(stats.get("fulltext_fetches") or 0),
                      "discovery_fulltext_rescued_candidates": int(stats.get("fulltext_rescued_candidates") or 0),
                  }
              except Exception as exc:
                  search_errors[city_key] = f"{type(exc).__name__}: {exc}"
                  discovery_stats[city_key] = {
                      "due_checks": len(city_due),
                      "earliest_due_episode_start": monitor.iso(earliest),
                      "error": search_errors[city_key],
                  }
                  continue

              episodes = monitor.tracked_episodes_for_city(state, city_key)
              for raw in rows:
                  row = {**raw, "source": raw.get("source") or "Google News RSS"}
                  aggregate["total_google_news_rss_candidates_observed"] += 1
                  city_counter["total_google_news_rss_candidates_observed"] += 1

                  matching = monitor.match_candidate_to_episodes(row, episodes)
                  official = monitor.classify_candidate(row, city_key, episodes, matching)
                  aggregate[f"official_{official.get('proposed_outcome') or 'unknown'}"] += 1
                  city_counter[f"official_{official.get('proposed_outcome') or 'unknown'}"] += 1

                  if not monitor.rss_durability_enrichment_eligible(row, official):
                      continue

                  aggregate["enrichment_eligible_candidates"] += 1
                  city_counter["enrichment_eligible_candidates"] += 1
                  publisher = str(row.get("publisher") or "Google News result")
                  pub_counter = publisher_metrics[publisher]
                  pub_counter["enrichment_eligible_candidates"] += 1

                  before_fetch_count = len(fetch_records)
                  enriched, network_fetched, enrichment_succeeded = monitor.enrich_rss_candidate_for_durability(
                      row,
                      official,
                      fulltext_fetcher=instrumented_publisher_fetch,
                      fetch_cache=durability_cache,
                  )
                  if network_fetched:
                      aggregate["unique_publisher_fetch_attempts_after_cache"] += 1
                      city_counter["unique_publisher_fetch_attempts_after_cache"] += 1
                      pub_counter["unique_publisher_fetch_attempts_after_cache"] += 1
                  else:
                      aggregate["duplicate_fetches_avoided_by_in_run_cache"] += 1
                      city_counter["duplicate_fetches_avoided_by_in_run_cache"] += 1
                      pub_counter["duplicate_fetches_avoided_by_in_run_cache"] += 1

                  rss_url = str(row.get("url") or "")
                  fetch_record = next((x for x in reversed(fetch_records) if x["rss_url"] == rss_url), None)
                  if not network_fetched and fetch_record is None:
                      fetch_record = next((x for x in fetch_records if x["rss_url"] == rss_url), None)

                  body = bodies_by_rss_url.get(rss_url)
                  rss_text = f"{row.get('title') or ''} {row.get('snippet') or ''}".strip()
                  rss_temporal_tokens = temporal_tokens(rss_text)
                  body_temporal_tokens = temporal_tokens(body) if body else []
                  new_temporal_tokens = sorted(set(body_temporal_tokens) - set(rss_temporal_tokens))
                  new_temporal_language = bool(new_temporal_tokens)

                  body_parser_usable = False
                  body_temporal = None
                  captured_parser_usable = False
                  captured_temporal = None
                  counterfactual = None

                  if body:
                      full_body_row = {
                          **row,
                          "discovery_basis": "publisher_fulltext",
                          "matched_text_excerpt": body,
                          "resolved_url": (fetch_record or {}).get("resolved_url"),
                      }
                      full_body_decision = monitor.classify_candidate(full_body_row, city_key, episodes, matching)
                      body_parser_usable = strict_temporal(full_body_decision)
                      body_temporal = temporal_payload(full_body_decision)

                  body_excerpt = None
                  if enrichment_succeeded:
                      body_excerpt = enriched.get("matched_text_excerpt")
                      aggregate["candidates_receiving_body_derived_excerpt"] += 1
                      city_counter["candidates_receiving_body_derived_excerpt"] += 1
                      pub_counter["candidates_receiving_body_derived_excerpt"] += 1

                      captured_row = {
                          **enriched,
                          "discovery_basis": "publisher_fulltext",
                      }
                      captured_decision = monitor.classify_candidate(captured_row, city_key, episodes, matching)
                      captured_parser_usable = strict_temporal(captured_decision)
                      captured_temporal = temporal_payload(captured_decision)
                      counterfactual = {
                          "analysis_only": True,
                          "input_representation": "captured publisher excerpt treated as allowed publisher_fulltext evidence",
                          "proposed_outcome": captured_decision.get("proposed_outcome"),
                          "temporal_binding": captured_temporal,
                          "stronger_temporal_evidence": captured_parser_usable and not strict_temporal(official),
                      }

                  if new_temporal_language:
                      aggregate["bodies_with_temporal_language_absent_from_rss"] += 1
                      city_counter["bodies_with_temporal_language_absent_from_rss"] += 1
                      pub_counter["bodies_with_temporal_language_absent_from_rss"] += 1

                  if body_parser_usable:
                      aggregate["bodies_with_parser_usable_episode_specific_temporal"] += 1
                      city_counter["bodies_with_parser_usable_episode_specific_temporal"] += 1
                      pub_counter["bodies_with_parser_usable_episode_specific_temporal"] += 1
                  elif body:
                      aggregate["successful_bodies_still_temporally_unresolved"] += 1
                      city_counter["successful_bodies_still_temporally_unresolved"] += 1
                      pub_counter["successful_bodies_still_temporally_unresolved"] += 1

                  if captured_parser_usable:
                      aggregate["counterfactual_stronger_temporal_candidates"] += 1
                      city_counter["counterfactual_stronger_temporal_candidates"] += 1
                      pub_counter["counterfactual_stronger_temporal_candidates"] += 1

                  if fetch_record and fetch_record.get("body_extraction_success"):
                      aggregate["successful_body_extraction_candidates"] += 1
                      city_counter["successful_body_extraction_candidates"] += 1
                      pub_counter["successful_body_extraction_candidates"] += 1

                  if fetch_record and fetch_record.get("resolution_success"):
                      aggregate["successful_resolution_candidates"] += 1
                      city_counter["successful_resolution_candidates"] += 1
                      pub_counter["successful_resolution_candidates"] += 1

                  if not body:
                      outcome = (fetch_record or {}).get("failure_mechanism") or "EMPTY_OR_UNUSABLE_BODY"
                  elif body_parser_usable:
                      outcome = "SUCCESS_WITH_PARSER_USABLE_TEMPORAL_EVIDENCE"
                  elif new_temporal_language:
                      outcome = "BODY_TEMPORAL_LANGUAGE_UNSUPPORTED"
                  else:
                      outcome = "BODY_PRESENT_NO_NEW_TEMPORAL_EVIDENCE"

                  aggregate[f"taxonomy_{outcome}"] += 1
                  city_counter[f"taxonomy_{outcome}"] += 1
                  pub_counter[f"taxonomy_{outcome}"] += 1

                  ledger.append({
                      "city": city_key,
                      "city_label": monitor.CITY_CONFIG[city_key]["label"],
                      "candidate_id": monitor.candidate_id(city_key, row["url"], row["title"]),
                      "rss_url": row.get("url"),
                      "publisher": row.get("publisher"),
                      "publisher_url": row.get("publisher_url"),
                      "rss_title": row.get("title"),
                      "rss_snippet": row.get("snippet"),
                      "publication_timestamp": row.get("published_at"),
                      "official_pre_enrichment_classification": official.get("proposed_outcome"),
                      "official_pre_enrichment_reason_codes": list(official.get("reason_codes") or []),
                      "official_pre_enrichment_temporal_binding": temporal_payload(official),
                      "enrichment_attempted": True,
                      "network_fetch_performed": bool(network_fetched),
                      "resolved_url": (fetch_record or {}).get("resolved_url"),
                      "publisher_fetch_extraction_outcome": outcome,
                      "publisher_resolution_success": bool((fetch_record or {}).get("resolution_success")),
                      "publisher_body_extraction_success": bool((fetch_record or {}).get("body_extraction_success")),
                      "body_derived_excerpt": body_excerpt,
                      "new_temporal_language_found": new_temporal_language,
                      "new_temporal_language_tokens": new_temporal_tokens[:20],
                      "current_parser_recognizes_episode_specific_temporal_in_full_body": body_parser_usable,
                      "full_body_temporal_binding": body_temporal,
                      "current_parser_recognizes_episode_specific_temporal_in_captured_excerpt": captured_parser_usable,
                      "captured_excerpt_temporal_binding": captured_temporal,
                      "counterfactual": counterfactual,
                  })

          # Attempt-level fetch metrics are computed only from actual durability fetcher invocations.
          attempts = len(fetch_records)
          successful_resolutions = sum(1 for x in fetch_records if x.get("resolution_success"))
          successful_bodies = sum(1 for x in fetch_records if x.get("body_extraction_success"))
          failed_attempts = attempts - successful_bodies
          eligible = int(aggregate["enrichment_eligible_candidates"])
          captured_useful = int(aggregate["counterfactual_stronger_temporal_candidates"])

          network_taxonomy = Counter(
              x.get("failure_mechanism") or "SUCCESS_BODY_EXTRACTED"
              for x in fetch_records
          )

          valid_rss_denominator = sum(1 for city in due_cities if city not in search_errors) > 0
          if due_cities and not valid_rss_denominator:
              verdict = "LIVE RSS DURABILITY SHADOW VALIDATION = BLOCKED"
              verdict_basis = "All normal due-city Google News RSS searches failed; no valid live denominator."
          elif eligible < 5:
              verdict = "LIVE RSS DURABILITY SHADOW VALIDATION = INSUFFICIENT SAMPLE"
              verdict_basis = f"Only {eligible} enrichment-eligible RSS candidates were observed in the single normal window; threshold is 5."
          elif attempts and successful_bodies / attempts < 0.5:
              verdict = "LIVE RSS DURABILITY SHADOW VALIDATION = BLOCKED"
              verdict_basis = "A valid RSS denominator was observed, but fewer than half of unique durability fetch attempts produced usable publisher bodies."
          else:
              useful_threshold = max(2, math.ceil(eligible * 0.20))
              if captured_useful >= useful_threshold:
                  verdict = "LIVE RSS DURABILITY SHADOW VALIDATION = USEFUL"
                  verdict_basis = (
                      f"{captured_useful}/{eligible} eligible candidates gained parser-usable episode-specific temporal evidence "
                      f"from the captured publisher excerpt; useful threshold is {useful_threshold}."
                  )
              else:
                  verdict = "LIVE RSS DURABILITY SHADOW VALIDATION = LOW YIELD"
                  verdict_basis = (
                      f"Publisher capture was operationally viable but only {captured_useful}/{eligible} eligible candidates "
                      "gained parser-usable episode-specific temporal evidence in the captured excerpt."
                  )

          mutation_inputs = {
              "state_blob": (out_dir / "state_blob.txt").read_text().strip(),
              "review_queue_blob": (out_dir / "review_queue_blob.txt").read_text().strip(),
              "canonical_alerts_blob": (out_dir / "canonical_alerts_blob.txt").read_text().strip(),
              "last_run_blob": (out_dir / "last_run_blob.txt").read_text().strip(),
          }

          proof = {
              "schema": "live_rss_durability_shadow_validation_v1",
              "verdict": verdict,
              "verdict_basis": verdict_basis,
              "execution": {
                  "started_at": monitor.iso(started),
                  "finished_at": monitor.iso(monitor.now_utc()),
                  "window": "single normal due-check RSS observation using frozen checked-out monitor state; no repeated polling",
                  "repo": os.environ["GITHUB_REPOSITORY"],
                  "proof_branch": os.environ["GITHUB_REF_NAME"],
                  "exact_repaired_base": os.environ["REPAIRED_HEAD"],
                  "proof_head": os.environ["GITHUB_SHA"],
                  "actions_run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "observed_city_set": due_cities,
                  "due_city_count": len(due_cities),
                  "successful_city_search_count": len(due_cities) - len(search_errors),
                  "failed_city_search_count": len(search_errors),
                  "state_blob": mutation_inputs["state_blob"],
              },
              "aggregate_metrics": {
                  "total_google_news_rss_candidates_observed": int(aggregate["total_google_news_rss_candidates_observed"]),
                  "enrichment_eligible_candidates": eligible,
                  "unique_publisher_fetch_attempts_after_cache_deduplication": attempts,
                  "successful_publisher_resolutions": successful_resolutions,
                  "successful_publisher_body_extractions": successful_bodies,
                  "failed_resolutions_fetches_or_extractions": failed_attempts,
                  "candidates_receiving_body_derived_excerpt": int(aggregate["candidates_receiving_body_derived_excerpt"]),
                  "bodies_containing_temporal_language_absent_from_rss_title_snippet": int(aggregate["bodies_with_temporal_language_absent_from_rss"]),
                  "bodies_containing_episode_specific_clock_or_interval_recognized_by_current_parser": int(aggregate["bodies_with_parser_usable_episode_specific_temporal"]),
                  "successful_bodies_still_temporally_unresolved_after_publisher_body_inspection": int(aggregate["successful_bodies_still_temporally_unresolved"]),
                  "fetches_per_eligible_candidate": (attempts / eligible) if eligible else 0.0,
                  "duplicate_fetches_avoided_by_in_run_cache": max(0, eligible - attempts),
                  "counterfactual_stronger_temporal_candidates_from_captured_excerpt": captured_useful,
              },
              "official_classification_distribution": {
                  key.removeprefix("official_"): int(value)
                  for key, value in sorted(aggregate.items())
                  if key.startswith("official_")
              },
              "per_city_metrics": {
                  city: {k: int(v) for k, v in sorted(counter.items())}
                  for city, counter in sorted(city_metrics.items())
              },
              "per_publisher_outcomes": {
                  publisher: {k: int(v) for k, v in sorted(counter.items())}
                  for publisher, counter in sorted(publisher_metrics.items())
              },
              "discovery_stats": discovery_stats,
              "city_search_errors": search_errors,
              "failure_taxonomy_candidate_level": {
                  key.removeprefix("taxonomy_"): int(value)
                  for key, value in sorted(aggregate.items())
                  if key.startswith("taxonomy_")
              },
              "failure_taxonomy_unique_fetch_attempt_level": {
                  key: int(value) for key, value in sorted(network_taxonomy.items())
              },
              "candidate_shadow_ledger": sorted(
                  ledger,
                  key=lambda x: (x["city"], x["candidate_id"]),
              ),
              "official_vs_counterfactual": {
                  "official_boundary": "Official classification is computed from RSS representation before durability enrichment and is never recomputed from enriched evidence.",
                  "counterfactual_boundary": "Counterfactual classification is analysis-only and treats only the captured publisher excerpt as publisher_fulltext evidence; it is never written to state or queues.",
                  "official_rows_mutated": False,
                  "counterfactual_persisted": False,
              },
              "mutation_checks": {
                  "protected_repo_inputs_before": mutation_inputs,
                  "production_state_written": False,
                  "historical_state_written": False,
                  "historical_queue_written": False,
                  "review_queue_written": False,
                  "canonical_alerts_written": False,
                  "last_run_file_written": False,
                  "neon_or_db_used": False,
                  "deployment_performed": False,
                  "top_level_monitor_main_called": False,
                  "proof_output_only": True,
              },
              "decision_thresholds": {
                  "insufficient_sample_if_eligible_below": 5,
                  "operational_body_success_floor": 0.5,
                  "useful_if_counterfactual_parser_usable_count_at_least": "max(2, ceil(20% of eligible))",
              },
          }

          result_path = out_dir / "live_rss_durability_shadow_validation.json"
          result_path.write_text(json.dumps(proof, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          digest = hashlib.sha256(result_path.read_bytes()).hexdigest()
          (out_dir / "live_rss_durability_shadow_validation.sha256").write_text(
              f"{digest}  {result_path.name}\n", encoding="utf-8"
          )
          summary = (
              f"# Live RSS durability shadow validation\n\n"
              f"- Verdict: `{verdict}`\n"
              f"- RSS candidates: {proof['aggregate_metrics']['total_google_news_rss_candidates_observed']}\n"
              f"- Eligible: {eligible}\n"
              f"- Unique publisher fetches: {attempts}\n"
              f"- Publisher bodies: {successful_bodies}\n"
              f"- Parser-usable full-body temporal evidence: {proof['aggregate_metrics']['bodies_containing_episode_specific_clock_or_interval_recognized_by_current_parser']}\n"
              f"- Counterfactual stronger captured evidence: {captured_useful}\n"
              f"- JSON SHA256: `{digest}`\n"
          )
          (out_dir / "summary.md").write_text(summary, encoding="utf-8")

          print(f"PROOF_VERDICT={verdict}")
          print(f"PROOF_JSON_SHA256={digest}")
          print("PROOF_METRICS=" + json.dumps(proof["aggregate_metrics"], sort_keys=True))
          print("PROOF_OBSERVED_CITIES=" + json.dumps(due_cities))
          print("PROOF_SEARCH_ERRORS=" + json.dumps(search_errors, ensure_ascii=False, sort_keys=True))
          PY

      - name: Prove zero protected mutation
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z             'kyiv-air-alerts-grafana/data/**'             'kyiv-air-alerts-grafana/research/**'             'research/**'             | sort -z | xargs -0 -r sha256sum > /tmp/live-rss-shadow/protected.after.sha256

          cmp /tmp/live-rss-shadow/protected.before.sha256 /tmp/live-rss-shadow/protected.after.sha256
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --exit-code --             kyiv-air-alerts-grafana/data             kyiv-air-alerts-grafana/research             research

          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json)" = "$(cat /tmp/live-rss-shadow/state_blob.txt)"
          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/data/explosion_review_queue.json)" = "$(cat /tmp/live-rss-shadow/review_queue_blob.txt)"
          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/data/alerts_combined.json)" = "$(cat /tmp/live-rss-shadow/canonical_alerts_blob.txt)"

          printf 'ZERO_PROTECTED_MUTATION_OK\n' | tee /tmp/live-rss-shadow/mutation_check.txt

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-rss-durability-shadow-validation
          path: |
            /tmp/live-rss-shadow/live_rss_durability_shadow_validation.json
            /tmp/live-rss-shadow/live_rss_durability_shadow_validation.sha256
            /tmp/live-rss-shadow/summary.md
            /tmp/live-rss-shadow/mutation_check.txt
          if-no-files-found: error
          retention-days: 30
