name: H2 Secret Role Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'olegbalakin-cmyk/kyiv-air-alerts-grafana' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare secret URI metadata in memory only
        shell: bash
        env:
          H2_DSN: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import unquote, urlsplit

          fields = ("URI_FORMAT", "USERNAME_MATCH", "ENDPOINT_MATCH", "DATABASE_MATCH")
          raw = os.environ.get("H2_DSN") or ""
          if not raw:
              for field in fields:
                  print(f"{field}=BLOCKED")
              sys.exit(1)

          try:
              url = urlsplit(raw)
              host = (url.hostname or "").lower()
              checks = {
                  "URI_FORMAT": (
                      url.scheme in ("postgres", "postgresql")
                      and bool(url.netloc)
                      and not url.fragment
                      and bool(url.username)
                      and bool(url.password)
                  ),
                  "USERNAME_MATCH": unquote(url.username or "") == "neondb_owner",
                  "ENDPOINT_MATCH": (
                      host.endswith(".neon.tech")
                      and host.split(".", 1)[0] in (
                          "ep-still-violet-b5bg6mhp",
                          "ep-still-violet-b5bg6mhp-pooler",
                      )
                  ),
                  "DATABASE_MATCH": unquote(url.path) == "/neondb",
              }
          except (ValueError, TypeError):
              for field in fields:
                  print(f"{field}=BLOCKED")
              sys.exit(1)

          for field in fields:
              print(f"{field}={'YES' if checks[field] else 'NO'}")
          sys.exit(0 if all(checks.values()) else 1)
          PY
