name: Validate and publish isolated chart-share preview
on:
  push:
    branches: [preview-chart-share-2026-10-19]
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "kyiv-air-alerts-grafana/tests/test_chart_share.js"
      - "kyiv-air-alerts-grafana/tests/test_daily28_rollover.js"
      - "kyiv-air-alerts-grafana/tests/test_dynamic_city_kpi.js"
      - "kyiv-air-alerts-grafana/tests/test_historical_max.js"
      - "kyiv-air-alerts-grafana/tests/test_city_period_kpi_sync.js"
      - "kyiv-air-alerts-grafana/tests/test_kpi_interval_windows.js"
      - "kyiv-air-alerts-grafana/tests/test_all_time_period.js"
      - "kyiv-air-alerts-grafana/scripts/build_preview_historical_daily.py"
      - "kyiv-air-alerts-grafana/scripts/update_data.py"
      - "kyiv-air-alerts-grafana/scripts/apply_site_rolling_7d.py"
      - "kyiv-air-alerts-grafana/tests/test_monthly_seconds.py"
      - ".github/workflows/chart-share-preview.yml"
permissions:
  contents: read
concurrency:
  group: isolated-chart-share-preview-2026-10-19
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend and share links
        run: |
          node --check kyiv-air-alerts-grafana/pages-preview/chart-share.js
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node --check kyiv-air-alerts-grafana/pages-preview/kpi-range.js
          node kyiv-air-alerts-grafana/tests/test_chart_share.js
          node kyiv-air-alerts-grafana/tests/test_calendar_week.js
          node kyiv-air-alerts-grafana/tests/test_daily28_rollover.js
          node kyiv-air-alerts-grafana/tests/test_dynamic_city_kpi.js
          node kyiv-air-alerts-grafana/tests/test_historical_max.js
          node kyiv-air-alerts-grafana/tests/test_city_period_kpi_sync.js
          node kyiv-air-alerts-grafana/tests/test_kpi_interval_windows.js
          node kyiv-air-alerts-grafana/tests/test_all_time_period.js
          grep -q '"attack_events": false' kyiv-air-alerts-grafana/pages-preview/features.json
          test -s kyiv-air-alerts-grafana/pages-preview/brand-mark.svg
          test -s kyiv-air-alerts-grafana/pages-preview/brand-horizontal-uk-dark.svg
          test -s kyiv-air-alerts-grafana/pages-preview/brand-horizontal-en-dark.svg
          test -s kyiv-air-alerts-grafana/pages-preview/favicon.svg
          test -s kyiv-air-alerts-grafana/pages-preview/favicon-32.png
          grep -q 'brand-mark.svg' kyiv-air-alerts-grafana/pages-preview/chart-share.js
      - name: Checkout immutable production data snapshot into a separate read-only directory
        uses: actions/checkout@v4
        with:
          ref: site-prod
          path: _source
          persist-credentials: false
      - name: Compute a verified daily-index from production's own event collectors
        run: |
          python -m pip install -r _source/kyiv-air-alerts-grafana/requirements.txt
          python kyiv-air-alerts-grafana/tests/test_monthly_seconds.py
          python kyiv-air-alerts-grafana/scripts/build_preview_historical_daily.py \
            --production-root _source/kyiv-air-alerts-grafana \
            --source-sha "$(git -C _source rev-parse HEAD)" \
            --output historical-daily-kpi.json
          python -c 'import json; x=json.load(open("historical-daily-kpi.json")); assert x["meta"]["exact_month_seconds_count"] > 0; assert x["cities"]["kyiv"]["monthly_seconds_verified"] > 0; print("PASS verified-month-seconds:", x["meta"]["exact_month_seconds_count"])'
      - name: Assemble preview
        run: |
          mkdir -p _preview
          cp kyiv-air-alerts-grafana/pages-preview/{index.html,app.js,kpi-range.js,chart-share.js,styles.css,features.json,brand-mark.svg,brand-horizontal-uk-dark.svg,brand-horizontal-en-dark.svg,favicon.svg,favicon-32.png} _preview/
          cp historical-daily-kpi.json _preview/
      - name: Deploy draft only, never production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy --dir=_preview --alias=chart-share-test-20261019 --site=b5aafc46-7468-4070-baf1-db80a4d30501 --auth="$NETLIFY_AUTH_TOKEN" --json | tee chart-share-preview-deploy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-share-preview-receipt
          path: |
            chart-share-preview-deploy.json
            historical-daily-kpi.json
          if-no-files-found: warn
