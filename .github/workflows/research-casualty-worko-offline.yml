name: CASUALTY Work O parser and evidence offline proof
on:
  push:
    branches: [research-casualty-worko-parser-evidence-2026-11-13]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 236d3d3af785ea89f44504995498bcd0915d2e10
          path: _baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline parser test dependencies (no media GET)
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: No source grant, no launch, no source bodies, no production changes
        run: |
          set -euo pipefail
          test ! -e research/casualty_one_time_capture_2026_11_13/launch.json
          test ! -e _baseline/research/casualty_one_time_capture_2026_11_13/launch.json
          test "$(git -C _baseline rev-parse HEAD)" = 236d3d3af785ea89f44504995498bcd0915d2e10
          test "$(git diff --name-only 236d3d3af785ea89f44504995498bcd0915d2e10 HEAD | grep -Ec '^(kyiv-air-alerts-grafana/data/|deploy/|site-prod|research/casualty_one_time_capture_2026_11_13/launch.json)' || true)" = 0
      - name: Frozen baseline E G I J K L (68 offline safety tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/worko
          (
            cd _baseline
            python -m unittest research.casualty_evidence_ingestion_2026_11_13.test_ingest \
              research.casualty_controlled_capture_preflight_2026_11_13.test_preflight \
              research.casualty_strict_redirect_2026_11_13.test_redirect \
              research.casualty_fact_retention_workj_2026_11_13.test_workj \
              research.casualty_one_time_capture_2026_11_13.test_workk \
              research.casualty_one_time_capture_2026_11_13.test_workl -v \
              2>&1 | tee /tmp/worko/baseline.log
          )
      - name: Work O new code, Work A and Work J test paths (no source HTTP)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest research.casualty_parser_evidence_worko_2026_11_13.test_worko \
            research.casualty_fact_retention_workj_2026_11_13.test_workj \
            research.casualty_evidence_ingestion_2026_11_13.test_ingest \
            -v 2>&1 | tee /tmp/worko/new.log
          python -m unittest discover -s kyiv-air-alerts-grafana/tests \
            -p test_casualty_auto_review.py -v 2>&1 | tee /tmp/worko/work-a.log
      - name: Proof manifest and explicit zero publisher GET
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, pathlib
          root=pathlib.Path('/tmp/worko')
          logs={}
          for name in ['baseline.log','new.log','work-a.log']:
              p=root/name
              if not p.exists():
                  logs[name]={'status':'MISSING','tests':0,'fail':None,'skip':None}
                  continue
              s=p.read_text(errors='replace')
              matches=re.findall(r'Ran (\d+) tests? in',s)
              logs[name]={
                  'status':'PASS' if matches and re.search(r'^OK(?:\s|$)',s,re.M) else 'FAIL',
                  'tests':int(matches[-1]) if matches else 0,
                  'fail':len(re.findall(r'^FAIL:',s,re.M))+len(re.findall(r'^ERROR:',s,re.M)),
                  'skip':len(re.findall(r'\.\.\. skipped ',s)),
              }
          result={
              'schema':'casualty-worko-offline-proof-v1',
              'head_sha':os.environ.get('GITHUB_SHA'),
              'baseline_sha':'236d3d3af785ea89f44504995498bcd0915d2e10',
              'source_get':0,'source_get_basis':'No source-capture function is invoked by test workflow; only local fixtures and frozen offline baseline',
              'publication_allowed':False,'automatic_credits':0,
              'real_t03_t05_html_retested':False,'test_groups':logs}
          (root/'proof.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.glob('*.log'))}
          hashes['proof.json']=hashlib.sha256((root/'proof.json').read_bytes()).hexdigest()
          (root/'manifest.json').write_text(json.dumps({'files_sha256':hashes},sort_keys=True,indent=2)+'\n')
          assert all(x['status']=='PASS' for x in logs.values()),logs
          print('WORKO_OFFLINE_TEST_GROUPS_PASS',logs)
          PY
      - name: Upload work O proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-worko-offline-parser-evidence-proof
          path: |
            /tmp/worko/*.json
            /tmp/worko/*.log
          retention-days: 30
          if-no-files-found: warn
