name: CASUALTY Work O parser and evidence offline proof
on:
  push:
    branches: [research-casualty-workp-worko-runner-2026-11-14, research-casualty-workq-real-excerpts-2026-11-14, research-casualty-workr-identity-2026-11-14, research-casualty-workx-reliable-evidence-2026-11-14, research-casualty-workz-source-evidence-2026-11-14]
    paths-ignore:
      - research/casualty_one_time_capture_2026_11_13/launch.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 236d3d3af785ea89f44504995498bcd0915d2e10
          path: _baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          path: _baseline/_pr102
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _baseline/_wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _baseline/_site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          path: _baseline/_matrix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          path: _matrix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          path: _pr102
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43053796144
          name: casualty-three-new-original-publisher-excerpts-one-shot
          path: /tmp/casualty-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43261676781
          name: casualty-zap11-approved-http-43261676781-1
          path: /tmp/casualty-receipts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline parser test dependencies (no media GET)
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: No source grant, no launch, no source bodies, no production changes
        run: |
          set -euo pipefail
          test ! -e research/casualty_one_time_capture_2026_11_13/launch.json
          test ! -e _baseline/research/casualty_one_time_capture_2026_11_13/launch.json
          test "$(git -C _baseline rev-parse HEAD)" = 236d3d3af785ea89f44504995498bcd0915d2e10
          test "$(git diff --name-only 236d3d3af785ea89f44504995498bcd0915d2e10 HEAD | grep -Ec '^(kyiv-air-alerts-grafana/data/|deploy/|site-prod|research/casualty_one_time_capture_2026_11_13/launch.json)' || true)" = 0
      - name: Frozen baseline E G I J K L (68 offline safety tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/worko
          (
            cd _baseline
            python -m unittest research.casualty_evidence_ingestion_2026_11_13.test_ingest \
              research.casualty_controlled_capture_preflight_2026_11_13.test_preflight \
              research.casualty_strict_redirect_2026_11_13.test_redirect \
              research.casualty_fact_retention_workj_2026_11_13.test_workj \
              research.casualty_one_time_capture_2026_11_13.test_workk \
              research.casualty_one_time_capture_2026_11_13.test_workl -v \
              2>&1 | tee /tmp/worko/baseline.log
          )
      - name: Work O new code, Work A and Work J test paths (no source HTTP)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest research.casualty_parser_evidence_worko_2026_11_13.test_worko \
            research.casualty_fact_retention_workj_2026_11_13.test_workj \
            research.casualty_evidence_ingestion_2026_11_13.test_ingest \
            -v 2>&1 | tee /tmp/worko/new.log
          python research/casualty_parser_evidence_worko_2026_11_13/run_worka_tests.py \
            2>&1 | tee /tmp/worko/work-a.log
      - name: Work P integrated exact loaded Work O mock HTTP-to-JSON proof (zero real GET)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest research.casualty_workp_runner_integration_2026_11_14.test_workp -v 2>&1 | tee /tmp/worko/workp.log
          python - <<'PY'
          from pathlib import Path
          from research.casualty_one_time_capture_2026_11_13 import run_capture as r
          from research.casualty_one_time_capture_2026_11_13.test_workk import queue
          import subprocess
          r.check_scope(queue())
          assert all(subprocess.check_output(['git', 'rev-parse', 'HEAD:'+p],text=True).strip()==sha for p,sha in r.BLOBS.items())
          assert subprocess.check_output(['git','log','--format=%H','HEAD','--',r.LAUNCH_REL],text=True).strip()==''
          assert not (r.HERE/'launch.json').exists()
          print('WORKP_VERIFIED_LOADED_WORKO_BLOBS_AND_CLEAN_LAUNCH_HISTORY')
          PY
      - name: Work Q saved real excerpts and CI path simulation (no HTTP)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest research.casualty_workq_real_excerpts_2026_11_14.test_workq -v 2>&1 | tee /tmp/worko/workq.log
      - name: Work R incident context retention safety tests (no HTTP)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest research.casualty_workr_identity_2026_11_14.test_workr -v 2>&1 | tee /tmp/worko/workr.log
      - name: Work X download already retained Work P and Work V proof (no publisher HTTP)
        if: github.ref == 'refs/heads/research-casualty-workx-reliable-evidence-2026-11-14' || github.ref == 'refs/heads/research-casualty-workz-source-evidence-2026-11-14'
        uses: actions/download-artifact@v4
        with:
          run-id: 43521321878
          name: casualty-workl-approved-three-source-research-only
          path: /tmp/workx-workp
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Work X restore frozen Work V result (no publisher HTTP)
        if: github.ref == 'refs/heads/research-casualty-workx-reliable-evidence-2026-11-14' || github.ref == 'refs/heads/research-casualty-workz-source-evidence-2026-11-14'
        uses: actions/download-artifact@v4
        with:
          run-id: 43587369075
          name: casualty-e2e-shadow-proof
          path: /tmp/workx-workv
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Work X independent discovery and existing retained source-index proof
        if: github.ref == 'refs/heads/research-casualty-workx-reliable-evidence-2026-11-14' || github.ref == 'refs/heads/research-casualty-workz-source-evidence-2026-11-14'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/workx-workp')
          m=list(p.rglob('manifest.json'))
          assert len(m)==1, 'Work P immutable manifest missing'
          files=json.loads(m[0].read_text())['files_sha256']
          for name,want in files.items():
              f=m[0].parent/name
              assert f.exists() and hashlib.sha256(f.read_bytes()).hexdigest()==want, name
          v=Path('/tmp/workx-workv')
          sums=list(v.rglob('sha256_manifest.json'))
          assert len(sums)==1
          for name,want in json.loads(sums[0].read_text()).items():
              f=sums[0].parent/name
              assert f.exists() and hashlib.sha256(f.read_bytes()).hexdigest()==want, name
          print('WORKX_RETAINED_ARTIFACT_INNER_HASHES_PASS')
          PY
          p=$(find /tmp/workx-workp -name minimal_capture_facts.json -print -quit)
          v=$(find /tmp/workx-workv -name result.json -print -quit)
          test -s "$p"
          test -s "$v"
          WORKX_WORKP_FACTS="$p" WORKX_WORKV_RESULT="$v" \
            python -m unittest research.casualty_evidence_ingestion_2026_11_13.test_workx -v \
            2>&1 | tee /tmp/worko/workx.log
          WORKX_WORKP_FACTS="$p" WORKX_WORKV_RESULT="$v" python - <<'PY'
          import hashlib, json, os, pathlib
          from research.casualty_evidence_ingestion_2026_11_13 import workx_evidence as x
          src=json.loads(pathlib.Path(os.environ['WORKX_WORKP_FACTS']).read_text())
          workv=json.loads(pathlib.Path(os.environ['WORKX_WORKV_RESULT']).read_text())
          result=x.build_review_index(src)
          assert result['summary']['automatic_credits']==0
          assert workv['latest_total']==23 and workv['replay_increment']==0
          proof={'schema':'casualty-workx-proof-v1','head_sha':os.environ['GITHUB_SHA'],
                 'source_get':0,'production_mutations':0,'publication_allowed':False,
                 'workp_retained_sources':result['summary'],
                 'workv_10oct_final_total':workv['latest_total'],
                 'workv_10oct_increments':[z['review_increment'] for z in workv['effective_progression']],
                 'workv_replay_increment':workv['replay_increment'],
                 't03_t05_incident_auto_matches':0,
                 'unverified_real_html_scenarios':True,
                 'network_mode':'DEFAULT_OFF'}
          out=pathlib.Path('/tmp/worko/workx.json')
          out.write_text(json.dumps(proof,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('WORKX_SOURCE_BASED_PROOF',proof)
          PY
      - name: Synthetic launch-present suite restores file exactly (no HTTP)
        shell: bash
        run: |
          set -euo pipefail
          launch=research/casualty_one_time_capture_2026_11_13/launch.json
          test ! -e "$launch"
          echo '{"synthetic_offline_fixture":true}' > "$launch"
          trap 'rm -f "$launch"' EXIT
          bash research/casualty_workn_clean_rearm_2026_11_13/guarded_prehttp_regressions.sh 2>&1 | tee /tmp/worko/launch-restoration.log
          test -f "$launch"
          test "$(cat "$launch")" = '{"synthetic_offline_fixture":true}'
          rm "$launch"
          trap - EXIT
          test ! -e "$launch"
          git diff --exit-code

      - name: Pinned real-original 18 to 20 to 23 generator proof (no HTTP)
        shell: bash
        run: |
          set -euo pipefail
          echo '84ffea1315d41b8ec67b55a07273d6bbd7d6e8e14191801402168f7fddf4e5df  /tmp/casualty-original/evidence.json' | sha256sum -c -
          echo '4c21321b8a75d57f60efc97f581e89604eaa03289bb64bfba26e491ac83a203b  /tmp/casualty-receipts/capture_receipts.json' | sha256sum -c -
          mkdir -p /tmp/worko/original /tmp/worko/generator
          common=(
            --queue _wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json
            --evidence /tmp/casualty-original/evidence.json
            --receipts /tmp/casualty-receipts/capture_receipts.json
            --matrix _matrix/research/casualty_zaporizhzhia_additional_events_2026_11_12/verification_matrix.json
          )
          python research/casualty_evidence_ingestion_2026_11_13/ingest.py "${common[@]}" --output /tmp/worko/original             2>&1 | tee /tmp/worko/ingestion.log
          python research/casualty_e2e_shadow_2026_11_12/pipeline.py "${common[@]}"             --revisions _site/kyiv-air-alerts-grafana/data/casualties/revisions.csv             --baseline research/casualty_automated_review_2026_11_10/baseline_coverage.json             --city-manifest _site/kyiv-air-alerts-grafana/data/casualties/cities/zaporizhzhia/manifest.json             --city-csv _site/kyiv-air-alerts-grafana/data/casualties/cities/zaporizhzhia/zaporizhzhia_air_attack_deaths_monthly.csv             --generator _site/kyiv-air-alerts-grafana/scripts/update_casualties.py             --dashboard _site/kyiv-air-alerts-grafana/data/dashboard_data.json             --ingested-reports /tmp/worko/original/work_a_reports.json             --output /tmp/worko/generator 2>&1 | tee /tmp/worko/generator.log
          python research/casualty_evidence_ingestion_2026_11_13/verify_proof.py             /tmp/worko/original /tmp/worko/generator 2>&1 | tee /tmp/worko/physical.log
          grep -q 'PASS' /tmp/worko/physical.log
      - name: Proof manifest and explicit zero publisher GET
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, pathlib
          root=pathlib.Path('/tmp/worko')
          logs={}
          for name in (['baseline.log','new.log','work-a.log','workp.log','workq.log','workr.log'] + (['workx.log'] if (os.environ.get('GITHUB_REF','').endswith('/research-casualty-workx-reliable-evidence-2026-11-14') or os.environ.get('GITHUB_REF','').endswith('/research-casualty-workz-source-evidence-2026-11-14')) else [])):
              p=root/name
              if not p.exists():
                  logs[name]={'status':'MISSING','tests':0,'fail':None,'skip':None}
                  continue
              s=p.read_text(errors='replace')
              matches=re.findall(r'Ran (\d+) tests? in',s)
              logs[name]={
                  'status':'PASS' if matches and re.search(r'^OK(?:\s|$)',s,re.M) else 'FAIL',
                  'tests':int(matches[-1]) if matches else 0,
                  'fail':len(re.findall(r'^FAIL:',s,re.M))+len(re.findall(r'^ERROR:',s,re.M)),
                  'skip':len(re.findall(r'\.\.\. skipped ',s)),
              }
          physical=(root/'physical.log').read_text(errors='replace') if (root/'physical.log').exists() else ''
          result={
              'schema':'casualty-worko-offline-proof-v1',
              'head_sha':os.environ.get('GITHUB_SHA'),
              'baseline_sha':'236d3d3af785ea89f44504995498bcd0915d2e10',
              'source_get':0,'source_get_basis':'No source-capture function is invoked by test workflow; only local fixtures and frozen offline baseline',
              'publication_allowed':False,'automatic_credits':0,
              'real_original_18_20_23_proof_log_present':bool(physical),
              'real_original_18_20_23_proof_log_has_pass':bool(re.search(r'PASS',physical)),
              'real_t03_t05_html_retested':False,'test_groups':logs}
          (root/'proof.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.glob('*.log'))}
          hashes['proof.json']=hashlib.sha256((root/'proof.json').read_bytes()).hexdigest()
          if (root/'workx.json').exists():
              hashes['workx.json']=hashlib.sha256((root/'workx.json').read_bytes()).hexdigest()
          (root/'manifest.json').write_text(json.dumps({'files_sha256':hashes},sort_keys=True,indent=2)+'\n')
          assert all(x['status']=='PASS' for x in logs.values()),logs
          assert result['real_original_18_20_23_proof_log_has_pass'],'PHYSICAL_GENERATOR_PROOF_NOT_PASSED'
          print('WORKO_OFFLINE_TEST_GROUPS_PASS',logs)
          PY
      - name: Upload work O proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-worko-offline-parser-evidence-proof
          path: |
            /tmp/worko/*.json
            /tmp/worko/*.log
          retention-days: 30
          if-no-files-found: warn
