name: H2 actual 008 late ACL synthetic PG18 A B
on:
  push:
    branches: [research-h2-008-late-acl-rollback-2026-10-21-gpt6]
    paths:
      - '.github/workflows/h2-actual-008-late-acl-2026-10-21.yml'
      - 'research/h2_008_late_acl_2026_10_21/**'
permissions:
  contents: read
jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
      - name: Verify accepted 008 SQL and execute true late ACL fault
        run: python research/h2_008_late_acl_2026_10_21/test_late_acl.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-008-late-acl-${{ matrix.copy }}
          path: /tmp/h2_008_late_acl_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
