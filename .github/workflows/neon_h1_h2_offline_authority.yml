                      calculated=sha256(data) if data is not None else None
                      verdict="PASS" if original==expected and calculated==expected and len(rows)==matrix[city]["canonical_episodes"] else ("UNRESOLVED_INPUT" if missing else "MISMATCH")
                      cities[city]={"proof_head":head,"original_proof_blob":proof_blob,"generator_blob":observed_script_blob,"method":mode,"rows":len(rows),"accepted_rows":matrix[city]["canonical_episodes"],"original_proof_sha256":original,"accepted_matrix_sha256":expected,"export_embedded_sha256":h2.get("target_hashes",{}).get(city),"recomputed_sha256":calculated,"missing_hash_input_fields":len(missing),"result":verdict}
              if sorted(cities)!=sorted(matrix):
