          ("kharkiv_kherson","79397290b0d51ca49bf15d6e5890ffc3ce631ce3","f5fa45527f40a5af02e98ea5d0958547756d0218","d731d76b3e835d5e3a2ebbbe134592202c4c5495","CANON_CITY_TARGETS","kharkiv,kherson"),
