name: Disposable H1 H2 offline row authority check
on:
  push:
    branches: [neon-h1-h2-large-export-authority-transport-2026-10-11]
    paths: [.github/workflows/neon_h1_h2_offline_authority.yml]
permissions:
  contents: read
jobs:
  row-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify historical inputs offline with independent A and B
        shell: bash
        run: |
          set -euo pipefail
          for commit in 02ad2e8fadee78442753567bc2d3a540345d8e8a 03a04d33f7616b77181741fd77a776c490391d07 efefa399e69eadd3d7fc8393ac1553cfde35f138 31aa7a8f8f57ff090f24814ef3c62137eebebf16 5d18ef85a66384f189ede5ca5654d750f60f088b 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 1998919036b4832fc3555b54c9854e6cfe24a696 79397290b0d51ca49bf15d6e5890ffc3ce631ce3 b09a95da6354d496eea478fc7e6871e62acb4b7d 130f1bdef1bb2479e9b992d26009472930e91987 05e9ce706a2f8da459f46fb130bc25d716cfcc46 cf20d7f411688de9d2684b8baac63c796bfa090e c01f4b3d8f304a8024899f22eaa8a73a8975af05 19637504db967003c4e0465957dc7bd2bf5fbc58 a8eeaf13d51d3e16582212c85cd69a9e6c09685d 778fb57908f64c684d3ee7df5d9a7e3f7731559b; do
