          def git(*parts,raw=False):
              data=subprocess.check_output(["git",*parts],cwd=REPO,stderr=subprocess.DEVNULL)
              return data if raw else data.decode().strip()
          
          def sha256(data):
              return hashlib.sha256(data).hexdigest()
          
          def canonical(obj):
              return json.dumps(obj,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode("utf-8")
          
          def load_at(ref,path,blob):
              actual=git("rev-parse",f"{ref}:{path}")
              if actual != blob:
                  raise ValueError("PROOF_BLOB_MISMATCH:"+path+" "+actual)
              return json.loads(git("cat-file","blob",blob,raw=True))
          
          def load_export(t):
              commit,path,blob,nbytes,digest=t
              actual=git("rev-parse",f"{commit}:{path}")
              raw=git("cat-file","blob",blob,raw=True)
              if actual!=blob or len(raw)!=nbytes or sha256(raw)!=digest or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=blob:
                  raise ValueError("EXPORT_OBJECT_IDENTITY_MISMATCH:"+path)
              return json.loads(raw),{"commit":commit,"path":path,"git_blob":blob,"bytes":len(raw),"sha256":sha256(raw),"status":"EXACT_BYTES_VERIFIED"}
          
          def find_time(row,key):
              from datetime import datetime,timezone
              for parent in [row,row.get("historical_episode") or {},row.get("canonical_episode") or {},row.get("episode") or {},row.get("origin_episode") or {}]:
                  if isinstance(parent,dict) and key in parent:
                      return parent.get(key),key
              micros=row.get(key+"_utc_microseconds")
              if isinstance(micros,int):
                  dt=datetime.fromtimestamp(micros/1000000,timezone.utc)
                  return dt.isoformat(timespec="microseconds").replace("+00:00","Z"),"UTC_MICROSECOND_EXPORT_CONVERSION"
              return None,None
          
          def main():
              h1,h1obj=load_export(H1)
              h2,h2obj=load_export(H2)
              combined,combinedobj=load_export(COMBINED)
              accepted=load_at(*ACCEPTANCE)
