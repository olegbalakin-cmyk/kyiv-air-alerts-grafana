                      elif mode=="CANON_ID_STATE_ARRAY":
                          data=canonical([{"episode_id":a,"state":b} for a,b in pairs])
                      elif mode=="CANON_CHRONO_FULL":
                          full=[]
                          for r in h2group[city]:
                              start,_=find_time(r,"alert_start")
                              end,_=find_time(r,"alert_end")
                              if not isinstance(start,str) or not isinstance(end,str):
                                  missing.append(r["historical_episode_id"])
                              full.append({"episode_id":r["historical_episode_id"],"alert_start":start,"alert_end":end,"state":r["verdict"]})
                          full.sort(key=lambda r:(str(r.get("alert_start") or ""),str(r["episode_id"])))
                          data=canonical(full) if not missing else None
                      else:
