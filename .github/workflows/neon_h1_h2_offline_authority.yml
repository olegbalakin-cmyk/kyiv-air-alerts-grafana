                      qa_mismatch.append(k)
              h1_report={"frozen_campaign_commit":CAMPAIGN,"frozen_batch_files_read":len(batches),"expected_batch_files":139,"frozen_episode_rows":len(base),"duplicate_frozen_identities":len(collisions),"export_classifications":len(h1_rows),"export_unique_episode_identities":len(set(h1_keys)),"historical_identity_missing":len(set(base)-set(h1_keys)),"historical_identity_extra":len(set(h1_keys)-set(base)),"original_unrepaired_verdict_mismatches":len(base_mismatch),"accepted_repair_overlay_count":len(overlay),"export_repaired_overlay_count":sum(r.get("repair_overlay") is not None for r in h1_rows),"repaired_verdict_mismatches":len(repaired_mismatch),"unchanged_original_qa_mismatches":len(qa_mismatch),"accepted_repaired_target_sha256":repairs["hashes"]["repaired_target_state_sha256"],"embedded_repaired_target_sha256":h1.get("target_state_sha256"),"source_membership_projection_independently_reconstructed":False}
              h1_report["independent_verdict_identity_gate"]=all([len(batches)==139,len(base)==6863,len(collisions)==0,len(h1_rows)==6863,len(set(h1_keys))==6863,h1_report["historical_identity_missing"]==0,h1_report["historical_identity_extra"]==0,len(base_mismatch)==0,len(repaired_mismatch)==0,len(qa_mismatch)==0,len(overlay)==25,h1_report["embedded_repaired_target_sha256"]==h1_report["accepted_repaired_target_sha256"]])
