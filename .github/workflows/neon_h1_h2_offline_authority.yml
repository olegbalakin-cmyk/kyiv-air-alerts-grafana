              print("RUN_RESULT="+json.dumps({"report_sha256":sha256(canonical(report)),"h2_hash_matches":h2matched,"h1_gate":h1_report["independent_verdict_identity_gate"],"h2_sample_keys":list(h2["classifications"][0].keys()),"kropy_example":{k:find_time(h2group["kropyvnytskyi"][0],k)[0] for k in ("alert_start","alert_end")}}))
          if __name__=="__main__":
              main()
          
          PY
          mkdir -p /tmp/recon_a /tmp/recon_b
          PYTHONHASHSEED=61 TMPDIR=/tmp/recon_a python3 /tmp/recon.py /tmp/recon_a/result.json
          PYTHONHASHSEED=97 TMPDIR=/tmp/recon_b python3 /tmp/recon.py /tmp/recon_b/result.json
