name: Attack-event STEP 3 committed shadow persistence migration

on:
  push:
    branches:
      - attack-event-step3-shadow-persistence-migration-2026-10-06
    paths:
      - .github/workflows/attack-event-step3-shadow-persistence-migration.yml

permissions:
  contents: write

jobs:
  shadow-persistence-migration:
    name: shadow-persistence-migration
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PHASE1_PROD_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
      PHASE1_PROD_SHADOW_BRANCH_ID: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration DB client
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Build STEP 3 harness from exact STEP 2C implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          payload_dir = Path(".github/step3_payload")
          payload = "".join((payload_dir / f"builder.part{i}").read_text(encoding="ascii").strip() for i in (1, 2, 3))
          source = zlib.decompress(base64.b64decode(payload))
          expected = "613e80160d64e4af6cf6e123e369eb205d7e02e295951f18671a9022f0d6e0af"
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise SystemExit(f"STEP3_BUILDER_SOURCE_SHA256_MISMATCH:{actual}")
          out = Path(os.environ["RUNNER_TEMP"]) / "attack-event-step3-shadow-persistence-migration" / "step3_builder.py"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(source)
          print("STEP3_BUILDER_SOURCE_SHA256=" + actual)
          PY
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "attack-event-step3-shadow-persistence-migration" / "step3_builder.py"
          s = p.read_text(encoding="utf-8")
          old = 'if raw.count(start_marker) != 1 or raw.count(end_marker) < 1:'
          new = 'if raw.count(start_marker) < 1 or raw.count(end_marker) < 1:'
          if s.count(old) != 1:
              raise SystemExit("STEP3_EXTRACTOR_REPAIR_CARDINALITY_MISMATCH")
          p.write_text(s.replace(old, new), encoding="utf-8")
          print("STEP3_EXTRACTOR_REPAIR=APPLIED")
          PY
          python "$RUNNER_TEMP/attack-event-step3-shadow-persistence-migration/step3_builder.py"

      - name: Run committed shadow persistence migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/attack-event-step3-shadow-persistence-migration/step3_migration.py"

      - name: Print compact migration metadata
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "attack-event-step3-shadow-persistence-migration" / "attack_event_23city_shadow_persistence_migration_2026-10-06.json"
          if not p.is_file():
              print("MIGRATION_METADATA_MISSING=1")
              raise SystemExit(0)
          x = json.loads(p.read_text(encoding="utf-8"))
          compact = {
              "verdict": x.get("verdict"),
              "first_failing_gate": x.get("first_failing_gate"),
              "phase": x.get("phase"),
              "target_neon_branch_id": x.get("target_neon_branch_id"),
              "step2c_authorization_status": x.get("step2c_authorization_status"),
              "effective_ddl_sha_status": x.get("effective_ddl_sha_status"),
              "offline_representability_status": x.get("offline_representability_status"),
              "parent_validation": x.get("parent_validation"),
              "pre_transaction_state": x.get("pre_transaction_state"),
              "commit_executed": x.get("commit_executed"),
              "post_commit_durable_counts": x.get("post_commit_durable_counts"),
              "post_commit_semantic_mismatches": x.get("post_commit_semantic_mismatches"),
              "protected_parent_slice_unchanged": x.get("protected_parent_slice_unchanged"),
              "ingestion_runs_delta": x.get("ingestion_runs_delta"),
              "replay_inserts": x.get("replay_inserts"),
              "replay_semantic_conflicts": x.get("replay_semantic_conflicts"),
              "replay_transaction_rolled_back": x.get("replay_transaction_rolled_back"),
              "production_mutation": x.get("production_mutation"),
              "credentials_exposed": x.get("credentials_exposed"),
              "safe_continuation_point": x.get("safe_continuation_point"),
          }
          print("MIGRATION_METADATA=" + json.dumps(compact, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Persist durable migration artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/attack-event-step3-shadow-persistence-migration/attack_event_23city_shadow_persistence_migration_2026-10-06.json"
          dst="research/attack_event_23city_shadow_persistence_migration_2026-10-06.json"
          test -s "$src"
          mkdir -p research
          cp "$src" "$dst"
          sha256sum "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -m "Freeze 23-city shadow persistence migration"
          artifact_commit="$(git rev-parse HEAD)"
          artifact_blob="$(git rev-parse HEAD:$dst)"
          artifact_sha256="$(sha256sum "$dst" | awk '{print $1}')"
          echo "DURABLE_ARTIFACT_COMMIT=$artifact_commit"
          echo "DURABLE_ARTIFACT_BLOB=$artifact_blob"
          echo "DURABLE_ARTIFACT_SHA256=$artifact_sha256"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload shadow persistence migration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-23city-shadow-persistence-migration-2026-10-06
          path: ${{ runner.temp }}/attack-event-step3-shadow-persistence-migration/attack_event_23city_shadow_persistence_migration_2026-10-06.json
          if-no-files-found: error
          retention-days: 30
