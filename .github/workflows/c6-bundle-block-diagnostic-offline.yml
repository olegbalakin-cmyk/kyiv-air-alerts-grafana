name: C6 bundle block diagnostics offline test

on:
  push:
    branches: [research-c6-bundle-block-diagnostic-2026-11-10]

permissions:
  contents: read

jobs:
  narrow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test only safe blocked-export diagnostics
        run: python -m unittest discover -s tests -p 'test_c2_bundle_block_diagnostic.py' -v
