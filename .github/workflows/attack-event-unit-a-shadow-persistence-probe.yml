name: Attack-event Unit A offline persistence projection probe
on:
  push:
    branches:
      - attack-event-unit-a-shadow-persistence-gap-audit-2026-10-09
    paths:
      - .github/workflows/attack-event-unit-a-shadow-persistence-probe.yml
permissions:
  contents: read
jobs:
  offline-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe frozen provenance and contributor representability
        run: python .github/proof/attack_event_unit_a_shadow_persistence_probe.py
