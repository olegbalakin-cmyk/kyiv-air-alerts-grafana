name: Historical blind freeze kyiv proof

on:
  push:
    branches:
      - historical-blind-freeze-kyiv-proof-2026-10-02
    paths-ignore:
      - research/historical_blind_freeze_kyiv_2026-10-02.json

permissions:
  contents: write

concurrency:
  group: historical-blind-freeze-kyiv-proof-2026-10-02
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: historical-blind-freeze-kyiv-proof-2026-10-02

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run one-city blind freeze selector
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/historical_blind_freeze_kyiv.py

      - name: Verify mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {"research/historical_blind_freeze_kyiv_2026-10-02.json"}
          rows = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = set()
          for line in rows:
              if not line.strip():
                  continue
              path = line[3:].strip()
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          assert not unexpected, f"unexpected mutations: {sorted(unexpected)}"
          assert allowed <= changed, f"freeze artifact missing: {sorted(changed)}"
          print("mutation allowlist PASS")
          PY

      - name: Commit compact freeze artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_blind_freeze_kyiv_2026-10-02.json
          git commit -m "Record kyiv blind sample freeze"
          git push origin HEAD:historical-blind-freeze-kyiv-proof-2026-10-02

      - name: Emit compact result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/historical_blind_freeze_kyiv_2026-10-02.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("verdict=", d["verdict"])
          print("city=", d["city"])
          print("before=", d["eligible_count_before_exclusions"])
          print("excluded=", d["exclusions_count"])
          print("after=", d["eligible_count_after_exclusions"])
          print("CITY_SAMPLE_SHA256=", d["CITY_SAMPLE_SHA256"])
          for row in d["selected_cases"]:
              print(row)
          PY
