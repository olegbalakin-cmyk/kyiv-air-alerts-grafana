name: historical-v2-formalization-kropyvnytskyi-mykolaiv-proof

on:
  push:
    branches:
      - historical-v2-formalization-kropyvnytskyi-mykolaiv-proof-2026-10-02
    paths:
      - kyiv-air-alerts-grafana/scripts/formalize_historical_v2_existing_evidence.py
      - .github/workflows/historical-v2-formalization-kropyvnytskyi-mykolaiv-proof.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historical-v2-formalization-kropyvnytskyi-mykolaiv-proof-2026-10-02
          fetch-depth: 0

      - name: Verify base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fb563dc410fe6614263bdc8d4eb55025a987e950 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Self tests
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/replay_explosion_history.py --self-test

      - name: Formalize
        working-directory: kyiv-air-alerts-grafana
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: "*"
        run: python scripts/formalize_historical_v2_existing_evidence.py --output ../research/historical_v2_formalization_kropyvnytskyi_mykolaiv_proof_2026-10-02.json

      - name: Validate artifact
        run: |
          set -euo pipefail
          python -c 'import json; p="research/historical_v2_formalization_kropyvnytskyi_mykolaiv_proof_2026-10-02.json"; d=json.load(open(p,encoding="utf-8")); assert d["city_set"]==["kropyvnytskyi","mykolaiv"]; assert d["methodology"]=="historical-attack-event-air-defense-action-v2"; assert d["mode"]=="REBIND_EXISTING_EVIDENCE"; assert d["cities"]["kropyvnytskyi"]["counts"]["canonical_episodes"]==1161; assert d["cities"]["mykolaiv"]["counts"]["canonical_episodes"]==1648; assert all(d["cities"][c]["counts"]["missing_targets"]==0 and d["cities"][c]["counts"]["duplicate_targets"]==0 and d["cities"][c]["counts"]["extra_targets"]==0 and d["determinism"][c]["pass"] for c in d["city_set"]); print("artifact validation PASS")'

      - name: Mutation guards
        run: |
          set -euo pipefail
          base=fb563dc410fe6614263bdc8d4eb55025a987e950
          test -z "$(git diff --name-only "$base"...HEAD -- 'kyiv-air-alerts-grafana/data/explosion_research/*/final_evidence.json')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'kyiv-air-alerts-grafana/data/explosion_metric_handoff/source_slices/**')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'kyiv-air-alerts-grafana/data/**' 'kyiv-air-alerts-grafana/grafana/**' 'kyiv-air-alerts-grafana/pages-preview/**' 'deploy/**')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'research/historical_attack_event_backfill/**' 'research/historical_attack_event_backfill_status.json' 'research/historical_attack_event_source_registry.json' 'kyiv-air-alerts-grafana/scripts/historical_attack_event_sources.py' 'kyiv-air-alerts-grafana/scripts/discover_historical_attack_events.py')"
          unexpected="$(git diff --name-only "$base"...HEAD | grep -Ev '^(kyiv-air-alerts-grafana/scripts/formalize_historical_v2_existing_evidence\.py|\.github/workflows/historical-v2-formalization-kropyvnytskyi-mykolaiv-proof\.yml)$' || true)"
          test -z "$unexpected"

      - name: Commit proof artifact
        run: |
          set -euo pipefail
          artifact=research/historical_v2_formalization_kropyvnytskyi_mykolaiv_proof_2026-10-02.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          test "$(git diff --cached --name-only)" = "$artifact"
          git commit -m "Add Kropyvnytskyi Mykolaiv v2 formalization proof"
          git push origin HEAD:historical-v2-formalization-kropyvnytskyi-mykolaiv-proof-2026-10-02
