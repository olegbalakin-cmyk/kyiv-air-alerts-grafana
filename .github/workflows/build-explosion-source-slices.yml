name: Build explosion source slices

on:
  workflow_dispatch:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - ".github/workflows/build-explosion-source-slices.yml"
      - "kyiv-air-alerts-grafana/scripts/build_explosion_source_slices.py"
      - "kyiv-air-alerts-grafana/scripts/audit_city_sources.py"
      - "kyiv-air-alerts-grafana/data/explosion_metric_handoff/RESEARCH_SUBSLICES_2026-09-19.csv"

concurrency:
  group: explosion-source-slices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Build and validate source slices
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/build_explosion_source_slices.py

      - name: Validate manifest
        working-directory: kyiv-air-alerts-grafana
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data/explosion_metric_handoff")
          m = json.loads((base / "SOURCE_SLICES_MANIFEST_2026-09-19.json").read_text(encoding="utf-8"))
          assert m["subslice_count"] == 40, m["subslice_count"]
          assert m["all_match_frozen_denominator"] is True
          assert not m["mismatches"]
          files = sorted((base / "source_slices").glob("*_alerts.json"))
          assert len(files) == 40, len(files)
          for path in files:
              x = json.loads(path.read_text(encoding="utf-8"))
              assert x["episode_count"] == x["frozen_denominator"], path.name
              assert len(x["episodes"]) == x["frozen_denominator"], path.name
          print("validated", len(files), "source slices")
          PY

      - name: Commit source slices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             kyiv-air-alerts-grafana/data/explosion_metric_handoff/source_slices             kyiv-air-alerts-grafana/data/explosion_metric_handoff/SOURCE_SLICES_MANIFEST_2026-09-19.json
          if git diff --cached --quiet; then
            echo "No source-slice changes"
            exit 0
          fi
          git commit -m "Build explosion research source slices"

          for attempt in 1 2 3; do
            git fetch origin multicity-wip-2026-09-16
            if git rebase origin/multicity-wip-2026-09-16 && git push origin HEAD:multicity-wip-2026-09-16; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
