name: H2 expanded ACL and rollback PG18 AB
on:
  push:
    branches: [research-h2-full-cas-007-acl-2026-10-20-gpt6]
    paths:
      - '.github/workflows/h2-007-expanded-acl-pg18.yml'
      - 'research/h2_full_cas_007_2026-10-20/test_expanded_acl_pg18.py'
permissions:
  contents: read
jobs:
  pg18-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only synthetic database client dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12"
      - name: Run expanded ACL matrix and selected fail-closed controls
        run: python research/h2_full_cas_007_2026-10-20/test_expanded_acl_pg18.py
      - name: Upload full original results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-007-expanded-acl-${{ matrix.copy }}
          path: /tmp/h2_expanded_acl_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
