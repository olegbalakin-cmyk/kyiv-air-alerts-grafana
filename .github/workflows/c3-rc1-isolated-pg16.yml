name: C3-RC1 isolated PG16 research proof
on:
  push:
    branches: [research-c3-rc1-live-queue-2026-10-28-gpt6]
    paths:
      - ".github/workflows/c3-rc1-isolated-pg16.yml"
      - "kyiv-air-alerts-grafana/scripts/live_canonical_queue.py"
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/attack_event_canonical_persistence.py"
      - "kyiv-air-alerts-grafana/tests/prove_pg16_**"
      - "kyiv-air-alerts-grafana/tests/fixtures/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: offline
          POSTGRES_PASSWORD: offline
          POSTGRES_DB: offline_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offline -d offline_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LOCAL_PROOF_POSTGRES_DSN: "postgresql://offline:offline@localhost:5432/offline_acceptance"
      ATTACK_EVENT_DATABASE_URL: ""
      DATABASE_URL: ""
      NEON_DATABASE_URL: ""
      UKRAINEALARM_API_TOKEN: ""
      GITHUB_TOKEN: ""
      ATTACK_EVENT_PERSISTENCE_CANARY_MAX_EPISODES: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline dependencies
        run: |
          pip install psycopg[binary] requests beautifulsoup4
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply frozen PG16 canonical schema to disposable instance
        run: PGPASSWORD=offline psql -v ON_ERROR_STOP=1 -h localhost -U offline -d offline_acceptance -f kyiv-air-alerts-grafana/tests/fixtures/pg16_verified_canonical_schema.sql
      - name: Execute PG16 reference integration with actual code
        run: |
          python kyiv-air-alerts-grafana/tests/prove_pg16_canonical_pipeline.py > /tmp/c3-pg.json
          python kyiv-air-alerts-grafana/tests/prove_pg16_monitor_main.py > /tmp/c3-monitor.log
          grep '^MAIN_INTEGRATION_REPORT=' /tmp/c3-monitor.log
      - name: Upload bounded proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-rc1-pg16-research-proof
          path: |
            /tmp/c3-pg.json
            /tmp/c3-monitor.log
          if-no-files-found: warn
