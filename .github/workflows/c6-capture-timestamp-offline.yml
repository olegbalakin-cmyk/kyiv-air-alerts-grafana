name: C6 capture timestamp offline regression

on:
  push:
    branches:
      - research-c6-capture-timestamp-fix-2026-11-11
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: C6 capture/replay and synthetic bundle regression
        run: |
          python -m unittest discover -s tests -p 'test_c6_capture_timestamp_fix.py' -v
          python -m unittest discover -s tests -p 'test_c6_integration_wiring.py' -v
          python -m unittest discover -s tests -p 'test_c2_bundle_block_diagnostic.py' -v
