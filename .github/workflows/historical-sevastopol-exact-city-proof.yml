name: Historical Sevastopol exact-city proof

on:
  push:
    branches:
      - historical-sevastopol-exact-city-proof-2026-10-02
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/tests/test_historical_sevastopol_exact_city_proof.py"
      - ".github/workflows/historical-sevastopol-exact-city-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historical-sevastopol-exact-city-proof-2026-10-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt
      - name: Existing classifier self-test
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/monitor_explosion_candidates.py --self-test
      - name: Existing Step-1 timestamp proof
        working-directory: kyiv-air-alerts-grafana
        run: python tests/test_historical_live_update_timestamp_repair.py
      - name: Existing Step-2 source-coverage controls
        working-directory: kyiv-air-alerts-grafana
        run: python tests/test_historical_source_coverage_repair.py
      - name: Focused Sevastopol exact-city proof
        working-directory: kyiv-air-alerts-grafana
        run: python tests/test_historical_sevastopol_exact_city_proof.py
      - name: Scope and frozen-batch guards
        shell: bash
        run: |
          set -euo pipefail
          predecessor=209df693c0c034a8137eee5b8cfd1a295ca086ed
          test "$(git diff --name-only "$predecessor"...HEAD -- 'research/historical_attack_event_backfill/historical-attack-events-v2-2026-09-27/**' | wc -l)" -eq 0
          test "$(find research/historical_attack_event_backfill/historical-attack-events-v2-2026-09-27 -name 'batch_*.json' | wc -l)" -eq 139
          test -z "$(git diff --name-only "$predecessor"...HEAD --             'research/historical_attack_event_source_registry.json'             'kyiv-air-alerts-grafana/scripts/historical_attack_event_sources.py'             'kyiv-air-alerts-grafana/scripts/discover_historical_attack_events.py'             'kyiv-air-alerts-grafana/data/**')"
          unexpected="$(git diff --name-only "$predecessor"...HEAD | grep -Ev '^(kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates\.py|kyiv-air-alerts-grafana/tests/test_historical_sevastopol_exact_city_proof\.py|\.github/workflows/historical-sevastopol-exact-city-proof\.yml)$' || true)"
          test -z "$unexpected"
          echo "Frozen campaign batch diff = 0; batch count = 139; scope guard = PASS"
