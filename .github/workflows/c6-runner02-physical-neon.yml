name: C6 isolated Python Neon read-only proof

on:
  push:
    branches:
      - research-c6-runner02-isolated-2026-10-29
    paths:
      - .github/workflows/c6-runner02-physical-neon.yml

permissions:
  contents: read

concurrency:
  group: c6-runner02-physical-neon-isolated
  cancel-in-progress: false

jobs:
  physical-connection:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-c6-runner02-isolated-2026-10-29'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: c6-runner02-research
    steps:
      - name: Checkout pinned research commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'

      - name: Physical read-only Neon connection
        id: proof
        env:
          C6_B1_READONLY_DATABASE_URL: ${{ secrets.C6_B1_READONLY_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          from urllib import request

          import psycopg
          from psycopg.conninfo import conninfo_to_dict

          expected = {
              'project': 'green-cake-44216048',
              'branch': 'br-bold-mode-b5rub8pq',
              'compute': 'ep-calm-rice-b5073ypp',
              'host': 'ep-calm-rice-b5073ypp.c-7.us-east-2.aws.neon.tech',
              'database': 'neondb',
          }
          output_dir = Path('c6_runner02_proof')
          output_dir.mkdir(exist_ok=True)
          result = {
              'schema': 'c6_runner02_physical_connection_v1',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'target': expected,
              'psycopg_connect_succeeded': False,
              'physical_connection_verdict': 'PYTHON_NEON_CONNECTION_NOT_EXECUTED',
              'b2_verdict': 'B2_NOT_EXECUTED',
              'control_plane_verdict': 'NOT_CHECKED',
              'transaction': None,
              'october_bounded_counts': None,
              'changes_to_neon_or_repository': 0,
          }
          stage = 'env'
          code = 4
          try:
              dsn = os.environ.get('C6_B1_READONLY_DATABASE_URL')
              if not dsn:
                  result['reason'] = 'REQUIRED_ENV_SECRET_NOT_INJECTED'
                  code = 2
              else:
                  stage = 'dsn'
                  dsn_info = conninfo_to_dict(dsn)
                  if (dsn_info.get('host') != expected['host']
                      or dsn_info.get('dbname') != expected['database']
                      or bool(dsn_info.get('hostaddr'))
                      or dsn_info.get('sslmode') not in ('require', 'verify-ca', 'verify-full')):
                      result['reason'] = 'DSN_IDENTITY_OR_TLS_MISMATCH'
                      code = 3
                  else:
                      key = os.environ.get('NEON_API_KEY')
                      if key:
                          url = ('https://console.neon.tech/api/v2/projects/'
                                 + expected['project'] + '/endpoints/' + expected['compute'])
                          req = request.Request(url, headers={'Authorization': 'Bearer ' + key,
                                                               'Accept': 'application/json'})
                          try:
                              with request.urlopen(req, timeout=15) as response:
                                  metadata = json.load(response)
                              endpoint = metadata.get('endpoint') or {}
                              actual = (endpoint.get('id'), endpoint.get('project_id'),
                                        endpoint.get('branch_id'), endpoint.get('type'),
                                        endpoint.get('host'))
                              required = (expected['compute'], expected['project'],
                                          expected['branch'], 'read_only', expected['host'])
                              if all(x is not None for x in actual) and actual != required:
                                  result['control_plane_verdict'] = 'IDENTITY_MISMATCH'
                                  result['reason'] = 'CONTROL_PLANE_IDENTITY_MISMATCH'
                                  code = 3
                              elif actual == required:
                                  result['control_plane_verdict'] = 'MATCH'
                              else:
                                  result['control_plane_verdict'] = 'INCOMPLETE_METADATA'
                          except Exception:
                              result['control_plane_verdict'] = 'UNAVAILABLE'
                      else:
                          result['control_plane_verdict'] = 'NO_API_KEY'

                      if result.get('reason') != 'CONTROL_PLANE_IDENTITY_MISMATCH':
                          stage = 'psycopg_connect'
                          with psycopg.connect(dsn, autocommit=True, connect_timeout=20) as connection:
                              result['psycopg_connect_succeeded'] = True
                              stage = 'transaction'
                              with connection.cursor() as cursor:
                                  cursor.execute('BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY')
                                  cursor.execute('''
                                      SELECT current_database(), current_setting('server_version'),
                                             current_setting('transaction_read_only'),
                                             current_setting('transaction_isolation'),
                                             pg_is_in_recovery(), pg_current_snapshot()::text,
                                             pg_last_wal_replay_lsn()::text
                                  ''')
                                  (database, version, ro, iso, recovery, snapshot, replay_lsn) = cursor.fetchone()
                                  result['transaction'] = {
                                      'database': database, 'postgres_version': version,
                                      'transaction_read_only': ro,
                                      'transaction_isolation': iso,
                                      'pg_is_in_recovery': recovery,
                                      'snapshot': snapshot, 'replay_lsn': replay_lsn,
                                  }
                                  if (database != expected['database'] or ro != 'on'
                                      or iso != 'repeatable read' or recovery is not True):
                                      result['reason'] = 'READ_ONLY_TRANSACTION_GUARD_FAILED'
                                      code = 3
                                  else:
                                      cursor.execute('''
                                          WITH parents AS MATERIALIZED (
                                              SELECT episode_uid FROM public.alert_episodes
                                              WHERE city_key = 'kyiv' AND alert_type = 'AIR'
                                                AND episode_state = 'closed'
                                                AND (start_at AT TIME ZONE 'Europe/Kyiv') >= TIMESTAMP '2026-10-01'
                                                AND (start_at AT TIME ZONE 'Europe/Kyiv') < TIMESTAMP '2026-11-01'
                                          ), classifications AS MATERIALIZED (
                                              SELECT classification_uid FROM public.attack_event_classifications
                                              WHERE alert_episode_uid IN (SELECT episode_uid FROM parents)
                                          )
                                          SELECT (SELECT COUNT(*) FROM parents),
                                                 (SELECT COUNT(*) FROM classifications),
                                                 (SELECT COUNT(*) FROM public.attack_event_sources
                                                  WHERE classification_uid IN (SELECT classification_uid
                                                                                 FROM classifications))
                                      ''')
                                      n_parents, n_classifications, n_links = cursor.fetchone()
                                      result['october_bounded_counts'] = {
                                          'physical_parents': n_parents,
                                          'classifications': n_classifications,
                                          'source_links': n_links,
                                          'historical_reference': [382, 55, 223],
                                      }
                                      result['physical_connection_verdict'] = 'PYTHON_NEON_CONNECTION_PASS'
                                      result['b2_verdict'] = 'B2_INPUT_BLOCKED'
                                      result['b2_blockers'] = [
                                          'APPROVED_PROVENANCE_RECEIPT_NOT_VERIFIED',
                                          'PUBLISHER_LIVE_CAPTURE_NOT_VERIFIED',
                                          'COMPLETE_GUARDED_B2_INPUTS_NOT_VERIFIED',
                                      ]
                                      code = 0
                                  cursor.execute('ROLLBACK')
          except Exception as exc:
              result['failure_stage'] = stage
              result['exception_type_only'] = type(exc).__name__
              if stage in ('psycopg_connect', 'transaction'):
                  result['physical_connection_verdict'] = 'PYTHON_NEON_CONNECTION_FAIL'
          finally:
              result['python_exit_code'] = code
              output = output_dir / 'result.json'
              output.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
              safe_log = output_dir / 'redacted_execution.log'
              safe_log.write_text(
                  'C6-RUNNER-02 isolated read-only physical connection\n'
                  + 'git_sha=' + str(result['git_sha']) + '\n'
                  + 'run_id=' + str(result['run_id']) + '\n'
                  + 'verdict=' + result['physical_connection_verdict'] + '\n'
                  + 'b2_verdict=' + result['b2_verdict'] + '\n'
                  + 'exit_code=' + str(code) + '\n'
              )
              manifest = {
                  'git_sha': result['git_sha'],
                  'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                             for p in (output, safe_log)},
                  'workflow_sha256': hashlib.sha256(Path(
                      '.github/workflows/c6-runner02-physical-neon.yml'
                  ).read_bytes()).hexdigest(),
              }
              (output_dir / 'sha256_manifest.json').write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + '\n'
              )
              print(json.dumps({
                  'physical_connection_verdict': result['physical_connection_verdict'],
                  'b2_verdict': result['b2_verdict'],
                  'python_exit_code': code,
                  'counts': result['october_bounded_counts'],
              }, sort_keys=True))
          sys.exit(code)
          PY

      - name: Upload redacted proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-runner02-physical-${{ github.run_id }}
          path: c6_runner02_proof/
          if-no-files-found: warn
          retention-days: 30
