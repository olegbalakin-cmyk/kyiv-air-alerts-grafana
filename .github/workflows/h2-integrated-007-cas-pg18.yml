name: H2 integrated 007 CAS PG18 AB
on:
  push:
    branches: [research-h2-full-cas-007-acl-2026-10-20-gpt6]
    paths:
      - '.github/workflows/h2-integrated-007-cas-pg18.yml'
      - 'research/h2_full_cas_007_2026-10-20/test_integrated_007_cas.py'
permissions:
  contents: read
jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
      H2_PG18_OWNER_DSN: postgresql://h2_local:synthetic_only@127.0.0.1:5432/postgres
      H2_PG18_WRITER_DSN: postgresql://h2_app_ingest_writer_test:synthetic_only_local_role@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic PostgreSQL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
      - name: Verify frozen original 31 A/B ZIP and JSON Git-only
        run: python research/h2_full_cas_007_2026-10-20/verify_original_31.py
      - name: Execute complete original CAS regression through real non-superuser 007 migration
        run: python research/h2_full_cas_007_2026-10-20/test_integrated_007_cas.py
      - name: Retain exact A or B result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-integrated-007-cas-${{ matrix.copy }}
          path: /tmp/h2_integrated_007_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
