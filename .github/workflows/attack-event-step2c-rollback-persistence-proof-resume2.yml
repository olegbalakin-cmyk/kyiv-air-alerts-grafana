                  "alert_start_at","alert_end_at","verdict","is_event","positive_tier","event_types","qa_reasons_state",
                  "qa_reasons","classifier_reason_codes","classifier_blob_sha","classifier_methodology_version",
                  "normalization_version","evidence_set_sha256","review_provenance_sha256","human_review_state",
                  "review_provenance","originating_frozen_case_id","binding_state","alert_episode_uid","origin_repository",
                  "origin_ref","origin_commit_sha","origin_artifact_path","origin_artifact_blob_sha","origin_target_state_sha256",
                  "origin_workflow_run_id","classified_at","supersedes_classification_uid","revision_reason",
                  "correction_provenance","persisted_by_run_id","origin_provenance","origin_provenance_sha256"
              ]
              EVENT_COLS = [
                  "attack_event_key_version","attack_event_key","event_grain","historical_episode_id","city_key","alert_type",
                  "alert_start_at","alert_end_at","event_status","current_classification_uid","binding_state","alert_episode_uid",
                  "correction_provenance","created_by_run_id","updated_by_run_id"
              ]
              SOURCE_COLS = [
                  "source_link_key_version","source_link_key","classification_uid","observation_id","source_family","source_type",
                  "source_url","telegram_channel","telegram_message_id","source_timestamp","event_timestamp_if_stated","excerpt",
                  "content_sha256","content_hash_basis","observation_classification_outcome","classification_episode_id",
                  "evidence_payload","retrieval_provenance","origin_artifact_path","origin_git_ref","origin_git_blob_sha",
                  "raw_object_path","origin_provenance","origin_provenance_sha256"
              ]

              def class_params(r):
                  vals = []
                  for c in CLASS_COLS:
                      v = r[c]
                      if c in {"qa_reasons"} and v is not None:
                          v = Jsonb(v)
                      elif c in {"review_provenance","correction_provenance","origin_provenance"}:
                          v = Jsonb(v)
                      vals.append(v)
                  return vals

              def event_params(r, uid_map):
                  vals = []
                  for c in EVENT_COLS:
                      if c == "current_classification_uid":
                          v = uid_map[r["classification_key_v2"]]
                      else:
                          v = r[c]
                      if c == "correction_provenance":
                          v = Jsonb(v)
                      vals.append(v)
                  return vals

              def source_params(r, uid_map):
                  vals = []
                  for c in SOURCE_COLS:
                      if c == "classification_uid":
                          v = uid_map[r["classification_key_v2"]]
                      else:
                          v = r[c]
                      if c in {"evidence_payload","retrieval_provenance","origin_provenance"}:
                          v = Jsonb(v)
                      vals.append(v)
                  return vals

              class_sql = "INSERT INTO public.attack_event_classifications (" + ",".join(CLASS_COLS) + ") VALUES (" + ",".join(["%s"]*len(CLASS_COLS)) + ")"
              event_sql = "INSERT INTO public.attack_events (" + ",".join(EVENT_COLS) + ") VALUES (" + ",".join(["%s"]*len(EVENT_COLS)) + ")"
              source_sql = "INSERT INTO public.attack_event_sources (" + ",".join(SOURCE_COLS) + ") VALUES (" + ",".join(["%s"]*len(SOURCE_COLS)) + ")"

              # PHASE 3: forced-failure atomicity under one savepoint.
              phase = "FORCED_FAILURE_ATOMICITY"
              sample_event = sorted(event_rows, key=lambda x: x["attack_event_key"])[0]
              sample_ck = sample_event["classification_key_v2"]
              sample_class = next(r for r in class_rows if r["classification_key"] == sample_ck)
              sample_sources = [r for r in source_rows if r["classification_key_v2"] == sample_ck]
              cur.execute("SAVEPOINT attack_event_atomicity_test")
              cur.execute(class_sql, class_params(sample_class))
              cur.execute("SELECT classification_uid::text FROM public.attack_event_classifications WHERE classification_key=%s", (sample_ck,))
              sample_uid = cur.fetchone()[0]
              cur.execute(event_sql, event_params(sample_event, {sample_ck: sample_uid}))
              if sample_sources:
                  cur.execute(source_sql, source_params(sorted(sample_sources, key=lambda x: x["source_link_key"])[0], {sample_ck: sample_uid}))
              invalid = dict(sample_class)
              invalid["classification_key"] = "0" * 64
              invalid["binding_state"] = "BROKEN"
              invalid["alert_episode_uid"] = None
              violated = False
              try:
                  cur.execute(class_sql, class_params(invalid))
              except psycopg.Error:
                  violated = True
              if not violated:
                  fail("FORCED_FAILURE_CONSTRAINT_NOT_TRIGGERED", phase=phase)
              cur.execute("ROLLBACK TO SAVEPOINT attack_event_atomicity_test")
              cur.execute("RELEASE SAVEPOINT attack_event_atomicity_test")
              zero_counts = []
              for t in ("attack_event_classifications","attack_events","attack_event_sources"):
                  cur.execute(f"SELECT count(*) FROM public.{t}")
                  zero_counts.append(int(cur.fetchone()[0]))
              if zero_counts != [0, 0, 0]:
                  fail("FORCED_FAILURE_ATOMICITY_MISMATCH", phase=phase, detail=str(zero_counts))
              result["forced_failure_atomicity"] = "PASS"

              # PHASE 4: full pass A.
              phase = "FULL_PASS_A"
              cur.executemany(class_sql, [class_params(r) for r in class_rows])
              cur.execute("SELECT classification_key, classification_uid::text FROM public.attack_event_classifications")
              uid_map = {str(k): str(v) for k, v in cur.fetchall()}
              if len(uid_map) != 26405:
                  fail("PASS_A_CLASSIFICATION_UID_MAP_MISMATCH", phase=phase)
              cur.executemany(event_sql, [event_params(r, uid_map) for r in event_rows])
              cur.executemany(source_sql, [source_params(r, uid_map) for r in source_rows])

              for table, expected in (("attack_event_classifications",26405),("attack_events",1080),("attack_event_sources",3769)):
                  cur.execute(f"SELECT count(*) FROM public.{table}")
                  if int(cur.fetchone()[0]) != expected:
                      fail("PASS_A_ROW_COUNT_MISMATCH", phase=phase, table="public."+table, count=int(cur.fetchone()[0]) if False else None)
              cur.execute("SELECT verdict,count(*) FROM public.attack_event_classifications GROUP BY verdict")
              if {k:int(v) for k,v in cur.fetchall()} != EXPECTED_DIST:
                  fail("PASS_A_VERDICT_DISTRIBUTION_MISMATCH", phase=phase)
              cur.execute("SELECT qa_reasons_state,count(*) FROM public.attack_event_classifications GROUP BY qa_reasons_state")
              if {k:int(v) for k,v in cur.fetchall()} != {"MATERIALIZED":6863,"UNMATERIALIZED_IN_ACCEPTED_SOURCE":19542}:
                  fail("PASS_A_QA_DISTRIBUTION_MISMATCH", phase=phase)
              cur.execute("SELECT human_review_state,count(*) FROM public.attack_event_classifications GROUP BY human_review_state")
              hdb = {k:int(v) for k,v in cur.fetchall()}
              if hdb.get("NONE",0) != 24610 or hdb.get("NEEDS_REVIEW",0) != 1795 or hdb.get("REVIEWED_EVIDENCE",0) != 0:
                  fail("PASS_A_HUMAN_REVIEW_DISTRIBUTION_MISMATCH", phase=phase)
              cur.execute("SELECT binding_state,count(*) FROM public.attack_event_classifications GROUP BY binding_state")
              if {k:int(v) for k,v in cur.fetchall()} != {"BOUND":26380,"UNBOUND":25}:
                  fail("PASS_A_BINDING_DISTRIBUTION_MISMATCH", phase=phase)
              cur.execute(
                  "SELECT count(*) FROM public.attack_events e "
                  "JOIN public.attack_event_classifications c ON c.classification_uid=e.current_classification_uid "
                  "WHERE c.verdict NOT IN ('STRICT_EVENT_POSITIVE','SENSITIVITY_EVENT_POSITIVE') "
                  "OR c.city_key<>e.city_key OR c.historical_episode_id<>e.historical_episode_id "
                  "OR c.binding_state<>e.binding_state OR c.alert_episode_uid IS DISTINCT FROM e.alert_episode_uid"
              )
              if int(cur.fetchone()[0]) != 0:
                  fail("PASS_A_EVENT_CLASSIFICATION_INVARIANT_MISMATCH", phase=phase)
              cur.execute(
                  "SELECT count(*) FROM public.attack_event_sources s "
                  "LEFT JOIN public.attack_event_classifications c ON c.classification_uid=s.classification_uid "
                  "WHERE c.classification_uid IS NULL"
              )
              if int(cur.fetchone()[0]) != 0:
                  fail("PASS_A_SOURCE_FK_INVARIANT_MISMATCH", phase=phase)
              result["pass_a"] = {"classifications":26405,"events":1080,"sources":3769}
              result["fk_validation"] = "PASS"

              # Semantic equality before replay.
              phase = "IDEMPOTENT_PASS_B"
              class_sem_cols = CLASS_COLS
              event_sem_cols = EVENT_COLS
              source_sem_cols = SOURCE_COLS

              def compare_table(table, key_col, cols, expected_rows, expected_key, transform_expected):
                  cur.execute("SELECT " + ",".join(cols) + f" FROM public.{table} ORDER BY {key_col}")
                  db_rows = cur.fetchall()
                  exp = sorted(expected_rows, key=lambda r: str(r[expected_key]))
                  if len(db_rows) != len(exp):
                      return len(exp)
                  mismatches = 0
                  for dbrow, erow in zip(db_rows, exp):
                      ex = transform_expected(erow)
                      if normalize(list(dbrow)) != normalize([ex[c] for c in cols]):
                          mismatches += 1
                  return mismatches

              class_conflicts = compare_table(
                  "attack_event_classifications","classification_key",class_sem_cols,class_rows,"classification_key",lambda r:r
              )
              event_conflicts = compare_table(
                  "attack_events","attack_event_key",event_sem_cols,event_rows,"attack_event_key",
                  lambda r: {**r, "current_classification_uid": uid_map[r["classification_key_v2"]]}
              )
              source_conflicts = compare_table(
                  "attack_event_sources","source_link_key",source_sem_cols,source_rows,"source_link_key",
                  lambda r: {**r, "classification_uid": uid_map[r["classification_key_v2"]]}
              )
              semantic_conflicts = class_conflicts + event_conflicts + source_conflicts
              if semantic_conflicts:
                  fail("PASS_B_SEMANTIC_CONFLICT", phase=phase, count=semantic_conflicts)

              before = {}
              for t in ("attack_event_classifications","attack_events","attack_event_sources"):
                  cur.execute(f"SELECT count(*) FROM public.{t}")
                  before[t] = int(cur.fetchone()[0])
              cur.executemany(class_sql + " ON CONFLICT DO NOTHING", [class_params(r) for r in class_rows])
              cur.executemany(event_sql + " ON CONFLICT DO NOTHING", [event_params(r, uid_map) for r in event_rows])
              cur.executemany(source_sql + " ON CONFLICT DO NOTHING", [source_params(r, uid_map) for r in source_rows])
              after = {}
              for t in ("attack_event_classifications","attack_events","attack_event_sources"):
                  cur.execute(f"SELECT count(*) FROM public.{t}")
                  after[t] = int(cur.fetchone()[0])
              replay = {k: after[k]-before[k] for k in before}
              if any(replay.values()):
                  fail("PASS_B_NON_IDEMPOTENT_INSERT", phase=phase, detail=str(replay))
              result["replay_inserts"] = {
                  "classifications": replay["attack_event_classifications"],
                  "events": replay["attack_events"],
                  "sources": replay["attack_event_sources"],
              }
              result["semantic_conflicts"] = 0

              # PHASE 6: explicit outer rollback via client transaction rollback; no COMMIT is issued.
              phase = "OUTER_ROLLBACK"
              rollback_outer()
              write_conn.close()
              write_conn = None

              # PHASE 7: fresh read-only post-rollback verification.
              phase = "POST_ROLLBACK"
              post_rollback_safety()
              if result.get("attack_event_tables_after_rollback") != 0:
                  fail("POST_ROLLBACK_ATTACK_EVENT_TABLES_REMAIN", phase=phase)
              if result.get("committed_attack_event_rows") != 0:
                  fail("POST_ROLLBACK_COMMITTED_ROWS_PRESENT", phase=phase)
              if result.get("ingestion_runs_delta") != 0:
                  fail("POST_ROLLBACK_INGESTION_RUNS_DELTA", phase=phase, count=result.get("ingestion_runs_delta"))
              if result.get("protected_alert_episodes_unchanged") is not True:
                  fail("POST_ROLLBACK_PROTECTED_PARENT_STATE_CHANGED", phase=phase)
              result["committed_db_mutations"] = 0
              result["verdict"] = "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF PASSED"
              result["first_failing_gate"] = None
              result["phase"] = "COMPLETE"
              result["remaining_representability_gaps"] = []
              result["safe_continuation_point"] = "Proof complete. Do not proceed to real persistence in this task."
              PROOF_PATH.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print("VERDICT=" + result["verdict"])
              print("EXHAUSTIVE_OFFLINE_REPRESENTABILITY=PASS")
              print("REMAINING_REPRESENTABILITY_GAPS=0")
              print("EFFECTIVE_CANDIDATE_DDL_SHA256=" + result["effective_candidate_ddl_sha256"])
              print("PARENT_VALIDATION=PASS")
              print("FORCED_FAILURE_ATOMICITY=PASS")
              print("PASS_A_CLASSIFICATIONS=26405")
              print("PASS_A_EVENTS=1080")
              print("PASS_A_SOURCES=3769")
              print("REPLAY_CLASSIFICATION_INSERTS=0")
              print("REPLAY_EVENT_INSERTS=0")
              print("REPLAY_SOURCE_INSERTS=0")
              print("SEMANTIC_CONFLICTS=0")
              print("OUTER_ROLLBACK=PASS")
              print("COMMITTED_NEON_MUTATIONS=0")

          except GateError as exc:
              try:
                  rollback_outer()
              except Exception as rb_exc:
                  result["rollback_error_type"] = type(rb_exc).__name__
              if write_conn is not None:
                  try:
                      write_conn.close()
                  except Exception:
                      pass
                  write_conn = None
              if result.get("db_preflight_ran"):
                  try:
                      post_rollback_safety()
                  except Exception as safety_exc:
                      result["post_rollback_safety_error"] = type(safety_exc).__name__ + ":" + safe_error(safety_exc)
              result.update({
                  "verdict": "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF BLOCKED",
                  "first_failing_gate": exc.gate,
                  "phase": exc.phase or phase,
                  "affected_table_or_contract_field": {"table": exc.table, "field": exc.field} if (exc.table or exc.field) else None,
                  "affected_row_count": exc.count,
                  "committed_db_mutations": 0 if result.get("attack_event_tables_after_rollback") in (0, None) else None,
                  "production_mutation": "NO",
                  "safe_continuation_point": (
                      "Do not repair this blocker in the same task. Resume only from the reported gate after a separately frozen contract/addendum if required."
                  ),
              })
              if exc.detail is not None:
                  result["compact_diagnostic"] = str(exc.detail)[:500]
              PROOF_PATH.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print("VERDICT=" + result["verdict"], file=sys.stderr)
              print("FIRST_FAILING_GATE=" + exc.gate, file=sys.stderr)
              print("PHASE=" + str(result["phase"]), file=sys.stderr)
              if exc.table:
                  print("AFFECTED_TABLE=" + str(exc.table), file=sys.stderr)
              if exc.field:
                  print("AFFECTED_FIELD=" + str(exc.field), file=sys.stderr)
              if exc.count is not None:
                  print("AFFECTED_COUNT=" + str(exc.count), file=sys.stderr)
              for i, gap in enumerate(result.get("remaining_representability_gaps", [])[:10], 1):
                  print(
                      "REPRESENTABILITY_GAP_" + str(i) + "=" +
                      str(gap.get("table")) + "." + str(gap.get("field")) +
                      ";count=" + str(gap.get("affected_count")) +
                      ";reason=" + re.sub(r"[^A-Za-z0-9_ .,:;=/+-]", "?", str(gap.get("reason")))[:220],
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          except Exception as exc:
              try:
                  rollback_outer()
              except Exception:
                  pass
              if write_conn is not None:
                  try:
                      write_conn.close()
                  except Exception:
                      pass
              if result.get("db_preflight_ran"):
                  try:
                      post_rollback_safety()
                  except Exception:
                      pass
              result.update({
                  "verdict": "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF BLOCKED",
                  "first_failing_gate": "EXECUTION_HARNESS_FAILURE",
                  "phase": phase,
                  "affected_table_or_contract_field": None,
                  "affected_row_count": None,
                  "compact_diagnostic": type(exc).__name__ + ":" + safe_error(exc),
                  "production_mutation": "NO",
                  "safe_continuation_point": "Fix proof tooling only; do not repair frozen data and do not proceed to real persistence.",
              })
              PROOF_PATH.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print("VERDICT=" + result["verdict"], file=sys.stderr)
              print("FIRST_FAILING_GATE=EXECUTION_HARNESS_FAILURE", file=sys.stderr)
              print("PHASE=" + phase, file=sys.stderr)
              print("ERROR_TYPE=" + type(exc).__name__, file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Print compact proof metadata
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "attack-event-step2c-rollback-persistence-proof-resume2" / "attack_event_23city_rollback_persistence_proof_resume2.json"
          if not p.is_file():
              print("PROOF_METADATA_MISSING=1")
              raise SystemExit(0)
          x = json.loads(p.read_text(encoding="utf-8"))
          compact = {
              "verdict": x.get("verdict"),
              "first_failing_gate": x.get("first_failing_gate"),
              "phase": x.get("phase"),
              "affected_table_or_contract_field": x.get("affected_table_or_contract_field"),
              "affected_row_count": x.get("affected_row_count"),
              "snapshot_sha_status": x.get("snapshot_sha_status"),
              "binding_map_sha_status": x.get("binding_map_sha_status"),
              "contract_sha_status": x.get("contract_sha_status"),
              "exhaustive_offline_representability": x.get("exhaustive_offline_representability"),
              "remaining_representability_gap_count": len(x.get("remaining_representability_gaps") or []),
              "remaining_representability_gaps": (x.get("remaining_representability_gaps") or [])[:10],
              "effective_candidate_ddl_sha256": x.get("effective_candidate_ddl_sha256"),
              "human_review_state": x.get("human_review_state"),
              "db_preflight_ran": x.get("db_preflight_ran"),
              "parent_validation": x.get("parent_validation"),
              "forced_failure_atomicity": x.get("forced_failure_atomicity"),
              "pass_a": x.get("pass_a"),
              "fk_validation": x.get("fk_validation"),
              "replay_inserts": x.get("replay_inserts"),
              "semantic_conflicts": x.get("semantic_conflicts"),
              "outer_rollback_executed": x.get("outer_rollback_executed"),
              "attack_event_tables_after_rollback": x.get("attack_event_tables_after_rollback"),
              "committed_attack_event_rows": x.get("committed_attack_event_rows"),
              "ingestion_runs_delta": x.get("ingestion_runs_delta"),
              "protected_alert_episodes_unchanged": x.get("protected_alert_episodes_unchanged"),
              "committed_db_mutations": x.get("committed_db_mutations"),
              "production_mutation": x.get("production_mutation"),
              "credentials_exposed": x.get("credentials_exposed"),
              "safe_continuation_point": x.get("safe_continuation_point"),
          }
          print("PROOF_METADATA=" + json.dumps(compact, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload rollback persistence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-23city-rollback-persistence-proof-resume2
          path: ${{ runner.temp }}/attack-event-step2c-rollback-persistence-proof-resume2/attack_event_23city_rollback_persistence_proof_resume2.json
          if-no-files-found: error
          retention-days: 30
