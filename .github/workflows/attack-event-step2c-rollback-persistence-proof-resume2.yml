              if source_lossless != ((exp_lossless.get("source_link") or {}).get("losslessly_representable")):
                  audit(stable, "origin_provenance", "UNREPRESENTABLE", abs(3769 - source_lossless), "source provenance coverage differs from frozen provenance-cardinality addendum")
              if bad_hash_basis:
                  audit(stable, "content_hash_basis", "UNREPRESENTABLE", bad_hash_basis, "content_hash_basis outside frozen STEP 1 enum")
              if bad_outcome:
