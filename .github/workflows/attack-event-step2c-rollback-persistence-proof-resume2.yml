              audit(stable, "classification_uid", "CONTRACT_DERIVED")
              for f in ("source_family", "source_url", "telegram_channel", "telegram_message_id", "source_timestamp", "event_timestamp_if_stated", "excerpt", "observation_classification_outcome", "classification_episode_id"):
