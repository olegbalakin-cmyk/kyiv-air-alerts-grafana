name: Attack-event STEP 2C rollback-only persistence proof resume2

on:
  push:
    branches:
      - attack-event-step2c-rollback-persistence-proof-resume2-2026-10-05
    paths:
      - .github/workflows/attack-event-step2c-rollback-persistence-proof-resume2.yml

permissions:
  contents: read

jobs:
  rollback-persistence-proof:
    name: rollback-persistence-proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PHASE1_PROD_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
      PHASE1_PROD_SHADOW_BRANCH_ID: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof-only DB client
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Run STEP 2C rollback-only proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from uuid import UUID

          import psycopg
          from psycopg.types.json import Jsonb

          REPO = "olegbalakin-cmyk/kyiv-air-alerts-grafana"
          EXPECTED_BRANCH = "br-bold-mode-b5rub8pq"
          SNAPSHOT = {
              "commit": "efefa399e69eadd3d7fc8393ac1553cfde35f138",
              "path": "research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json",
              "blob": "8a2f6bd33f879be9db978da59c12c34e61f6f843",
              "sha256": "09458bcf0a019fa2939eb9dfa484da46cd8fa2be077343c5ba6d595c93d71788",
              "bytes": 90282029,
          }
          BINDING = {
              "commit": "e213f445f08bfc119b234c9460b66bd3efe75d36",
              "path": "research/attack_event_23city_parent_binding_map_v1_2026-10-05.json",
              "sha256": "b0ecd5ce980d76cf5ffce65f80ee1d5bd43c0d1b1438afb85424ae95aaef1241",
          }
          STEP1 = {
              "commit": "b205d38dbc50bc502d10e682d4ae53491af542ea",
              "path": "research/attack_event_neon_persistence_contract_2026-10-02.json",
              "sha256": "02bfe8bb0420bcf1259b0c49a73ca76e8cc6488c1cd426be4dd8b28ad01b94c3",
          }
          V2 = {
              "commit": "bd82a6c0a19aca4610a8af6df73a307a88c35bf6",
              "path": "research/attack_event_classification_identity_availability_addendum_2026-10-04.json",
              "sha256": "a1ba446261625383650b781233fc4956290bffd1437756dca8d7883b24906017",
          }
          PROVENANCE = {
              "commit": "cafee4106d89f59d7f1020baef414ba4813ab29d",
              "path": "research/attack_event_provenance_cardinality_addendum_2026-10-05.json",
              "blob": "58a78e525f728fa9f6e52c38ae75c5358ca1b678",
              "sha256": "e7bb8eb181d152b9760a5d80dc46ce0e261146e7e14433b706989f30e7ffc068",
          }
          HUMAN = {
              "commit": "1b161d240013a669aefd2b9485d6e5f2ca7c7402",
              "path": "research/attack_event_human_review_state_derivation_addendum_2026-10-05.json",
              "blob": "5a5ca7da0335685a1480d6f22bac5452c5251f09",
              "sha256": "b611a8171ed3e8b4d0146f03f61c511b55fbca2e1f26c2796241784bb2d6e7d1",
          }
          EXPECTED_DIST = {
              "STRICT_EVENT_POSITIVE": 1017,
              "SENSITIVITY_EVENT_POSITIVE": 63,
              "NO_CONFIRMED_EVENT": 23530,
              "NEEDS_REVIEW": 1795,
          }
          EXPECTED_HUMAN = {"NONE": 24610, "NEEDS_REVIEW": 1795, "REVIEWED_EVIDENCE": 0}
          POSITIVE = {"STRICT_EVENT_POSITIVE", "SENSITIVITY_EVENT_POSITIVE"}
          OUTDIR = Path(os.environ["RUNNER_TEMP"]) / "attack-event-step2c-rollback-persistence-proof-resume2"
          OUTDIR.mkdir(parents=True, exist_ok=True)
          PROOF_PATH = OUTDIR / "attack_event_23city_rollback_persistence_proof_resume2.json"

          class GateError(RuntimeError):
              def __init__(self, gate, *, phase=None, table=None, field=None, count=None, detail=None):
                  self.gate = gate
                  self.phase = phase
                  self.table = table
                  self.field = field
                  self.count = count
                  self.detail = detail
                  super().__init__(gate)

          def fail(gate, *, phase=None, table=None, field=None, count=None, detail=None):
              raise GateError(gate, phase=phase, table=table, field=field, count=count, detail=detail)

          def safe_error(exc):
              s = str(exc)
              secret = os.environ.get("PHASE1_PROD_SHADOW_DATABASE_URL", "")
              if secret:
                  s = s.replace(secret, "<redacted>")
              s = re.sub(r"(?i)(postgres(?:ql)?://)[^@\s]+@", r"\1<redacted>@", s)
              return s[:500]

          def run(args, *, stdout=None, check=True):
              p = subprocess.run(
                  list(map(str, args)),
                  stdout=stdout if stdout is not None else subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=False,
              )
              if check and p.returncode != 0:
                  err = (p.stderr or b"").decode("utf-8", "replace")[-500:]
                  raise RuntimeError("command failed: " + " ".join(map(str, args)) + ": " + err)
              return p

          def git_text(*args):
              return run(["git", *args]).stdout.decode("utf-8", "replace").strip()

          def ensure_commit(sha):
              p = run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=False)
              if p.returncode != 0:
                  run(["git", "fetch", "--no-tags", "origin", sha])
              if git_text("rev-parse", f"{sha}^{{commit}}") != sha:
                  fail("FROZEN_INPUT_COMMIT_MISMATCH", phase="OFFLINE_PREFLIGHT")

          def sha_file(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def materialize(spec, label):
              ensure_commit(spec["commit"])
              blob = git_text("rev-parse", f'{spec["commit"]}:{spec["path"]}')
              if spec.get("blob") and blob != spec["blob"]:
                  fail(label + "_GIT_BLOB_MISMATCH", phase="OFFLINE_PREFLIGHT")
              out = OUTDIR / (label.lower() + ".json")
              with out.open("wb") as f:
                  p = run(["git", "show", f'{spec["commit"]}:{spec["path"]}'], stdout=f, check=False)
              if p.returncode != 0:
                  fail(label + "_MATERIALIZATION_FAILED", phase="OFFLINE_PREFLIGHT")
              if spec.get("bytes") is not None and out.stat().st_size != spec["bytes"]:
                  fail(label + "_BYTE_COUNT_MISMATCH", phase="OFFLINE_PREFLIGHT")
              actual_sha = sha_file(out)
              if spec.get("sha256") and actual_sha != spec["sha256"]:
                  fail(label + "_SHA256_MISMATCH", phase="OFFLINE_PREFLIGHT")
              return out, blob, actual_sha

          def load_json(spec, label):
              p, blob, sha = materialize(spec, label)
              try:
                  return json.loads(p.read_bytes()), blob, sha
              except Exception:
                  fail(label + "_JSON_INVALID", phase="OFFLINE_PREFLIGHT")

          def canonical_json_bytes(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")

          def canonical_sha(value):
              return hashlib.sha256(canonical_json_bytes(value)).hexdigest()

          def parse_utc(value):
              if not isinstance(value, str) or not value:
                  raise ValueError("missing timestamp")
              dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  raise ValueError("naive timestamp")
              return dt.astimezone(timezone.utc)

          def utc_microseconds(dt):
              if dt is None:
                  return None
              return dt.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")

          def walk_values(obj, predicate):
              out = []
              def walk(x, key=""):
                  if isinstance(x, dict):
                      for k, v in x.items():
                          walk(v, str(k))
                  elif isinstance(x, list):
                      for v in x:
                          walk(v, key)
                  elif predicate(key.lower(), x):
                      out.append(x)
              walk(obj)
              return out

          def unique_string(obj, predicate):
              vals = sorted({str(v) for v in walk_values(obj, predicate) if isinstance(v, (str, int)) and str(v).strip()})
              return vals[0] if len(vals) == 1 else None

          def classification_origin_projection(origin):
              return {
                  "origin_repository": unique_string(origin, lambda k, v: k == "origin_repository") or REPO,
                  "origin_ref": unique_string(origin, lambda k, v: k == "ref" or k.endswith("_ref")),
                  "origin_commit_sha": unique_string(origin, lambda k, v: "commit" in k or k.endswith("_head") or k in {"tested_head", "accepted_final_head"}),
                  "origin_artifact_path": unique_string(origin, lambda k, v: "path" in k),
                  "origin_artifact_blob_sha": unique_string(origin, lambda k, v: "blob" in k),
                  "origin_target_state_sha256": unique_string(origin, lambda k, v: k == "origin_target_state_sha256" or k.endswith("target_state_sha256")),
                  "origin_workflow_run_id": unique_string(origin, lambda k, v: "run_id" in k and isinstance(v, (str, int))),
              }

          def source_origin_projection(origin):
              return {
                  "origin_artifact_path": unique_string(origin, lambda k, v: "path" in k),
                  "origin_git_ref": unique_string(origin, lambda k, v: k == "ref" or k.endswith("_ref")),
                  "origin_git_blob_sha": unique_string(origin, lambda k, v: "blob" in k),
              }

          def explicit_frozen_case_id(row):
              vals = []
              for key in ("originating_frozen_case_id", "frozen_case_id"):
                  vals.extend(walk_values(row, lambda k, v, key=key: k == key and isinstance(v, (str, int)) and str(v).strip()))
              vals = sorted({str(v) for v in vals})
              return vals[0] if len(vals) == 1 else None

          def has_adjudication_marker(row):
              return bool(walk_values(row, lambda k, v: k in {"accepted_adjudication_artifact", "adjudication_class"} and v not in (None, "", False)))

          def nonempty_review(value):
              return isinstance(value, dict) and bool(value)

          def derive_human_state(row):
              rv = row.get("review_provenance")
              rh = row.get("review_provenance_sha256")
              if nonempty_review(rv) and isinstance(rh, str) and rh:
                  if canonical_sha(rv) != rh:
                      raise ValueError("review provenance hash mismatch")
                  return "REVIEWED_EVIDENCE"
              if nonempty_review(rv) != bool(rh):
                  raise ValueError("review provenance/hash consistency mismatch")
              if row.get("verdict") == "NEEDS_REVIEW":
                  return "NEEDS_REVIEW"
              return "NONE"

          def build_effective_ddl(step1, v2, provenance, human):
              ddl = step1.get("candidate_ddl")
              if not isinstance(ddl, str) or not ddl.strip():
                  fail("PERSISTENCE_CONTRACT_DDL_UNAVAILABLE", phase="OFFLINE_PREFLIGHT")
              if (v2.get("future_schema_contract") or {}).get("classification_key_version_required") != "attack-event-classification-key-v2":
                  fail("CLASSIFICATION_IDENTITY_V2_CONTRACT_MISMATCH", phase="OFFLINE_PREFLIGHT")
              old_col = "    qa_reasons TEXT[] NOT NULL DEFAULT '{}'::text[],"
              new_col = "    qa_reasons_state TEXT NOT NULL,\n    qa_reasons JSONB NULL,"
              if ddl.count(old_col) != 1:
                  fail("PERSISTENCE_CONTRACT_DDL_DELTA_MISMATCH", phase="OFFLINE_PREFLIGHT")
              ddl = ddl.replace(old_col, new_col)
              old_ver = "CHECK (classification_key_version = 'attack-event-classification-key-v1')"
              new_ver = "CHECK (classification_key_version = 'attack-event-classification-key-v2')"
              if ddl.count(old_ver) != 1:
                  fail("PERSISTENCE_CONTRACT_DDL_DELTA_MISMATCH", phase="OFFLINE_PREFLIGHT")
              ddl = ddl.replace(old_ver, new_ver)
              ddl = ddl.rstrip() + "\n\n" + """
          ALTER TABLE public.attack_event_classifications
              ADD CONSTRAINT attack_event_classifications_qa_state_check
              CHECK (qa_reasons_state IN ('MATERIALIZED','UNMATERIALIZED_IN_ACCEPTED_SOURCE'));

          ALTER TABLE public.attack_event_classifications
              ADD CONSTRAINT attack_event_classifications_qa_value_check
              CHECK (
                  (qa_reasons_state = 'MATERIALIZED' AND jsonb_typeof(qa_reasons) = 'array')
                  OR
                  (qa_reasons_state = 'UNMATERIALIZED_IN_ACCEPTED_SOURCE' AND qa_reasons IS NULL)
              );
          """.lstrip()
              delta = provenance.get("candidate_ddl_delta") or {}
              prov_sql = delta.get("sql")
              if not isinstance(prov_sql, str) or hashlib.sha256(prov_sql.encode("utf-8")).hexdigest() != delta.get("sha256"):
                  fail("PROVENANCE_CARDINALITY_DDL_DELTA_SHA_MISMATCH", phase="OFFLINE_PREFLIGHT")
              if delta.get("supersedes_only_origin_provenance_representation") is not True:
                  fail("PROVENANCE_CARDINALITY_DELTA_SCOPE_MISMATCH", phase="OFFLINE_PREFLIGHT")
              if (human.get("future_schema_contract") or {}).get("column") != "human_review_state TEXT NOT NULL":
                  fail("HUMAN_REVIEW_STATE_CONTRACT_MISMATCH", phase="OFFLINE_PREFLIGHT")
              return ddl.rstrip() + "\n\n" + prov_sql.strip() + "\n"

          def normalize(v):
              if isinstance(v, UUID):
                  return str(v)
              if isinstance(v, datetime):
                  return utc_microseconds(v)
              if isinstance(v, dict):
                  return {str(k): normalize(val) for k, val in sorted(v.items(), key=lambda x: str(x[0]))}
              if isinstance(v, (list, tuple)):
                  return [normalize(x) for x in v]
              return v

          result = {
              "schema_version": 1,
              "kind": "attack_event_23city_rollback_persistence_proof_resume2",
              "proof_branch": os.environ.get("GITHUB_REF_NAME"),
              "workflow_commit": os.environ.get("GITHUB_SHA"),
              "actions_run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "snapshot": {"commit": SNAPSHOT["commit"], "path": SNAPSHOT["path"], "sha256": SNAPSHOT["sha256"]},
              "binding_map": {"commit": BINDING["commit"], "path": BINDING["path"], "sha256": BINDING["sha256"]},
              "contract_sha_status": {
                  "step1": "NOT_RUN",
                  "classification_identity_v2": "NOT_RUN",
                  "provenance_cardinality": "NOT_RUN",
                  "human_review_state": "NOT_RUN",
              },
              "snapshot_sha_status": "NOT_RUN",
              "binding_map_sha_status": "NOT_RUN",
              "db_preflight_ran": False,
              "outer_rollback_executed": False,
              "committed_db_mutations": 0,
              "production_mutation": "NO",
              "credentials_exposed": False,
              "remaining_representability_gaps": [],
          }

          phase = "OFFLINE_PREFLIGHT"
          write_conn = None
          baseline_ingestion_runs = None
          protected_parent_baseline_sha = None
          db_url = os.environ.get("PHASE1_PROD_SHADOW_DATABASE_URL", "")
          branch_id = os.environ.get("PHASE1_PROD_SHADOW_BRANCH_ID", "")
          snapshot = binding = step1 = v2 = provenance = human = None
          class_rows = event_rows = source_rows = None
          outer_txn_opened = False

          def rollback_outer():
              global write_conn, outer_txn_opened
              if write_conn is not None and outer_txn_opened:
                  try:
                      write_conn.rollback()
                      result["outer_rollback_executed"] = True
                  finally:
                      outer_txn_opened = False

          def protected_parent_rows(conn, bound_uids):
              found = {}
              with conn.cursor() as cur:
                  chunk = 4000
                  for i in range(0, len(bound_uids), chunk):
                      ids = bound_uids[i:i+chunk]
                      cur.execute(
                          "SELECT episode_uid::text, city_key::text, alert_type::text, episode_state::text, "
                          "canonicalization_version::text, start_at, end_at "
                          "FROM public.alert_episodes WHERE episode_uid::text = ANY(%s)",
                          (ids,),
                      )
                      for uid, city, alert_type, state, canon, start_at, end_at in cur.fetchall():
                          found[str(uid)] = [
                              str(uid), str(city), str(alert_type), str(state), str(canon),
                              utc_microseconds(start_at), utc_microseconds(end_at),
                          ]
              return found

          def post_rollback_safety():
              if not db_url:
                  return
              conn = psycopg.connect(db_url, autocommit=True, connect_timeout=20, options="-c default_transaction_read_only=on")
              try:
                  with conn.cursor() as cur:
                      cur.execute("BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY")
                      cur.execute("SET LOCAL default_transaction_read_only = on")
                      cur.execute(
                          "SELECT table_name FROM information_schema.tables "
                          "WHERE table_schema='public' AND table_name IN "
                          "('attack_event_classifications','attack_events','attack_event_sources') ORDER BY table_name"
                      )
                      tables = [r[0] for r in cur.fetchall()]
                      result["attack_event_tables_after_rollback"] = len(tables)
                      result["committed_attack_event_rows"] = 0 if not tables else None
                      cur.execute("SELECT count(*) FROM public.ingestion_runs")
                      after_runs = int(cur.fetchone()[0])
                      if baseline_ingestion_runs is not None:
                          result["ingestion_runs_delta"] = after_runs - baseline_ingestion_runs
                      if binding is not None and snapshot is not None:
                          records = binding["records"]
                          bound_uids = sorted(str(r["alert_episode_uid"]) for r in records if r["binding_state"] == "BOUND")
                          now_rows = protected_parent_rows(conn, bound_uids)
                          raw = canonical_json_bytes([now_rows[k] for k in sorted(now_rows)])
                          result["protected_parent_state_after_rollback_sha256"] = hashlib.sha256(raw).hexdigest()
                          if protected_parent_baseline_sha is not None:
                              result["protected_alert_episodes_unchanged"] = (
                                  result["protected_parent_state_after_rollback_sha256"] == protected_parent_baseline_sha
                              )
                      cur.execute("ROLLBACK")
              finally:
                  conn.close()

          try:
              snapshot_path, snapshot_blob, snapshot_sha = materialize(SNAPSHOT, "SNAPSHOT")
              binding_path, binding_blob, binding_sha = materialize(BINDING, "BINDING_MAP")
              step1, step1_blob, step1_sha = load_json(STEP1, "STEP1_CONTRACT")
              v2, v2_blob, v2_sha = load_json(V2, "V2_ADDENDUM")
              provenance, provenance_blob, provenance_sha = load_json(PROVENANCE, "PROVENANCE_ADDENDUM")
              human, human_blob, human_sha = load_json(HUMAN, "HUMAN_REVIEW_ADDENDUM")
              result["snapshot_sha_status"] = "PASS"
              result["binding_map_sha_status"] = "PASS"
              result["contract_sha_status"] = {
                  "step1": "PASS" if step1_sha == STEP1["sha256"] else "FAIL",
                  "classification_identity_v2": "PASS" if v2_sha == V2["sha256"] else "FAIL",
                  "provenance_cardinality": "PASS" if provenance_sha == PROVENANCE["sha256"] else "FAIL",
                  "human_review_state": "PASS" if human_sha == HUMAN["sha256"] else "FAIL",
              }
              if any(v != "PASS" for v in result["contract_sha_status"].values()):
                  fail("FROZEN_CONTRACT_SHA_MISMATCH", phase=phase)
              if step1.get("verdict") != "ATTACK-EVENT NEON PERSISTENCE CONTRACT FROZEN":
                  fail("STEP1_PERSISTENCE_CONTRACT_NOT_FROZEN", phase=phase)
              if v2.get("verdict") != "ATTACK-EVENT CLASSIFICATION IDENTITY AVAILABILITY CONTRACT FROZEN":
                  fail("CLASSIFICATION_IDENTITY_V2_ADDENDUM_NOT_FROZEN", phase=phase)
              if provenance.get("verdict") != "ATTACK-EVENT PROVENANCE CARDINALITY SCHEMA ADDENDUM FROZEN":
                  fail("PROVENANCE_CARDINALITY_ADDENDUM_NOT_FROZEN", phase=phase)
              if human.get("verdict") != "ATTACK-EVENT HUMAN REVIEW STATE DERIVATION ADDENDUM FROZEN":
                  fail("HUMAN_REVIEW_STATE_ADDENDUM_NOT_FROZEN", phase=phase)

              effective_ddl = build_effective_ddl(step1, v2, provenance, human)
              result["effective_candidate_ddl_sha256"] = hashlib.sha256(effective_ddl.encode("utf-8")).hexdigest()

              snapshot = json.loads(snapshot_path.read_bytes())
              binding = json.loads(binding_path.read_bytes())
              cls = snapshot.get("classifications")
              events = snapshot.get("attack_events")
              links = snapshot.get("source_links")
              records = binding.get("records")
              if not all(isinstance(x, list) for x in (cls, events, links, records)):
                  fail("FROZEN_INPUT_SCHEMA_MISMATCH", phase=phase)
              if (len(cls), len(events), len(links), len(records)) != (26405, 1080, 3769, 26405):
                  fail("FROZEN_INPUT_COUNT_MISMATCH", phase=phase)
              if Counter(str(r.get("verdict")) for r in cls) != Counter(EXPECTED_DIST):
                  fail("SNAPSHOT_DISTRIBUTION_MISMATCH", phase=phase)
              if snapshot.get("classification_key_version") != "attack-event-classification-key-v2":
                  fail("SNAPSHOT_CLASSIFICATION_KEY_VERSION_MISMATCH", phase=phase)
              if snapshot.get("attack_event_key_version") != "attack-event-key-v1":
                  fail("SNAPSHOT_EVENT_KEY_VERSION_MISMATCH", phase=phase)
              if snapshot.get("source_link_key_version") != "attack-event-source-link-key-v1":
                  fail("SNAPSHOT_SOURCE_LINK_KEY_VERSION_MISMATCH", phase=phase)

              ckeys = [str(r.get("classification_key") or "") for r in cls]
              ekeys = [str(r.get("attack_event_key") or "") for r in events]
              skeys = [str(r.get("source_link_key") or "") for r in links]
              bkeys = [str(r.get("classification_key") or "") for r in records]
              if "" in ckeys or len(set(ckeys)) != 26405:
                  fail("SNAPSHOT_CLASSIFICATION_KEY_UNIQUENESS_MISMATCH", phase=phase)
              if "" in ekeys or len(set(ekeys)) != 1080:
                  fail("SNAPSHOT_EVENT_KEY_UNIQUENESS_MISMATCH", phase=phase)
              if "" in skeys or len(set(skeys)) != 3769:
                  fail("SNAPSHOT_SOURCE_LINK_KEY_UNIQUENESS_MISMATCH", phase=phase)
              if set(ckeys) != set(bkeys):
                  fail("SNAPSHOT_BINDING_KEYSET_MISMATCH", phase=phase)
              bc = Counter(str(r.get("binding_state")) for r in records)
              if bc != Counter({"BOUND": 26380, "UNBOUND": 25}):
                  fail("BINDING_MAP_STATE_COUNT_MISMATCH", phase=phase)
              if any(r.get("alert_episode_uid") is not None for r in records if r.get("binding_state") == "UNBOUND"):
                  fail("BINDING_MAP_UNBOUND_PARENT_NOT_NULL", phase=phase)

              human_counts = Counter()
              human_conflicts = 0
              for row in cls:
                  try:
                      state = derive_human_state(row)
                      human_counts[state] += 1
                  except Exception:
                      human_conflicts += 1
              if human_conflicts:
                  fail("HUMAN_REVIEW_STATE_DERIVATION_CONFLICT", phase=phase, table="public.attack_event_classifications", field="human_review_state", count=human_conflicts)
