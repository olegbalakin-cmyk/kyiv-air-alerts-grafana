name: CASUALTY actual generator to incomplete display (offline)
on:
  push:
    branches: [research-casualty-generator-display-2026-11-12]
    paths: [".github/workflows/research-casualty-generator-display.yml", "research/casualty_generator_display_2026_11_12/**"]
permissions:
  contents: read
  actions: read
jobs:
  generator-to-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6a0100b0937218c62c5c079fd46e80e5071783cb
          path: _worka
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          path: _matrix
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43053796144
          name: casualty-three-new-original-publisher-excerpts-one-shot
          path: /tmp/casualty-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43261676781
          name: casualty-zap11-approved-http-43261676781-1
          path: /tmp/casualty-receipts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Check pinned snapshots and software safety invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _worka rev-parse HEAD)" = 6a0100b0937218c62c5c079fd46e80e5071783cb
          test "$(git -C _wip rev-parse HEAD)" = 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          test "$(git -C _site rev-parse HEAD)" = d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          test "$(git -C _matrix rev-parse HEAD)" = 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          echo "84ffea1315d41b8ec67b55a07273d6bbd7d6e8e14191801402168f7fddf4e5df  /tmp/casualty-original/evidence.json" | sha256sum -c -
          echo "4c21321b8a75d57f60efc97f581e89604eaa03289bb64bfba26e491ac83a203b  /tmp/casualty-receipts/capture_receipts.json" | sha256sum -c -
          python -m unittest discover -s _worka/research/casualty_e2e_shadow_2026_11_12 -p test_pipeline.py -v
      - name: Actual source-backed Work A generator to qualified dashboard
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --queue _wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json
            --evidence /tmp/casualty-original/evidence.json
            --receipts /tmp/casualty-receipts/capture_receipts.json
            --matrix _matrix/research/casualty_zaporizhzhia_additional_events_2026_11_12/verification_matrix.json
            --revisions _site/kyiv-air-alerts-grafana/data/casualties/revisions.csv
            --baseline _worka/research/casualty_automated_review_2026_11_10/baseline_coverage.json
            --city-manifest _site/kyiv-air-alerts-grafana/data/casualties/cities/zaporizhzhia/manifest.json
            --city-csv _site/kyiv-air-alerts-grafana/data/casualties/cities/zaporizhzhia/zaporizhzhia_air_attack_deaths_monthly.csv
            --generator _site/kyiv-air-alerts-grafana/scripts/update_casualties.py
            --dashboard _site/kyiv-air-alerts-grafana/data/dashboard_data.json
          )
          mkdir -p /tmp/casualty-first
          python _worka/research/casualty_e2e_shadow_2026_11_12/pipeline.py "${common[@]}" --output /tmp/casualty-first | tee /tmp/casualty-generator.txt
          python research/casualty_generator_display_2026_11_12/bridge.py \
            --dashboard _site/kyiv-air-alerts-grafana/data/dashboard_data.json \
            --generator-probe /tmp/casualty-first/generator_probe.json \
            --proposals /tmp/casualty-first/proposals.json \
            --decision research/casualty_generator_display_2026_11_12/coverage_decision.json \
            --generator _site/kyiv-air-alerts-grafana/scripts/update_casualties.py \
            --revisions _site/kyiv-air-alerts-grafana/data/casualties/revisions.csv \
            --output /tmp/casualty-qualified.json --proof /tmp/casualty-bridge-proof.json | tee /tmp/casualty-bridge.txt
          python research/casualty_generator_display_2026_11_12/test_bridge.py \
            /tmp/casualty-qualified.json /tmp/casualty-bridge-proof.json /tmp/casualty-first/generator_probe.json
      - name: Install browser dependencies (localhost only, no source HTTP)
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1 chart.js@4.4.7
          npx playwright install --with-deps chromium
      - name: Build real-generator preview and clean rollback
        run: |
          python research/casualty_generator_display_2026_11_12/prepare_local_preview.py \
            --site-root _site/kyiv-air-alerts-grafana \
            --chart-js node_modules/chart.js/dist/chart.umd.js \
            --shadow-dashboard /tmp/casualty-qualified.json \
            --preview /tmp/casualty-generator-preview \
            --rollback /tmp/casualty-clean-rollback
      - name: Chromium checks for real output and exports
        env:
          PREVIEW_DIR: /tmp/casualty-generator-preview
          ROLLBACK_DIR: /tmp/casualty-clean-rollback
          PROOF_DIR: /tmp/casualty-browser-proof
        run: |
          node research/casualty_generator_display_2026_11_12/browser_qa.js | tee /tmp/casualty-browser-checks.txt
          grep -q 'BROWSER_CHECKS_FAIL=0' /tmp/casualty-browser-checks.txt
      - name: Verify untouched source and record hashes
        run: |
          test -z "$(git -C _site status --porcelain)"
          sha256sum /tmp/casualty-qualified.json /tmp/casualty-bridge-proof.json | tee /tmp/casualty-output-shas.txt
      - name: Upload real generator browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-generator-to-display-proof
          path: |
            /tmp/casualty-first/generator_probe.json
            /tmp/casualty-first/proposals.json
            /tmp/casualty-generator.txt
            /tmp/casualty-bridge.txt
            /tmp/casualty-qualified.json
            /tmp/casualty-bridge-proof.json
            /tmp/casualty-browser-checks.txt
            /tmp/casualty-browser-proof/**
            /tmp/casualty-output-shas.txt
          if-no-files-found: warn
          retention-days: 14
