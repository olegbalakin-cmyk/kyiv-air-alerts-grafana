name: Lviv canonical boundary repair proof

on:
  push:
    branches:
      - lviv-canonical-boundary-repair-proof-2026-10-01
    paths:
      - ".github/workflows/lviv-canonical-boundary-repair-proof.yml"
      - "kyiv-air-alerts-grafana/scripts/lviv_canonical_boundary_repair.py"
      - "kyiv-air-alerts-grafana/tests/test_lviv_canonical_boundary_repair.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    env:
      CHILD_BRANCH_ID: br-icy-forest-b5mfyezq
      CHILD_DB_HOST: ep-shy-truth-b5ngaye8-pooler.c-7.us-east-2.aws.neon.tech

    steps:
      - name: Check out isolated repair proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install PostgreSQL proof dependencies
        run: pip install -r requirements-db-phase1.txt

      - name: Derive disposable child URL without printing credentials
        env:
          BASE_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          base = os.environ["BASE_DATABASE_URL"]
          child_host = os.environ["CHILD_DB_HOST"]
          parts = urlsplit(base)
          if not parts.username:
              raise SystemExit("database secret has no username")
          userinfo = parts.username
          if parts.password is not None:
              userinfo += ":" + parts.password
          port = f":{parts.port}" if parts.port else ""
          child = urlunsplit(
              (parts.scheme, f"{userinfo}@{child_host}{port}", parts.path, parts.query, parts.fragment)
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("DATABASE_URL=" + child + "\n")
          print("Disposable child URL derived; credentials not printed.")
          PY

      - name: Run focused and existing Phase-1 persistence tests
        run: |
          python -m unittest \
            tests/test_db_phase1_core.py \
            tests/test_db_phase1_lviv.py \
            tests/test_db_phase1_persistence.py \
            tests/test_lviv_canonical_boundary_repair.py -v

      - name: Exact retry in process one
        shell: bash
        run: |
          out="$(python scripts/lviv_canonical_boundary_repair.py)"
          printf '%s\n' "$out"
          python - "$out" <<'PY'
          import json, sys
          obj = json.loads(sys.argv[1])
          assert obj["status"] == "already_repaired", obj
          assert obj["writes"] == 0, obj
          PY

      - name: Fresh-process exact retry
        shell: bash
        run: |
          out="$(python scripts/lviv_canonical_boundary_repair.py)"
          printf '%s\n' "$out"
          python - "$out" <<'PY'
          import json, sys
          obj = json.loads(sys.argv[1])
          assert obj["status"] == "already_repaired", obj
          assert obj["writes"] == 0, obj
          PY

      - name: Validate post-repair DB invariants
        run: |
          python - <<'PY'
          import json, os
          import psycopg

          targets = {
              "575f370c-6e99-4623-8219-f8fbdfd6c978": ("2026-09-12 22:00:05.398348+00", "2026-09-12 22:14:27+00", "7dd411c2a2587efc740a1a66"),
              "c90e7b05-1982-461f-945f-53d8130c627b": ("2026-09-13 02:32:14+00", "2026-09-13 06:11:11.976953+00", "c2cd9a96768756d84c250735"),
              "451c8a2c-248a-41e5-b49e-31af3f44631f": ("2026-09-15 16:44:13+00", "2026-09-15 17:09:02+00", "94ce779cf047984e881bfdd5"),
          }
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT
                      (SELECT count(*) FROM ingestion_runs),
                      (SELECT count(*) FROM alert_episodes),
                      (SELECT count(*) FROM alert_episode_sources),
                      (SELECT count(*) FROM ingestion_checkpoints),
                      (SELECT max(checkpoint_seq) FROM ingestion_checkpoints),
                      (SELECT count(*) FROM alert_state_snapshots),
                      (SELECT count(*) FROM alert_threat_observations),
                      (SELECT count(*) FROM alert_episodes WHERE city_key='lviv'),
                      (SELECT md5(coalesce(string_agg(to_jsonb(t)::text,E'\\n' ORDER BY to_jsonb(t)::text),'')) FROM alert_episodes t
                         WHERE episode_uid NOT IN ('575f370c-6e99-4623-8219-f8fbdfd6c978','c90e7b05-1982-461f-945f-53d8130c627b','451c8a2c-248a-41e5-b49e-31af3f44631f')),
                      (SELECT md5(coalesce(string_agg(to_jsonb(t)::text,E'\\n' ORDER BY to_jsonb(t)::text),'')) FROM ingestion_checkpoints t),
                      (SELECT md5(coalesce(string_agg(to_jsonb(t)::text,E'\\n' ORDER BY to_jsonb(t)::text),'')) FROM alert_state_snapshots t),
                      (SELECT md5(coalesce(string_agg(to_jsonb(t)::text,E'\\n' ORDER BY to_jsonb(t)::text),'')) FROM alert_threat_observations t)
                  """)
                  row = cur.fetchone()
                  assert row == (
                      2, 126, 143, 1, 1, 13, 14, 126,
                      "304ef1d8e5b62f8eebf27f4285b52669",
                      "2a982250b3dc8e3b11e96dc859e83acb",
                      "f1b361222d3b9428bd74519f873a9ce3",
                      "7ca8f9930c8b645c733b35797aad96f6",
                  ), row

                  cur.execute("""
                    SELECT episode_uid::text, start_at::text, end_at::text, legacy_episode_id
                    FROM alert_episodes
                    WHERE episode_uid IN (
                      '575f370c-6e99-4623-8219-f8fbdfd6c978',
                      'c90e7b05-1982-461f-945f-53d8130c627b',
                      '451c8a2c-248a-41e5-b49e-31af3f44631f'
                    )
                  """)
                  got = {uid: (start, end, legacy) for uid, start, end, legacy in cur.fetchall()}
                  assert got == targets, got

                  cur.execute("""
                    SELECT count(*)
                    FROM alert_episode_sources s
                    JOIN alert_episodes e USING (episode_uid)
                    WHERE s.episode_uid IN (
                      '575f370c-6e99-4623-8219-f8fbdfd6c978',
                      'c90e7b05-1982-461f-945f-53d8130c627b',
                      '451c8a2c-248a-41e5-b49e-31af3f44631f'
                    )
                      AND s.binding_state='bound'
                      AND s.canonicalization_role='canonical_input'
                      AND (
                        s.source_start_at < e.start_at
                        OR s.source_end_at > e.end_at
                        OR (s.contributes_start_boundary AND s.source_start_at <> e.start_at)
                        OR (s.contributes_end_boundary AND s.source_end_at <> e.end_at)
                      )
                  """)
                  assert cur.fetchone()[0] == 0

                  cur.execute("""
                    SELECT count(*)
                    FROM ingestion_runs
                    WHERE parameters->>'repair'='lviv-production-boundary-reconciliation-2026-10-01'
                  """)
                  assert cur.fetchone()[0] == 1

          print(json.dumps({"post_repair_invariants":"PASS","credentials_exposed":False}, sort_keys=True))
          PY
