name: C2 fail-closed canonical persistence (offline PostgreSQL)

on:
  push:
    branches:
      - research-c2-fail-closed-persistence-2026-10-27-gpt6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c2-disposable-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: c2_test
          POSTGRES_PASSWORD: c2_test
          POSTGRES_DB: c2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c2_test -d c2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline test requirements
        run: python -m pip install "psycopg[binary]>=3,<4" "PyYAML>=6,<7"
      - name: Run isolated C2 PostgreSQL/rollback/retry/workflow tests
        env:
          C2_TEST_DATABASE_URL: postgresql://c2_test:c2_test@127.0.0.1:5432/c2_test
        run: python -m unittest discover -s tests -p "test_multicity_c2_fail_closed.py" -v
