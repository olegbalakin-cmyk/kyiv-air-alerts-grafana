name: Kyiv historical source-set revision pilot

on:
  push:
    branches: [kyiv-historical-source-set-revision-pilot-2026-10-09]
    paths:
      - ".github/proof/kyiv_historical_source_set_revision_pilot.py"
      - ".github/workflows/kyiv-historical-source-set-revision-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyiv-historical-source-set-revision-pilot-2026-10-09
  cancel-in-progress: false

jobs:
  shadow-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kyiv-historical-source-set-revision-pilot-2026-10-09
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof-only dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Require no database configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected database config: $key"; exit 1; }
          done

      - name: Execute frozen native URL development-only pilot
        run: python .github/proof/kyiv_historical_source_set_revision_pilot.py

      - name: Upload exact proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-historical-source-set-revision-pilot-${{ github.run_id }}
          path: |
            research/kyiv_historical_source_set_revision_candidates_2026-10-09.json
            research/kyiv_historical_source_set_revision_pilot_2026-10-09.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit only requested proof artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/kyiv_historical_source_set_revision_candidates_2026-10-09.json
          git add research/kyiv_historical_source_set_revision_pilot_2026-10-09.json
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          while IFS= read -r file; do
            case "$file" in
              research/kyiv_historical_source_set_revision_candidates_2026-10-09.json|research/kyiv_historical_source_set_revision_pilot_2026-10-09.json) ;;
              *) echo "Unexpected path: $file"; exit 1 ;;
            esac
          done <<< "$changed"
          git commit -m "Record development-only Kyiv source set revision proof"
          git push origin HEAD:kyiv-historical-source-set-revision-pilot-2026-10-09
