name: H2 008 freeze exact original PG18 A B ZIP
on:
  push:
    branches: [research-h2-008-late-acl-rollback-2026-10-21-gpt6]
    paths:
      - '.github/workflows/h2-008-original-freeze-2026-10-21.yml'
      - 'research/h2_008_late_acl_2026_10_21/freeze_original_ab.py'
permissions:
  contents: write
  actions: read
jobs:
  original-zip-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original run A/B provenance and archive exact ZIP bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 research/h2_008_late_acl_2026_10_21/freeze_original_ab.py
      - name: Freeze original ZIP and manifest on isolated research branch only
        run: |
          set -eu
          test "$(git branch --show-current)" = "research-h2-008-late-acl-rollback-2026-10-21-gpt6"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/h2_008_late_acl_2026_10_21/original_ab/A.zip research/h2_008_late_acl_2026_10_21/original_ab/B.zip research/h2_008_late_acl_2026_10_21/original_ab/manifest.json
          git diff --cached --quiet && { echo "ALREADY_FROZEN"; exit 0; }
          git commit -m "research(H2): freeze byte-original actual 008 A/B Actions ZIPs"
          git push origin HEAD:refs/heads/research-h2-008-late-acl-rollback-2026-10-21-gpt6
