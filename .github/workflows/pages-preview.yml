name: Deploy multicity preview to GitHub Pages

on:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "kyiv-air-alerts-grafana/data/dashboard_data.json"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch Kyiv Digital differentiated history
        run: |
          curl -fsS \
            -H 'Accept: application/json' \
            'https://kyiv.digital/open-api/air-alert/history' \
            -o /tmp/kyiv-air-alert-history.json
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/kyiv-air-alert-history.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("kyiv_history_bytes=", p.stat().st_size)
          print("kyiv_history_root_type=", type(data).__name__)
          if isinstance(data, dict):
              print("kyiv_history_root_keys=", sorted(data.keys()))
              for key, value in data.items():
                  if isinstance(value, list):
                      print("kyiv_history_list_key=", key, "count=", len(value))
                      if value:
                          print("kyiv_history_first_item=", json.dumps(value[0], ensure_ascii=False)[:3000])
                      break
          elif isinstance(data, list):
              print("kyiv_history_count=", len(data))
              if data:
                  print("kyiv_history_first_item=", json.dumps(data[0], ensure_ascii=False)[:3000])
          PY

      - name: Assemble preview site
        run: |
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/pages-preview/threat-mix-test.html _site/threat-mix-test.html
          cp /tmp/kyiv-air-alert-history.json _site/kyiv-air-alert-history.json
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
