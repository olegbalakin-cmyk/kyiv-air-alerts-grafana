name: Deploy multicity preview to GitHub Pages

on:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "kyiv-air-alerts-grafana/data/dashboard_data.json"
      - "kyiv-air-alerts-grafana/scripts/build_time_of_day_heatmap.py"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16

      - name: Test cumulative-hours comparison (preview only)
        run: |
          node kyiv-air-alerts-grafana/tests/test_cumulative_comparison.js
          node kyiv-air-alerts-grafana/tests/test_daynight_burden_preview.js
          node --check kyiv-air-alerts-grafana/pages-preview/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Use current production-parity alert data
        run: |
          cp kyiv-air-alerts-grafana/data/dashboard_data.json /tmp/wip-dashboard-data.json
          git fetch origin site-prod
          git show origin/site-prod:kyiv-air-alerts-grafana/data/dashboard_data.json > kyiv-air-alerts-grafana/data/dashboard_data.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/alerts_combined.json > /tmp/site-prod-alerts-combined.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json > /tmp/site-prod-ukrainealarm-bridge.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/sevastopol_events.json > /tmp/site-prod-sevastopol-events.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("kyiv-air-alerts-grafana/data/dashboard_data.json")
          prod = json.loads(path.read_text(encoding="utf-8"))
          wip = json.loads(Path("/tmp/wip-dashboard-data.json").read_text(encoding="utf-8"))
          features = json.loads(Path("kyiv-air-alerts-grafana/pages-preview/features.json").read_text(encoding="utf-8"))
          attack_events_enabled = features.get("attack_events") is True

          keys = prod.get("multicity_meta", {}).get("production_city_keys", [])
          assert len(keys) == 23, len(keys)
          assert prod.get("multicity_meta", {}).get("weekly_mode") == "rolling_7d"
          assert prod.get("multicity_meta", {}).get("rolling_window_periods") == ["weekly", "rolling30", "rolling90"]

          for key in keys:
              city = prod.get("cities", {}).get(key, {})
              assert city.get("rolling30"), key
              assert city.get("rolling90"), key
              assert city.get("daily28"), key

          if "casualties_by_city" in wip:
              prod["casualties_by_city"] = wip["casualties_by_city"]

          if attack_events_enabled and "explosion_metric_test" in wip:
              prod["explosion_metric_test"] = wip["explosion_metric_test"]
          else:
              prod.pop("explosion_metric_test", None)

          if prod.get("casualties") and prod.get("casualties_by_city"):
              prod["casualties_by_city"]["kyiv"] = prod["casualties"]

          path.write_text(json.dumps(prod, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "analysis_end": prod.get("meta", {}).get("analysis_end"),
              "cities": len(keys),
              "rolling30_nonempty": sum(bool(prod["cities"][k].get("rolling30")) for k in keys),
              "rolling90_nonempty": sum(bool(prod["cities"][k].get("rolling90")) for k in keys),
              "attack_events_enabled": attack_events_enabled,
              "explosion_metric_embedded": "explosion_metric_test" in prod,
          }, ensure_ascii=False))
          PY

      - name: Rebuild current preview time-of-day profiles
        run: |
          python -m pip install -r kyiv-air-alerts-grafana/requirements.txt
          python kyiv-air-alerts-grafana/tests/test_daynight_burden_preview.py
          python kyiv-air-alerts-grafana/scripts/build_time_of_day_heatmap.py \
            --dashboard kyiv-air-alerts-grafana/data/dashboard_data.json \
            --kyiv-alerts /tmp/site-prod-alerts-combined.json \
            --bridge-store /tmp/site-prod-ukrainealarm-bridge.json \
            --sevastopol-events /tmp/site-prod-sevastopol-events.json \
            --explorations-output /tmp/explorations-test-data.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("kyiv-air-alerts-grafana/data/dashboard_data.json").read_text(encoding="utf-8"))
          profile = data["time_of_day_heatmap_test"]
          assert profile["meta"]["test_only"] is True
          assert profile["meta"]["city_count"] == 23
          assert set(profile["meta"]["periods"]) == {"7d", "30d", "90d", "180d", "year", "all"}
          assert set(profile["cities"]) == set(data["multicity_meta"]["production_city_keys"])
          for key, city in profile["cities"].items():
              for period in ("7d", "30d", "90d", "180d", "year", "all"):
                  row = city["periods"][period]
                  assert len(row["slots"]) == 96, (key, period)
          print("Preview time-of-day profiles verified for 23 cities, including 180d")

          explorations = json.loads(Path("/tmp/explorations-test-data.json").read_text(encoding="utf-8"))
          assert explorations["meta"]["test_only"] is True
          assert explorations["meta"]["city_count"] == 23
          assert len(explorations["meta"]["views"]) == 6
          assert set(explorations["cities"]) == set(data["multicity_meta"]["production_city_keys"])
          for key, city in explorations["cities"].items():
              assert city["daily"], key
              assert city["monthly"], key
              assert city["years"], key
              for row in city["monthly"]:
                  shares = row.get("time_day_night_shares") or {}
                  minutes = row.get("time_day_night_minutes") or {}
                  assert set(shares) == {"day", "evening_night"}, (key, row.get("month"))
                  assert set(minutes) == set(shares), (key, row.get("month"))
                  assert abs(sum(minutes.values()) - float(row["alert_hours"])*60) < 0.07
                  if row["alert_hours"] > 0.001:
                      assert abs(sum(shares.values()) - 100) < 0.005
                  else:
                      assert sum(shares.values()) == 0
          print("Exploration lab data verified for 23 cities and 6 views")
          PY

      - name: Read published Kyiv Digital alert-cause export for preview
        run: |
          # The live upstream can return invalid JSON; reuse the already
          # source-derived and validated production Git artifact, read-only.
          git show origin/site-prod:kyiv-air-alerts-grafana/data/kyiv_threat_mix.json > /tmp/kyiv-threat-mix-data.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          obj = json.loads(Path("/tmp/kyiv-threat-mix-data.json").read_text(encoding="utf-8"))
          meta, rows = obj["meta"], obj["rows"]
          assert meta["source"] == "https://kyiv.digital/open-api/air-alert/history"
          assert meta["timezone"] == "Europe/Kyiv"
          assert meta["semantics"] == "episode_level_cause_assignment"
          assert 1 <= len(rows) <= 28
          dates = [row["date"] for row in rows]
          assert dates == sorted(set(dates))
          assert dates[-1] < datetime.now(ZoneInfo("Europe/Kyiv")).date().isoformat()
          assert meta["visible_end"] == dates[-1]
          for row in rows:
              assert row["total_minutes"] >= 0
              if row["total_minutes"]:
                  assert abs(sum(row["shares"].values()) - 100) < 0.01
              else:
                  assert sum(row["shares"].values()) == 0
          print(f"PASS: source-derived site-prod Kyiv cause rows {dates[0]}..{dates[-1]}")
          PY

      - name: Assemble preview site
        run: |
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/pages-preview/features.json _site/features.json
          cp kyiv-air-alerts-grafana/pages-preview/explorations-test.html _site/explorations-test.html
          cp /tmp/explorations-test-data.json _site/explorations-test-data.json
          python - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          width, height = 1200, 630
          bg = (11, 15, 20)
          blue = (72, 145, 220)
          green = (143, 240, 164)
          grid = (31, 43, 53)
          buf = bytearray(width * height * 3)

          def pixel(x, y, color):
              if 0 <= x < width and 0 <= y < height:
                  i = (y * width + x) * 3
                  buf[i:i+3] = bytes(color)

          def rect(x0, y0, x1, y1, color):
              x0, y0 = max(0, x0), max(0, y0)
              x1, y1 = min(width, x1), min(height, y1)
              row = bytes(color) * max(0, x1 - x0)
              for y in range(y0, y1):
                  i = (y * width + x0) * 3
                  buf[i:i+len(row)] = row

          def line(x0, y0, x1, y1, color, thickness=7):
              dx = abs(x1 - x0)
              dy = -abs(y1 - y0)
              sx = 1 if x0 < x1 else -1
              sy = 1 if y0 < y1 else -1
              err = dx + dy
              while True:
                  rect(x0-thickness//2, y0-thickness//2, x0+thickness//2+1, y0+thickness//2+1, color)
                  if x0 == x1 and y0 == y1:
                      break
                  e2 = 2 * err
                  if e2 >= dy:
                      err += dy
                      x0 += sx
                  if e2 <= dx:
                      err += dx
                      y0 += sy

          rect(0, 0, width, height, bg)
          for y in range(105, 560, 75):
              rect(70, y, 1130, y + 1, grid)

          heights = [120, 180, 135, 250, 320, 270, 365, 420, 385, 470]
          points = []
          for i, bar_h in enumerate(heights):
              x = 120 + i * 92
              rect(x, 535 - bar_h, x + 48, 535, blue)
              points.append((x + 24, 470 - int(bar_h * 0.62)))

          for (x0, y0), (x1, y1) in zip(points, points[1:]):
              line(x0, y0, x1, y1, green)

          raw = bytearray()
          stride = width * 3
          for y in range(height):
              raw.append(0)
              raw.extend(buf[y*stride:(y+1)*stride])

          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)

          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(bytes(raw), 9))
          png += chunk(b"IEND", b"")
          Path("_site/share-card.png").write_bytes(png)
          PY
          if python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("kyiv-air-alerts-grafana/pages-preview/features.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if cfg.get("attack_events") is True else 1)
          PY
          then
            cp kyiv-air-alerts-grafana/pages-preview/threat-mix-test.html _site/threat-mix-test.html
          else
            echo "Attack-event preview features disabled; standalone event pages are not published."
          fi
          # Kyiv Digital alert-cause data is a separate Kyiv-only dashboard feature,
          # not part of the hidden attack-event/explosion feature family.
          cp /tmp/kyiv-threat-mix-data.json _site/kyiv-threat-mix-data.json
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
