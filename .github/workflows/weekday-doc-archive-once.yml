name: One-shot coordination archive for accepted weekday release
on:
  push:
    branches: [docs/weekday-prod-checkpoint-20261119]
    paths:
      - ".github/workflows/weekday-doc-archive-once.yml"
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run exact lossless archival
        run: |
          python3 scripts/coordination_docs.py archive --dry-run --date 2026-11-19 --source-ref "$GITHUB_SHA"
      - name: Archive old roots, verify manifest, and commit to docs PR branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/docs/weekday-prod-checkpoint-20261119"
          python3 scripts/coordination_docs.py archive --date 2026-11-19 --source-ref "$GITHUB_SHA"
          python3 scripts/coordination_docs.py verify --base-ref origin/main
          python3 scripts/coordination_docs.py check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md CHANGELOG.md docs/coordination-archive
          test -n "$(git diff --cached --name-only)"
          git commit -m "Archive older coordination checkpoints without loss"
          git push origin HEAD:refs/heads/docs/weekday-prod-checkpoint-20261119
