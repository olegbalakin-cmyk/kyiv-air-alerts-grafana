name: RSS syntax coverage-gap complete alert-history revalidation

on:
  push:
    branches:
      - rss-syntax-coverage-gap-complete-alert-history-revalidation-2026-10-05
    paths:
      - ".github/proof/rss_syntax_coverage_gap_complete_alert_history_revalidation.py"
      - ".github/workflows/rss-syntax-coverage-gap-complete-alert-history-revalidation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FROZEN_ARTIFACT_ID: "11329769176"
      SYNTAX_PROOF_ARTIFACT_ID: "11356189561"
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert proof-only scope and no DB environment
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only bf2efe5015a81ebc12fdac615dbdb801e947b5dd...HEAD | sort
          unexpected="$(git diff --name-only bf2efe5015a81ebc12fdac615dbdb801e947b5dd...HEAD | grep -v -E '^\.github/(proof/rss_syntax_coverage_gap_complete_alert_history_revalidation\.py|workflows/rss-syntax-coverage-gap-complete-alert-history-revalidation\.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB env: $key"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install existing requirements
        run: python -m pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Download accepted frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coverage-gap/frozen /tmp/coverage-gap/syntax
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID/zip" > /tmp/coverage-gap/frozen.zip
          unzip -q /tmp/coverage-gap/frozen.zip -d /tmp/coverage-gap/frozen
          test -s /tmp/coverage-gap/frozen/rss_temporal_audit_context_retention.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SYNTAX_PROOF_ARTIFACT_ID/zip" > /tmp/coverage-gap/syntax.zip
          unzip -q /tmp/coverage-gap/syntax.zip -d /tmp/coverage-gap/syntax
          test -s /tmp/coverage-gap/syntax/rss_temporal_syntax_gap_repair_proof_2026-10-05.json

      - name: Read-only authoritative history revalidation
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/rss_syntax_coverage_gap_complete_alert_history_revalidation.py \
            /tmp/coverage-gap/frozen/rss_temporal_audit_context_retention.json \
            /tmp/coverage-gap/syntax/rss_temporal_syntax_gap_repair_proof_2026-10-05.json \
            /tmp/coverage-gap/rss_syntax_coverage_gap_complete_alert_history_revalidation_2026-10-05.json

      - name: Upload revalidation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-syntax-coverage-gap-complete-alert-history-revalidation-2026-10-05
          path: /tmp/coverage-gap/rss_syntax_coverage_gap_complete_alert_history_revalidation_2026-10-05.json
          if-no-files-found: error
          retention-days: 7
