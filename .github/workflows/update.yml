# Restored production baseline: Kyiv, Kharkiv, Zaporizhzhia. Multicity WIP is preserved on branch multicity-wip-2026-09-16.
name: Update Kyiv air-alert data

on:
  schedule:
    - cron: "15 4,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/**"
      - "kyiv-air-alerts-grafana/data/casualties/**"
      - "kyiv-air-alerts-grafana/grafana/dashboard.template.json"
      - "kyiv-air-alerts-grafana/requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: kyiv-air-alert-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data
        run: python scripts/update_data.py

      - name: Add weekly duration metrics
        run: python scripts/add_weekly_breakdown.py

      - name: Render Grafana dashboard for this repository
        run: python scripts/render_dashboard.py --repository "${GITHUB_REPOSITORY}" --branch "${GITHUB_REF_NAME}" --prefix "kyiv-air-alerts-grafana"

      - name: Add weekly Grafana panels
        run: python scripts/add_weekly_panels.py

      - name: Add multicity data and comparison panels
        run: python scripts/add_duration_unit_switch.py

      - name: Apply official UkraineAlarm API bridge
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        run: python scripts/apply_ukrainealarm_bridge.py

      - name: Update Kyiv casualty series and review queue
        run: python scripts/update_casualties.py

      - name: Finalize single admin/public dashboard
        run: python scripts/finalize_multicity_dashboard.py

      - name: Convert weekly series to rolling 7-day windows
        run: python scripts/apply_rolling_7d.py

      - name: Refresh rolling rows from official API bridge
        run: python scripts/refresh_rolling_from_bridge.py

      - name: Combine monthly alert count and duration panels
        run: python scripts/combine_monthly_alerts_duration.py

      - name: Add Kyiv casualty panel and disclaimer
        run: python scripts/add_casualty_panel.py

      - name: Commit changed data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data kyiv-air-alerts-grafana/grafana/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Kyiv air-alert and casualty data"

            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              echo "Push attempt ${attempt} failed; retrying..."
              sleep $((attempt * 2))
            done
          fi

      - name: Deploy dashboard to Grafana
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          GRAFANA_DASHBOARD_UID: ${{ secrets.GRAFANA_DASHBOARD_UID }}
          GRAFANA_DASHBOARD_TITLE: ${{ vars.GRAFANA_DASHBOARD_TITLE }}
          GRAFANA_INFINITY_NAME: ${{ vars.GRAFANA_INFINITY_NAME }}
        run: python scripts/deploy_grafana.py
