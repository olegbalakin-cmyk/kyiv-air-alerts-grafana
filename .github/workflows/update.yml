name: Update Ukraine city air-alert data

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/**"
      - "kyiv-air-alerts-grafana/data/casualties/**"
      - "kyiv-air-alerts-grafana/data/alerts_in_ua_bridge_*.csv.gz.b64"
      - "kyiv-air-alerts-grafana/data/alerts_in_ua_bridge_*.meta.json"
      - "kyiv-air-alerts-grafana/grafana/dashboard.template.json"
      - "kyiv-air-alerts-grafana/requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: ukraine-city-air-alert-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data
        run: python scripts/update_data.py

      - name: Add weekly duration metrics
        run: python scripts/add_weekly_breakdown.py

      - name: Render Grafana dashboard for this repository
        run: python scripts/render_dashboard.py --repository "${GITHUB_REPOSITORY}" --branch "${GITHUB_REF_NAME}" --prefix "kyiv-air-alerts-grafana"

      - name: Add weekly Grafana panels
        run: python scripts/add_weekly_panels.py

      - name: Add exact-city base rows and switches
        run: python scripts/add_duration_unit_switch.py

      - name: Add documented production proxy rows
        run: python scripts/expand_multicity_production.py

      - name: Add cross-source validated proxy rows
        run: python scripts/extend_remaining_proxies.py

      - name: Apply verified Alerts.in.ua and UkraineAlarm bridge
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        run: python scripts/apply_ukrainealarm_bridge.py

      - name: Add Sevastopol exact-city series
        run: python scripts/add_sevastopol_exact.py

      - name: Update Kyiv casualty series and review queue
        run: python scripts/update_casualties.py

      - name: Configure full city-selector dashboard
        run: python scripts/configure_full_city_dashboard.py

      - name: Add Kyiv casualty panel and disclaimer
        run: python scripts/add_casualty_panel.py

      - name: QA 23-city dashboard and source freshness
        run: python scripts/postprocess_compact_dashboard_qa.py

      - name: Reconcile freshness with official API bridge
        run: python scripts/reconcile_bridge_freshness.py

      - name: Commit changed data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data kyiv-air-alerts-grafana/grafana/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Ukraine city air-alert and casualty data"

            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              echo "Push attempt ${attempt} failed; retrying..."
              sleep $((attempt * 2))
            done
          fi

      - name: Deploy dashboard to Grafana
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          GRAFANA_DASHBOARD_UID: ${{ secrets.GRAFANA_DASHBOARD_UID }}
          GRAFANA_DASHBOARD_TITLE: ${{ vars.GRAFANA_DASHBOARD_TITLE }}
          GRAFANA_INFINITY_NAME: ${{ vars.GRAFANA_INFINITY_NAME }}
        run: python scripts/deploy_grafana.py
