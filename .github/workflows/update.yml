name: Update Kyiv air-alert data

on:
  schedule:
    - cron: "15 4,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/**"
      - "kyiv-air-alerts-grafana/grafana/dashboard.template.json"
      - "kyiv-air-alerts-grafana/requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: kyiv-air-alert-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data
        run: python scripts/update_data.py

      - name: Add weekly duration metrics
        run: python scripts/add_weekly_breakdown.py

      - name: Render Grafana dashboard for this repository
        run: python scripts/render_dashboard.py --repository "${GITHUB_REPOSITORY}" --branch "${GITHUB_REF_NAME}" --prefix "kyiv-air-alerts-grafana"

      - name: Add weekly Grafana panels
        run: python scripts/add_weekly_panels.py

      - name: Commit changed data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data kyiv-air-alerts-grafana/grafana/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Kyiv air-alert data"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo "Push failed after 3 attempts"
          exit 1
