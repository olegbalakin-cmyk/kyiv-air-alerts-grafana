name: Raion proxy grouping repair proof

on:
  push:
    branches:
      - attack-event-raion-proxy-grouping-repair-2026-10-08
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/live_parent_ordering.py"
      - "kyiv-air-alerts-grafana/scripts/prove_raion_proxy_grouping_repair.py"
      - ".github/workflows/raion-proxy-grouping-repair-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - run: pip install -r requirements.txt
      - name: Shared monitor self-test
        run: python scripts/monitor_explosion_candidates.py --self-test
      - name: Recent raion-proxy canonical parity
        run: python scripts/prove_raion_proxy_grouping_repair.py
