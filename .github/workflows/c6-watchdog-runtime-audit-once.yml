name: C6 watchdog runtime logs read-only audit
on:
  push:
    branches: [audit/c6-watchdog-netlify-runtime-20261122]
    paths:
      - .github/workflows/c6-watchdog-runtime-audit-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read ONLY independent Netlify function logs, no C6 dispatch
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "AUDIT_TOKEN_UNAVAILABLE"; exit 2; }
          npx --yes netlify-cli@latest link --id 4370af81-4ccf-485c-8e43-5a9184ee7565 --auth "$NETLIFY_AUTH_TOKEN" >/dev/null
          npx --yes netlify-cli@latest logs \
            --source functions \
            --function c6-backup \
            --url https://ukraine-air-alerts-c6-watchdog.netlify.app \
            --since 7h \
            --json \
            --auth "$NETLIFY_AUTH_TOKEN" \
            > "$RUNNER_TEMP/c6-watchdog-raw-logs.jsonl"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"c6-watchdog-raw-logs.jsonl"
          content=path.read_text(errors="replace")
          events=[]
          for line in content.splitlines():
              try:
                  row=json.loads(line)
              except (ValueError,TypeError):
                  continue
              message=row.get("message") if isinstance(row,dict) else ""
              if not isinstance(message,str): message=json.dumps(message,ensure_ascii=True)
              # Whitelist only known, finite status codes. Never print log bodies or secrets.
              found=re.search(r"C6_BACKUP_CHECK\s+([A-Z0-9_]+)\s+([A-Z0-9_]+)",message)
              failure="C6_BACKUP_FAIL_CLOSED" in message
              if found or failure:
                  iso=row.get("timestamp") or row.get("time") or ""
                  if not isinstance(iso,str) or not re.match(r"^20\d{2}-",iso): iso="time_unavailable"
                  events.append((iso,found.group(1) if found else "FAIL_CLOSED",found.group(2) if found else "NONE"))
          print("NETLIFY_C6_WATCHDOG_LOG_PROOF")
          print("log_lines",len(content.splitlines()))
          print("status_events",len(events))
          for event in events[:25]: print("watchdog_event",*event)
          if not events:
              print("NO_VISIBLE_WATCHDOG_STATUS_LOGS")
              shape=[]
              for raw in content.splitlines()[:15]:
                  try: obj=json.loads(raw)
                  except ValueError: shape.append("not_json"); continue
                  if isinstance(obj,dict):
                      shape.append(",".join(sorted(obj.keys())[:12]))
                  elif isinstance(obj,list): shape.append("list")
                  else: shape.append(type(obj).__name__)
              print("JSON_LINE_KEY_SHAPES", "|".join(shape))
              print("ANY_WATCHDOG_MARKER", "C6_BACKUP_" in content)
              print("ANY_FUNCTION_NAME", "c6-backup" in content)
              print("CONTAINS_NO_LOGS_HINT", "no logs" in content.lower())
              for raw in content.splitlines()[:15]:
                  try: row=json.loads(raw)
                  except ValueError: continue
                  if not isinstance(row,dict): continue
                  message=row.get("message")
                  if not isinstance(message,str): message=json.dumps(message,ensure_ascii=True)
                  if re.search(r"gh[pousr]_[A-Za-z0-9_]{8,}",message):
                      print("LOG_CLASS",row.get("source","unknown"),"SENSITIVE_PATTERN_SUPPRESSED")
                      continue
                  whitelist=re.findall(r"(?:C6_BACKUP_[A-Z_]+|FAIL_CLOSED|DRY_RUN_ONLY|DISPATCH_ACCEPTED|C6_[A-Z_]+)",message)
                  print("LOG_CLASS",str(row.get("source","unknown"))[:28],str(row.get("level","unknown"))[:12],
                        str(row.get("name","unknown"))[:28],"labels="+",".join(sorted(set(whitelist)))[:100],
                        "msg_len="+str(len(message)))
          PY
