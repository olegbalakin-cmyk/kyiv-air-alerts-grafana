name: Research CASUALTY three new candidates - offline WIP shortlist ONLY

on:
  push:
    branches:
      - research-casualty-three-new-http-shadow-2026-11-11
    paths:
      - .github/workflows/research-casualty-three-shortlist-once.yml

permissions:
  contents: read

jobs:
  shortlist-without-media-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research code, read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable WIP queue (GitHub only)
        uses: actions/checkout@v4
        with:
          ref: c5ad6548e5ae901a75e5ff1b82ba25289341f59b
          path: wip-pin
          persist-credentials: false
          sparse-checkout: |
            kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json
          sparse-checkout-cone-mode: false
      - name: Rank three evidence-oriented news categories, NO HTTP to media
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object wip-pin/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json)" = "f3f7141aa6d7584c63ff42510b40239a18834d15"
          python - <<'PY'
          import json,re,collections
          from pathlib import Path
          q=json.loads(Path('wip-pin/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json').read_text(encoding='utf-8'))
          prior={"5d60e1c78026fdc494ea3c84","96dc8052cf48f4ce74df29f6","6c946bfd46fffbe953d795bf","f4719e871b92e7563c7150da","81196e29c4a6ac2141a93617"}
          assert len(q)==1657
          elig=[x for x in q if x.get('status')=='needs_review' and x.get('source')=='Google News RSS' and x.get('candidate_id') not in prior and x.get('url','').startswith('https://news.google.com/rss/articles/')]
          print("QUEUE",len(q),"ELIGIBLE",len(elig),"PUBLISHERS",collections.Counter(x.get('publisher') for x in elig).most_common(20))
          cats={
           'POSITIVE_OFFICIAL_DATED': [
              (r'загинул|загибл|жертв|смертел',5),
              (r'дснс|прокуратур|поліці|мва|військов.{0,20}адміністрац|міськ.{0,15}рада|синєгубов|лисака|кличк|офіційн|обласн.{0,18}адміністрац',3),
              (r'\b(?:1[0-9]|2[0-9]|3[01])\s*(?:жовтн|листопад|вересн)|\b20(?:25|26)[-./]\d{2}[-./]\d{2}|\b[0-3]?[0-9][.]\s*[01]?[0-9][.]\s*2026',4),
              (r'ракет|дрон|безпілот|шахед|бпла|авіаудар|повітрян|обстріл',3),
              (r'супільне|суспільне|укрінформ|українська правда|LB.ua|громадське|радіо свобода',2),
            ],
           'COUNT_UPDATES': [
              (r'загинул|загибл|жертв',5),
              (r'кількість|число|зросл|збільшил|уточнил|оновлен|зросла|стало відом|знайшли|знайдено|до\s*\d+\s*(?:осіб|людей)|оновлено',7),
              (r'дснс|прокуратур|поліці|мва|військов.{0,20}адміністрац|міськ.{0,15}рада',3),
              (r'ракет|дрон|безпілот|шахед|бпла|авіаудар',2)
            ],
           'MULTI_STRIKE': [
              (r'загинул|загибл|жертв',5),
              (r'повторн|друга атак|дві атак|кілька атак|серія атак|удари|наслідки|атаки|після|хронологі|протягом доби|за добу',5),
              (r'дрон|безпілот|ракет|шахед',2),
              (r'дснс|прокуратур|поліці|мва|військов.{0,20}адміністрац',2)
            ]
          }
          for category,rules in cats.items():
              rank=[]
              for x in elig:
                  title=str(x.get('title') or '')
                  low=title.casefold()
                  score=sum(w for pat,w in rules if re.search(pat,low,re.I))
                  if not re.search(r'загинул|загибл|жертв|смертел',low):
                      continue
                  if category=='POSITIVE_OFFICIAL_DATED' and score<8: continue
                  if category=='COUNT_UPDATES' and score<12: continue
                  if category=='MULTI_STRIKE' and score<9: continue
                  rank.append((score,x))
              rank.sort(key=lambda v:(-v[0],str(v[1].get('published_at') or ''),str(v[1].get('candidate_id'))),reverse=False)
              print("\nCATEGORY",category,"MATCHES",len(rank))
              for score,x in rank[:55]:
                  print(json.dumps({
                     'score':score,'id':x.get('candidate_id'),'city':x.get('city_key'),
                     'publisher':x.get('publisher'),'published_at':x.get('published_at'),
                     'title':x.get('title')
                  },ensure_ascii=False))
          PY
