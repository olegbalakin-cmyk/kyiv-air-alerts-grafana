name: Infer raion stable start

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/infer_raion_stable_start.py"
      - ".github/workflows/infer-raion-stable-start.yml"

permissions:
  contents: write

jobs:
  infer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Sync with latest main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install "requests>=2.32,<3"
      - name: Infer stable starts
        run: python scripts/infer_raion_stable_start.py
      - name: Commit outputs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data/raion_stable_start_candidates.csv kyiv-air-alerts-grafana/data/raion_stable_start_candidates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update raion stable-start candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
