name: Attack-event 23-city parent-binding map v1 freeze

on:
  push:
    branches:
      - attack-event-23city-parent-binding-map-v1-2026-10-05
    paths:
      - .github/workflows/attack-event-23city-parent-binding-map-freeze.yml

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    name: RUN ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_LABEL: ${{ matrix.run }}
      AUDIT_RUN: "37269247142"
      AUDIT_ARTIFACT_ID: "11327254449"
      AUDIT_ARTIFACT_NAME: "attack-event-23city-parent-binding-audit"
      ALIGN_RUN: "37281361126"
      ALIGN_ARTIFACT_ID: "11332332817"
      ALIGN_ARTIFACT_NAME: "attack-event-step2b-parent-binding-contract-alignment"
    steps:
      - name: Download only accepted frozen source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source out
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$AUDIT_RUN/artifacts?per_page=100" > source/audit-run-artifacts.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ALIGN_RUN/artifacts?per_page=100" > source/alignment-run-artifacts.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUDIT_ARTIFACT_ID/zip" > source/audit.zip
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ALIGN_ARTIFACT_ID/zip" > source/alignment.zip

      - name: Validate sources and materialize deterministic map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import sys
          import zipfile
          from collections import Counter
          from pathlib import Path

          EXPECTED = {"BOUND": 26380, "UNBOUND": 25, "AMBIGUOUS": 0}
          CLASSIFICATIONS = 26405
          SNAPSHOT_SHA = "09458bcf0a019fa2939eb9dfa484da46cd8fa2be077343c5ba6d595c93d71788"
          PARENT_SHA = "882802f162334c336bc5015e1ef12b9e0d36b338c12f4939700fc69419387146"
          AUDIT_RUN = 37269247142
          AUDIT_ARTIFACT_ID = 11327254449
          AUDIT_ARTIFACT_NAME = "attack-event-23city-parent-binding-audit"
          AUDIT_HEAD = "174c4a4621d1831f6d808d7c23d992dc4e41cc90"
          ALIGN_RUN = 37281361126
          ALIGN_ARTIFACT_ID = 11332332817
          ALIGN_ARTIFACT_NAME = "attack-event-step2b-parent-binding-contract-alignment"
          ALIGN_HEAD = "74da9bbcf921e96a965ee1995320e351e7a92d0a"
          CONTRACT_COMMIT = "b205d38dbc50bc502d10e682d4ae53491af542ea"
          SNAPSHOT_COMMIT = "efefa399e69eadd3d7fc8393ac1553cfde35f138"
          SNAPSHOT_BLOB = "8a2f6bd33f879be9db978da59c12c34e61f6f843"
          SNAPSHOT_PATH = "research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json"
          OUT = Path("out/attack_event_23city_parent_binding_map_v1_2026-10-05.json")
          STATUS = Path("out/run_status.json")
          run_label = os.environ.get("RUN_LABEL", "?").upper()

          class GateError(RuntimeError):
              def __init__(self, gate, affected=0):
                  super().__init__(gate)
                  self.gate = gate
                  self.affected = int(affected or 0)

          def fail(gate, affected=0):
              raise GateError(gate, affected)

          def artifact_meta_ok(path, artifact_id, artifact_name):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              artifacts = data.get("artifacts")
              if not isinstance(artifacts, list):
                  return False
              hits = [a for a in artifacts if int(a.get("id", -1)) == artifact_id]
              if len(hits) != 1:
                  return False
              a = hits[0]
              return a.get("name") == artifact_name and not bool(a.get("expired"))

          def zip_json(zip_path, basename):
              with zipfile.ZipFile(zip_path, "r") as zf:
                  matches = [
                      name for name in zf.namelist()
                      if not name.endswith("/") and Path(name).name == basename
                  ]
                  if len(matches) != 1:
                      fail("SOURCE_ARTIFACT_REQUIRED_FILE_MISMATCH")
                  return json.loads(zf.read(matches[0]))

          status = {
              "run": run_label,
              "source_audit_integrity": "NOT_CHECKED",
              "alignment_proof_integrity": "NOT_CHECKED",
              "sha256": None,
              "bytes": None,
              "affected_classification_count": 0,
          }

          try:
              if not artifact_meta_ok("source/audit-run-artifacts.json", AUDIT_ARTIFACT_ID, AUDIT_ARTIFACT_NAME):
                  fail("SOURCE_AUDIT_ARTIFACT_IDENTITY_MISMATCH")
              if not artifact_meta_ok("source/alignment-run-artifacts.json", ALIGN_ARTIFACT_ID, ALIGN_ARTIFACT_NAME):
                  fail("ALIGNMENT_ARTIFACT_IDENTITY_MISMATCH")

              audit = zip_json("source/audit.zip", "attack_event_23city_parent_binding_audit.json")
              summary = zip_json("source/audit.zip", "summary.json")
              alignment = zip_json("source/alignment.zip", "step2b_parent_binding_contract_alignment.json")

              if audit.get("kind") != "attack_event_23city_parent_binding_audit":
                  fail("SOURCE_AUDIT_SCHEMA_MISMATCH")
              if audit.get("snapshot_sha256") != SNAPSHOT_SHA:
                  fail("SOURCE_AUDIT_SNAPSHOT_SHA_MISMATCH")
              if (audit.get("parent_corpus") or {}).get("parent_corpus_sha256") != PARENT_SHA:
                  fail("SOURCE_AUDIT_PARENT_CORPUS_SHA_MISMATCH")

              records = audit.get("records")
              if not isinstance(records, list) or len(records) != CLASSIFICATIONS:
                  fail("SOURCE_AUDIT_RECORD_COUNT_MISMATCH", 0 if not isinstance(records, list) else abs(len(records)-CLASSIFICATIONS))

              keys = []
              state_counts = Counter()
              bound_uids = []
              bad_bound = []
              bad_unbound = []
              for row in records:
                  if not isinstance(row, dict):
                      fail("SOURCE_AUDIT_RECORD_SCHEMA_MISMATCH", 1)
                  ck = row.get("classification_key")
                  city = row.get("city_key")
                  hid = row.get("historical_episode_id")
                  start = row.get("alert_start_at")
                  end = row.get("alert_end_at")
                  state = row.get("binding_state")
                  if not all(isinstance(v, str) and v for v in (ck, city, hid, start, end)):
                      fail("SOURCE_AUDIT_RECORD_SCHEMA_MISMATCH", 1)
                  if state not in EXPECTED:
                      fail("SOURCE_AUDIT_BINDING_STATE_MISMATCH", 1)
                  keys.append(ck)
                  state_counts[state] += 1
                  if state == "BOUND":
                      uid = row.get("alert_episode_uid")
                      if not isinstance(uid, str) or not uid:
                          bad_bound.append(ck)
                      if row.get("deterministic_episode_id_validation_result") != "PASS":
                          bad_bound.append(ck)
                      bound_uids.append(uid)
                  elif state == "UNBOUND":
                      reasons = row.get("diagnostic_reason_codes")
                      if row.get("alert_episode_uid") is not None:
                          bad_unbound.append(ck)
                      if row.get("exact_parent_candidate_count") != 0:
                          bad_unbound.append(ck)
                      if not isinstance(reasons, list) or "NO_EXACT_PARENT_TUPLE" not in reasons:
                          bad_unbound.append(ck)
                      if row.get("deterministic_episode_id_validation_result") != "PASS":
                          bad_unbound.append(ck)

              if len(set(keys)) != CLASSIFICATIONS:
                  fail("SOURCE_AUDIT_CLASSIFICATION_KEY_UNIQUENESS_MISMATCH", CLASSIFICATIONS-len(set(keys)))
              actual_counts = {k: state_counts.get(k, 0) for k in EXPECTED}
              if actual_counts != EXPECTED:
                  fail("SOURCE_AUDIT_BINDING_PARTITION_MISMATCH")
              if bad_bound:
                  fail("SOURCE_AUDIT_BOUND_INVARIANT_MISMATCH", len(set(bad_bound)))
              if bad_unbound:
                  fail("SOURCE_AUDIT_UNBOUND_INVARIANT_MISMATCH", len(set(bad_unbound)))
              if len(bound_uids) != EXPECTED["BOUND"] or len(set(bound_uids)) != EXPECTED["BOUND"]:
                  fail("SOURCE_AUDIT_PARENT_UID_COLLISION", len(bound_uids)-len(set(bound_uids)))

              if summary.get("verdict") != "ATTACK-EVENT 23-CITY PARENT BINDING AUDIT BLOCKED":
                  fail("SOURCE_AUDIT_SUMMARY_VERDICT_MISMATCH")
              if summary.get("first_failing_gate") != "NO_EXACT_PARENT_TUPLE":
                  fail("SOURCE_AUDIT_SUMMARY_GATE_MISMATCH")
              if summary.get("snapshot_classifications") != CLASSIFICATIONS:
                  fail("SOURCE_AUDIT_SUMMARY_COUNT_MISMATCH")
              for state, expected in EXPECTED.items():
                  if summary.get(state) != expected:
                      fail("SOURCE_AUDIT_SUMMARY_BINDING_PARTITION_MISMATCH")
              if summary.get("unique_bound_parent_uids") != EXPECTED["BOUND"]:
                  fail("SOURCE_AUDIT_SUMMARY_UNIQUE_PARENT_MISMATCH")
              if summary.get("no_exact_parent_tuple_count") != EXPECTED["UNBOUND"]:
                  fail("SOURCE_AUDIT_SUMMARY_UNBOUND_DIAGNOSTIC_MISMATCH")
              if summary.get("parent_corpus_sha256") != PARENT_SHA:
                  fail("SOURCE_AUDIT_SUMMARY_PARENT_SHA_MISMATCH")
              if summary.get("snapshot_sha_intact") != "YES":
                  fail("SOURCE_AUDIT_SUMMARY_SNAPSHOT_INTEGRITY_MISMATCH")
              if summary.get("db_writes") != 0 or summary.get("neon_mutations") != 0:
                  fail("SOURCE_AUDIT_MUTATION_GUARD_MISMATCH")
              if summary.get("production_mutation") != "NO" or summary.get("credentials_exposed") is not False:
                  fail("SOURCE_AUDIT_SAFETY_GUARD_MISMATCH")
              status["source_audit_integrity"] = "PASS"

              if alignment.get("verdict") != "ATTACK-EVENT 23-CITY PARENT BINDING AUDIT CONTRACT-ALIGNED PASSED":
                  fail("ALIGNMENT_PROOF_VERDICT_MISMATCH")
              ori = alignment.get("original_audit_run_identity") or {}
              if ori.get("run_id") != AUDIT_RUN or ori.get("head_sha") != AUDIT_HEAD:
                  fail("ALIGNMENT_PROOF_AUDIT_IDENTITY_MISMATCH")
              oai = alignment.get("original_audit_artifact_identity") or {}
              if oai.get("artifact_id") != AUDIT_ARTIFACT_ID or oai.get("artifact_name") != AUDIT_ARTIFACT_NAME:
                  fail("ALIGNMENT_PROOF_AUDIT_ARTIFACT_IDENTITY_MISMATCH")
              contract = alignment.get("frozen_persistence_contract_identity") or {}
              if contract.get("commit") != CONTRACT_COMMIT:
                  fail("ALIGNMENT_PROOF_CONTRACT_COMMIT_MISMATCH")
              if contract.get("public.alert_episodes.classification") != "OPTIONAL FK":
                  fail("ALIGNMENT_PROOF_OPTIONAL_FK_MISMATCH")
              snap = alignment.get("snapshot_identity") or {}
              if snap.get("sha256") != SNAPSHOT_SHA or snap.get("classifications") != CLASSIFICATIONS or snap.get("integrity") != "PASS":
                  fail("ALIGNMENT_PROOF_SNAPSHOT_IDENTITY_MISMATCH")
              if alignment.get("parent_corpus_sha256") != PARENT_SHA:
                  fail("ALIGNMENT_PROOF_PARENT_SHA_MISMATCH")
              ac = alignment.get("counts") or {}
              expected_alignment_counts = {
                  "classifications": CLASSIFICATIONS,
                  "unique_classification_keys": CLASSIFICATIONS,
                  "BOUND": EXPECTED["BOUND"],
                  "UNBOUND": EXPECTED["UNBOUND"],
                  "AMBIGUOUS": EXPECTED["AMBIGUOUS"],
                  "unique_bound_parent_uids": EXPECTED["BOUND"],
                  "bound_records_satisfying_all_bound_predicates": EXPECTED["BOUND"],
                  "unbound_records_satisfying_unbound_invariant": EXPECTED["UNBOUND"],
                  "unbound_records_with_exact_parent_candidate_count_0": EXPECTED["UNBOUND"],
                  "unbound_records_with_deterministic_episode_id_validation_PASS": EXPECTED["UNBOUND"],
                  "bound_parent_uid_collisions": 0,
                  "historical_id_mismatch_among_BOUND": 0,
                  "historical_id_mismatch_among_UNBOUND": 0,
              }
              for key, expected in expected_alignment_counts.items():
                  if ac.get(key) != expected:
                      fail("ALIGNMENT_PROOF_COUNT_MISMATCH")
              if alignment.get("all_25_unbound_have_NO_EXACT_PARENT_TUPLE") is not True:
                  fail("ALIGNMENT_PROOF_UNBOUND_DIAGNOSTIC_MISMATCH")
              if alignment.get("all_25_unbound_satisfy_frozen_UNBOUND_storage_semantics") is not True:
                  fail("ALIGNMENT_PROOF_UNBOUND_STORAGE_MISMATCH")
              corrected = alignment.get("corrected_contract_aligned_criterion") or {}
              if corrected.get("observed_required_partition_for_this_artifact") != EXPECTED:
                  fail("ALIGNMENT_PROOF_PARTITION_MISMATCH")
              if corrected.get("UNBOUND_storage") != "alert_episode_uid NULL":
                  fail("ALIGNMENT_PROOF_UNBOUND_STORAGE_TEXT_MISMATCH")
              if corrected.get("AMBIGUOUS_storage") != "alert_episode_uid NULL":
                  fail("ALIGNMENT_PROOF_AMBIGUOUS_STORAGE_TEXT_MISMATCH")
              if corrected.get("exact_matching_weakened") is not False:
                  fail("ALIGNMENT_PROOF_MATCHING_WEAKENED")
              if alignment.get("new_neon_queries") != 0 or alignment.get("db_queries_in_this_task") != 0:
                  fail("ALIGNMENT_PROOF_QUERY_GUARD_MISMATCH")
              if alignment.get("db_writes") != 0 or alignment.get("neon_mutations") != 0:
                  fail("ALIGNMENT_PROOF_MUTATION_GUARD_MISMATCH")
              if alignment.get("semantic_change") != "NO" or alignment.get("binding_algorithm_changed") != "NO":
                  fail("ALIGNMENT_PROOF_SEMANTIC_GUARD_MISMATCH")
              if alignment.get("credentials_exposed") is not False:
                  fail("ALIGNMENT_PROOF_CREDENTIAL_GUARD_MISMATCH")
              status["alignment_proof_integrity"] = "PASS"

              ordered = sorted(records, key=lambda r: r["classification_key"])
              ordered_keys = [r["classification_key"] for r in ordered]
              if any(a >= b for a, b in zip(ordered_keys, ordered_keys[1:])):
                  fail("CANONICAL_ORDERING_MISMATCH")
              map_records = [
                  {
                      "classification_key": r["classification_key"],
                      "city_key": r["city_key"],
                      "historical_episode_id": r["historical_episode_id"],
                      "alert_start_at": r["alert_start_at"],
                      "alert_end_at": r["alert_end_at"],
                      "binding_state": r["binding_state"],
                      "alert_episode_uid": r["alert_episode_uid"],
                  }
                  for r in ordered
              ]

              doc = {
                  "schema_version": "attack-event-parent-binding-map-v1",
                  "source_snapshot_sha256": SNAPSHOT_SHA,
                  "source_snapshot_artifact_path": SNAPSHOT_PATH,
                  "source_snapshot_artifact_commit": SNAPSHOT_COMMIT,
                  "source_snapshot_git_blob": SNAPSHOT_BLOB,
                  "parent_corpus_sha256": PARENT_SHA,
                  "source_parent_binding_audit_run": AUDIT_RUN,
                  "source_parent_binding_audit_artifact_id": AUDIT_ARTIFACT_ID,
                  "source_parent_binding_audit_artifact_name": AUDIT_ARTIFACT_NAME,
                  "source_parent_binding_audit_proof_head": AUDIT_HEAD,
                  "source_contract_alignment_run": ALIGN_RUN,
                  "source_contract_alignment_artifact_id": ALIGN_ARTIFACT_ID,
                  "source_contract_alignment_artifact_name": ALIGN_ARTIFACT_NAME,
                  "source_contract_alignment_proof_head": ALIGN_HEAD,
                  "source_persistence_contract_commit": CONTRACT_COMMIT,
                  "classifications": CLASSIFICATIONS,
                  "BOUND": EXPECTED["BOUND"],
                  "UNBOUND": EXPECTED["UNBOUND"],
                  "AMBIGUOUS": EXPECTED["AMBIGUOUS"],
                  "records": map_records,
              }
              raw = json.dumps(
                  doc,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              OUT.write_bytes(raw)
              status["sha256"] = hashlib.sha256(raw).hexdigest()
              status["bytes"] = len(raw)
              STATUS.write_text(json.dumps(status, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print(f"RUN_{run_label}_SOURCE_AUDIT_INTEGRITY=PASS")
              print(f"RUN_{run_label}_ALIGNMENT_PROOF_INTEGRITY=PASS")
              print(f"RUN_{run_label}_SHA256={status['sha256']}")
              print(f"RUN_{run_label}_BYTES={status['bytes']}")
              print(f"RUN_{run_label}_RECORDS={CLASSIFICATIONS}")
              print(f"RUN_{run_label}_BOUND={EXPECTED['BOUND']}")
              print(f"RUN_{run_label}_UNBOUND={EXPECTED['UNBOUND']}")
              print(f"RUN_{run_label}_AMBIGUOUS={EXPECTED['AMBIGUOUS']}")
          except GateError as exc:
              status["first_failing_gate"] = exc.gate
              status["affected_classification_count"] = exc.affected
              STATUS.write_text(json.dumps(status, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print(f"FIRST_FAILING_GATE={exc.gate}", file=sys.stderr)
              print(f"SOURCE_AUDIT_INTEGRITY={status['source_audit_integrity']}", file=sys.stderr)
              print(f"ALIGNMENT_PROOF_INTEGRITY={status['alignment_proof_integrity']}", file=sys.stderr)
              print(f"AFFECTED_CLASSIFICATION_COUNT={exc.affected}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload RUN output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-parent-binding-map-run-${{ matrix.run }}
          path: |
            out/attack_event_23city_parent_binding_map_v1_2026-10-05.json
            out/run_status.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Verify A/B and freeze durable artifact
    needs: materialize
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: "c4698d1fd2050620fe0575e1525ea0cb791e2053"
      FREEZE_BRANCH: "attack-event-23city-parent-binding-map-v1-2026-10-05"
      WORKFLOW_PATH: ".github/workflows/attack-event-23city-parent-binding-map-freeze.yml"
      DURABLE_PATH: "research/attack_event_23city_parent_binding_map_v1_2026-10-05.json"
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download RUN A
        uses: actions/download-artifact@v4
        with:
          name: attack-event-parent-binding-map-run-a
          path: compare/run-a

      - name: Download RUN B
        uses: actions/download-artifact@v4
        with:
          name: attack-event-parent-binding-map-run-b
          path: compare/run-b

      - name: Verify byte equality, commit exact bytes, and verify final tree
        shell: bash
        run: |
          set -euo pipefail
          A="compare/run-a/attack_event_23city_parent_binding_map_v1_2026-10-05.json"
          B="compare/run-b/attack_event_23city_parent_binding_map_v1_2026-10-05.json"
          test -f "$A"
          test -f "$B"
          SHA_A="$(sha256sum "$A" | awk '{print $1}')"
          SHA_B="$(sha256sum "$B" | awk '{print $1}')"
          BYTES_A="$(wc -c < "$A" | tr -d ' ')"
          BYTES_B="$(wc -c < "$B" | tr -d ' ')"
          if [ "$SHA_A" != "$SHA_B" ] || [ "$BYTES_A" != "$BYTES_B" ] || ! cmp -s "$A" "$B"; then
            echo "FIRST_FAILING_GATE=RUN_A_RUN_B_BYTE_IDENTITY_MISMATCH" >&2
            echo "RUN_A_SHA256=$SHA_A" >&2
            echo "RUN_B_SHA256=$SHA_B" >&2
            echo "RUN_A_BYTES=$BYTES_A" >&2
            echo "RUN_B_BYTES=$BYTES_B" >&2
            exit 31
          fi

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > current-run-artifacts.json
          IDS="$(python - <<'PY'
          import json
          d=json.load(open("current-run-artifacts.json", encoding="utf-8"))
          by={}
          for a in d.get("artifacts", []):
              by.setdefault(a.get("name"), []).append(a)
          out=[]
          for name in ("attack-event-parent-binding-map-run-a","attack-event-parent-binding-map-run-b"):
              hits=by.get(name,[])
              if len(hits)!=1 or hits[0].get("expired"):
                  raise SystemExit("RUN_OUTPUT_ARTIFACT_IDENTITY_MISMATCH")
              out.append(str(hits[0]["id"]))
          print(" ".join(out))
          PY
          )"
          read -r RUN_A_ARTIFACT_ID RUN_B_ARTIFACT_ID <<< "$IDS"

          mkdir -p "$(dirname "$DURABLE_PATH")"
          cp "$A" "$DURABLE_PATH"
          cmp -s "$A" "$DURABLE_PATH"
          cmp -s "$B" "$DURABLE_PATH"

          git rm "$WORKFLOW_PATH"
          git add "$DURABLE_PATH"

          PRECOMMIT_DIFF="$(git diff --cached --name-status "$BASE_SHA")"
          EXPECTED_DIFF=$'A\t'"$DURABLE_PATH"
          if [ "$PRECOMMIT_DIFF" != "$EXPECTED_DIFF" ]; then
            echo "FIRST_FAILING_GATE=FINAL_TREE_PRECOMMIT_DIFF_MISMATCH" >&2
            echo "FINAL_TREE_DIFF_STATUS=FAIL" >&2
            exit 32
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze 23-city attack-event parent-binding map v1"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:$FREEZE_BRANCH"

          DURABLE_BLOB="$(git rev-parse "HEAD:$DURABLE_PATH")"
          DURABLE_SHA="$(sha256sum "$DURABLE_PATH" | awk '{print $1}')"
          DURABLE_BYTES="$(wc -c < "$DURABLE_PATH" | tr -d ' ')"
          if [ "$DURABLE_SHA" != "$SHA_A" ] || [ "$DURABLE_SHA" != "$SHA_B" ] || [ "$DURABLE_BYTES" != "$BYTES_A" ] || [ "$DURABLE_BYTES" != "$BYTES_B" ]; then
            echo "FIRST_FAILING_GATE=DURABLE_BYTE_IDENTITY_MISMATCH" >&2
            exit 33
          fi
          cmp -s "$A" "$DURABLE_PATH"
          cmp -s "$B" "$DURABLE_PATH"

          FINAL_DIFF="$(git diff --name-status "$BASE_SHA" HEAD)"
          if [ "$FINAL_DIFF" != "$EXPECTED_DIFF" ]; then
            echo "FIRST_FAILING_GATE=FINAL_TREE_DIFF_MISMATCH" >&2
            echo "FINAL_TREE_DIFF_STATUS=FAIL" >&2
            exit 34
          fi

          export SHA_A SHA_B BYTES_A BYTES_B RUN_A_ARTIFACT_ID RUN_B_ARTIFACT_ID FINAL_COMMIT DURABLE_BLOB DURABLE_SHA DURABLE_BYTES
          python - <<'PY'
          import json, os
          p=os.environ["DURABLE_PATH"]
          with open(p,"rb") as f:
              raw=f.read()
          doc=json.loads(raw)
          expected={
              "schema_version":"attack-event-parent-binding-map-v1",
              "source_snapshot_sha256":"09458bcf0a019fa2939eb9dfa484da46cd8fa2be077343c5ba6d595c93d71788",
              "parent_corpus_sha256":"882802f162334c336bc5015e1ef12b9e0d36b338c12f4939700fc69419387146",
              "source_parent_binding_audit_run":37269247142,
              "source_contract_alignment_run":37281361126,
              "classifications":26405,
              "BOUND":26380,
              "UNBOUND":25,
              "AMBIGUOUS":0,
          }
          for k,v in expected.items():
              if doc.get(k)!=v:
                  raise SystemExit("DURABLE_METADATA_MISMATCH:"+k)
          records=doc.get("records")
          if not isinstance(records,list) or len(records)!=26405:
              raise SystemExit("DURABLE_RECORD_COUNT_MISMATCH")
