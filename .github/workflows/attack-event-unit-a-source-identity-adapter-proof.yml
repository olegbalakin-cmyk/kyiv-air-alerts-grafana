name: Unit A source identity adapter offline proof

on:
  push:
    branches:
      - attack-event-unit-a-source-identity-adapter-proof-2026-10-09

permissions:
  contents: write

concurrency:
  group: unit-a-source-identity-adapter-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-identity:
    if: ${{ !contains(github.event.head_commit.message, '[unit-a-source-identity-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch only pinned historical Git objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin multicity-wip-2026-09-16
          git fetch --no-tags origin 51adc76b715669e46e8c2c936906022d4d96ed44
          git fetch --no-tags origin 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453
          git fetch --no-tags origin f54b0d6dcfcdd7e5b51a5b45b996273d1df72cff
          git fetch --no-tags origin 1422e8482303ec9262647ca55fef753a9aa2b3ea
          git fetch --no-tags origin bc58ab0705699c1686d897f07852c3493b5eec16
      - name: Offline lossless source-identity parity RUN A and RUN B
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          python -B .github/proof/attack_event_unit_a_source_identity_adapter_proof.py
      - name: Commit only the durable proof artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f research/attack_event_execution_unit_a_source_identity_adapter_proof_2026-10-09.json
          test "$(git status --porcelain | wc -l)" -eq 1
          test "$(git status --porcelain)" = "?? research/attack_event_execution_unit_a_source_identity_adapter_proof_2026-10-09.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/attack_event_execution_unit_a_source_identity_adapter_proof_2026-10-09.json
          git commit -m "freeze: Unit A source identity adapter offline proof [unit-a-source-identity-artifact]"
          git push origin HEAD:attack-event-unit-a-source-identity-adapter-proof-2026-10-09
