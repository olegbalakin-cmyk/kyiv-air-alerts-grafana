name: Kyiv post-cutoff evidence semantic sufficiency audit
# read-only audit workflow

on:
  push:
    branches:
      - kyiv-postcutoff-evidence-semantic-sufficiency-audit-2026-10-07
    paths:
      - ".github/proof/kyiv_postcutoff_evidence_semantic_sufficiency.py"
      - ".github/workflows/kyiv-postcutoff-evidence-semantic-sufficiency.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SNAPSHOT_COMMIT: efefa399e69eadd3d7fc8393ac1553cfde35f138
      CLASSIFIER_COMMIT: 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453
      SNAPSHOT_FILE: /tmp/attack_event_23city_persistence_snapshot_v2_2026-10-04.json
      STACK_DIR: /tmp/authoritative_classifier_stack
      OUT: /tmp/kyiv_postcutoff_evidence_semantic_sufficiency_2026-10-07.json
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SNAPSHOT_COMMIT" "$CLASSIFIER_COMMIT"
          test "$(git rev-parse "$SNAPSHOT_COMMIT:research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json")" = "8a2f6bd33f879be9db978da59c12c34e61f6f843"
          test "$(git rev-parse "$CLASSIFIER_COMMIT:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")" = "778469b74c2aa807d851cf2c2ee35cf4aa785589"

      - name: Assert zero database configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB environment variable: $key"; exit 1; }
          done

      - name: Materialize snapshot runner-side only
        shell: bash
        run: |
          set -euo pipefail
          git show "$SNAPSHOT_COMMIT:research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json" > "$SNAPSHOT_FILE"
          test -s "$SNAPSHOT_FILE"

      - name: Materialize exact classifier stack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STACK_DIR"
          mkdir -p "$STACK_DIR"
          git archive "$CLASSIFIER_COMMIT" | tar -x -C "$STACK_DIR"
          test -f "$STACK_DIR/kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact stack dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r "$STACK_DIR/kyiv-air-alerts-grafana/requirements.txt"

      - name: Run authoritative classifier self-test
        shell: bash
        working-directory: /tmp/authoritative_classifier_stack/kyiv-air-alerts-grafana
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python scripts/monitor_explosion_candidates.py --self-test

      - name: Run read-only evidence sufficiency audit
        id: audit
        shell: bash
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 python .github/proof/kyiv_postcutoff_evidence_semantic_sufficiency.py             --snapshot "$SNAPSHOT_FILE"             --stack "$STACK_DIR"             --out "$OUT"             --run-id "$GITHUB_RUN_ID"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -s "$OUT"
          cat "$OUT"
          exit 0

      - name: Upload compact audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-postcutoff-evidence-semantic-sufficiency-${{ github.run_id }}
          path: /tmp/kyiv_postcutoff_evidence_semantic_sufficiency_2026-10-07.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if audit blocked
        if: steps.audit.outputs.exit_code != '0'
        shell: bash
        run: exit 1
