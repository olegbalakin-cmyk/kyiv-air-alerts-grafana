name: Phase-1 Same-Stream Concurrency Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-stream-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      E2E_EXPECTED_PROJECT_ID: green-cake-44216048
      E2E_PARENT_BRANCH_ID: br-young-feather-b5q19nli
      E2E_PRIMARY_BRANCH_ID: br-wandering-sunset-b5835alw
      E2E_ACCEPTED_BRANCH_ID: br-young-feather-b5q19nli
      E2E_LIVE_E2E_BRANCH_ID: br-still-sea-b5062r40
      E2E_BLOCKED_BRANCH_ID: br-calm-cherry-b56fsh4i
      E2E_BRANCH_NAME: lviv-phase1-same-stream-concurrency-e2e-2026-09-28
      E2E_DB_NAME: neondb
      E2E_ROLE_NAME: neondb_owner
      PHASE1_PROOF_BASE_SHA: 182abd7bc6ac761417a4ba74aa20697f533c637c
      PHASE1_DDL_BLOB: 3b8af7940b23aae03a4f6b434d90d97dde10bfc0
      PHASE1_PERSISTENCE_BLOB: 06f3098df63d7aaf2348c366b6a351901926cb53
      PHASE1_IMPORTER_BLOB: 7f2c1d90fb719e296e4dbb2cc96c6ec492e25ad8

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set proof paths and initialize machine-readable result
        shell: bash
        run: |
          set -euo pipefail
          echo "PHASE1_CONCURRENCY_RESULT=$RUNNER_TEMP/db_phase1_same_stream_concurrency_result.json" >> "$GITHUB_ENV"
          echo "PHASE1_CONCURRENCY_BRANCH_META=$RUNNER_TEMP/db_phase1_same_stream_concurrency_branch_meta.json" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = {
              "schema_version": "db-phase1-same-stream-concurrency-proof-v1",
              "verdict": "PHASE-1 SAME-STREAM CONCURRENCY BLOCKED",
              "git": {
                  "base_sha": os.environ["PHASE1_PROOF_BASE_SHA"],
                  "proof_workflow_sha": os.environ["GITHUB_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "ddl_blob": os.environ["PHASE1_DDL_BLOB"],
                  "persistence_blob": os.environ["PHASE1_PERSISTENCE_BLOB"],
                  "importer_blob": os.environ["PHASE1_IMPORTER_BLOB"],
              },
              "neon": {
                  "project_id": os.environ.get("NEON_PROJECT_ID"),
                  "branch_id": None,
                  "branch_name": os.environ["E2E_BRANCH_NAME"],
                  "parent_branch_id": os.environ["E2E_PARENT_BRANCH_ID"],
                  "direct_unpooled_connection": False,
              },
              "writer_a_committed": False,
              "writer_b_committed": False,
              "credentials_exposed": False,
              "failing_step": "workflow_preflight",
          }
          Path(os.environ["RUNNER_TEMP"], "db_phase1_same_stream_concurrency_result.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install committed Phase-1 DB requirements
        working-directory: kyiv-air-alerts-grafana
        run: python -m pip install -r requirements-db-phase1.txt

      - name: Verify exact baseline and frozen production files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PHASE1_PROOF_BASE_SHA"
          git diff --quiet -- \
            kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql \
            kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py \
            kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py
          git diff --cached --quiet -- \
            kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql \
            kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py \
            kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py
          test "$(git hash-object kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql)" = "$PHASE1_DDL_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py)" = "$PHASE1_PERSISTENCE_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py)" = "$PHASE1_IMPORTER_BLOB"
          git diff --quiet "$PHASE1_PROOF_BASE_SHA" -- \
            kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql \
            kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py \
            kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py
          actual="$RUNNER_TEMP/phase1_changed_paths.txt"
          expected="$RUNNER_TEMP/phase1_expected_paths.txt"
          git diff --name-only "$PHASE1_PROOF_BASE_SHA" "$GITHUB_SHA" | sort > "$actual"
          printf '%s\n' \
            '.github/workflows/db-phase1-same-stream-concurrency-proof.yml' \
            'kyiv-air-alerts-grafana/scripts/proof_db_phase1_same_stream_concurrency.py' | sort > "$expected"
          diff -u "$expected" "$actual"
          echo "baseline and frozen production blobs = PASS"

      - name: Run committed Phase-1 regression tests
        working-directory: kyiv-air-alerts-grafana
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_db_phase1*.py" 2>&1 | tee "$RUNNER_TEMP/phase1_tests.log"

      - name: Verify secure Neon API credential path
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "BLOCKED - SECURE GITHUB ACTIONS DATABASE SECRET UNAVAILABLE"
            exit 78
          fi
          if [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "BLOCKED - REQUIRED GITHUB REPOSITORY VARIABLE NEON_PROJECT_ID UNAVAILABLE"
            exit 78
          fi
          if [ "$NEON_PROJECT_ID" != "$E2E_EXPECTED_PROJECT_ID" ]; then
            echo "BLOCKED - NEON_PROJECT_ID DOES NOT MATCH REQUIRED PROJECT"
            exit 78
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          project_id = os.environ["NEON_PROJECT_ID"]
          request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{project_id}",
              headers={"Authorization": f"Bearer {os.environ['NEON_API_KEY']}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          project = payload.get("project", payload)
          if project.get("id") != project_id:
              raise SystemExit("Neon API secret does not resolve the required project")
          print("secure GitHub Actions Neon credential path = YES")
          PY

      - name: Create fresh child branch and inject direct masked database URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = "https://console.neon.tech/api/v2"
          key = os.environ["NEON_API_KEY"]
          project = os.environ["NEON_PROJECT_ID"]
          parent = os.environ["E2E_PARENT_BRANCH_ID"]
          branch_name = os.environ["E2E_BRANCH_NAME"]
          db = os.environ["E2E_DB_NAME"]
          role = os.environ["E2E_ROLE_NAME"]
          result_path = Path(os.environ["RUNNER_TEMP"], "db_phase1_same_stream_concurrency_result.json")
          meta_path = Path(os.environ["RUNNER_TEMP"], "db_phase1_same_stream_concurrency_branch_meta.json")
          headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}
          branch_id = None

          def request_json(method, path, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def update_result(**values):
              out = json.loads(result_path.read_text(encoding="utf-8"))
              out.update(values)
              if branch_id:
                  out.setdefault("neon", {})["branch_id"] = branch_id
              result_path.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          existing = request_json(
              "GET",
              f"/projects/{project}/branches?search={urllib.parse.quote(branch_name)}",
          ).get("branches", [])
          exact = [branch for branch in existing if branch.get("name") == branch_name]
          if exact:
              branch_id = exact[0].get("id")
              update_result(
                  failing_step="fresh_branch_name_check",
                  existing_branch={
                      "id": branch_id,
                      "name": exact[0].get("name"),
                      "parent_id": exact[0].get("parent_id"),
                  },
              )
              raise SystemExit("Refusing to reuse an existing Neon concurrency proof branch")

          created = request_json(
              "POST",
              f"/projects/{project}/branches",
              {
                  "branch": {"name": branch_name, "parent_id": parent},
                  "endpoints": [{"type": "read_write"}],
              },
          )
          branch = created["branch"]
          branch_id = branch["id"]
          update_result(failing_step="direct_connection_preflight")
          if branch.get("parent_id") != parent:
              update_result(failing_step="created_branch_parent_check")
              raise SystemExit("Created Neon branch has the wrong parent")

          def connection_uri(target_branch_id):
              query = urllib.parse.urlencode(
                  {
                      "branch_id": target_branch_id,
                      "database_name": db,
                      "role_name": role,
                      "pooled": "false",
                  }
              )
              payload = request_json("GET", f"/projects/{project}/connection_uri?{query}")
              uri = payload.get("uri") or payload.get("connection_uri")
              if not uri:
                  raise SystemExit("Neon connection URI response was empty")
              print(f"::add-mask::{uri}")
              return uri

          target_url = connection_uri(branch_id)
          parsed_host = urllib.parse.urlparse(target_url).hostname or ""
          if not parsed_host or "-pooler" in parsed_host:
              update_result(
                  failing_step="direct_connection_preflight",
                  neon={
                      "project_id": project,
                      "branch_id": branch_id,
                      "branch_name": branch_name,
                      "parent_branch_id": parent,
                      "direct_unpooled_connection": False,
                  },
              )
              raise SystemExit("DIRECT POSTGRESQL CONNECTION UNAVAILABLE")

          protected = {
              "PHASE1_PRIMARY_DATABASE_URL": os.environ["E2E_PRIMARY_BRANCH_ID"],
              "PHASE1_ACCEPTED_DATABASE_URL": os.environ["E2E_ACCEPTED_BRANCH_ID"],
              "PHASE1_LIVE_E2E_DATABASE_URL": os.environ["E2E_LIVE_E2E_BRANCH_ID"],
              "PHASE1_BLOCKED_DATABASE_URL": os.environ["E2E_BLOCKED_BRANCH_ID"],
          }
          protected_urls = {name: connection_uri(branch) for name, branch in protected.items()}

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PHASE1_CONCURRENCY_DATABASE_URL={target_url}\n")
              handle.write(f"PHASE1_CONCURRENCY_BRANCH_ID={branch_id}\n")
              for name, uri in protected_urls.items():
                  handle.write(f"{name}={uri}\n")

          meta = {
              "neon_project_id": project,
              "neon_branch_id": branch_id,
              "neon_branch_name": branch_name,
              "neon_parent_branch_id": parent,
              "direct_unpooled_connection": True,
              "credentials_exposed": False,
          }
          meta_path.write_text(json.dumps(meta, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          update_result(
              failing_step="live_two_session_proof",
              neon={
                  "project_id": project,
                  "branch_id": branch_id,
                  "branch_name": branch_name,
                  "parent_branch_id": parent,
                  "direct_unpooled_connection": True,
              },
          )
          print(f"Neon concurrency branch ID = {branch_id}")
          print(f"Neon concurrency branch name = {branch_name}")
          print(f"Neon concurrency parent branch = {parent}")
          print("direct unpooled connection = YES")
          PY

      - name: Run live two-session same-stream contention proof
        working-directory: kyiv-air-alerts-grafana
        shell: bash
        run: |
          set -euo pipefail
          python scripts/proof_db_phase1_same_stream_concurrency.py

      - name: Reconfirm frozen production files after proof
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- \
            kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql \
            kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py \
            kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py
          git diff --cached --quiet -- \
            kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql \
            kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py \
            kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py
          test "$(git hash-object kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql)" = "$PHASE1_DDL_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py)" = "$PHASE1_PERSISTENCE_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py)" = "$PHASE1_IMPORTER_BLOB"
          echo "frozen production files after proof = PASS"

      - name: Upload machine-readable concurrency proof result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-phase1-same-stream-concurrency-result
          path: |
            ${{ runner.temp }}/db_phase1_same_stream_concurrency_result.json
            ${{ runner.temp }}/db_phase1_same_stream_concurrency_branch_meta.json
            ${{ runner.temp }}/phase1_tests.log
          if-no-files-found: warn
          retention-days: 30
