name: Test WIP monitors (existing offline test workflow)

on:
  push:
    branches: [multicity-wip-2026-09-16, integration-casualty-workab-shadow-off-2026-11-15, integration-casualty-workac-bounded-shadow-off-2026-11-15, integration-casualty-workad-url-facts-offline-2026-11-15, research-casualty-workae-direct-rss-offline-2026-11-15, research-casualty-workae-six-rss-live-2026-11-15]
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/update_explosion_metric_live.py"
      - "kyiv-air-alerts-grafana/scripts/sync_explosion_audited_baseline.py"
      - "kyiv-air-alerts-grafana/data/explosion_audited_baseline.json"
      - "kyiv-air-alerts-grafana/data/explosion_daily_alert_seed.json"
      - "kyiv-air-alerts-grafana/data/explosion_preview_input.json"
      - ".github/workflows/test-explosion-monitor-wip.yml"
      - "kyiv-air-alerts-grafana/scripts/monitor_casualty_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/casualty_workx_evidence.py"
      - "kyiv-air-alerts-grafana/scripts/casualty_workaa_context.py"
      - "kyiv-air-alerts-grafana/scripts/casualty_workaa_offline.py"
      - "research/casualty_workab_shadow_2026_11_15/**"
      - "kyiv-air-alerts-grafana/scripts/casualty_workac_capture.py"
      - "research/casualty_workac_shadow_2026_11_15/**"
      - "research/casualty_workad_shadow_2026_11_15/**"
      - "research/casualty_workae_direct_rss_2026_11_15/**"
      - "kyiv-air-alerts-grafana/scripts/casualty_workj_rules.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  casualty_workae_one_shot:
    # NO scheduled execution, reruns, or later push. This exact commit message
    # is a single-use trigger that MUST NOT be reused.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research-casualty-workae-six-rss-live-2026-11-15' && github.event.head_commit.message == 'go(casualty): RUN WORKAE SIX RSS ONE SHOT ONCE 2026-11-15' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - name: Checkout pilot-only research head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for existing Work AC modules
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Exactly six read-only RSS GET using Work AC pinned TLS
        env:
          WORKAE_GO_APPROVED: yes-one-shot-6-feeds
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKAE_PILOT_OUT: /tmp/workae-rss-pilot
        run: |
          set -euo pipefail
          python research/casualty_workae_direct_rss_2026_11_15/oneshot_rss_probe.py
          test -f /tmp/workae-rss-pilot/sha256_manifest.json
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/workae-rss-pilot')
          report=json.loads((p/'pilot_receipt.json').read_text())
          manifest=json.loads((p/'sha256_manifest.json').read_text())
          assert hashlib.sha256((p/'pilot_receipt.json').read_bytes()).hexdigest()==manifest['pilot_receipt.json']
          assert report['get_attempts']<=6
          assert report['article_gets']==report['active_wip_writes']==report['automatic_credits']==0
          assert report['PROMOTE']=='OFF' and report['publication_allowed'] is False
          print('WORKAE_ONE_SHOT_PROOF_REHASH_PASS',manifest['pilot_receipt.json'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casualty-workae-six-rss-one-shot
          path: /tmp/workae-rss-pilot
          retention-days: 30
          if-no-files-found: warn
  smoke:
    if: github.ref == 'refs/heads/multicity-wip-2026-09-16'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Self-test baseline onboarding
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/sync_explosion_audited_baseline.py --self-test

      - name: Sync current audited baseline
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/sync_explosion_audited_baseline.py

      - name: Self-test primary candidate monitor and live rebuilder
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/update_explosion_metric_live.py --self-test

      - name: Run primary monitor safely from cached alert bridge
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --local-only
          python scripts/update_explosion_metric_live.py

      - name: Validate dynamic city membership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("kyiv-air-alerts-grafana/data")
          baseline = json.loads((root / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          output = json.loads((root / "explosions_test.json").read_text(encoding="utf-8"))
          seed = json.loads((root / "explosion_daily_alert_seed.json").read_text(encoding="utf-8"))

          expected = set(baseline["cities"])
          assert len(expected) >= 10
          assert set(output["cities"]) == expected
          assert set(seed["cities"]) >= expected
          assert output["meta"]["city_count"] == len(expected)
          assert output["meta"]["schema_version"] == 2
          assert output["meta"]["city_count"] == len(expected)

          for key in expected:
              assert output["cities"][key]["rolling90"], key

          print("Explosion WIP smoke test OK:", len(expected), "audited cities")
          PY

      - name: Simulate onboarding the next audited city
        working-directory: kyiv-air-alerts-grafana
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path("data")
          preview_path = data / "explosion_preview_input.json"
          feed = json.loads((data / "grafana/cities/kropyvnytskyi.json").read_text(encoding="utf-8"))
          preview = json.loads(preview_path.read_text(encoding="utf-8"))
          assert "kropyvnytskyi" not in preview["cities"]
          kpi = feed["kpis"][0]
          preview["cities"]["kropyvnytskyi"] = {
              "label": "Кропивницький",
              "coverage_start": "2025-09-01",
              "coverage_end": kpi["period_end"],
              "alerts_total": 1161,
              "strict": 0,
              "strict_pct": 0,
              "sensitivity": 0,
              "sensitivity_pct": 0,
              "trend_available": True,
              "strict_episode_start_dates": [],
          }
          preview_path.write_text(json.dumps(preview, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python scripts/sync_explosion_audited_baseline.py \
            --dashboard-data data/dashboard_data.json
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/monitor_explosion_candidates.py --local-only
          python scripts/update_explosion_metric_live.py

          python - <<'PY'
          import json
          from pathlib import Path

          data = Path("data")
          baseline = json.loads((data / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          seed = json.loads((data / "explosion_daily_alert_seed.json").read_text(encoding="utf-8"))
          output = json.loads((data / "explosions_test.json").read_text(encoding="utf-8"))
          assert len(baseline["cities"]) == 12
          assert "kropyvnytskyi" in baseline["cities"]
          assert baseline["cities"]["kropyvnytskyi"]["coverage_start"] == "2025-09-01"
          assert baseline["cities"]["kropyvnytskyi"]["total_alerts"] == 1161
          assert set(seed["cities"]) >= set(baseline["cities"])
          assert set(output["cities"]) == set(baseline["cities"])
          assert output["meta"]["city_count"] == 12
          print("Dynamic onboarding simulation OK: audited baseline expands without monitor/workflow edits")
          PY


      - name: Simulate automatic Kyiv and Sevastopol onboarding
        working-directory: kyiv-air-alerts-grafana
        run: |
          git fetch origin site-prod
          git show origin/site-prod:kyiv-air-alerts-grafana/data/dashboard_data.json > /tmp/special-prod-dashboard.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/alerts_combined.json > /tmp/special-prod-kyiv.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/sevastopol_events.json > /tmp/special-prod-sevastopol.json

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          data = Path("data")
          tz = ZoneInfo("Europe/Kyiv")
          preview_path = data / "explosion_preview_input.json"
          preview = json.loads(preview_path.read_text(encoding="utf-8"))

          prod = json.loads(Path("/tmp/special-prod-dashboard.json").read_text(encoding="utf-8"))
          kyiv_feed = prod["cities"]["kyiv"]
          sev_feed = prod["cities"]["sevastopol"]
          kyiv_alerts = json.loads(Path("/tmp/special-prod-kyiv.json").read_text(encoding="utf-8"))
          sev_store = json.loads(Path("/tmp/special-prod-sevastopol.json").read_text(encoding="utf-8"))

          assert "kyiv" not in preview["cities"]
          assert "sevastopol" not in preview["cities"]

          kyiv_end = kyiv_feed["kpis"][0]["period_end"]
          sev_end = sev_feed["kpis"][0]["period_end"]

          def local_start_day(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(tz).date().isoformat()

          kyiv_completed = [
              row for row in kyiv_alerts
              if row.get("start") and row.get("end") and local_start_day(row["start"]) <= kyiv_end
          ]
          sev_completed = [
              row for row in sev_store["pairs"]
              if row.get("start") and row.get("end") and local_start_day(row["start"]) <= sev_end
          ]

          preview["cities"]["kyiv"] = {
              "label": "Київ",
              "coverage_start": min(local_start_day(row["start"]) for row in kyiv_completed),
              "coverage_end": kyiv_end,
              "alerts_total": len(kyiv_completed),
              "strict": 0,
              "strict_pct": 0,
              "sensitivity": 0,
              "sensitivity_pct": 0,
              "trend_available": True,
              "strict_episode_start_dates": [],
          }
          preview["cities"]["sevastopol"] = {
              "label": "Севастополь",
              "coverage_start": sev_store["meta"]["coverage_start"],
              "coverage_end": sev_end,
              "alerts_total": len(sev_completed),
              "strict": 0,
              "strict_pct": 0,
              "sensitivity": 0,
              "sensitivity_pct": 0,
              "trend_available": True,
              "strict_episode_start_dates": [],
          }
          preview_path.write_text(json.dumps(preview, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("simulated Kyiv alerts:", len(kyiv_completed), "Sevastopol alerts:", len(sev_completed))
          PY

          before_count=$(python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("data/explosion_audited_baseline.json").read_text(encoding="utf-8"))
          print(len(x["cities"]))
          PY
          )

          python scripts/sync_explosion_audited_baseline.py \
            --dashboard-data /tmp/special-prod-dashboard.json
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/monitor_explosion_candidates.py \
            --local-only \
            --kyiv-alerts-file /tmp/special-prod-kyiv.json \
            --sevastopol-events-file /tmp/special-prod-sevastopol.json
          python scripts/update_explosion_metric_live.py

          BEFORE_COUNT="$before_count" python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = Path("data")
          before = int(os.environ["BEFORE_COUNT"])
          baseline = json.loads((data / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          seed = json.loads((data / "explosion_daily_alert_seed.json").read_text(encoding="utf-8"))
          output = json.loads((data / "explosions_test.json").read_text(encoding="utf-8"))
          state = json.loads((data / "explosion_candidate_monitor_state.json").read_text(encoding="utf-8"))

          assert len(baseline["cities"]) == before + 2
          assert {"kyiv", "sevastopol"} <= set(baseline["cities"])
          assert {"kyiv", "sevastopol"} <= set(seed["cities"])
          assert {"kyiv", "sevastopol"} <= set(output["cities"])
          assert {"kyiv", "sevastopol"} <= set(state["cities"])

          kyiv_eps = state["cities"]["kyiv"]["episodes"]
          sev_eps = state["cities"]["sevastopol"]["episodes"]
          assert all(ep["alert_source"] == "kyiv_combined_exact_city" for ep in kyiv_eps), kyiv_eps[:1]
          assert all(ep["alert_source"] == "sevastopol_verified_exact_city_pairs" for ep in sev_eps), sev_eps[:1]

          assert output["meta"]["city_count"] == before + 2
          print(
              "Special-source onboarding OK:",
              "Kyiv + Sevastopol added automatically;",
              "active cities =", output["meta"]["city_count"],
          )
          PY

  casualty_workab_offline:
    if: github.ref == 'refs/heads/integration-casualty-workab-shadow-off-2026-11-15' || github.ref == 'refs/heads/integration-casualty-workac-bounded-shadow-off-2026-11-15' || github.ref == 'refs/heads/integration-casualty-workad-url-facts-offline-2026-11-15' || github.ref == 'refs/heads/research-casualty-workae-direct-rss-offline-2026-11-15'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies for existing RSS module (no source-site requests)
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Direct RSS Work AE offline integration (no network)
        if: github.ref == 'refs/heads/research-casualty-workae-direct-rss-offline-2026-11-15'
        run: |
          python -m unittest discover -s research/casualty_workae_direct_rss_2026_11_15 -p 'test_workae.py' -v
          python - <<'PY'
          import hashlib, json, os, pathlib
          out=pathlib.Path("/tmp/workae")
          out.mkdir(parents=True,exist_ok=True)
          proof={"head_sha":os.environ["GITHUB_SHA"],"source_http_gets":0,
                 "real_rss_coverage_measured":False,"source_fixtures":"synthetic",
                 "new_cards_credited":0,"PROMOTE":"OFF","publication_allowed":False,
                 "rss_get_budget":23,"article_get_budget":10,"live_wip_touched":False}
          b=json.dumps(proof,sort_keys=True,indent=2).encode()
          (out/"offline_proof.json").write_bytes(b)
          (out/"sha256_manifest.json").write_text(json.dumps({"offline_proof.json":hashlib.sha256(b).hexdigest()},indent=2))
          assert hashlib.sha256((out/"offline_proof.json").read_bytes()).hexdigest()==json.loads((out/"sha256_manifest.json").read_text())["offline_proof.json"]
          print("WORKAE_OFFLINE_MANIFEST_PASS",os.environ["GITHUB_SHA"])
          PY
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/research-casualty-workae-direct-rss-offline-2026-11-15'
        with:
          name: casualty-workae-direct-rss-offline
          path: /tmp/workae/
          if-no-files-found: error
          retention-days: 30
      - name: Read main promotion guards without mutation
        run: git fetch origin main site-prod
      - name: Restore PREVIOUSLY SAVED Work Z artifact only (no HTTP pilot)
        uses: actions/download-artifact@v4
        with:
          run-id: 43609731091
          name: casualty-workl-approved-three-source-research-only
          path: /tmp/workab-workz
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Two 4-hour shadow cycles, failure recovery, evidence, no source GET
        env:
          WORKAB_WORKZ_DIR: /tmp/workab-workz
          WORKAB_OUT: /tmp/workab
        run: |
          set -euo pipefail
          test ! -e research/casualty_one_time_capture_2026_11_13/launch.json
          python -m unittest discover -s research/casualty_workab_shadow_2026_11_15 -p 'test_workab.py' -v
          if [[ "$GITHUB_REF" == "refs/heads/integration-casualty-workac-bounded-shadow-off-2026-11-15" || "$GITHUB_REF" == "refs/heads/integration-casualty-workad-url-facts-offline-2026-11-15" || "$GITHUB_REF" == "refs/heads/research-casualty-workae-direct-rss-offline-2026-11-15" ]]; then
            WORKAC_OUT=/tmp/workac python -m unittest discover -s research/casualty_workac_shadow_2026_11_15 -p 'test_workac.py' -v
          fi
          if [[ "$GITHUB_REF" == "refs/heads/integration-casualty-workad-url-facts-offline-2026-11-15" || "$GITHUB_REF" == "refs/heads/research-casualty-workae-direct-rss-offline-2026-11-15" ]]; then
            WORKAD_OUT=/tmp/workad python -m unittest discover -s research/casualty_workad_shadow_2026_11_15 -p "test_workad.py" -v
          fi
          git diff --exit-code -- kyiv-air-alerts-grafana/data/casualties/
          test ! -e /tmp/workab/launch.json
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("/tmp/workab")
          a=json.loads((root/"cycles.json").read_text())
          b=json.loads((root/"saved_evidence_summary.json").read_text())
          assert a["head_sha"]==os.environ["GITHUB_SHA"],"HEAD mismatch"
          assert a["external_source_http_requests"]==0
          assert a["cycles"][0]["fixture_cities_retrieved"]==23
          assert a["cycles"][1]["fixture_cities_retrieved"]==22
          assert a["cycles"][2]["new_candidates"]==0
          assert b["source_index_summary"]["total"]==3
          assert b["automatic_credits"]==0

          for p in root.glob("*.json"):
              assert all(k not in p.read_text() for k in ("<html","<!DOCTYPE html","launch.json"))
          if os.environ.get("GITHUB_REF","").endswith(("integration-casualty-workac-bounded-shadow-off-2026-11-15","integration-casualty-workad-url-facts-offline-2026-11-15","research-casualty-workae-direct-rss-offline-2026-11-15")):
              ac=json.loads(pathlib.Path("/tmp/workac/cycles.json").read_text())
              assert ac["external_http"]==0 and ac["automatic_credits"]==0
              assert ac["cards"]==1 and len(ac["cycles"])==3
              (root/"workac_cycles.json").write_text(json.dumps(ac,sort_keys=True,indent=2))
          if os.environ.get("GITHUB_REF","").endswith(("integration-casualty-workad-url-facts-offline-2026-11-15","research-casualty-workae-direct-rss-offline-2026-11-15")):
              ad=json.loads(pathlib.Path("/tmp/workad/workad_results.json").read_text())
              assert ad["exact_head"]==os.environ["GITHUB_SHA"]
              assert ad["source_http_gets"]==0 and ad["automatic_credits"]==0
              assert ad["PROMOTE"]=="OFF" and ad["publication_allowed"] is False
              assert ad["synthetic_url_resolution"]=={"resolved":2,"unresolved":1,"blocked":1}
              assert ad["synthetic_claims"]["cumulative"]==2
              assert ad["saved_t03_t05"]["all_insufficient_evidence"] is True
              (root/"workad_results.json").write_text(json.dumps(ad,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob("*.json")}
          (root/"sha256_manifest.json").write_text(json.dumps(hashes,indent=2,sort_keys=True)+"\n")
          verified=json.loads((root/"sha256_manifest.json").read_text())
          assert len(verified)>=3
          for name,want in verified.items():
              assert (root/name).is_file()
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==want,name
          print("WORKAC_INNER_MANIFEST_REHASH_PASS",len(verified))
          print("WORKAB_EXACT_HEAD_OFFLINE_PASS",os.environ["GITHUB_SHA"],hashes)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casualty-workab-workac-workad-offline
          path: /tmp/workab/
          if-no-files-found: warn
          retention-days: 30
