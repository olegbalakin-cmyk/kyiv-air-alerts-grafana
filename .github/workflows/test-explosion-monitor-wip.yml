name: Test explosion monitor WIP

on:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/update_explosion_metric_live.py"
      - "kyiv-air-alerts-grafana/scripts/sync_explosion_audited_baseline.py"
      - "kyiv-air-alerts-grafana/data/explosion_audited_baseline.json"
      - "kyiv-air-alerts-grafana/data/explosion_daily_alert_seed.json"
      - "kyiv-air-alerts-grafana/data/explosion_preview_input.json"
      - ".github/workflows/test-explosion-monitor-wip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Self-test baseline onboarding
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/sync_explosion_audited_baseline.py --self-test

      - name: Sync current audited baseline
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/sync_explosion_audited_baseline.py

      - name: Self-test primary candidate monitor and live rebuilder
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/update_explosion_metric_live.py --self-test

      - name: Run primary monitor safely from cached alert bridge
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --local-only
          python scripts/update_explosion_metric_live.py

      - name: Validate dynamic city membership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("kyiv-air-alerts-grafana/data")
          baseline = json.loads((root / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          output = json.loads((root / "explosions_test.json").read_text(encoding="utf-8"))
          seed = json.loads((root / "explosion_daily_alert_seed.json").read_text(encoding="utf-8"))

          expected = set(baseline["cities"])
          assert len(expected) >= 10
          assert set(output["cities"]) == expected
          assert set(seed["cities"]) >= expected
          assert output["meta"]["city_count"] == len(expected)
          assert output["meta"]["schema_version"] == 2
          assert output["meta"]["city_count"] == len(expected)

          for key in expected:
              assert output["cities"][key]["rolling90"], key

          print("Explosion WIP smoke test OK:", len(expected), "audited cities")
          PY

      - name: Simulate onboarding the next audited city
        working-directory: kyiv-air-alerts-grafana
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path("data")
          preview_path = data / "explosion_preview_input.json"
          feed = json.loads((data / "grafana/cities/kropyvnytskyi.json").read_text(encoding="utf-8"))
          preview = json.loads(preview_path.read_text(encoding="utf-8"))
          assert "kropyvnytskyi" not in preview["cities"]
          kpi = feed["kpis"][0]
          preview["cities"]["kropyvnytskyi"] = {
              "label": "Кропивницький",
              "coverage_start": "2025-09-01",
              "coverage_end": kpi["period_end"],
              "alerts_total": 1161,
              "strict": 0,
              "strict_pct": 0,
              "sensitivity": 0,
              "sensitivity_pct": 0,
              "trend_available": True,
              "strict_episode_start_dates": [],
          }
          preview_path.write_text(json.dumps(preview, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python scripts/sync_explosion_audited_baseline.py \
            --dashboard-data data/dashboard_data.json
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/monitor_explosion_candidates.py --local-only
          python scripts/update_explosion_metric_live.py

          python - <<'PY'
          import json
          from pathlib import Path

          data = Path("data")
          baseline = json.loads((data / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          seed = json.loads((data / "explosion_daily_alert_seed.json").read_text(encoding="utf-8"))
          output = json.loads((data / "explosions_test.json").read_text(encoding="utf-8"))
          assert len(baseline["cities"]) == 12
          assert "kropyvnytskyi" in baseline["cities"]
          assert baseline["cities"]["kropyvnytskyi"]["coverage_start"] == "2025-09-01"
          assert baseline["cities"]["kropyvnytskyi"]["total_alerts"] == 1161
          assert set(seed["cities"]) >= set(baseline["cities"])
          assert set(output["cities"]) == set(baseline["cities"])
          assert output["meta"]["city_count"] == 12
          print("Dynamic onboarding simulation OK: audited baseline expands without monitor/workflow edits")
          PY


      - name: Simulate automatic Kyiv and Sevastopol onboarding
        working-directory: kyiv-air-alerts-grafana
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          data = Path("data")
          tz = ZoneInfo("Europe/Kyiv")
          preview_path = data / "explosion_preview_input.json"
          preview = json.loads(preview_path.read_text(encoding="utf-8"))

          kyiv_feed = json.loads((data / "grafana/cities/kyiv.json").read_text(encoding="utf-8"))
          sev_feed = json.loads((data / "grafana/cities/sevastopol.json").read_text(encoding="utf-8"))
          kyiv_alerts = json.loads((data / "alerts_combined.json").read_text(encoding="utf-8"))
          sev_store = json.loads((data / "sevastopol_events.json").read_text(encoding="utf-8"))

          assert "kyiv" not in preview["cities"]
          assert "sevastopol" not in preview["cities"]

          kyiv_end = kyiv_feed["kpis"][0]["period_end"]
          sev_end = sev_feed["kpis"][0]["period_end"]

          def local_start_day(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(tz).date().isoformat()

          kyiv_completed = [
              row for row in kyiv_alerts
              if row.get("start") and row.get("end") and local_start_day(row["start"]) <= kyiv_end
          ]
          sev_completed = [
              row for row in sev_store["pairs"]
              if row.get("start") and row.get("end") and local_start_day(row["start"]) <= sev_end
          ]

          preview["cities"]["kyiv"] = {
              "label": "Київ",
              "coverage_start": min(local_start_day(row["start"]) for row in kyiv_completed),
              "coverage_end": kyiv_end,
              "alerts_total": len(kyiv_completed),
              "strict": 0,
              "strict_pct": 0,
              "sensitivity": 0,
              "sensitivity_pct": 0,
              "trend_available": True,
              "strict_episode_start_dates": [],
          }
          preview["cities"]["sevastopol"] = {
              "label": "Севастополь",
              "coverage_start": sev_store["meta"]["coverage_start"],
              "coverage_end": sev_end,
              "alerts_total": len(sev_completed),
              "strict": 0,
              "strict_pct": 0,
              "sensitivity": 0,
              "sensitivity_pct": 0,
              "trend_available": True,
              "strict_episode_start_dates": [],
          }
          preview_path.write_text(json.dumps(preview, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("simulated Kyiv alerts:", len(kyiv_completed), "Sevastopol alerts:", len(sev_completed))
          PY

          before_count=$(python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("data/explosion_audited_baseline.json").read_text(encoding="utf-8"))
          print(len(x["cities"]))
          PY
          )

          python scripts/sync_explosion_audited_baseline.py \
            --dashboard-data data/dashboard_data.json
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/monitor_explosion_candidates.py \
            --local-only \
            --kyiv-alerts-file data/alerts_combined.json \
            --sevastopol-events-file data/sevastopol_events.json
          python scripts/update_explosion_metric_live.py

          BEFORE_COUNT="$before_count" python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = Path("data")
          before = int(os.environ["BEFORE_COUNT"])
          baseline = json.loads((data / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          seed = json.loads((data / "explosion_daily_alert_seed.json").read_text(encoding="utf-8"))
          output = json.loads((data / "explosions_test.json").read_text(encoding="utf-8"))
          state = json.loads((data / "explosion_candidate_monitor_state.json").read_text(encoding="utf-8"))

          assert len(baseline["cities"]) == before + 2
          assert {"kyiv", "sevastopol"} <= set(baseline["cities"])
          assert {"kyiv", "sevastopol"} <= set(seed["cities"])
          assert {"kyiv", "sevastopol"} <= set(output["cities"])
          assert {"kyiv", "sevastopol"} <= set(state["cities"])

          kyiv_eps = state["cities"]["kyiv"]["episodes"]
          sev_eps = state["cities"]["sevastopol"]["episodes"]
          assert all(ep["alert_source"] == "kyiv_combined_exact_city" for ep in kyiv_eps), kyiv_eps[:1]
          assert all(ep["alert_source"] == "sevastopol_verified_exact_city_pairs" for ep in sev_eps), sev_eps[:1]

          assert output["meta"]["city_count"] == before + 2
          print(
              "Special-source onboarding OK:",
              "Kyiv + Sevastopol added automatically;",
              "active cities =", output["meta"]["city_count"],
          )
          PY
