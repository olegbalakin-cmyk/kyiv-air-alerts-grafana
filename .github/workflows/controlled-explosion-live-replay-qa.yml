name: Controlled explosion live replay QA

on:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - ".github/workflows/controlled-explosion-live-replay-qa.yml"

concurrency:
  group: controlled-explosion-live-replay-qa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  replay-normal-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Get production alert inputs
        run: |
          git fetch origin site-prod
          git show origin/site-prod:kyiv-air-alerts-grafana/data/alerts_combined.json > /tmp/prod-kyiv-alerts.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/sevastopol_events.json > /tmp/prod-sevastopol-events.json

      - name: Record frozen baseline hash
        run: sha256sum kyiv-air-alerts-grafana/data/explosion_audited_baseline.json > /tmp/baseline.sha256

      - name: Self-test hardened monitor and live metric
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/update_explosion_metric_live.py --self-test

      - name: Run normal hardened monitor once
        working-directory: kyiv-air-alerts-grafana
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        run: |
          python scripts/monitor_explosion_candidates.py             --kyiv-alerts-file /tmp/prod-kyiv-alerts.json             --sevastopol-events-file /tmp/prod-sevastopol-events.json

      - name: Propagate live metric through generator
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/update_explosion_metric_live.py

      - name: Validate replay invariants
        run: |
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path

          root = Path("kyiv-air-alerts-grafana/data")
          queue = json.loads((root / "explosion_review_queue.json").read_text(encoding="utf-8"))
          state = json.loads((root / "explosion_candidate_monitor_state.json").read_text(encoding="utf-8"))
          live = json.loads((root / "explosions_test.json").read_text(encoding="utf-8"))
          report = json.loads((root / "explosion_candidate_monitor_last_run.json").read_text(encoding="utf-8"))
          baseline = root / "explosion_audited_baseline.json"

          old_hash = Path("/tmp/baseline.sha256").read_text().split()[0]
          new_hash = hashlib.sha256(baseline.read_bytes()).hexdigest()
          assert old_hash == new_hash, (old_hash, new_hash)

          ids = [str(x.get("candidate_id") or "") for x in queue if x.get("candidate_id")]
          assert len(ids) == len(set(ids)), "duplicate candidate IDs"

          ep_ids = {
              str(ep.get("episode_id"))
              for c in (state.get("cities") or {}).values()
              for ep in (c.get("episodes") or [])
              if ep.get("episode_id")
          }
          approved = [x for x in queue if x.get("status") in {"approved_strict", "approved_sensitivity"}]
          broken = [x.get("candidate_id") for x in approved if not x.get("matched_episode_id") or str(x.get("matched_episode_id")) not in ep_ids]
          assert not broken, broken

          strict = {str(x["matched_episode_id"]) for x in queue if x.get("status") == "approved_strict" and x.get("matched_episode_id")}
          sensitivity = {str(x["matched_episode_id"]) for x in approved if x.get("matched_episode_id")}
          assert strict <= sensitivity

          assert len(state.get("cities") or {}) == 23
          assert live["meta"]["city_count"] == 23
          assert report["city_count"] == 23
          assert report["unchecked_due_checks_at_cutoff"] == 0
          assert report["checked_due_checks_at_cutoff"] == report["due_checks_at_cutoff"]

          print(json.dumps({
              "ok": report.get("ok"),
              "errors": report.get("errors"),
              "new_candidates": report.get("new_review_candidates"),
              "matching_refresh": report.get("matching_refresh"),
              "queue_size": len(queue),
              "status_counts": Counter(x.get("status") for x in queue),
              "approved_records": len(approved),
              "strict_unique_episode_ids": len(strict),
              "sensitivity_unique_episode_ids": len(sensitivity),
              "duplicate_candidate_ids": 0,
              "broken_matched_episode_id": 0,
              "city_count": 23,
              "baseline_unchanged": True,
          }, ensure_ascii=False, indent=2, default=dict))
          PY

      - name: Commit normal-run data outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json             kyiv-air-alerts-grafana/data/explosion_review_queue.json             kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json             kyiv-air-alerts-grafana/data/explosions_test.json             kyiv-air-alerts-grafana/data/dashboard_data.json
          if git diff --cached --quiet; then
            echo "No normal-run data changes"
            exit 0
          fi
          git commit -m "data: validate hardened explosion monitor live run"
          git fetch origin multicity-wip-2026-09-16
          git rebase origin/multicity-wip-2026-09-16
          git push origin HEAD:multicity-wip-2026-09-16
