name: RSS temporal syntax-gap target probe

on:
  push:
    branches:
      - rss-temporal-syntax-gap-repair-2026-10-05
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FROZEN_ARTIFACT_ID: "11329769176"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert probe-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 57e3bf8ca3ea2ec468be1aad7352cd91aaa4b36b...HEAD | sort
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB env: $key"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install existing requirements
        run: python -m pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Download frozen 228-candidate source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/syntax-probe
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID/zip" > /tmp/syntax-probe/frozen.zip
          unzip -q /tmp/syntax-probe/frozen.zip -d /tmp/syntax-probe
          test -s /tmp/syntax-probe/rss_temporal_audit_context_retention.json

      - name: Run monitor self-test and temporal parser tests
        working-directory: kyiv-air-alerts-grafana
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monitor_explosion_candidates.py --self-test
          python -m pytest -q tests/test_rss_temporal_syntax_gap.py tests/test_kyiv_temporal_clock_parser.py tests/test_kyiv_temporal_representation.py

      - name: Audit syntax recognizer delta across all 228 retained contexts
        shell: bash
        run: |
          set -euo pipefail
          git show 57e3bf8ca3ea2ec468be1aad7352cd91aaa4b36b:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py > /tmp/syntax-probe/monitor_before.py
          python - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path

          root = Path("kyiv-air-alerts-grafana").resolve()
          sys.path.insert(0, str(root / "scripts"))
          import monitor_explosion_candidates as after

          spec = importlib.util.spec_from_file_location("monitor_before", "/tmp/syntax-probe/monitor_before.py")
          before = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(before)

          doc = json.loads(Path("/tmp/syntax-probe/rss_temporal_audit_context_retention.json").read_text(encoding="utf-8"))
          delta = []
          for row in doc["candidate_level_durability_ledger"]:
              changed = []
              for ctx in row.get("audit_contexts") or []:
                  text = str(ctx.get("source_excerpt") or "")
                  old = before.event_clock_mentions(text)
                  new = after.event_clock_mentions(text)
                  if old != new:
                      changed.append({"context_id": ctx.get("context_id"), "before": old, "after": new, "text": text})
              if changed:
                  delta.append({"candidate_id": row["candidate_id"], "city": row["city"], "changed_contexts": changed})
          Path("/tmp/syntax-probe/recognizer_delta.json").write_text(json.dumps(delta, ensure_ascii=False, indent=2)+"\\n", encoding="utf-8")
          print("RECOGNIZER_DELTA_COUNT="+str(len(delta)))
          print(json.dumps(delta, ensure_ascii=False))
          PY

      - name: Extract only seven frozen syntax targets
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/rss_temporal_syntax_gap_probe.py \
            /tmp/syntax-probe/rss_temporal_audit_context_retention.json \
            /tmp/syntax-probe/rss_temporal_syntax_gap_targets.json

      - name: Upload target probe
        uses: actions/upload-artifact@v4
        with:
          name: rss-temporal-syntax-gap-target-probe
          path: |
            /tmp/syntax-probe/rss_temporal_syntax_gap_targets.json
            /tmp/syntax-probe/recognizer_delta.json
          if-no-files-found: error
          retention-days: 7
