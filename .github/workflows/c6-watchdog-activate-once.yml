name: C6 isolated watchdog ACTIVATE - one shot
on:
  push:
    branches: [ops/c6-watchdog-activate-20261122]
    paths:
      - .github/workflows/c6-watchdog-activate-once.yml
permissions:
  contents: read
jobs:
  activate-isolated-watchdog-only:
    if: github.actor == 'olegbalakin-cmyk'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WATCHDOG_SITE_ID: 4370af81-4ccf-485c-8e43-5a9184ee7565
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check external scheduler guards (never execute C2)
        run: |
          set -euo pipefail
          test "$WATCHDOG_SITE_ID" = "4370af81-4ccf-485c-8e43-5a9184ee7565"
          test -s ops/c6-backup-scheduler/netlify/functions/c6-backup.mjs
          test -s ops/c6-backup-scheduler/netlify.toml
          test -n "$NETLIFY_AUTH_TOKEN"
          node --check ops/c6-backup-scheduler/netlify/functions/c6-backup.mjs
          node --test ops/c6-backup-scheduler/tests/c6-backup.test.mjs
          echo "C6_WATCHDOG_ACTIVATION_PREFLIGHT_PASS"
      - name: Deploy to isolated watchdog project only (never website)
        working-directory: ops/c6-backup-scheduler
        run: |
          set -euo pipefail
          npx --yes netlify-cli@23.8.1 deploy \
            --prod --no-build --dir public --functions netlify/functions \
            --site "$WATCHDOG_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "C6 independent backup watchdog owner-token activation 2026-11-22" \
            --json > "$RUNNER_TEMP/watchdog-activation.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"watchdog-activation.json").read_text())
          deploy_id=report.get("deploy_id") or report.get("id")
          assert isinstance(deploy_id,str) and len(deploy_id)==24
          print("C6_WATCHDOG_SEPARATE_DEPLOY_COMPLETED",deploy_id)
          PY
