name: Unit A A5 explicitly authorized atomic execution
on:
  push:
    branches:
      - attack-event-unit-a-a5-authorized-execution-2026-10-10
    paths:
      - .github/workflows/attack-event-unit-a-a5-authorized-execution.yml
permissions:
  contents: write
jobs:
  a5-atomic-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify coordination base and fetch frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 6a47d703a7bd4f236767fc39642c723c01aadf42)" = 6a47d703a7bd4f236767fc39642c723c01aadf42
          for sha in             107f0f3ca96d6480e26ec66df70058943ba0f7cb             1b93d94cf9a11fd71b55483d9da0b443b954e25c             36a5989229ed5c1ad1cd07fbb61df5033af22681; do
            git fetch --no-tags origin "$sha"
          done
          git show 107f0f3ca96d6480e26ec66df70058943ba0f7cb:.github/proof/attack_event_unit_a_a5_current_state_revalidation.py > /tmp/unit_a_a5_reval.py
          test "$(sha256sum /tmp/unit_a_a5_reval.py | cut -d' ' -f1)" != ""

      - name: Install bounded Postgres driver
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'

      - name: Execute explicitly authorized atomic A5
        shell: bash
        env:
          PHASE1_PROD_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          PHASE1_PROD_SHADOW_BRANCH_ID: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          UNIT_A_A5_EXPLICIT_AUTHORIZATION: "YES"
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          python3 -B .github/proof/attack_event_unit_a_a5_authorized_execution.py

      - name: Freeze result and remove execution infrastructure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact=research/attack_event_execution_unit_a_a5_authorized_execution_2026-10-10.json
          if ! test -f "$artifact"; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/attack_event_execution_unit_a_a5_authorized_execution_2026-10-10.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
            "schema_version":1,
            "kind":"unit_a_a5_authorized_execution",
            "verdict":"A5_EXECUTION_RUNNER_FAILED_BEFORE_RESULT",
            "A5_AUTHORIZED":"YES",
            "A5_EXECUTED":"UNKNOWN",
            "A5_EXECUTION_GATE":"NOT_RECORDED",
            "first_failure":"RUNNER_FAILED_BEFORE_ARTIFACT",
            "production_mutation":"UNKNOWN",
            "site_prod_mutation":"NO"
          }, sort_keys=True, indent=2)+"\n")
          PY
          fi

          python3 - <<'PY'
          import json
          p="research/attack_event_execution_unit_a_a5_authorized_execution_2026-10-10.json"
          r=json.load(open(p))
          assert r["A5_AUTHORIZED"]=="YES"
          assert r["A5_EXECUTION_GATE"] in ("PASS","FAIL","POSTCOMMIT_PROOF_INCOMPLETE","NOT_RECORDED")
          if r["A5_EXECUTION_GATE"]=="PASS":
              assert r["A5_EXECUTED"]=="YES"
              assert r["writes"]=={"classifications":1713,"sources":1559,"events":10,"total":3282}
              assert r["precommit_readback"]["mismatch_count"]==0
              assert r["postcommit_readback"]["mismatch_count"]==0
              assert r["idempotency"]["future_mutations"]==0
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze explicitly authorized Unit A A5 atomic execution result"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          echo "ARTIFACT_SHA256=$(sha256sum "$artifact" | cut -d' ' -f1)"
          before="$(git hash-object "$artifact")"

          rm -f .github/proof/attack_event_unit_a_a5_authorized_execution.py
          rm -f .github/workflows/attack-event-unit-a-a5-authorized-execution.yml
          git add -A .github/proof/attack_event_unit_a_a5_authorized_execution.py .github/workflows/attack-event-unit-a-a5-authorized-execution.yml
          git commit -m "Remove temporary Unit A A5 execution harness and workflow"
          test "$before" = "$(git hash-object "$artifact")"
          test "$(git diff --name-status 6a47d703a7bd4f236767fc39642c723c01aadf42..HEAD)" = "$(printf 'A\tresearch/attack_event_execution_unit_a_a5_authorized_execution_2026-10-10.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "WORKFLOW_REMOVED=YES"
          echo "HARNESS_REMOVED=YES"
          git push origin HEAD:attack-event-unit-a-a5-authorized-execution-2026-10-10

          python3 - <<'PY'
          import json, sys
          r=json.load(open("research/attack_event_execution_unit_a_a5_authorized_execution_2026-10-10.json"))
          if r["A5_EXECUTION_GATE"] != "PASS":
              sys.exit(1)
          PY
