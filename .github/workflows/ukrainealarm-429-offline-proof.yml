name: Isolated UkraineAlarm 429 repair offline proof
on:
  push:
    branches:
      - repair-ukrainealarm-429-2026-10-14
    paths:
      - "kyiv-air-alerts-grafana/scripts/ukrainealarm_request_policy.py"
      - "kyiv-air-alerts-grafana/scripts/apply_ukrainealarm_bridge.py"
      - "kyiv-air-alerts-grafana/scripts/differentiated_alert_source_capture.py"
      - "kyiv-air-alerts-grafana/tests/test_ukrainealarm_retry_policy.py"
      - ".github/workflows/ukrainealarm-429-offline-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ukrainealarm-429-offline-repair-proof
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile modified scripts
        run: python -m py_compile scripts/ukrainealarm_request_policy.py scripts/apply_ukrainealarm_bridge.py scripts/differentiated_alert_source_capture.py
      - name: Offline policy and affected regression tests
        env:
          UKRAINEALARM_API_TOKEN: ""
        run: |
          python -m unittest discover -s tests -p 'test_ukrainealarm_retry_policy.py' -v
          python -m pytest -q tests/test_ukrainealarm_bridge_dedup.py tests/test_update_fallback.py
          python scripts/validate_bridge_checkpoint.py self-test
      - name: Verify no sensitive mutation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "offline proof only; no API credentials, site-prod, publication, DB or deploy"
