name: sixcity-proof-temp

on:
  push:
    branches:
      - historical-replay-sixcity-evidence-normalization-proof-2026-09-29
    paths:
      - .github/workflows/sixcity-proof-temp.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests beautifulsoup4
      - name: Execute six-city proof
        env:
          BASE_SHA: bdc0188020aa39cc8164ff58218e6aac4868f54b
        run: |
          set -u
          APP="$GITHUB_WORKSPACE/kyiv-air-alerts-grafana"
          mkdir -p /tmp/sixcity-proof/current /tmp/sixcity-proof/base
          cd "$APP"

          python scripts/replay_explosion_history.py --self-test > /tmp/sixcity-proof/replay_selftest.log 2>&1
          SELFTEST_RC=$?

          shopt -s nullglob
          TESTS=(tests/test_historical_replay_*.py)
          if [ ${#TESTS[@]} -gt 0 ]; then
            python -m pytest -q "${TESTS[@]}" > /tmp/sixcity-proof/inherited_tests.log 2>&1
            INHERITED_RC=$?
          else
            echo "NO_MATCHING_TEST_FILES" > /tmp/sixcity-proof/inherited_tests.log
            INHERITED_RC=127
          fi

          TARGETS=(zhytomyr uzhhorod chernivtsi ivano_frankivsk khmelnytskyi lutsk)
          for city in "${TARGETS[@]}"; do
            python scripts/replay_explosion_history.py --repo-root "$APP" --city "$city" --through 2026-09-17 --output "/tmp/sixcity-proof/current/$city.json" --input-head "$GITHUB_SHA" > "/tmp/sixcity-proof/current/$city.log" 2>&1
            echo $? > "/tmp/sixcity-proof/current/$city.rc"
          done

          git -C "$GITHUB_WORKSPACE" worktree add --detach /tmp/sixcity-proof/base-checkout "$BASE_SHA"
          BASE_APP="/tmp/sixcity-proof/base-checkout/kyiv-air-alerts-grafana"
          NONTARGETS=(dnipro lviv sevastopol sumy cherkasy chernihiv kropyvnytskyi kyiv zaporizhzhia)
          for city in "${NONTARGETS[@]}"; do
            python "$APP/scripts/replay_explosion_history.py" --repo-root "$APP" --city "$city" --through 2026-09-17 --output "/tmp/sixcity-proof/current/non_target_$city.json" --input-head "$GITHUB_SHA" > "/tmp/sixcity-proof/current/non_target_$city.log" 2>&1
            echo $? > "/tmp/sixcity-proof/current/non_target_$city.rc"
            python "$BASE_APP/scripts/replay_explosion_history.py" --repo-root "$BASE_APP" --city "$city" --through 2026-09-17 --output "/tmp/sixcity-proof/base/non_target_$city.json" --input-head "$BASE_SHA" > "/tmp/sixcity-proof/base/non_target_$city.log" 2>&1
            echo $? > "/tmp/sixcity-proof/base/non_target_$city.rc"
          done

          SELFTEST_RC="$SELFTEST_RC" INHERITED_RC="$INHERITED_RC" APP="$APP" BASE_SHA="$BASE_SHA" PROOF_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os, pathlib, subprocess
          tmp=pathlib.Path("/tmp/sixcity-proof")
          expected={
            "zhytomyr":(685,19,20),
            "uzhhorod":(92,1,1),
            "chernivtsi":(113,2,2),
            "ivano_frankivsk":(103,6,6),
            "khmelnytskyi":(248,11,12),
            "lutsk":(135,12,12),
          }
          target={}
          for city,(den,st,se) in expected.items():
            p=tmp/"current"/f"{city}.json"
            rc=int((tmp/"current"/f"{city}.rc").read_text())
            row={"rc":rc,"output_present":p.exists()}
            if p.exists():
              j=json.loads(p.read_text())
              row.update({
                "status":j.get("status"),
                "episodes_checked":j.get("episodes_checked"),
                "canonicalized_legacy_strict_episodes":j.get("canonicalized_legacy_strict_episodes"),
                "replayed_strict_episodes":j.get("replayed_strict_episodes"),
                "canonicalized_legacy_sensitivity_episodes":j.get("canonicalized_legacy_sensitivity_episodes"),
                "replayed_sensitivity_episodes":j.get("replayed_sensitivity_episodes"),
                "errors":j.get("errors"),
                "changed_episodes":j.get("changed_episodes"),
                "strict_episode_identity":j.get("strict_episode_identity"),
                "unbound_review_evidence":j.get("unbound_review_evidence"),
                "source_status":(j.get("source_validation") or {}).get("source_status"),
                "frozen_strict_ids":((j.get("source_validation") or {}).get("evidence_validation") or {}).get("frozen_strict_ids"),
                "frozen_sensitivity_ids":((j.get("source_validation") or {}).get("evidence_validation") or {}).get("frozen_sensitivity_ids"),
              })
              row["expected_match"]=(
                rc==0 and j.get("episodes_checked")==den
                and j.get("canonicalized_legacy_strict_episodes")==st
                and j.get("replayed_strict_episodes")==st
                and j.get("canonicalized_legacy_sensitivity_episodes")==se
                and j.get("replayed_sensitivity_episodes")==se
                and not j.get("errors")
                and not j.get("changed_episodes")
              )
            else:
              row["expected_match"]=False
              log=tmp/"current"/f"{city}.log"
              row["log_tail"]=log.read_text(errors="replace")[-4000:] if log.exists() else ""
            target[city]=row

          fields=["status","episodes_checked","replayed_strict_episodes","replayed_sensitivity_episodes",
                  "changed_episodes","errors","strict_episode_identity","reconciliation_events",
                  "accepted_evidence_backed_upgrades"]
          non_target={}
          for city in ["dnipro","lviv","sevastopol","sumy","cherkasy","chernihiv","kropyvnytskyi","kyiv","zaporizhzhia"]:
            cp=tmp/"current"/f"non_target_{city}.json"
            bp=tmp/"base"/f"non_target_{city}.json"
            crc=int((tmp/"current"/f"non_target_{city}.rc").read_text())
            brc=int((tmp/"base"/f"non_target_{city}.rc").read_text())
            entry={"proof_rc":crc,"base_rc":brc,"proof_present":cp.exists(),"base_present":bp.exists()}
            if cp.exists() and bp.exists():
              cj=json.loads(cp.read_text()); bj=json.loads(bp.read_text())
              diffs={k:{"base":bj.get(k),"proof":cj.get(k)} for k in fields if bj.get(k)!=cj.get(k)}
              entry["classification_map_equal"]=not diffs and crc==brc
              entry["diffs"]=diffs
            else:
              entry["classification_map_equal"]=False
            non_target[city]=entry

          app=pathlib.Path(os.environ["APP"])
          changed=subprocess.check_output(["git","-C",str(app.parent),"diff","--name-only",os.environ["BASE_SHA"],os.environ["PROOF_SHA"]],text=True).splitlines()
          allowed={f"kyiv-air-alerts-grafana/data/explosion_research/{c}/final_evidence.json" for c in expected}
          allowed.add(".github/workflows/sixcity-proof-temp.yml")
          result={
            "schema_version":1,
            "kind":"sixcity_execution_result_temp",
            "base_sha":os.environ["BASE_SHA"],
            "proof_execution_sha":os.environ["PROOF_SHA"],
            "replay_self_test":{"rc":int(os.environ["SELFTEST_RC"]),"log":(tmp/"replay_selftest.log").read_text(errors="replace")[-6000:]},
            "inherited_historical_replay_tests":{"rc":int(os.environ["INHERITED_RC"]),"log":(tmp/"inherited_tests.log").read_text(errors="replace")[-12000:]},
            "targets":target,
            "aggregate":{
              "denominator":sum(v[0] for v in expected.values()),
              "strict":sum(v[1] for v in expected.values()),
              "sensitivity":sum(v[2] for v in expected.values()),
              "all_target_expected_match":all(x.get("expected_match") for x in target.values()),
            },
            "non_target_regression":non_target,
            "unexpected_non_target_episode_deltas":sum(not x.get("classification_map_equal") for x in non_target.values()),
            "changed_paths":changed,
            "file_scope_guard_pass":set(changed)<=allowed,
          }
          out=app/"research"/"sixcity_execution_result_temp.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result["aggregate"],indent=2))
          print("unexpected_non_target_episode_deltas",result["unexpected_non_target_episode_deltas"])
          print("file_scope_guard_pass",result["file_scope_guard_pass"])
          PY

          cd "$GITHUB_WORKSPACE"
          git config user.name "sixcity-proof-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/research/sixcity_execution_result_temp.json
          git commit -m "Record six-city executable proof result"
          git push origin HEAD:historical-replay-sixcity-evidence-normalization-proof-2026-09-29
