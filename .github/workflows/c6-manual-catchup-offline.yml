name: C6 manual catch-up guard offline (no publish)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-netlify-site.yml"
      - ".github/workflows/c6-manual-catchup-offline.yml"
      - "tests/test_c6_manual_catchup.py"
  push:
    branches: [fix-c6-manual-catchup-20261120]
    paths:
      - ".github/workflows/update-netlify-site.yml"
      - ".github/workflows/c6-manual-catchup-offline.yml"
      - "tests/test_c6_manual_catchup.py"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Guarded manual catch-up contract (no Neon, sources, Git write, or Netlify)
        run: python -m unittest discover -s tests -p test_c6_manual_catchup.py -v
