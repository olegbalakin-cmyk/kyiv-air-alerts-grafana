                  "single_anomaly_condition_identified": "PASS",
                  "single_anomaly_affected_source_links": 1,
                  "lossless_availability_raw_representation": "PASS",
                  "source_identity_changed": "NO",
                  "post_delta_exhaustive_offline_representability": "PASS",
                  "remaining_representability_gaps": 0,
                  "classification_identity_change": "NO",
                  "event_identity_change": "NO",
                  "source_link_identity_change": "NO",
                  "neon_queries": 0,
                  "db_writes": 0,
                  "production_mutation": "NO",
              }
              result["safe_continuation_point"] = "rerun STEP 2C rollback-only persistence proof against this five-contract effective schema in a separate task"
              result["status"] = "FROZEN"
              result["verdict"] = "ATTACK-EVENT PERSISTENCE AVAILABILITY COMPLETION ADDENDUM FROZEN"

              OUT.parent.mkdir(parents=True, exist_ok=True)
              OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print("VERDICT=" + result["verdict"])
              print("SOURCE_TYPE_MATERIALIZED=" + str(source_type_counts["MATERIALIZED"]))
              print("SOURCE_TYPE_UNMATERIALIZED=" + str(source_type_counts["UNMATERIALIZED_IN_ACCEPTED_SOURCE"]))
              print("ANOMALY_CATEGORY=" + anomaly["primary_category"])
              print("ANOMALY_SOURCE_LINK_PREFIX=" + anomaly["source_link_key"][:16])
              print("POST_DDL_SHA256=" + result["post_addendum_effective_candidate_ddl_sha256"])
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("pass=true\n")
                  f.write("artifact_path=" + str(OUT) + "\n")

          except Blocked as e:
              result["first_failing_gate"] = e.gate
              result["affected_table"] = e.table
              result["affected_field"] = e.field
              result["affected_count"] = e.count
              result["detail"] = e.detail
              result["remaining_representability_gaps"] = (e.gaps or [])[:10]
              result["snapshot_sha_intact"] = result.get("frozen_snapshot", {}).get("verified_sha256") == SNAPSHOT["sha256"]
              result["safe_continuation_point"] = "fix proof/addendum only from the first failing gate; do not rerun STEP 2C or query Neon"
              diag = Path("research/attack_event_persistence_availability_completion_addendum_blocked.json")
              diag.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print("VERDICT=" + result["verdict"])
              print("FIRST_FAILING_GATE=" + e.gate)
              print("BLOCKED_DIAGNOSTIC=" + str(diag))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("pass=false\n")
                  f.write("diagnostic_path=" + str(diag) + "\n")
          PY

      - name: Commit durable artifact
        if: steps.audit.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/attack_event_persistence_availability_completion_addendum_2026-10-05.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT"
          git commit -m "Freeze attack-event persistence availability completion addendum"
          git push origin HEAD:attack-event-persistence-availability-completion-addendum-2026-10-05
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$OUT)"
          echo "ARTIFACT_SHA256=$(sha256sum "$OUT" | awk '{print $1}')"

      - name: Commit bounded blocked diagnostic
        if: steps.audit.outputs.pass == 'false'
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/attack_event_persistence_availability_completion_addendum_blocked.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT"
          git commit -m "Record blocked persistence availability completion diagnostic"
          git push origin HEAD:attack-event-persistence-availability-completion-addendum-2026-10-05

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-persistence-availability-completion-addendum-proof
          path: |
            research/attack_event_persistence_availability_completion_addendum_2026-10-05.json
            research/attack_event_persistence_availability_completion_addendum_blocked.json
          if-no-files-found: ignore
