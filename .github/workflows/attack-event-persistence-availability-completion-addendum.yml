name: Attack-event persistence availability completion addendum

on:
  push:
    branches:
      - attack-event-persistence-availability-completion-addendum-2026-10-05
    paths:
      - .github/workflows/attack-event-persistence-availability-completion-addendum.yml

permissions:
  contents: write

jobs:
  freeze-addendum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run exhaustive offline availability audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          REPO = "olegbalakin-cmyk/kyiv-air-alerts-grafana"
          BRANCH = "attack-event-persistence-availability-completion-addendum-2026-10-05"
          OUT = Path("research/attack_event_persistence_availability_completion_addendum_2026-10-05.json")
          TMP = Path(os.environ["RUNNER_TEMP"]) / "attack-event-persistence-availability-completion"
          TMP.mkdir(parents=True, exist_ok=True)

          SNAPSHOT = {
              "commit": "efefa399e69eadd3d7fc8393ac1553cfde35f138",
              "path": "research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json",
              "blob": "8a2f6bd33f879be9db978da59c12c34e61f6f843",
              "sha256": "09458bcf0a019fa2939eb9dfa484da46cd8fa2be077343c5ba6d595c93d71788",
              "bytes": 90282029,
          }
          BINDING = {
              "commit": "e213f445f08bfc119b234c9460b66bd3efe75d36",
              "path": "research/attack_event_23city_parent_binding_map_v1_2026-10-05.json",
              "sha256": "b0ecd5ce980d76cf5ffce65f80ee1d5bd43c0d1b1438afb85424ae95aaef1241",
          }
          CONTRACTS = {
              "step1_base_persistence": {
                  "commit": "b205d38dbc50bc502d10e682d4ae53491af542ea",
                  "path": "research/attack_event_neon_persistence_contract_2026-10-02.json",
                  "sha256": "02bfe8bb0420bcf1259b0c49a73ca76e8cc6488c1cd426be4dd8b28ad01b94c3",
                  "verdict": "ATTACK-EVENT NEON PERSISTENCE CONTRACT FROZEN",
              },
              "classification_identity_qa_availability": {
                  "commit": "bd82a6c0a19aca4610a8af6df73a307a88c35bf6",
                  "path": "research/attack_event_classification_identity_availability_addendum_2026-10-04.json",
                  "sha256": "a1ba446261625383650b781233fc4956290bffd1437756dca8d7883b24906017",
                  "verdict": "ATTACK-EVENT CLASSIFICATION IDENTITY AVAILABILITY CONTRACT FROZEN",
              },
              "provenance_cardinality": {
                  "commit": "cafee4106d89f59d7f1020baef414ba4813ab29d",
                  "path": "research/attack_event_provenance_cardinality_addendum_2026-10-05.json",
                  "sha256": "e7bb8eb181d152b9760a5d80dc46ce0e261146e7e14433b706989f30e7ffc068",
                  "verdict": "ATTACK-EVENT PROVENANCE CARDINALITY SCHEMA ADDENDUM FROZEN",
              },
              "human_review_state": {
                  "commit": "1b161d240013a669aefd2b9485d6e5f2ca7c7402",
                  "path": "research/attack_event_human_review_state_derivation_addendum_2026-10-05.json",
                  "sha256": "b611a8171ed3e8b4d0146f03f61c511b55fbca2e1f26c2796241784bb2d6e7d1",
                  "verdict": "ATTACK-EVENT HUMAN REVIEW STATE DERIVATION ADDENDUM FROZEN",
              },
          }
          PREDECESSOR = {
              "verdict": "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF BLOCKED",
              "branch": "attack-event-step2c-rollback-persistence-proof-resume2-2026-10-05",
              "workflow_commit": "dfdcdb800b7aa0e2249a56e1110f3c99b52fc21a",
              "actions_run_id": 37355436987,
              "job_id": 111916540348,
              "artifact_id": 11364446990,
              "artifact_name": "attack-event-23city-rollback-persistence-proof-resume2",
              "first_failing_gate": "PERSISTENCE_SCHEMA_REPRESENTABILITY_MISMATCH",
              "phase": "OFFLINE_PREFLIGHT",
              "effective_candidate_ddl_sha256_at_failure": "67bf5b0aac0e4ef902ed839e4f62afba1d3e6cc96df971b82459696f577979c4",
          }
          ORIGINAL_GAPS = [
              {
                  "table": "public.attack_event_classifications",
                  "field": "originating_frozen_case_id",
                  "affected_count": 3,
                  "reason": "accepted adjudication marker present, but no explicit frozen/adjudicated case ID is mechanically available",
              },
              {
                  "table": "public.attack_event_sources",
                  "field": "source_type",
                  "affected_count": 1429,
                  "reason": "required frozen source field absent",
              },
              {
                  "table": "public.attack_event_sources",
                  "field": "evidence_payload",
                  "affected_count": 1,
                  "reason": "combined predecessor counter: classifier evidence payload missing/invalid or source timestamp invalid",
              },
          ]
          POSITIVE = {"STRICT_EVENT_POSITIVE", "SENSITIVITY_EVENT_POSITIVE"}
          EXPECTED_DIST = Counter({
              "STRICT_EVENT_POSITIVE": 1017,
              "SENSITIVITY_EVENT_POSITIVE": 63,
              "NO_CONFIRMED_EVENT": 23530,
              "NEEDS_REVIEW": 1795,
          })

          class Blocked(RuntimeError):
              def __init__(self, gate, table=None, field=None, count=None, detail=None, gaps=None):
                  self.gate = gate
                  self.table = table
                  self.field = field
                  self.count = count
                  self.detail = detail
                  self.gaps = gaps or []
                  super().__init__(gate)

          def block(gate, table=None, field=None, count=None, detail=None, gaps=None):
              raise Blocked(gate, table, field, count, detail, gaps)

          def sh(cmd, *, check=True, capture=True):
              p = subprocess.run(cmd, text=True, stdout=subprocess.PIPE if capture else None, stderr=subprocess.PIPE, check=False)
              if check and p.returncode != 0:
                  raise RuntimeError((p.stderr or "")[-1000:])
              return p.stdout.strip() if capture else ""

          def ensure_commit(sha):
              p = subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if p.returncode != 0:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", sha], check=True, stdout=subprocess.DEVNULL)
              got = sh(["git", "rev-parse", f"{sha}^{{commit}}"])
              if got != sha:
                  block("FROZEN_INPUT_COMMIT_MISMATCH", detail=sha)

          def sha256_file(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def materialize(spec, label):
              ensure_commit(spec["commit"])
              blob = sh(["git", "rev-parse", f'{spec["commit"]}:{spec["path"]}'])
              if spec.get("blob") and blob != spec["blob"]:
                  block(label + "_GIT_BLOB_MISMATCH")
              out = TMP / (label.lower() + ".json")
              with out.open("wb") as f:
                  p = subprocess.run(["git", "show", f'{spec["commit"]}:{spec["path"]}'], stdout=f, stderr=subprocess.PIPE)
              if p.returncode != 0:
                  block(label + "_MATERIALIZATION_FAILED")
              if spec.get("bytes") is not None and out.stat().st_size != spec["bytes"]:
                  block(label + "_BYTE_COUNT_MISMATCH", count=out.stat().st_size)
              actual = sha256_file(out)
              if spec.get("sha256") and actual != spec["sha256"]:
                  block(label + "_SHA256_MISMATCH", detail=actual)
              return out, blob, actual

          def load_json(spec, label):
              path, blob, sha = materialize(spec, label)
              try:
                  return json.loads(path.read_bytes()), blob, sha
              except Exception as e:
                  block(label + "_JSON_INVALID", detail=str(e)[:300])

          def cbytes(v):
              return json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")

          def csha(v):
              return hashlib.sha256(cbytes(v)).hexdigest()

          def walk_exact(obj, keys):
              out = []
              def walk(x, path="$"):
                  if isinstance(x, dict):
                      for k, v in x.items():
                          p = path + "." + str(k)
                          if str(k) in keys:
                              out.append((p, v))
                          walk(v, p)
                  elif isinstance(x, list):
                      for i, v in enumerate(x):
                          walk(v, f"{path}[{i}]")
              walk(obj)
              return out

          def unique_nonempty_strings(obj, keys):
              vals = []
              for path, v in walk_exact(obj, set(keys)):
                  if isinstance(v, (str, int)) and str(v).strip():
                      vals.append((path, str(v)))
              distinct = sorted({v for _, v in vals})
              return distinct, vals

          def parse_ts(v):
              if v in (None, ""):
                  return "ABSENT_IN_ACCEPTED_SOURCE", None
              raw = str(v)
              try:
                  dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      raise ValueError("naive")
                  dt.astimezone(timezone.utc)
                  return "MATERIALIZED", None
              except Exception:
                  return "UNPARSEABLE_IN_ACCEPTED_SOURCE", raw

          def accepted_payload_projection(row):
              hits = walk_exact(row, {"evidence_payload", "classifier_evidence_payload"})
              objects = []
              nonnull_nonobjects = []
              present = False
              for path, value in hits:
                  present = True
                  if isinstance(value, dict):
                      objects.append((path, value))
                  elif value is not None:
                      nonnull_nonobjects.append((path, type(value).__name__))
              by_hash = {}
              for path, value in objects:
                  by_hash.setdefault(csha(value), {"value": value, "paths": []})["paths"].append(path)
              if len(by_hash) == 1:
                  only = next(iter(by_hash.values()))
                  return {
                      "state": "MATERIALIZED",
                      "payload": only["value"],
                      "projection_paths": sorted(only["paths"]),
                      "present": present,
                      "nonnull_nonobjects": nonnull_nonobjects,
                      "conflict": False,
                  }
              if len(by_hash) > 1:
                  return {
                      "state": "CONFLICT",
                      "payload": None,
                      "projection_paths": sorted(p for x in by_hash.values() for p in x["paths"]),
                      "present": present,
                      "nonnull_nonobjects": nonnull_nonobjects,
                      "conflict": True,
                  }
              return {
                  "state": "UNMATERIALIZED_IN_ACCEPTED_SOURCE",
                  "payload": None,
                  "projection_paths": [],
                  "present": present,
                  "nonnull_nonobjects": nonnull_nonobjects,
                  "conflict": False,
              }

          def source_origin_object(row):
              x = row.get("origin")
              if isinstance(x, dict):
                  return x
              x = row.get("origin_provenance")
              return x if isinstance(x, dict) else {}

          def origin_artifact_path(row):
              # Prefer exact accepted origin_artifact_path fields. Do not use URL/domain/content.
              vals, hits = unique_nonempty_strings(source_origin_object(row), {"origin_artifact_path"})
              if len(vals) == 1:
                  return vals[0]
              vals2, hits2 = unique_nonempty_strings(row, {"source_corpus", "source_corpus_id", "corpus_id"})
              if len(vals2) == 1:
                  return vals2[0]
              top = row.get("origin_artifact_path")
              if isinstance(top, str) and top.strip():
                  return top
              return None

          def classification_origin_projection(origin):
              def uniq(pred):
                  vals = []
                  def walk(x, k=""):
                      if isinstance(x, dict):
                          for kk, vv in x.items():
                              walk(vv, str(kk))
                      elif isinstance(x, list):
                          for vv in x:
                              walk(vv, k)
                      elif pred(k.lower(), x) and isinstance(x, (str, int)) and str(x).strip():
                          vals.append(str(x))
                  walk(origin)
                  u = sorted(set(vals))
                  return u[0] if len(u) == 1 else None
              return {
                  "origin_repository": uniq(lambda k, v: k == "origin_repository") or REPO,
                  "origin_ref": uniq(lambda k, v: k == "ref" or k.endswith("_ref")),
                  "origin_commit_sha": uniq(lambda k, v: "commit" in k or k.endswith("_head") or k in {"tested_head", "accepted_final_head"}),
                  "origin_artifact_path": uniq(lambda k, v: "path" in k),
                  "origin_artifact_blob_sha": uniq(lambda k, v: "blob" in k),
                  "origin_target_state_sha256": uniq(lambda k, v: k == "origin_target_state_sha256" or k.endswith("target_state_sha256")),
                  "origin_workflow_run_id": uniq(lambda k, v: "run_id" in k),
              }

          def source_origin_projection(origin):
              def uniq(pred):
                  vals = []
                  def walk(x, k=""):
                      if isinstance(x, dict):
                          for kk, vv in x.items():
                              walk(vv, str(kk))
                      elif isinstance(x, list):
                          for vv in x:
                              walk(vv, k)
                      elif pred(k.lower(), x) and isinstance(x, (str, int)) and str(x).strip():
                          vals.append(str(x))
                  walk(origin)
                  u = sorted(set(vals))
                  return u[0] if len(u) == 1 else None
              return {
                  "origin_artifact_path": uniq(lambda k, v: "path" in k),
                  "origin_git_ref": uniq(lambda k, v: k == "ref" or k.endswith("_ref")),
                  "origin_git_blob_sha": uniq(lambda k, v: "blob" in k),
              }

          def has_adjudication_marker(row):
              hits = walk_exact(row, {"accepted_adjudication_artifact", "adjudication_class"})
              return any(v not in (None, "", False) for _, v in hits)

          def case_id_state(row):
              vals, hits = unique_nonempty_strings(row, {"originating_frozen_case_id", "frozen_case_id"})
              if len(vals) > 1:
                  return "CONFLICT", None, vals
              if len(vals) == 1:
                  return "MATERIALIZED", vals[0], vals
              if has_adjudication_marker(row):
                  return "UNMATERIALIZED_IN_ACCEPTED_SOURCE", None, []
              return "NOT_APPLICABLE", None, []

          def source_type_state(row):
              vals, hits = unique_nonempty_strings(row, {"source_type"})
              if len(vals) > 1:
                  return "CONFLICT", None, vals, hits
              if len(vals) == 1:
                  return "MATERIALIZED", vals[0], vals, hits
              return "UNMATERIALIZED_IN_ACCEPTED_SOURCE", None, [], hits

          def derive_human_state(row):
              rv = row.get("review_provenance")
              rh = row.get("review_provenance_sha256")
              nonempty = isinstance(rv, dict) and bool(rv)
              if nonempty and isinstance(rh, str) and rh:
                  if csha(rv) != rh:
                      raise ValueError("review provenance hash mismatch")
                  return "REVIEWED_EVIDENCE"
              if nonempty != bool(rh):
                  raise ValueError("review provenance/hash consistency mismatch")
              return "NEEDS_REVIEW" if row.get("verdict") == "NEEDS_REVIEW" else "NONE"

          def build_effective_four_contract_ddl(step1, v2, provenance, human):
              ddl = step1.get("candidate_ddl")
              if not isinstance(ddl, str) or not ddl.strip():
                  block("PERSISTENCE_CONTRACT_DDL_UNAVAILABLE")
              if (v2.get("future_schema_contract") or {}).get("classification_key_version_required") != "attack-event-classification-key-v2":
                  block("CLASSIFICATION_IDENTITY_V2_CONTRACT_MISMATCH")
              old_col = "    qa_reasons TEXT[] NOT NULL DEFAULT '{}'::text[],"
              new_col = "    qa_reasons_state TEXT NOT NULL,\n    qa_reasons JSONB NULL,"
              if ddl.count(old_col) != 1:
                  block("PERSISTENCE_CONTRACT_DDL_DELTA_MISMATCH")
              ddl = ddl.replace(old_col, new_col)
              old_ver = "CHECK (classification_key_version = 'attack-event-classification-key-v1')"
              new_ver = "CHECK (classification_key_version = 'attack-event-classification-key-v2')"
              if ddl.count(old_ver) != 1:
                  block("PERSISTENCE_CONTRACT_DDL_DELTA_MISMATCH")
              ddl = ddl.replace(old_ver, new_ver)
              ddl = ddl.rstrip() + "\n\n" + """ALTER TABLE public.attack_event_classifications
    ADD CONSTRAINT attack_event_classifications_qa_state_check
    CHECK (qa_reasons_state IN ('MATERIALIZED','UNMATERIALIZED_IN_ACCEPTED_SOURCE'));

ALTER TABLE public.attack_event_classifications
    ADD CONSTRAINT attack_event_classifications_qa_value_check
    CHECK (
        (qa_reasons_state = 'MATERIALIZED' AND jsonb_typeof(qa_reasons) = 'array')
        OR
        (qa_reasons_state = 'UNMATERIALIZED_IN_ACCEPTED_SOURCE' AND qa_reasons IS NULL)
    );
"""
              delta = provenance.get("candidate_ddl_delta") or {}
              prov_sql = delta.get("sql")
              if not isinstance(prov_sql, str) or hashlib.sha256(prov_sql.encode("utf-8")).hexdigest() != delta.get("sha256"):
                  block("PROVENANCE_CARDINALITY_DDL_DELTA_SHA_MISMATCH")
              if delta.get("supersedes_only_origin_provenance_representation") is not True:
                  block("PROVENANCE_CARDINALITY_DELTA_SCOPE_MISMATCH")
              if (human.get("future_schema_contract") or {}).get("column") != "human_review_state TEXT NOT NULL":
                  block("HUMAN_REVIEW_STATE_CONTRACT_MISMATCH")
              return ddl.rstrip() + "\n\n" + prov_sql.strip() + "\n"

          def make_delta(payload_needed, source_ts_needed, event_ts_needed):
              parts = []
              parts.append("""ALTER TABLE public.attack_event_classifications
    ADD COLUMN originating_frozen_case_id_state TEXT NOT NULL,
    ADD CONSTRAINT attack_event_classifications_frozen_case_id_state_check
        CHECK (originating_frozen_case_id_state IN ('MATERIALIZED','UNMATERIALIZED_IN_ACCEPTED_SOURCE','NOT_APPLICABLE')),
    ADD CONSTRAINT attack_event_classifications_frozen_case_id_value_check
        CHECK (
            (originating_frozen_case_id_state = 'MATERIALIZED' AND originating_frozen_case_id IS NOT NULL AND btrim(originating_frozen_case_id) <> '')
            OR
            (originating_frozen_case_id_state IN ('UNMATERIALIZED_IN_ACCEPTED_SOURCE','NOT_APPLICABLE') AND originating_frozen_case_id IS NULL)
        );""")
              parts.append("""ALTER TABLE public.attack_event_sources
    ALTER COLUMN source_type DROP NOT NULL,
    ADD COLUMN source_type_state TEXT NOT NULL,
    ADD CONSTRAINT attack_event_sources_source_type_state_check
        CHECK (source_type_state IN ('MATERIALIZED','UNMATERIALIZED_IN_ACCEPTED_SOURCE')),
    ADD CONSTRAINT attack_event_sources_source_type_value_check
        CHECK (
            (source_type_state = 'MATERIALIZED' AND source_type IS NOT NULL AND btrim(source_type) <> '')
            OR
            (source_type_state = 'UNMATERIALIZED_IN_ACCEPTED_SOURCE' AND source_type IS NULL)
        );""")
              if payload_needed:
                  parts.append("""ALTER TABLE public.attack_event_sources
    ALTER COLUMN evidence_payload DROP NOT NULL,
    ADD COLUMN evidence_payload_state TEXT NOT NULL,
    ADD CONSTRAINT attack_event_sources_evidence_payload_state_check
        CHECK (evidence_payload_state IN ('MATERIALIZED','UNMATERIALIZED_IN_ACCEPTED_SOURCE')),
    ADD CONSTRAINT attack_event_sources_evidence_payload_value_check
        CHECK (
            (evidence_payload_state = 'MATERIALIZED' AND evidence_payload IS NOT NULL AND jsonb_typeof(evidence_payload) = 'object')
            OR
            (evidence_payload_state = 'UNMATERIALIZED_IN_ACCEPTED_SOURCE' AND evidence_payload IS NULL)
        );""")
              def ts_delta(col):
                  return f"""ALTER TABLE public.attack_event_sources
    ADD COLUMN {col}_state TEXT NOT NULL,
    ADD COLUMN {col}_raw TEXT NULL,
    ADD CONSTRAINT attack_event_sources_{col}_state_check
        CHECK ({col}_state IN ('MATERIALIZED','ABSENT_IN_ACCEPTED_SOURCE','UNPARSEABLE_IN_ACCEPTED_SOURCE')),
    ADD CONSTRAINT attack_event_sources_{col}_value_check
        CHECK (
            ({col}_state = 'MATERIALIZED' AND {col} IS NOT NULL)
            OR
            ({col}_state = 'ABSENT_IN_ACCEPTED_SOURCE' AND {col} IS NULL AND {col}_raw IS NULL)
            OR
            ({col}_state = 'UNPARSEABLE_IN_ACCEPTED_SOURCE' AND {col} IS NULL AND {col}_raw IS NOT NULL AND btrim({col}_raw) <> '')
        );"""
              if source_ts_needed:
                  parts.append(ts_delta("source_timestamp"))
              if event_ts_needed:
                  parts.append(ts_delta("event_timestamp_if_stated"))
              return "\n\n".join(parts).strip() + "\n"

          result = {
              "schema_version": "attack-event-persistence-availability-completion-addendum-v1",
              "status": "BLOCKED",
              "verdict": "ATTACK-EVENT PERSISTENCE AVAILABILITY COMPLETION ADDENDUM BLOCKED",
              "scope": "offline contract completion for final STEP 2C representability gaps only",
              "fresh_base": None,
              "proof_branch": os.environ.get("GITHUB_REF_NAME"),
              "temporary_workflow_commit": os.environ.get("GITHUB_SHA"),
              "actions_run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "predecessor": PREDECESSOR,
              "frozen_snapshot": SNAPSHOT,
              "frozen_binding_map": BINDING,
              "existing_contracts": CONTRACTS,
              "original_representability_gaps": ORIGINAL_GAPS,
              "identity_invariants": {
                  "classification_key_version": "attack-event-classification-key-v2",
                  "event_key_version": "attack-event-key-v1",
                  "source_link_key_version": "attack-event-source-link-key-v1",
                  "classification_identity_change": "NO",
                  "event_identity_change": "NO",
                  "source_link_identity_change": "NO",
                  "evidence_set_hashing_change": "NO",
                  "review_provenance_hashing_change": "NO",
                  "verdict_change": "NO",
                  "event_types_change": "NO",
                  "qa_semantics_change": "NO",
                  "human_review_state_derivation_change": "NO",
                  "parent_binding_change": "NO",
              },
              "mutation_scope": {
                  "neon_queries": 0,
                  "db_writes": 0,
                  "production_mutation": "NO",
                  "ddl_executed": False,
                  "credentials_exposed": False,
              },
          }

          try:
              # Parent of the temporary workflow commit is the fresh-main base by construction.
              parents = sh(["git", "show", "-s", "--format=%P", os.environ["GITHUB_SHA"]]).split()
              if len(parents) != 1:
                  block("FRESH_BASE_PARENT_CARDINALITY_MISMATCH", count=len(parents))
              result["fresh_base"] = parents[0]

              snap_path, snap_blob, snap_sha = materialize(SNAPSHOT, "SNAPSHOT")
              bind_path, bind_blob, bind_sha = materialize(BINDING, "BINDING")
              result["frozen_snapshot"]["verified_blob"] = snap_blob
              result["frozen_snapshot"]["verified_sha256"] = snap_sha
              result["frozen_binding_map"]["verified_blob"] = bind_blob
              result["frozen_binding_map"]["verified_sha256"] = bind_sha

              loaded = {}
              for name, spec in CONTRACTS.items():
                  obj, blob, sha = load_json(spec, "CONTRACT_" + name.upper())
                  if obj.get("verdict") != spec["verdict"]:
                      block("FROZEN_CONTRACT_VERDICT_MISMATCH", detail=name)
                  loaded[name] = obj
                  result["existing_contracts"][name] = dict(spec, verified_blob=blob, verified_sha256=sha)

              snapshot = json.loads(snap_path.read_bytes())
              binding = json.loads(bind_path.read_bytes())
              cls = snapshot.get("classifications")
              events = snapshot.get("attack_events")
              links = snapshot.get("source_links")
              records = binding.get("records")
              if not all(isinstance(x, list) for x in (cls, events, links, records)):
                  block("FROZEN_INPUT_SCHEMA_MISMATCH")
