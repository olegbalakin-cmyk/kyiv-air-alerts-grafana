name: Update Ukraine air-alert production data

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      c6_final_prepare_only:
        description: "Owner-approved FINAL release bytes preparation ONLY (default OFF; no C2, no deploy, no publication)"
        type: boolean
        required: true
        default: false
      c6_neon_git_release:
        description: "Separately owner-approved one-shot Neon Git release (default OFF)"
        type: boolean
        required: true
        default: false
      c6_preparation_artifact_id:
        description: "Immutable same-run C6 preparation artifact ID"
        type: string
        required: false
      work_a_proof_artifact_id:
        description: "Immutable independent Work A proof artifact ID"
        type: string
        required: false
      c6_bundle_artifact_id:
        description: "Immutable pinned C2 shadow-inputs artifact ID for final preparation only"
        type: string
        required: false
      c6_final_release_artifact_id:
        description: "Owner-pinned pre-Netlify eight-file FINAL artifact ID for publication (no regeneration drift)"
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-netlify-site.yml"

concurrency:
  group: update-netlify-site
  # Never cancel a writer in its critical section in favor of a new dispatch.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-site:
    if: ${{ (github.event_name == 'schedule' && vars.C6_AUTO_NEON_GIT_ENABLED == 'true') || (vars.C6_AUTO_NEON_GIT_ENABLED != 'true' && (github.event_name != 'workflow_dispatch' || (!inputs.c6_neon_git_release && !inputs.c6_final_prepare_only)) && vars.C6_GIT_ONLY_PUBLISHER_PAUSED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out production site branch
        uses: actions/checkout@v4
        with:
          ref: site-prod
          fetch-depth: 0

      - name: Record Phase-1 checked-out input provenance
        working-directory: .
        shell: bash
        run: |
          echo "PHASE1_INPUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MULTICITY_CANONICAL_PAYLOAD_PATH=${RUNNER_TEMP}/multicity_canonical_payload.json" >> "$GITHUB_ENV"
          # Capture remains OFF unless the owner explicitly enables this separately.
          echo "C2_HISTORY_CAPTURE_ENABLED=${{ vars.C2_HISTORY_CAPTURE_ENABLED }}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install dependencies
        run: pip install -r requirements-db-phase1.txt

      - name: Declare differentiated shadow ephemeral paths
        shell: bash
        run: |
          echo "DIFFERENTIATED_ALERT_SHADOW_KYIV_JSON=${RUNNER_TEMP}/differentiated-shadow-kyiv.json" >> "$GITHUB_ENV"
          echo "DIFFERENTIATED_ALERT_SHADOW_UKRAINEALARM_JSON=${RUNNER_TEMP}/differentiated-shadow-ukrainealarm.json" >> "$GITHUB_ENV"
          echo "DIFFERENTIATED_ALERT_SHADOW_ALERTS_IN_UA_JSON=${RUNNER_TEMP}/differentiated-shadow-alerts-in-ua.json" >> "$GITHUB_ENV"
          echo "DIFFERENTIATED_ALERT_SOURCE_CAPTURE_DIAGNOSTIC=${RUNNER_TEMP}/differentiated-shadow-capture.json" >> "$GITHUB_ENV"
          echo "DIFFERENTIATED_ALERT_SHADOW_DIAGNOSTIC=${RUNNER_TEMP}/differentiated-shadow-persistence.json" >> "$GITHUB_ENV"

      - name: Guard production output before differentiated shadow
        shell: bash
        run: sha256sum data/dashboard_data.json | awk '{print $1}' > "${RUNNER_TEMP}/differentiated-shadow-product-before.sha256"

      - name: Capture differentiated same-run current-state inputs
        env:
          DIFFERENTIATED_ALERT_SOURCE_CAPTURE: "1"
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        run: python scripts/differentiated_alert_source_capture.py

      - name: Run differentiated PostgreSQL shadow from frozen same-run inputs
        env:
          DIFFERENTIATED_ALERT_SHADOW: "1"
          DIFFERENTIATED_ALERT_SHADOW_BACKEND: postgres
          DIFFERENTIATED_ALERT_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          DIFFERENTIATED_ALERT_SHADOW_INPUT_MODE: stored_only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          import differentiated_alert_shadow_runtime as runtime
          result = runtime.run_from_updater([], env=os.environ)
          safe = {
              "status": result.get("status"),
              "sidecar_network_requests": result.get("sidecar_network_requests"),
              "inserted_snapshots": result.get("inserted_snapshots"),
              "inserted_observations": result.get("inserted_observations"),
              "binding": result.get("binding"),
              "store_counts": result.get("store_counts"),
              "production_output_mutation": result.get("production_output_mutation"),
          }
          print("Differentiated production shadow:", json.dumps(safe, sort_keys=True))
          PY

      - name: Verify differentiated shadow did not mutate production output
        shell: bash
        run: |
          sha256sum data/dashboard_data.json | awk '{print $1}' > "${RUNNER_TEMP}/differentiated-shadow-product-after.sha256"
          cmp "${RUNNER_TEMP}/differentiated-shadow-product-before.sha256" "${RUNNER_TEMP}/differentiated-shadow-product-after.sha256"

      - name: Upload differentiated shadow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differentiated-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/differentiated-shadow-capture.json
            ${{ runner.temp }}/differentiated-shadow-persistence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Test municipal-source fallback
        run: python tests/test_update_fallback.py

      - name: Test bridge checkpoint persistence semantics
        run: python scripts/validate_bridge_checkpoint.py self-test

      - name: Update base data
        run: python scripts/update_data.py

      - name: Add weekly duration metrics
        run: python scripts/add_weekly_breakdown.py

      - name: Render dashboard data dependencies
        run: python scripts/render_dashboard.py --repository "${GITHUB_REPOSITORY}" --branch "site-prod" --prefix "kyiv-air-alerts-grafana"

      - name: Add weekly panels
        run: python scripts/add_weekly_panels.py

      - name: Add exact-city base rows
        run: python scripts/add_duration_unit_switch.py

      - name: Add documented proxy rows
        run: python scripts/expand_multicity_production.py

      - name: Add cross-source validated proxy rows
        run: python scripts/extend_remaining_proxies.py

      - name: Snapshot previous UkraineAlarm bridge checkpoint
        run: cp data/ukrainealarm_bridge.json "${RUNNER_TEMP}/ukrainealarm_bridge_before.json"

      - name: Apply verified Alerts.in.ua and UkraineAlarm bridge
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
          PHASE1_DB_SHADOW: "0"
          PHASE1_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          PHASE1_DB_BRANCH: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          PHASE1_DB_SHADOW_FAILURE_POLICY: fail_open
          PHASE1_DB_SHADOW_DIAGNOSTIC: ${{ runner.temp }}/phase1_db_shadow.json
          PHASE1_INPUT_REPOSITORY: ${{ github.repository }}
          PHASE1_INPUT_REF: site-prod
          PHASE1_INPUT_SHA: ${{ env.PHASE1_INPUT_SHA }}
        run: python scripts/apply_ukrainealarm_bridge.py

      - name: Upload Phase-1 DB shadow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-db-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase1_db_shadow.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize Phase-1 DB shadow diagnostic
        if: always()
        env:
          PHASE1_DIAGNOSTIC_PATH: ${{ runner.temp }}/phase1_db_shadow.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PHASE1_DIAGNOSTIC_PATH"])
          if not path.exists():
              print("::warning::Phase-1 DB shadow diagnostic missing")
              raise SystemExit(0)

          diagnostic = json.loads(path.read_text(encoding="utf-8"))
          status = diagnostic.get("status")
          if status == "succeeded":
              safe = {
                  "db_branch": diagnostic.get("db_branch"),
                  "run_id": diagnostic.get("run_id"),
                  "checkpoint_id": diagnostic.get("checkpoint_id"),
                  "checkpoint_seq": diagnostic.get("checkpoint_seq"),
                  "episodes_inserted": diagnostic.get("episodes_inserted"),
                  "episodes_existing": diagnostic.get("episodes_existing"),
                  "source_observations_inserted": diagnostic.get("source_observations_inserted"),
                  "source_observations_existing": diagnostic.get("source_observations_existing"),
                  "source_observations_last_seen_updated": diagnostic.get("source_observations_last_seen_updated"),
                  "checkpoints_inserted": diagnostic.get("checkpoints_inserted"),
                  "exact_retry": diagnostic.get("exact_retry"),
                  "workflow_sha": diagnostic.get("workflow_sha"),
                  "input_sha": diagnostic.get("input_sha"),
              }
              print("Phase-1 DB shadow succeeded:", json.dumps(safe, sort_keys=True))
          elif status == "failed":
              print(
                  "::warning::Phase-1 DB shadow failed open; "
                  f"error_type={diagnostic.get('error_type')} "
                  f"db_branch={diagnostic.get('db_branch')}"
              )
          else:
              print(f"::warning::Unexpected Phase-1 DB shadow diagnostic status: {status!r}")
          PY

      - name: Validate verified UkraineAlarm bridge checkpoint
        run: |
          python scripts/validate_bridge_checkpoint.py validate \
            --candidate data/ukrainealarm_bridge.json \
            --summary data/dashboard_data.json \
            --baseline "${RUNNER_TEMP}/ukrainealarm_bridge_before.json" \
            --diagnostic "${RUNNER_TEMP}/ukrainealarm_bridge_fetch.json"

      - name: Add Sevastopol exact-city series
        run: python scripts/add_sevastopol_exact.py

      - name: Run multicity canonical DB shadow
        id: canonical_db
        continue-on-error: true
        env:
          MULTICITY_CANONICAL_DB_SHADOW: "1"
          MULTICITY_CANONICAL_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          MULTICITY_CANONICAL_DB_BRANCH: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          MULTICITY_CANONICAL_DB_SHADOW_FAILURE_POLICY: fail_closed
          MULTICITY_CANONICAL_DB_SHADOW_DIAGNOSTIC: ${{ runner.temp }}/multicity_canonical_db_shadow.json
          MULTICITY_CANONICAL_DASHBOARD_PATH: data/dashboard_data.json
          MULTICITY_CANONICAL_INPUT_REPOSITORY: ${{ github.repository }}
          MULTICITY_CANONICAL_INPUT_REF: site-prod
          MULTICITY_CANONICAL_INPUT_SHA: ${{ env.PHASE1_INPUT_SHA }}
        run: python scripts/multicity_canonical_shadow.py

      - name: Upload multicity canonical DB shadow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multicity-canonical-db-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multicity_canonical_db_shadow.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize multicity canonical DB shadow diagnostic
        if: always()
        env:
          MULTICITY_DIAGNOSTIC_PATH: ${{ runner.temp }}/multicity_canonical_db_shadow.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["MULTICITY_DIAGNOSTIC_PATH"])
          if not path.exists():
              print("::warning::Multicity canonical DB shadow diagnostic missing")
              raise SystemExit(0)
          d = json.loads(path.read_text(encoding="utf-8"))
          safe = {k: d.get(k) for k in (
              "status","db_branch","city_count","canonical_episode_count","corpus_sha256",
              "episodes_inserted","episodes_existing","episodes_updated","writes","run_id",
              "workflow_sha","input_sha","error_type"
          )}
          print("Multicity canonical DB shadow:", json.dumps(safe, sort_keys=True))
          PY

      - name: Classify canonical persistence before controlled site publication
        id: canonical_publication
        shell: bash
        env:
          C2_WRITER_OUTCOME: ${{ steps.canonical_db.outcome }}
          C2_DIAGNOSTIC: ${{ runner.temp }}/multicity_canonical_db_shadow.json
          C2_STATUS_REPORT: ${{ runner.temp }}/c2_publication_status.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.verify_multicity_canonical_receipt import verify_receipt

          path = Path(os.environ["C2_DIAGNOSTIC"])
          outcome = os.environ.get("C2_WRITER_OUTCOME")
          try:
              diagnostic = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(diagnostic, dict):
                  raise ValueError("canonical diagnostic must be an object")
              if diagnostic.get("workflow_sha") != os.environ.get("GITHUB_SHA"):
                  raise ValueError("canonical diagnostic workflow SHA mismatch")
              if diagnostic.get("input_sha") != os.environ.get("PHASE1_INPUT_SHA"):
                  raise ValueError("canonical diagnostic input SHA mismatch")
              if outcome == "success":
                  verify_receipt(path)
                  status, error_type = "NEON_SUCCEEDED", None
              elif outcome == "failure":
                  # A DB connection/availability failure is not a successful
                  # canonical write. Preserve the strict DB receipt contract.
                  if diagnostic.get("status") != "failed" or diagnostic.get("failure_policy") != "fail_closed":
                      raise ValueError("failure outcome has no explicit failed diagnostic")
                  if diagnostic.get("production_output_mutation") is not False:
                      raise ValueError("failed canonical writer modified production output")
                  if diagnostic.get("run_id") is not None or diagnostic.get("persistence_status") is not None:
                      raise ValueError("failed canonical writer has a claimed success receipt")
                  if any(diagnostic.get(key) != 0 for key in (
                      "episodes_inserted", "episodes_existing", "episodes_updated", "writes"
                  )):
                      raise ValueError("failed canonical writer has nonzero success counters")
                  error_type = diagnostic.get("error_type")
                  if error_type not in {
                      "OperationalError", "InterfaceError", "ConnectionFailure",
                      "ConnectionDoesNotExist", "AdminShutdown", "TooManyConnections",
                      "CannotConnectNow", "QueryCanceled"
                  }:
                      raise ValueError("non-operational canonical failure requires hard stop")
                  status = "NEON_FAILED"
              else:
                  raise ValueError("canonical writer step outcome missing or unexpected")
          except (OSError, ValueError, TypeError, KeyError) as exc:
              # Never emit a canonical SUCCESS or allow site publication if
              # the receipt / failure classification is missing or ambiguous.
              print(f"::error title=C2 publication blocked::Canonical result cannot be trusted ({type(exc).__name__})")
              raise SystemExit(1)

          report = {
              "canonical_persistence_status": status,
              "canonical_receipt_validated": status == "NEON_SUCCEEDED",
              "canonical_db_commit": "CONFIRMED" if status == "NEON_SUCCEEDED" else "UNCONFIRMED",
              "site_publication_allowed_after_independent_qa": True,
              "error_type": error_type,
              "workflow_sha": diagnostic["workflow_sha"],
              "input_sha": diagnostic["input_sha"],
          }
          Path(os.environ["C2_STATUS_REPORT"]).write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as f:
                  f.write(f"canonical_persistence_status={status}\n")
          if status == "NEON_FAILED":
              print("::warning title=Neon FAILED::Canonical DB commit UNCONFIRMED; site publication proceeds only if independent data QA and Git publication pass")
          else:
              print("Canonical persistence receipt validated: NEON_SUCCEEDED")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(
                      f"### C2 canonical persistence: {status}\n"
                      f"Canonical commit: {report['canonical_db_commit']}. "
                      "Site publication requires separate 23-city QA and Git verification.\n"
                  )
          PY

      - name: Upload C2 canonical publication status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-publication-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c2_publication_status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build rolling windows, partial periods, time-of-day profile, and shared table ranges
        run: python scripts/apply_site_rolling_7d.py

      - name: Update Kyiv casualty series and review queue
        run: python scripts/update_casualties.py

      - name: Configure full city dataset
        run: python scripts/configure_full_city_dashboard.py

      - name: Add casualty data panel metadata
        run: python scripts/add_casualty_panel.py

      - name: QA 23-city dataset
        run: python scripts/postprocess_compact_dashboard_qa.py

      - name: Reconcile source freshness
        run: python scripts/reconcile_bridge_freshness.py

      - name: Verify production dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data')
          qa = json.loads((root / 'dashboard_qa.json').read_text(encoding='utf-8'))
          data = json.loads((root / 'dashboard_data.json').read_text(encoding='utf-8'))
          keys = data.get('multicity_meta', {}).get('production_city_keys', [])
          fresh = data.get('multicity_meta', {}).get('effective_freshness', {})
          assert qa.get('ok') is True, qa
          assert len(keys) == 23, len(keys)
          assert fresh.get('fully_continuous') is True, fresh
          assert not fresh.get('warning'), fresh
          assert data.get('multicity_meta', {}).get('weekly_mode') == 'rolling_7d'
          assert data.get('multicity_meta', {}).get('rolling_window_periods') == ['weekly', 'rolling30', 'rolling90']
          profile = data.get('time_of_day_profile', {})
          assert profile.get('meta', {}).get('city_count') == 23, profile.get('meta')
          assert profile.get('meta', {}).get('slot_minutes') == 15, profile.get('meta')
          assert set(profile.get('meta', {}).get('periods', [])) == {'7d', '30d', '90d', 'year', 'all'}
          assert len(profile.get('cities', {})) == 23
          table = data.get('all_cities_table', {})
          assert table.get('meta', {}).get('city_count') == 23, table.get('meta')
          assert set(table.get('meta', {}).get('periods', [])) == {'7d', '30d', '90d', 'year', 'common'}
          assert table.get('meta', {}).get('common_start') <= table.get('meta', {}).get('common_end')
          assert len(table.get('cities', {})) == 23
          for key in keys:
              city = data.get('cities', {}).get(key, {})
              assert city.get('rolling30'), key
              assert city.get('rolling90'), key
              partial_months = [row for row in city.get('monthly', []) if row.get('is_partial_period')]
              assert len(partial_months) <= 1, (key, partial_months)
              if partial_months:
                  assert city.get('monthly', [])[-1] is partial_months[-1]
                  assert partial_months[-1].get('partial_through')
          bad = [
              key for key in keys
              if data.get('cities', {}).get(key, {}).get('meta', {}).get('weekly_mode') != 'rolling_7d'
          ]
          assert not bad, f'Non-rolling city rows: {bad}'
          print('Production dataset verified:', len(keys), 'rows; rolling 7-day series enabled')
          PY

      - name: Build derived site JSON without Netlify
        run: |
          cp data/dashboard_data.json "${RUNNER_TEMP}/site-derived-dashboard.json"
          python scripts/build_time_of_day_heatmap.py \
            --dashboard "${RUNNER_TEMP}/site-derived-dashboard.json" \
            --kyiv-alerts data/alerts_combined.json \
            --bridge-store data/ukrainealarm_bridge.json \
            --sevastopol-events data/sevastopol_events.json \
            --explorations-output "${RUNNER_TEMP}/site-explorations.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          derived_dashboard = json.loads((root / "site-derived-dashboard.json").read_text(encoding="utf-8"))
          explorations = json.loads((root / "site-explorations.json").read_text(encoding="utf-8"))

          payload = {
              "meta": {
                  "generated_at": derived_dashboard.get("meta", {}).get("generated_at"),
                  "source": "site-prod production updater",
                  "city_count": len(derived_dashboard.get("multicity_meta", {}).get("production_city_keys", [])),
              },
              "time_of_day_heatmap_test": derived_dashboard["time_of_day_heatmap_test"],
              "all_cities_table_test": derived_dashboard["all_cities_table_test"],
              "explorations": explorations,
          }

          out = Path("data/site_derived.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          keys = derived_dashboard["multicity_meta"]["production_city_keys"]
          assert payload["meta"]["city_count"] == 23
          assert set(payload["time_of_day_heatmap_test"]["cities"]) == set(keys)
          assert set(payload["all_cities_table_test"]["cities"]) == set(keys)
          assert set(payload["explorations"]["cities"]) == set(keys)
          print("Derived site JSON verified for", len(keys), "cities")
          PY

      - name: Build Kyiv alert-cause JSON without Netlify
        run: python scripts/build_kyiv_threat_mix.py --output data/kyiv_threat_mix.json

      # Export only existing same-run bytes. Default OFF, no DB/source calls;
      # any export failure leaves the production Git publication path unchanged.
      - name: Check out same-workflow C2 bundle exporter
        id: c2_bundle_source
        if: ${{ (vars.C2_SHADOW_BUNDLE_EXPORT_ENABLED == 'true' || vars.C6_AUTO_NEON_GIT_ENABLED == 'true') && steps.canonical_publication.outputs.canonical_persistence_status == 'NEON_SUCCEEDED' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: c2-bundle-source
          persist-credentials: false

      - name: Export verified same-run C2 shadow bundle
        id: c2_bundle_export
        if: ${{ (vars.C2_SHADOW_BUNDLE_EXPORT_ENABLED == 'true' || vars.C6_AUTO_NEON_GIT_ENABLED == 'true') && steps.canonical_publication.outputs.canonical_persistence_status == 'NEON_SUCCEEDED' && steps.c2_bundle_source.outcome == 'success' }}
        continue-on-error: true
        env:
          C2_SHADOW_BUNDLE_EXPORT_ENABLED: 'true'
          MULTICITY_CANONICAL_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          MULTICITY_CANONICAL_DB_BRANCH: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
        shell: bash
        run: |
          cd ../c2-bundle-source
          python -m scripts.c2_shadow_bundle \
            --site ../kyiv-air-alerts-grafana \
            --receipt "${RUNNER_TEMP}/multicity_canonical_db_shadow.json" \
            --status "${RUNNER_TEMP}/c2_publication_status.json" \
            --payload "${MULTICITY_CANONICAL_PAYLOAD_PATH}" \
            --output "${RUNNER_TEMP}/c2-shadow-bundle"

      - name: Upload verified C2 shadow inputs
        if: ${{ (vars.C2_SHADOW_BUNDLE_EXPORT_ENABLED == 'true' || vars.C6_AUTO_NEON_GIT_ENABLED == 'true') && steps.canonical_publication.outputs.canonical_persistence_status == 'NEON_SUCCEEDED' && steps.c2_bundle_export.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: c2-shadow-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c2-shadow-bundle/c2-shadow-inputs.zip
            ${{ runner.temp }}/c2-shadow-bundle/c2-shadow-inputs.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Require C2 same-run Neon bundle in auto mode
        if: ${{ vars.C6_AUTO_NEON_GIT_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "schedule"
          test "${{ steps.canonical_publication.outputs.canonical_persistence_status }}" = "NEON_SUCCEEDED"
          test "${{ steps.c2_bundle_source.outcome }}" = "success"
          test "${{ steps.c2_bundle_export.outcome }}" = "success"
          test -s "${RUNNER_TEMP}/c2-shadow-bundle/c2-shadow-inputs.zip"
          test -s "${RUNNER_TEMP}/c2-shadow-bundle/c2-shadow-inputs.zip.sha256"

      - name: Checkout exact same-run integration scripts (never push-enabled)
        if: ${{ vars.C6_AUTO_NEON_GIT_ENABLED == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: c6-auto-integration
          persist-credentials: false

      - name: Freeze same-run C2 checkpoint delta (no commit/push)
        if: ${{ vars.C6_AUTO_NEON_GIT_ENABLED == 'true' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=c6-auto-integration python c6-auto-integration/scripts/c6_neon_auto_git.py capture \
            --checkout "$GITHUB_WORKSPACE/kyiv-air-alerts-grafana" \
            --status "${RUNNER_TEMP}/c2_publication_status.json" \
            --input-sha "${PHASE1_INPUT_SHA}" \
            --workflow-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${RUNNER_TEMP}/c2-neon-auto-delta"

      - name: Upload same-run C2 delta for one Git-only commit
        if: ${{ vars.C6_AUTO_NEON_GIT_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: c6-neon-auto-delta-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c2-neon-auto-delta/
          if-no-files-found: error
          retention-days: 7

      - name: Commit updated production data and verified UkraineAlarm bridge checkpoint
        if: ${{ vars.C6_AUTO_NEON_GIT_ENABLED != 'true' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          verify_remote_bridge() {
            git show origin/site-prod:kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json > "${RUNNER_TEMP}/ukrainealarm_bridge_remote.json"
            python kyiv-air-alerts-grafana/scripts/validate_bridge_checkpoint.py validate \
              --candidate kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json \
              --summary kyiv-air-alerts-grafana/data/dashboard_data.json \
              --baseline "${RUNNER_TEMP}/ukrainealarm_bridge_before.json" \
              --remote "${RUNNER_TEMP}/ukrainealarm_bridge_remote.json" \
              --diagnostic "${RUNNER_TEMP}/ukrainealarm_bridge_fetch.json"
          }

          verify_expected_output() {
            python kyiv-air-alerts-grafana/scripts/verify_c2_publication_snapshot.py verify \
              --root kyiv-air-alerts-grafana \
              --manifest "${RUNNER_TEMP}/c2-publication-snapshot.json"
          }

          # Compare the staged, QA-verified bytes with the ACTUAL remote.
          # This also handles a lost Git push acknowledgment and no-op reruns.
          remote_matches() {
            git fetch origin site-prod || return 1
            verify_expected_output || return 1
            git diff --cached --quiet origin/site-prod -- \
              kyiv-air-alerts-grafana/data \
              kyiv-air-alerts-grafana/grafana/dashboard.json || return 1
            remote_sha="$(git ls-remote origin refs/heads/site-prod | awk 'NR==1 {print $1}')" || return 1
            [ -n "$remote_sha" ] && [ "$remote_sha" = "$(git rev-parse origin/site-prod)" ]
          }

          # Only capture after DB commit receipt and 23-city QA.
          python kyiv-air-alerts-grafana/scripts/verify_c2_publication_snapshot.py capture \
            --root kyiv-air-alerts-grafana \
            --manifest "${RUNNER_TEMP}/c2-publication-snapshot.json"
          git fetch origin site-prod
          verify_remote_bridge
          git add kyiv-air-alerts-grafana/data kyiv-air-alerts-grafana/grafana/dashboard.json

          if git diff --cached --quiet; then
            if remote_matches; then
              echo "No local changes; exact remote publication verified"
            else
              echo "::error::No local changes but remote output is not the QA-verified canonical dataset"
              exit 1
            fi
          else
            git commit -m "Publish verified canonical data and UkraineAlarm checkpoint"
            for attempt in 1 2 3; do
              if remote_matches; then
                echo "Remote already has verified output (retry/lost push ACK)"
                exit 0
              fi
              if git fetch origin site-prod && git rebase origin/site-prod; then
                verify_remote_bridge
                verify_expected_output
                if git push origin HEAD:site-prod; then
                  if remote_matches; then
                    echo "Verified output published and confirmed on remote"
                    exit 0
                  fi
                  echo "::error::Push returned success but remote output could not be confirmed"
                  exit 1
                fi
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Git publication not confirmed after 3 attempts"
                exit 1
              fi
              echo "Git publication retry ${attempt}"
              sleep $((attempt * 2))
            done
          fi

      - name: Upload UkraineAlarm bridge fetch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukrainealarm-bridge-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ukrainealarm_bridge_fetch.json
          if-no-files-found: warn
          retention-days: 7

  # Same-run Neon candidate preparation only; never changes existing Git delivery.
  c6-neon-six-json-prepare:
    needs: update-site
    if: ${{ (vars.C6_NEON_JSON_PREPARE_ENABLED == 'true' || vars.C6_AUTO_NEON_GIT_ENABLED == 'true') && needs.update-site.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.c6_final_prepare_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    environment: c6-neon-shadow-readonly
    steps:
      - name: Checkout exact integration code with no push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: integration
          persist-credentials: false
      - name: Checkout pinned six-JSON read-only generator
        uses: actions/checkout@v4
        with:
          ref: 82a7cc775ed2f2a6fd0134440db709690f0c04d1
          path: reader
          persist-credentials: false
      - name: Download same-run C2 artifact
        uses: actions/download-artifact@v4
        with:
          name: c2-shadow-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-c2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact C2 SHA, writer receipt, 23 capture receipts
        env:
          PYTHONPATH: integration
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          from scripts.c2_shadow_bundle import verify_archive
          root=Path("existing-c2")
          bundle=root/"c2-shadow-inputs.zip"
          sidecar=(root/"c2-shadow-inputs.zip.sha256").read_text().strip().split()
          assert len(sidecar)==2 and sidecar[1]=="c2-shadow-inputs.zip"
          digest=hashlib.sha256(bundle.read_bytes()).hexdigest()
          assert sidecar[0]==digest
          m=verify_archive(bundle,digest,destination=Path("same-run-inputs"),
              run_id=os.environ["GITHUB_RUN_ID"],workflow_sha=os.environ["GITHUB_SHA"])
          assert m["github_run_attempt"]==int(os.environ["GITHUB_RUN_ATTEMPT"])
          assert len(m.get("historical_capture_receipts",{}).get("complete_cities",[]))==23
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for key,value in {
                  "C6_INPUT_SHA":m["input_sha"],"C6_BRANCH":m["db_branch"],
                  "C6_ENDPOINT":m["db_endpoint"],"C6_CORPUS":m["corpus_sha256"],
                  "C6_BUNDLE_SHA":digest}.items(): f.write(key+"="+str(value)+"\n")
          print("EXACT_SAME_RUN_C2_AND_23_RECEIPTS_PASS")
          PY
      - name: Checkout original C2 input source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.C6_INPUT_SHA }}
          path: pinned-site
          persist-credentials: false
      - name: Pin PR93 parser blob and restore same-run data
        run: |
          set -euo pipefail
          python integration/scripts/c6_pr93_generator_compat.py \
            --generator reader/scripts/neon_json_shadow_generator.py \
            --site-parser pinned-site/kyiv-air-alerts-grafana/scripts/add_sevastopol_exact.py
          cp -a same-run-inputs/site_data/. pinned-site/kyiv-air-alerts-grafana/data/
      - name: Install accepted read-only reader dependencies
        run: python -m pip install -r reader/research/neon_json_shadow_frontend_2026_10_31/offline_proof/requirements.lock.txt
      - name: Physical same-run Neon readback and six-JSON generation
        working-directory: reader
        env:
          NEON_JSON_SHADOW_READONLY_DATABASE_URL: ${{ secrets.NEON_JSON_SHADOW_READONLY_DATABASE_URL }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m scripts.neon_json_shadow_physical_proof \
            --site ../pinned-site/kyiv-air-alerts-grafana \
            --bundle ../existing-c2/c2-shadow-inputs.zip --bundle-sha256 "$C6_BUNDLE_SHA" \
            --workflow-sha "$GITHUB_SHA" --input-sha "$C6_INPUT_SHA" \
            --db-branch "$C6_BRANCH" --db-endpoint "$C6_ENDPOINT" \
            --c2-run-id "$GITHUB_RUN_ID" --output ../c6-live-proof
      - name: Recheck current freshness; stage six-file candidate outside production
        env:
          PYTHONPATH: integration
        run: |
          python -m scripts.c6_neon_git_candidate \
            --proof c6-live-proof --site pinned-site/kyiv-air-alerts-grafana \
            --output c6-prepared --c2-corpus "$C6_CORPUS" --db-branch "$C6_BRANCH" \
            --input-sha "$C6_INPUT_SHA" --workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --bundle-sha256 "$C6_BUNDLE_SHA"
      - name: Checkout Git delivery for local detached commit only
        uses: actions/checkout@v4
        with:
          ref: site-prod
          path: local-git-only
          persist-credentials: false
      - name: Create one isolated six-file Git commit without any remote
        env:
          PYTHONPATH: integration
        run: |
          set -euo pipefail
          git -C local-git-only checkout --detach
          git -C local-git-only remote remove origin
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.c6_neon_git_candidate import local_commit
          root=Path("c6-prepared")
          report=json.loads((root/"REPORT.json").read_text())
          report["local_candidate_commit"]=local_commit(root,Path("local-git-only"),report)
          report["remote_publication_performed"]=False
          (root/"REPORT.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("LOCAL_COMMIT_ONLY; NO_PUSH; NO_DEPLOY")
          PY
      - name: Upload preparation result, never candidate publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-neon-git-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            c6-prepared/REPORT.json
            c6-prepared/candidate/**
            c6-live-proof/**
          if-no-files-found: warn
          retention-days: 30

  # Scheduled four-hour Git-only update, enabled by ONE default-OFF variable.
  c6-neon-auto-git-publish:
    needs: [update-site, c6-neon-six-json-prepare]
    if: ${{ github.event_name == 'schedule' && vars.C6_AUTO_NEON_GIT_ENABLED == 'true' && needs.update-site.result == 'success' && needs.c6-neon-six-json-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact integration code without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: integration
          persist-credentials: false
      - name: Check out live site-prod for the one Git update
        uses: actions/checkout@v4
        with:
          ref: site-prod
          fetch-depth: 0
          path: live-site
      - name: Download same-run C2 delta
        uses: actions/download-artifact@v4
        with:
          name: c6-neon-auto-delta-${{ github.run_id }}-${{ github.run_attempt }}
          path: c6-delta
      - name: Download validated Neon readback and candidate
        uses: actions/download-artifact@v4
        with:
          name: c6-neon-git-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: c6-prepared
      - name: One atomic site-prod Git commit, zero Netlify calls
        env:
          PYTHONPATH: integration
          C6_AUTO_NEON_GIT_ENABLED: ${{ vars.C6_AUTO_NEON_GIT_ENABLED }}
          NETLIFY_DEPLOYMENTS_PER_UPDATE: '0'
        run: |
          set -euo pipefail
          python -m scripts.c6_neon_auto_git publish \
            --checkout live-site \
            --delta c6-delta \
            --prepared c6-prepared/c6-prepared \
            --proof c6-prepared/c6-live-proof \
            --workflow-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}"
          echo "NETLIFY_DEPLOYMENTS_PER_UPDATE=0"

  # Release byte preparation is independent of normal C2 and the Git publisher.
  c6-neon-final-prepare-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.c6_final_prepare_only && !inputs.c6_neon_git_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    environment: c6-final-prepare-only
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARE_ENABLED: ${{ vars.C6_FINAL_PREPARE_ENABLED }}
      PREPARE_OWNER_RECEIPT: ${{ secrets.C6_FINAL_PREPARE_OWNER_RECEIPT_JSON }}
      PREP_ARTIFACT_ID: ${{ inputs.c6_preparation_artifact_id }}
      WORK_A_ARTIFACT_ID: ${{ inputs.work_a_proof_artifact_id }}
      C2_BUNDLE_ARTIFACT_ID: ${{ inputs.c6_bundle_artifact_id }}
    steps:
      - name: Require distinct owner PREPARE ONLY receipt before any download
        run: |
          set -euo pipefail
          test "$PREPARE_ENABLED" = "true"
          test -n "$PREPARE_OWNER_RECEIPT"
          # Work M recovery has no original C2 preparation artifact.
          [[ "$WORK_A_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$C2_BUNDLE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/c6-final"
          printf '%s' "$PREPARE_OWNER_RECEIPT" > "$RUNNER_TEMP/c6-final/owner.json"
          chmod 600 "$RUNNER_TEMP/c6-final/owner.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"c6-final/owner.json").read_text())
          assert a.get("decision")=="APPROVE_PREPARE_ONLY_NO_PUBLICATION"
          assert a.get("prepare_code_sha")==os.environ["GITHUB_SHA"]
          assert a.get("repository")==os.environ["GITHUB_REPOSITORY"]
          # Checkout has not happened yet: no module import at this gate.
          # The exact-pair hash/run/JOB validation runs after checkout.
          RECOVERY_SCHEMA="c6-final-release-prepare-only-work-l-v1"
          if a.get("schema")==RECOVERY_SCHEMA:
              assert a.get("provenance_contract")=="C2_FAILED_PRERUN_C6_WORKL_PHYSICAL_PROOF_V1"
              assert not os.environ.get("PREP_ARTIFACT_ID")
              assert not a.get("c2_artifact_id")
              assert not a.get("c2_artifact_sha256")
          else:
              assert a.get("schema")=="c6-final-release-prepare-only-v1"
              assert os.environ["PREP_ARTIFACT_ID"].isdigit()
              assert a.get("c2_artifact_id")==int(os.environ["PREP_ARTIFACT_ID"])
          assert a.get("c2_bundle_artifact_id")==int(os.environ["C2_BUNDLE_ARTIFACT_ID"])
          assert a.get("work_a_artifact_id")==int(os.environ["WORK_A_ARTIFACT_ID"])
          print("PREPARE_ONLY_OWNER_RECEIPT_PRESENT; NO_PUBLICATION")
          PY
      - name: Checkout exact integration code without Git push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned GitHub Actions evidence (no source HTTP)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c6-final"
          C2_RUN_ID="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["c2_run_id"])' "$root/owner.json")"
          WORK_A_RUN_ID="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["work_a_run_id"])' "$root/owner.json")"
          [[ "$C2_RUN_ID" =~ ^[0-9]+$ && "$WORK_A_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$C2_RUN_ID" > "$root/c2-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORK_A_RUN_ID" > "$root/work-a-run.json"
          RECOVERY_MODE="$(python -c 'import json,sys; from scripts.c6_neon_final_prepare import RECOVERY_SCHEMA; print("true" if json.load(open(sys.argv[1])).get("schema")==RECOVERY_SCHEMA else "false")' "$root/owner.json")"
          if [ "$RECOVERY_MODE" = "true" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$C2_RUN_ID/jobs?per_page=100" > "$root/c2-jobs.json"
          fi
          for kind in c2 c2_bundle work_a; do
            if [ "$kind" = "c2" ] && [ "$RECOVERY_MODE" = "true" ]; then
              continue
            fi
            case "$kind" in
              c2) id="$PREP_ARTIFACT_ID" ;;
              c2_bundle) id="$C2_BUNDLE_ARTIFACT_ID" ;;
              work_a) id="$WORK_A_ARTIFACT_ID" ;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$root/$kind-artifact.json"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$root/$kind.zip"
          done
      - name: Verify immutable evidence and produce eight FINAL files
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c6-final"
          # Explicit recovery source; original path remains unchanged.
          extra=()
          if test -f "$root/c2-jobs.json"; then
            extra+=(--c2-jobs "$root/c2-jobs.json")
          else
            extra+=(--c2-artifact "$root/c2-artifact.json" --c2-zip "$root/c2.zip")
          fi
          python -m scripts.c6_neon_final_prepare \
            --receipt "$root/owner.json" \
            --c2-run "$root/c2-run.json" --work-a-run "$root/work-a-run.json" \
            --c2-bundle-artifact "$root/c2_bundle-artifact.json" \
            --work-a-artifact "$root/work_a-artifact.json" \
            --c2-bundle-zip "$root/c2_bundle.zip" \
            --work-a-zip "$root/work_a.zip" \
            --output "$root/final" --audit "$root/PREPARE_REPORT.json" \
            --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --code-sha "$GITHUB_SHA" \
            "${extra[@]}"
          test "$(find "$root/final" -type f | wc -l)" -eq 8
          echo "EIGHT_FINAL_FILES_PREPARED; NO_PUSH_OR_DEPLOY"
      - name: Upload exact final ZIP as owner-pinnable immutable GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: c6-neon-final-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c6-final/final/
          if-no-files-found: error
          retention-days: 30
      - name: Upload independent nonpublishing preparation receipt
        uses: actions/upload-artifact@v4
        with:
          name: c6-neon-final-prepare-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c6-final/PREPARE_REPORT.json
          if-no-files-found: error
          retention-days: 30

  # Explicit manual release is exclusive with normal C2 through the SAME
  # workflow-level concurrency group. No generator, updater, Neon writer or
  # source HTTP is invoked by this job.
  c6-neon-owner-gated-git-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.c6_neon_git_release && !inputs.c6_final_prepare_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: c6-neon-git-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ENABLED: ${{ vars.C6_NEON_GIT_RELEASE_ENABLED }}
      GIT_ONLY_PUBLISHER_PAUSED: ${{ vars.C6_GIT_ONLY_PUBLISHER_PAUSED }}
      OWNER_GRANT_JSON: ${{ secrets.C6_NEON_GIT_OWNER_GRANT_JSON }}
      PREP_ARTIFACT_ID: ${{ inputs.c6_preparation_artifact_id }}
      WORK_A_ARTIFACT_ID: ${{ inputs.work_a_proof_artifact_id }}
      FINAL_ARTIFACT_ID: ${{ inputs.c6_final_release_artifact_id }}
    steps:
      - name: Fail closed without separate owner release switch and receipt
        run: |
          set -euo pipefail
          test "$RELEASE_ENABLED" = "true"
          test "$GIT_ONLY_PUBLISHER_PAUSED" = "true"
          test -n "$OWNER_GRANT_JSON"
          [[ "$PREP_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$WORK_A_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$FINAL_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          install -m 700 -d "$RUNNER_TEMP/c6-release"
          printf '%s' "$OWNER_GRANT_JSON" > "$RUNNER_TEMP/c6-release/owner.json"
          chmod 600 "$RUNNER_TEMP/c6-release/owner.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          approval=json.loads((Path(os.environ["RUNNER_TEMP"])/"c6-release/owner.json").read_text())
          assert approval.get("decision")=="APPROVE_ONE_SHOT_NEON_GIT_PUBLICATION"
          if approval.get("schema")=="c6-approved-one-shot-neon-git-work-m-v1":
              assert approval.get("provenance_contract")=="C2_FAILED_PRERUN_C6_WORKL_PHYSICAL_PROOF_V1"
              assert int(os.environ["PREP_ARTIFACT_ID"])==13991878472
              assert approval.get("c2_artifact_id")==13991878472
              assert not approval.get("candidate_artifact_id")
          else:
              assert approval.get("schema")=="c6-approved-one-shot-neon-git-v1"
              assert approval.get("candidate_artifact_id")==int(os.environ["PREP_ARTIFACT_ID"])
          assert approval.get("work_a_artifact_id")==int(os.environ["WORK_A_ARTIFACT_ID"])
          assert approval.get("final_release_artifact_id")==int(os.environ["FINAL_ARTIFACT_ID"])
          print("EXPLICIT_OWNER_RECEIPT_AND_ARTIFACT_IDS_PRESENT")
          PY
      - name: Check out exact release code with owner-gated workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: integration
          persist-credentials: false
      - name: Check out current Git-only site-prod (sole push-enabled checkout)
        uses: actions/checkout@v4
        with:
          ref: site-prod
          path: live-site
          fetch-depth: 0
      - name: Fetch pinned GitHub evidence (not from source HTTP or Neon)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c6-release"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"c6-release/owner.json").read_text())
          for key in ("c2_run_id","work_a_run_id","work_a_artifact_id",
                      "final_release_artifact_id","final_release_run_id"):
              assert type(a.get(key)) is int and a[key]>0
          if a.get("schema")=="c6-approved-one-shot-neon-git-work-m-v1":
              assert a.get("c2_artifact_id")==13991878472
              assert a.get("final_prepare_report_artifact_id")==14025729121
              assert a.get("final_release_run_id")==43403595621
          else:
              assert type(a.get("candidate_artifact_id")) is int
              assert a["candidate_artifact_id"]>0
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREP_ARTIFACT_ID" > "$root/c2-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$WORK_A_ARTIFACT_ID" > "$root/work-a-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FINAL_ARTIFACT_ID" > "$root/final-artifact.json"
          RECOVERY="$(python -c 'import json,sys; print("true" if json.load(open(sys.argv[1])).get("schema")=="c6-approved-one-shot-neon-git-work-m-v1" else "false")' "$root/owner.json")"
          if [ "$RECOVERY" = "true" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14025729121" > "$root/work-m-report-artifact.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/43321997695/jobs?per_page=100" > "$root/c2-jobs.json"
          fi
          C2_RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["c2_run_id"])' "$root/owner.json")"
          WORK_A_RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["work_a_run_id"])' "$root/owner.json")"
          FINAL_RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["final_release_run_id"])' "$root/owner.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$C2_RUN_ID" > "$root/c2-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORK_A_RUN_ID" > "$root/work-a-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINAL_RUN_ID" > "$root/final-run.json"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREP_ARTIFACT_ID/zip" -o "$root/prep.zip"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$WORK_A_ARTIFACT_ID/zip" -o "$root/work-a.zip"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FINAL_ARTIFACT_ID/zip" -o "$root/final.zip"
          if [ "$RECOVERY" = "true" ]; then
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14025729121/zip" -o "$root/work-m-report.zip"
          fi
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"c6-release"
          a=json.loads((r/"owner.json").read_text())
          recovery=a.get("schema")=="c6-approved-one-shot-neon-git-work-m-v1"
          items=[("c2","prep.zip","c2_artifact_sha256" if recovery else "candidate_artifact_sha256"),
                 ("work-a","work-a.zip","work_a_artifact_sha256"),
                 ("final","final.zip","final_release_artifact_sha256")]
          if recovery:
              items.append(("work-m-report","work-m-report.zip","final_prepare_report_artifact_sha256"))
          for kind,file,key in items:
              expected=a[key]
              assert isinstance(expected,str) and len(expected)==64
              assert hashlib.sha256((r/file).read_bytes()).hexdigest()==expected
              remote=json.loads((r/(kind+"-artifact.json")).read_text())
              assert remote["digest"]=="sha256:"+expected and not remote["expired"]
          print("EXACT_ARTIFACT_ZIP_DIGESTS_PASS")
          PY
      - name: Safely unpack immutable six-JSON and full independent Work A proof
        run: |
          set -euo pipefail
          PYTHONPATH=integration python - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"c6-release"
          def extract(archive,output):
              with zipfile.ZipFile(root/archive) as z:
                  for member in z.infolist():
                      p=Path(member.filename)
                      assert not p.is_absolute() and not any(x==".." for x in p.parts)
                      assert member.file_size<=64*1024*1024
                  z.extractall(root/output)
          approval=json.loads((root/"owner.json").read_text())
          recovery=approval.get("schema")=="c6-approved-one-shot-neon-git-work-m-v1"
          if recovery:
              # prep.zip is the original C2 bundle here, never a fabricated prep artifact.
              extract("work-m-report.zip","work-m-report")
              extract("final.zip","work-m-final")
              prepared=root/"work-m-final"
              reports=list((root/"work-m-report").rglob("PREPARE_REPORT.json"))
              assert len(reports)==1
              report=reports[0]
              assert (prepared/"RELEASE_BINDING.json").is_file()
          else:
              extract("prep.zip","prepared-zip")
              prepared=root/"prepared-zip"
              reports=list(prepared.rglob("REPORT.json"))
              assert len(reports)==1
              report=reports[0]
          extract("work-a.zip","work-a-zip")
          assert (prepared/"candidate/historical-daily-kpi.json").is_file()
          (root/"prepared-path.txt").write_text(str(prepared))
          (root/"report-path.txt").write_text(str(report))
          proof_roots=[p.parent for p in (root/"work-a-zip").rglob("sha256_manifest.json")]
          assert len(proof_roots)==1
          (root/"work-a-path.txt").write_text(str(proof_roots[0]))
          print("EXACT_PREPARED_AND_WORK_A_ARTIFACTS_UNPACKED")
          PY
      - name: Verify approved deployed Netlify root KPI bytes before Git commit
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c6-release"
          curl --fail --show-error --silent --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "https://ukraine-air-alerts.netlify.app/historical-daily-kpi.json" \
            --output "$root/netlify-static-kpi.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"c6-release"
          approval=json.loads((root/"owner.json").read_text())
          assert approval.get("netlify_http_static_verified") is True
          expected=approval["approved_netlify_static_kpi_sha256"]
          actual=hashlib.sha256((root/"netlify-static-kpi.json").read_bytes()).hexdigest()
          assert actual==expected, "NETLIFY_STATIC_KPI_SHA_MISMATCH"
          index=json.loads((root/"netlify-static-kpi.json").read_text())
          assert index["meta"]["source_dashboard_generated_at"]==approval["approved_generation"]
          assert index["meta"]["release_manifest_sha256"]==approval["release_manifest_sha256"]
          print("EXACT_NETLIFY_STATIC_KPI_HTTP_SHA_PASS")
          PY
      - name: Validate owner receipt and six FINAL bytes; then single fast-forward Git push
        env:
          PYTHONPATH: integration
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c6-release"
          WORK_N_EXTRA_ARGS=()
          if test -f "$root/c2-jobs.json"; then
            WORK_N_EXTRA_ARGS+=(--work-m-report-artifact "$root/work-m-report-artifact.json"
                                --c2-jobs "$root/c2-jobs.json")
          fi
          python -m scripts.c6_neon_one_shot_publisher \
            --approval "$root/owner.json" \
            --report "$(cat "$root/report-path.txt")" \
            --work-a-proof "$(cat "$root/work-a-path.txt")" \
            --prepared "$(cat "$root/prepared-path.txt")" \
            --checkout live-site \
            --c2-run "$root/c2-run.json" \
            --work-a-run "$root/work-a-run.json" \
            --c2-artifact "$root/c2-artifact.json" \
            --work-a-artifact "$root/work-a-artifact.json" \
            --final-artifact "$root/final-artifact.json" \
            --final-run "$root/final-run.json" \
            --final-zip "$root/final.zip" \
            ${WORK_N_EXTRA_ARGS[@]} \
            --repository "$GITHUB_REPOSITORY"
