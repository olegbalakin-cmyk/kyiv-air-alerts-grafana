name: Permanent Lviv canonical repair gate

on:
  push:
    branches:
      - multicity-scheduled-production-shadow-enablement-proof-2026-10-01
    paths:
      - ".github/workflows/permanent-lviv-canonical-repair-gate.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt
      - run: pip install -r requirements-db-phase1.txt
      - name: Fresh Lviv repair tests
        run: python -m unittest tests.test_lviv_canonical_boundary_repair
      - name: Apply proven repair to permanent shadow
        env:
          DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          DB_BRANCH: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
        run: python scripts/lviv_canonical_boundary_repair.py --db-branch "$DB_BRANCH"
