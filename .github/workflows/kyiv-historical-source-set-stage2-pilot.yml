name: Kyiv historical source-set Stage 2 development-only pilot
on:
  push:
    branches:
      - kyiv-historical-source-set-stage2-2026-10-09
    paths:
      - ".github/proof/kyiv_historical_source_set_stage2_pilot.py"
      - ".github/workflows/kyiv-historical-source-set-stage2-pilot.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kyiv-historical-source-set-stage2-2026-10-09
  cancel-in-progress: false
jobs:
  frozen-development-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout isolated Stage 2 development-only branch
        uses: actions/checkout@v4
        with:
          ref: kyiv-historical-source-set-stage2-2026-10-09
          fetch-depth: 0
          clean: true
          persist-credentials: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing native article extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Prohibit database configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected database configuration: $key"; exit 1; }
          done
      - name: Compile only stage-2 proof Python
        run: python -m py_compile .github/proof/kyiv_historical_source_set_stage2_pilot.py
      - name: Run frozen development-only source eligibility replay
        run: python .github/proof/kyiv_historical_source_set_stage2_pilot.py
      - name: Upload only two stage-2 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-historical-source-set-stage2-${{ github.run_id }}
          path: |
            research/kyiv_historical_source_set_stage2_candidates_2026-10-09.json
            research/kyiv_historical_source_set_stage2_pilot_2026-10-09.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist only two development-only proof JSON artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f research/kyiv_historical_source_set_stage2_candidates_2026-10-09.json
          test -f research/kyiv_historical_source_set_stage2_pilot_2026-10-09.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/kyiv_historical_source_set_stage2_candidates_2026-10-09.json
          git add research/kyiv_historical_source_set_stage2_pilot_2026-10-09.json
          while IFS= read -r changed; do
            case "$changed" in
              research/kyiv_historical_source_set_stage2_candidates_2026-10-09.json|research/kyiv_historical_source_set_stage2_pilot_2026-10-09.json) ;;
              *) echo "Unauthorized path: $changed"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record only bounded Kyiv historical Stage 2 development source-set proof"
          git push origin HEAD:kyiv-historical-source-set-stage2-2026-10-09
