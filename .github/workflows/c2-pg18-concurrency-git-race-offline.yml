name: C2 full migration PG18 + process concurrency + isolated Git race
on:
  push:
    branches: [research-c2-pg18-concurrency-git-race-2026-10-27-gpt6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2-full-ddl-concurrency-and-git:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: c2_test
          POSTGRES_PASSWORD: c2_test
          POSTGRES_DB: c2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c2_test -d c2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local-only test runtime
        run: python -m pip install "psycopg[binary]>=3,<4"
      - name: Run new exact-DDL concurrency and Git race tests
        env:
          C2_TEST_DATABASE_URL: postgresql://c2_test:c2_test@127.0.0.1:5432/c2_test
        run: python -m unittest discover -s kyiv-air-alerts-grafana/tests -p test_multicity_c2_release_stage.py -v
