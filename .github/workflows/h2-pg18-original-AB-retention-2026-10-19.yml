name: H2 PG18 raw A-B Git-only archive verification
on:
  push:
    branches: [research-h2-neon-view-pg18-raw-AB-retention-2026-10-19]
    paths:
      - '.github/workflows/h2-pg18-original-AB-retention-2026-10-19.yml'
      - 'research/h2_neon_view_pg18_original_AB_reports_2026-10-19.json.xz.b64'
      - 'research/h2_neon_view_pg18_original_AB_manifest_2026-10-19.json'
      - 'research/h2_verify_view_pg18_original_AB_2026-10-19.py'
permissions:
  contents: read
jobs:
  archive-verification:
    name: Git-only A/B archive and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact archived JSON and fail-closed controls
        run: python3 research/h2_verify_view_pg18_original_AB_2026-10-19.py
