name: Live RSS evidence durability proof

on:
  push:
    branches:
      - live-rss-evidence-durability-proof-2026-10-04
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/tests/test_live_rss_evidence_durability.py"
      - ".github/workflows/live-rss-evidence-durability-proof.yml"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOF_BASE: "adeb526e282c153d6f7d7dc60ec404d6d6160b29"
      REPAIR_COMMIT: "d0bb9f9f818c232f15f3ab088f02779eec8877b9"
      HISTORICAL_STATE_COMMIT: "22d32a3f5e9e293aec94cef41b063a2eb715c1ad"
      EXPECTED_STATE_BLOB: "c8d799094e8360443d09702a62598cb735fb2335"
      EXPECTED_QUEUE_BLOB: "b10ed4376a9950c8b45e4893e415565e182fb44e"
      FROZEN_RUN_ID: "37209953519"
      FROZEN_ARTIFACT_ID: "11306780326"
      FROZEN_ARTIFACT_SHA256: "ddb2f3bfa5ad5a41ff49aaf72839067abb5e14551cd82efc99477fd09bad6fc3"
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact base and bounded mutation scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PROOF_BASE" HEAD)" = "$PROOF_BASE"
          test "$(git rev-parse "$REPAIR_COMMIT^")" = "$PROOF_BASE"
          changed="$(git diff --name-only "$PROOF_BASE"...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates\.py|kyiv-air-alerts-grafana/tests/test_live_rss_evidence_durability\.py|\.github/workflows/live-rss-evidence-durability-proof\.yml)$' || true)"
          test -z "$unexpected"

          python - <<'PY'
          import ast, os, subprocess
          from pathlib import Path

          path = "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
          base = subprocess.check_output(["git", "show", f"{os.environ['PROOF_BASE']}:{path}"], text=True)
          current = Path(path).read_text(encoding="utf-8")

          def funcs(text):
              tree = ast.parse(text)
              return {
                  n.name: ast.dump(n, include_attributes=False)
                  for n in tree.body
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
              }

          before, after = funcs(base), funcs(current)
          changed = sorted(name for name in set(before) | set(after) if before.get(name) != after.get(name))
          expected = sorted([
              "add_candidates",
              "enrich_rss_candidate_for_durability",
              "main",
              "rss_durability_enrichment_eligible",
          ])
          assert changed == expected, (changed, expected)

          for frozen in (
              "build_google_news_candidate",
              "classification_text",
              "classify_candidate",
              "temporal_binding_evidence",
              "strict_attack_event_signal",
              "strict_explosion_evidence",
              "air_military_context_evidence",
              "same_attack_context_evidence",
              "publisher_fulltext_requires_review",
              "match_candidate_to_episodes",
              "fetch_publisher_fulltext",
              "search_city_news",
          ):
              assert before.get(frozen) == after.get(frozen), frozen
          print("BOUNDED_AST_SCOPE_OK", changed)
          PY

          queue_blob="$(git rev-parse "$HISTORICAL_STATE_COMMIT:kyiv-air-alerts-grafana/data/explosion_review_queue.json")"
          state_blob="$(git rev-parse "$HISTORICAL_STATE_COMMIT:kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json")"
          test "$queue_blob" = "$EXPECTED_QUEUE_BLOB"
          test "$state_blob" = "$EXPECTED_STATE_BLOB"
          git show "$HISTORICAL_STATE_COMMIT:kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json" > /tmp/holdout-state.json

      - name: Download exact accepted frozen replay artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" > /tmp/frozen.zip
          echo "${FROZEN_ARTIFACT_SHA256}  /tmp/frozen.zip" | sha256sum -c -
          mkdir -p /tmp/frozen
          unzip -q /tmp/frozen.zip -d /tmp/frozen
          test -s /tmp/frozen/kyiv_holdout_final_stack_raw_replay.json
          test -s /tmp/frozen/kyiv_holdout_final_stack_validation.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run focused durability tests
        working-directory: kyiv-air-alerts-grafana
        run: python -m pytest -q tests/test_live_rss_evidence_durability.py

      - name: Run full relevant regressions
        working-directory: kyiv-air-alerts-grafana
        run: |
          python -m pytest -q tests
          python scripts/monitor_explosion_candidates.py --self-test

      - name: Prove fixture and frozen holdout invariance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import copy
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd() / "kyiv-air-alerts-grafana"
          sys.path.insert(0, str(root / "scripts"))
          import monitor_explosion_candidates as monitor

          UTC = timezone.utc

          def ep(eid, start, end):
              return {
                  "episode_id": eid,
                  "city_key": "poltava",
                  "city": "Полтава",
                  "alert_start": start,
                  "alert_end": end,
              }

          episodes = [
              ep("early", "2026-10-04T00:10:00Z", "2026-10-04T00:40:00Z"),
              ep("target", "2026-10-04T18:00:00Z", "2026-10-04T18:40:00Z"),
          ]
          row = {
              "title": "У Полтаві під час атаки БпЛА пролунав вибух",
              "snippet": "У Полтаві під час атаки БпЛА пролунав вибух.",
              "url": "https://news.google.test/articles/eligible",
              "publisher": "Fixture News",
              "publisher_url": "https://fixture.test",
              "published_at": "2026-10-04T18:50:00Z",
              "source": "Google News RSS",
              "discovery_basis": "rss_title_snippet",
              "resolved_url": None,
              "matched_text_excerpt": "У Полтаві під час атаки БпЛА пролунав вибух.",
          }
          before = monitor.classify_candidate(row, "poltava", episodes)

          calls = []
          def fixture_fetcher(url):
              calls.append(url)
              return (
                  "О 21:17 у Полтаві під час атаки БпЛА пролунав вибух. "
                  "Подія сталася під час повітряної тривоги.",
                  "https://fixture.test/news/poltava-attack",
              )

          cache = {}
          enriched, fetched, succeeded = monitor.enrich_rss_candidate_for_durability(
              row, before, fulltext_fetcher=fixture_fetcher, fetch_cache=cache
          )
          after = monitor.classify_candidate(enriched, "poltava", episodes)
          assert fetched and succeeded
          assert calls == [row["url"]]
          assert enriched["resolved_url"] == "https://fixture.test/news/poltava-attack"
          assert "21:17" in enriched["matched_text_excerpt"]
          assert enriched["title"] == row["title"]
          assert enriched["snippet"] == row["snippet"]
          assert enriched["published_at"] == row["published_at"]
          assert enriched["discovery_basis"] == "rss_title_snippet"
          assert before["proposed_outcome"] == after["proposed_outcome"]
          assert before["proposed_matched_episode_id"] == after["proposed_matched_episode_id"]
          assert before["reason_codes"] == after["reason_codes"]
          assert before["candidate_evidence"] == after["candidate_evidence"]

          second, second_fetched, second_ok = monitor.enrich_rss_candidate_for_durability(
              copy.deepcopy(row), before, fulltext_fetcher=fixture_fetcher, fetch_cache=cache
          )
          assert second_ok and not second_fetched
          assert len(calls) == 1
          assert second["resolved_url"] == enriched["resolved_url"]

          fail_row, fail_fetched, fail_ok = monitor.enrich_rss_candidate_for_durability(
              row,
              before,
              fulltext_fetcher=lambda url: (None, None),
              fetch_cache={},
          )
          assert fail_fetched and not fail_ok
          assert fail_row is row
          fail_after = monitor.classify_candidate(fail_row, "poltava", episodes)
          assert fail_after["proposed_outcome"] == before["proposed_outcome"]
          assert fail_after["candidate_evidence"] == before["candidate_evidence"]

          raw_path = Path("/tmp/frozen/kyiv_holdout_final_stack_raw_replay.json")
          val_path = Path("/tmp/frozen/kyiv_holdout_final_stack_validation.json")
          raw_bytes = raw_path.read_bytes()
          raw = json.loads(raw_bytes)
          old_validation = json.loads(val_path.read_text(encoding="utf-8"))
          state = json.loads(Path("/tmp/holdout-state.json").read_text(encoding="utf-8"))

          def forbidden_network(*args, **kwargs):
              raise AssertionError("NETWORK_FORBIDDEN_IN_FROZEN_PROOF")
          monitor.requests.sessions.Session.request = forbidden_network
          monitor.requests.get = forbidden_network
          monitor.requests.post = forbidden_network
          monitor.requests.request = forbidden_network

          post_candidates = []
          for original in raw.get("reclassified_candidates") or []:
              item = copy.deepcopy(original)
              decision = monitor.dry_classify_existing_candidate(item, state)
              matching = decision.get("matching") or {
                  "outcome": "no_match",
                  "matched_episode_ids": [],
                  "logical_episode_groups": [],
                  "matched_episode_id": None,
              }
              monitor.apply_classification_decision(item, decision, matching)
              post_candidates.append(item)

          post_by_id = {
              str(row.get("candidate_id") or ""): row
              for row in post_candidates
              if row.get("candidate_id")
          }
          positive_ids = {
              str(row["episode_id"])
              for row in old_validation["episode_comparisons"]
              if row.get("truth_state") == "STRICT_TRUTH_POSITIVE"
          }
          holdout_ids = {str(row["episode_id"]) for row in old_validation["episode_comparisons"]}
          raw_eps = {str(x["episode_id"]): x for x in raw["episodes"]}
          assert len(positive_ids) == 10
          assert holdout_ids == set(raw_eps)

          def supports(row, episode_id):
              temporal = (row.get("classification_evidence") or {}).get("temporal_binding") or {}
              return (
                  str(temporal.get("episode_id") or "") == episode_id
                  or episode_id in {str(x) for x in temporal.get("supported_episode_ids") or []}
              )

          outcomes = {}
          for episode_id in sorted(holdout_ids):
              candidates = [
                  post_by_id[cid]
                  for cid in raw_eps[episode_id].get("candidate_ids") or []
                  if cid in post_by_id
              ]
              strict = [x for x in candidates if x.get("status") == "approved_strict" and supports(x, episode_id)]
              sensitivity = [x for x in candidates if x.get("status") == "approved_sensitivity" and supports(x, episode_id)]
              if strict:
                  outcomes[episode_id] = "STRICT"
              elif sensitivity:
                  outcomes[episode_id] = "SENSITIVITY"
              elif candidates:
                  outcomes[episode_id] = "REVIEW"
              else:
                  outcomes[episode_id] = "NO_CANDIDATE"

          positive = {eid: outcomes[eid] for eid in positive_ids}
          counts = {
              "STRICT": sum(v == "STRICT" for v in positive.values()),
              "SENSITIVITY": sum(v == "SENSITIVITY" for v in positive.values()),
              "REVIEW": sum(v == "REVIEW" for v in positive.values()),
          }
          assert counts == {"STRICT": 3, "SENSITIVITY": 0, "REVIEW": 7}, counts

          truth_negative_ids = holdout_ids - positive_ids
          unsupported = sorted(eid for eid in truth_negative_ids if outcomes[eid] == "STRICT")
          assert unsupported == []

          proof = {
              "schema": "live_rss_evidence_durability_proof_v1",
              "verdict": "PROVEN",
              "repo": os.environ["GITHUB_REPOSITORY"],
              "proof_branch": os.environ["GITHUB_REF_NAME"],
              "exact_base": os.environ["PROOF_BASE"],
              "repair_commit": os.environ["REPAIR_COMMIT"],
              "final_proof_head": os.environ["GITHUB_SHA"],
              "proof_run": int(os.environ["GITHUB_RUN_ID"]),
              "live_enrichment_trigger": {
                  "source": "Google News RSS",
                  "discovery_basis": "rss_title_snippet",
                  "resolved_url_absent": True,
                  "feed_exact_city": True,
                  "feed_attack_event": True,
                  "feed_air_military_context": True,
                  "feed_same_attack": True,
                  "strict_temporal_binding_absent": True,
              },
              "persisted_fields": ["resolved_url", "matched_text_excerpt"],
              "preserved_feed_fields": [
                  "title", "snippet", "published_at", "publisher", "publisher_url", "discovery_basis"
              ],
              "fixture": {
                  "before": {
                      "resolved_url": row["resolved_url"],
                      "matched_text_excerpt": row["matched_text_excerpt"],
                      "classification": before["proposed_outcome"],
                  },
                  "after": {
                      "resolved_url": enriched["resolved_url"],
                      "matched_text_excerpt": enriched["matched_text_excerpt"],
                      "classification": after["proposed_outcome"],
                  },
                  "classification_before_equals_after": True,
              },
              "fetch_failure": {
                  "fail_open": True,
                  "candidate_unchanged": True,
                  "classification_unchanged": True,
              },
              "deduplication": {
                  "scope": "in-run cache keyed by RSS target; resolved target also cached",
                  "same_rss_target_network_fetches": 1,
                  "second_representation_reused_cache": True,
              },
              "frozen_kyiv_holdout": {
                  "STRICT": counts["STRICT"],
                  "SENSITIVITY": counts["SENSITIVITY"],
                  "REVIEW": counts["REVIEW"],
                  "unsupported_STRICT": len(unsupported),
                  "historical_evidence_added": False,
                  "raw_replay_sha256": hashlib.sha256(raw_bytes).hexdigest(),
                  "accepted_replay_run": int(os.environ["FROZEN_RUN_ID"]),
                  "accepted_replay_artifact_id": int(os.environ["FROZEN_ARTIFACT_ID"]),
              },
              "mutation_scope": {
                  "temporal_classifier_semantics_changed": False,
                  "attack_event_parser_changed": False,
                  "air_context_parser_changed": False,
                  "same_attack_logic_changed": False,
                  "strict_policy_changed": False,
                  "source_trust_policy_changed": False,
                  "alert_matching_policy_changed": False,
                  "historical_evidence_changed": False,
                  "historical_state_changed": False,
                  "historical_queue_changed": False,
                  "review_queue_changed": False,
                  "canonical_alerts_changed": False,
                  "neon_schema_or_data_changed": False,
                  "backfill": False,
                  "deployment": False,
              },
          }
          Path("/tmp/live_rss_evidence_durability_proof.json").write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-rss-evidence-durability-proof
          path: /tmp/live_rss_evidence_durability_proof.json
          if-no-files-found: error
          retention-days: 30
