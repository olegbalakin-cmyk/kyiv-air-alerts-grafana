name: Preview all-cities 180d
on:
  push:
    branches: [preview-all-cities-180d-2026-10-22]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend and frozen date-range behavior
        run: |
          set -euo pipefail
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node --check kyiv-air-alerts-grafana/pages-preview/kpi-range.js
          node kyiv-air-alerts-grafana/tests/test_historical_max.js
          node kyiv-air-alerts-grafana/tests/test_kpi_interval_windows.js
          node kyiv-air-alerts-grafana/tests/test_live_history_binding.js
          python - <<'PY'
          from pathlib import Path
          html=Path("kyiv-air-alerts-grafana/pages-preview/index.html").read_text()
          app=Path("kyiv-air-alerts-grafana/pages-preview/app.js").read_text()
          sel=html.split('<select id="allCitiesRange"',1)[1].split("</select>",1)[0]
          assert '<option value="180d">180 днів</option>' in sel
          assert '"180d":tr("180 днів","180 days")' in app
          assert 'const shared180Start = window.KpiRange.validDay(sharedEnd) ? addIsoDays(sharedEnd, -179)' in app
          assert 'window.KpiRange.preciseHistoricalKpis(city, daily, shared180Start, sharedEnd)' in app
          assert 'alerts: computed?.complete ? computed.alerts : null' in app
          assert 'const TABLE_RANGES = ["7d", "30d", "90d", "180d", "year", "common", "custom"]' in app
          print("PASS 180d option, labels, 180-day window and fail-closed metrics")
          PY
      - name: Build verified historical daily file without writes
        run: |
          python -m pip install -r kyiv-air-alerts-grafana/requirements.txt
          python kyiv-air-alerts-grafana/scripts/build_preview_historical_daily.py --production-root kyiv-air-alerts-grafana --source-sha "$(git rev-parse HEAD)" --output historical-daily-kpi.json
          python - <<'PY'
          import json
          d=json.load(open("historical-daily-kpi.json"))
          assert d["meta"]["verified_count"]==23
          PY
      - name: Assemble production-shaped preview
        run: |
          set -euo pipefail
          BUILD_COMMAND="$(python - <<'PY'
          import tomllib
          with open("netlify.toml","rb") as f:
              print(tomllib.load(f)["build"]["command"])
          PY
          )"
          bash -e -c "$BUILD_COMMAND"
          test -s _site/historical-daily-kpi.json
          test -s _site/kpi-range.js
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 13
      - name: Deploy draft only, never production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy --dir=_site --alias=allcities-180d-test-20261022 --site=b5aafc46-7468-4070-baf1-db80a4d30501 --auth="$NETLIFY_AUTH_TOKEN" --json | tee preview-result.json
      - name: Verify served assets, not only deploy ready
        run: |
          set -euo pipefail
          URL="https://allcities-180d-test-20261022--ukraine-air-alerts.netlify.app"
          for asset in index.html app.js kpi-range.js historical-daily-kpi.json; do
            curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$URL/$asset?v=20261022" -o "/tmp/allcities-$asset"
          done
          cmp kyiv-air-alerts-grafana/pages-preview/app.js /tmp/allcities-app.js
          cmp kyiv-air-alerts-grafana/pages-preview/index.html /tmp/allcities-index.html
          python - <<'PY'
          import json
          h=json.load(open("/tmp/allcities-historical-daily-kpi.json"))
          assert h["meta"]["verified_count"]==23
          print("PASS HTTP preview assets and history 23/23")
          PY
