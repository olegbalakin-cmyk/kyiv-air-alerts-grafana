name: Freeze and read back independently verified Kyiv 185 evidence
on:
  push:
    branches: [proof-kyiv-185-source-recovery-acceptance-2026-10-15]
    paths: [.github/workflows/kyiv185-evidence-freeze.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  guarded-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download known verified independent receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main site-prod multicity-wip-2026-09-16
          test "$(git rev-parse origin/main)" = "d425c3475565b4db1c36c472ab967b3283811d43"
          test "$(git rev-parse origin/site-prod)" = "4649aa4fd9b97f4d72e55879befa1de130579bb1"
          test "$(git rev-parse origin/multicity-wip-2026-09-16)" = "1ae29da3efca63ca8252226dfdb284c45243d738"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/olegbalakin-cmyk/kyiv-air-alerts-grafana/actions/artifacts/11997557355/zip" -o /tmp/kyiv185-independent.zip
          echo "2b7382df6854056eab4700e0078c796afec4b0e7b0f03409194bbd4a3dbf545c  /tmp/kyiv185-independent.zip" | sha256sum --check
          mkdir -p /tmp/verified-kyiv185
          unzip -q /tmp/kyiv185-independent.zip -d /tmp/verified-kyiv185
          python - <<'PY'
          import pathlib,json,hashlib
          out=pathlib.Path("research/kyiv_185_source_recovery_acceptance_2026-10-15")
          source=pathlib.Path("/tmp/verified-kyiv185")
          expected={"kyiv_185_original_source_recovery_ledger.json":"1391cdbc2688a08a5caa06ee4735f6d56ace7553b7183b4130314c6758770127","historical_source_revision_inventory.json":"5eb740f8277a946b1e5cf8814b6db94451c1df7845629d2299929b88508f625e","provenance_reconciliation_report.json":"864c25ea1485b086cdf232210103af179c97d9e785d0982b89351a6c2b25681a","frozen_safety_and_reproducibility.json":"d4dcf1123872cc547fcd44d06c1d622cd344bc31e7c2a515d6b2c107fa904394","result_hashes.json":"2992511fd86bc4e9bc0603db40714698ab05a2a5958c694e00f2e820f5bd5baf","producer_evidence.json":"953194bb53dcf4dfa1e929e657c65db75fb78821a7bd6c7af418097d5422d529"}
          all_names=set(expected)|{"seven_unresolved_cases.json","source_producer_evidence_index.json","independent_acceptance_receipt.json"}
          files={p.name:p for p in source.rglob("*.json")}
          assert set(files)==all_names, (set(files),all_names)
          receipt=json.loads(files["independent_acceptance_receipt.json"].read_bytes())
          assert receipt["verdict"]=="PASS"
          assert receipt["github_actions_run_id"]=="38785849734"
          assert (receipt["exact_historical_source_matches"],receipt["producer_evidence_gaps"],receipt["runtime_git_sha_pins"],receipt["modern_id_equivalence_proven"])==(178,7,0,0)
          for name in expected:
           assert hashlib.sha256(files[name].read_bytes()).hexdigest()==expected[name],name
          assert hashlib.sha256(files["seven_unresolved_cases.json"].read_bytes()).hexdigest()==receipt["seven_unresolved_register_sha256"]
          assert hashlib.sha256(files["source_producer_evidence_index.json"].read_bytes()).hexdigest()==receipt["normalized_evidence_index_sha256"]
          assert json.loads(files["seven_unresolved_cases.json"].read_bytes())["count"]==7
          assert json.loads(files["source_producer_evidence_index.json"].read_bytes())["count"]==185
          for name in all_names:
           (out/name).write_bytes(files[name].read_bytes())
          print("EXACT NINE JSON FILES VERIFIED AND STAGED")
          PY
      - name: Commit only immutable evidence and read back
        run: |
          set -euo pipefail
          git config user.name "kyiv-185-evidence-freeze[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/kyiv_185_source_recovery_acceptance_2026-10-15/*.json
          test "$(git diff --cached --name-only | wc -l)" = "9"
          test "$(git diff --cached --name-only | grep -cv '^research/kyiv_185_source_recovery_acceptance_2026-10-15/.*\.json$')" = "0"
          git commit -m "Freeze independently verified historical Kyiv 185 source evidence"
          python research/kyiv_185_source_recovery_acceptance_2026-10-15/verify_acceptance.py readback
          git fetch --no-tags origin proof-kyiv-185-source-recovery-acceptance-2026-10-15
          test "$(git rev-parse origin/proof-kyiv-185-source-recovery-acceptance-2026-10-15)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:refs/heads/proof-kyiv-185-source-recovery-acceptance-2026-10-15
      - name: Independently inspect committed Git SHA remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin proof-kyiv-185-source-recovery-acceptance-2026-10-15
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/proof-kyiv-185-source-recovery-acceptance-2026-10-15)"
          python research/kyiv_185_source_recovery_acceptance_2026-10-15/verify_acceptance.py readback
