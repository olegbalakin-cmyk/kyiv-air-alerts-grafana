name: Deploy Netlify WIP preview

on:
  workflow_dispatch:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "deploy/netlify-preview-release.txt"

permissions:
  contents: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16

      - name: Verify Netlify token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN secret is not configured"
            exit 2
          fi

      - name: Build production-parity preview data
        run: |
          cp kyiv-air-alerts-grafana/data/dashboard_data.json /tmp/wip-dashboard-data.json
          git fetch origin site-prod
          git show origin/site-prod:kyiv-air-alerts-grafana/data/dashboard_data.json \
            > kyiv-air-alerts-grafana/data/dashboard_data.json

          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path("kyiv-air-alerts-grafana/data/dashboard_data.json")
          prod = json.loads(data_path.read_text(encoding="utf-8"))
          wip = json.loads(Path("/tmp/wip-dashboard-data.json").read_text(encoding="utf-8"))

          keys = prod.get("multicity_meta", {}).get("production_city_keys", [])
          assert len(keys) == 23, len(keys)
          assert prod.get("multicity_meta", {}).get("weekly_mode") == "rolling_7d"
          missing_daily28 = [
              key for key in keys
              if not (prod.get("cities", {}).get(key, {}).get("daily28") or [])
          ]
          assert not missing_daily28, missing_daily28

          casualties = wip.get("casualties_by_city") or {}
          expected = {
              "kyiv": 454, "kharkiv": 339, "sevastopol": 22, "cherkasy": 2,
              "zhytomyr": 12, "dnipro": 214, "khmelnytskyi": 10, "poltava": 84,
              "rivne": 1, "sumy": 158, "vinnytsia": 31, "kropyvnytskyi": 9,
              "lviv": 29, "chernihiv": 105, "mykolaiv": 106, "lutsk": 10,
              "uzhhorod": 0, "ivano-frankivsk": 3, "ternopil": 41,
              "chernivtsi": 5, "odesa": 171, "zaporizhzhia": 316, "kherson": 163,
          }
          assert set(casualties) == set(expected), (sorted(casualties), sorted(expected))

          if prod.get("casualties"):
              casualties["kyiv"] = prod["casualties"]

          totals = {}
          for key, target in expected.items():
              actual = sum(int(row.get("deaths") or 0) for row in casualties[key].get("monthly", []))
              totals[key] = actual
              assert actual == target, (key, actual, target)

          prod["casualties_by_city"] = casualties

          explosion_path = Path("kyiv-air-alerts-grafana/data/explosions_test.json")
          explosion = json.loads(explosion_path.read_text(encoding="utf-8"))
          assert explosion["meta"]["test_only"] is True
          assert explosion["meta"]["rolling_window_days"] == 90
          assert len(explosion["cities"]) >= 10
          assert explosion["meta"]["city_count"] == len(explosion["cities"])
          prod["explosion_metric_test"] = explosion

          data_path.write_text(json.dumps(prod, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          validation = {
              "ok": True,
              "frontend_base": "site-prod",
              "city_count": len(keys),
              "weekly_mode": prod.get("multicity_meta", {}).get("weekly_mode"),
              "daily28_city_count": len(keys) - len(missing_daily28),
              "casualty_city_count": len(casualties),
              "casualty_totals": totals,
              "explosion_metric_test": {
                  "ok": True,
                  "city_count": len(explosion["cities"]),
                  "membership_source": explosion["meta"].get("city_membership_source"),
                  "rolling_window_days": explosion["meta"]["rolling_window_days"],
                  "poltava": f'{explosion["cities"]["poltava"]["strict_n"]}/{explosion["cities"]["poltava"]["total_alerts"]}',
                  "vinnytsia": f'{explosion["cities"]["vinnytsia"]["strict_n"]}/{explosion["cities"]["vinnytsia"]["total_alerts"]}',
              },
          }
          Path("/tmp/preview-validation.json").write_text(
              json.dumps(validation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(validation, ensure_ascii=False))
          PY

      - name: Verify production features and casualty additions
        run: |
          grep -q "setupTableSorting();" kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q "function renderShortHorizon" kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q "rolling7dEnabled" kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q "compareCasualtiesChart" kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q 'id="daily28HoursChart"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'id="compareCasualtiesChart"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'id="casualtyCityEyebrow"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'id="kpiExplosionsCard"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'id="compareExplosionsChart"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q "state.data.explosion_metric_test" kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q "methodology-detail-grid" kyiv-air-alerts-grafana/pages-preview/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("kyiv-air-alerts-grafana/data/explosions_test.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["meta"]["test_only"] is True
          assert x["meta"]["rolling_window_days"] == 90
          assert len(x["cities"]) >= 10
          assert x["meta"]["city_count"] == len(x["cities"])
          assert x["cities"]["poltava"]["strict_n"] == 51
          assert x["cities"]["poltava"]["total_alerts"] == 1805
          assert x["cities"]["vinnytsia"]["strict_n"] == 5
          assert x["cities"]["vinnytsia"]["total_alerts"] == 362
          built = json.loads(Path("kyiv-air-alerts-grafana/data/dashboard_data.json").read_text(encoding="utf-8"))
          assert built["explosion_metric_test"]["cities"]["poltava"]["strict_n"] == 51
          assert built["explosion_metric_test"]["cities"]["vinnytsia"]["strict_n"] == 5
          for key, city in x["cities"].items():
              assert city["rolling90"], key
              assert city["rolling90"][0]["date"] > city["coverage_start"], key
          PY

      - name: Build static preview
        run: |
          rm -rf _site
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json

      - name: Deploy draft preview to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx -y netlify-cli@latest deploy \
            --dir=_site \
            --site=b5aafc46-7468-4070-baf1-db80a4d30501 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --json | tee netlify-deploy.json

      - name: Record preview status
        run: |
          mkdir -p deploy
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          netlify = json.loads(Path("netlify-deploy.json").read_text(encoding="utf-8"))
          validation = json.loads(Path("/tmp/preview-validation.json").read_text(encoding="utf-8"))
          status = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "branch": "multicity-wip-2026-09-16",
              "validation": validation,
              "netlify": {
                  "production": False,
                  "draft_preview": True,
                  "deploy_id": netlify.get("deploy_id") or netlify.get("id"),
                  "deploy_url": netlify.get("deploy_url") or netlify.get("url"),
                  "logs": netlify.get("logs"),
              },
          }
          Path("deploy/netlify-preview-status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/netlify-preview-status.json
          git commit -m "Record Netlify WIP preview"

          for attempt in 1 2 3; do
            git fetch origin multicity-wip-2026-09-16
            if git rebase origin/multicity-wip-2026-09-16 && git push origin HEAD:multicity-wip-2026-09-16; then
              break
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Preview-status push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v4
        with:
          name: netlify-preview-deploy
          path: netlify-deploy.json
