name: C3 old production immutable HTTP SHA baseline read-only
on:
  push:
    branches: [research-c3-prod-rollback-http-2026-11-12]
    paths: [".github/workflows/c3-prod-http-baseline.yml"]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_${{ github.token }}: TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin exact currently published Git JSON branch
        run: |
          mkdir -p /tmp/c3-prod-rollback
          GIT_SHA=$(gh api repos/"$GITHUB_REPOSITORY"/branches/site-prod --jq .commit.sha)
          echo "GIT_SHA=$GIT_SHA" >> "$GITHUB_ENV"
          echo "Git data SHA pinned (no equivalence to old Netlify build implied): $GIT_SHA"
      - name: Read only GET immutable production and Git data, record SHA
        run: |
          python - <<'PY'
          import hashlib,json,datetime,urllib.request,urllib.error,traceback
          from pathlib import Path
          BASE='https://6adb629bc3ebc570117d82e1--ukraine-air-alerts.netlify.app/'
          PROD='https://ukraine-air-alerts.netlify.app/'
          DATA='https://raw.githubusercontent.com/olegbalakin-cmyk/kyiv-air-alerts-grafana/'
          paths=['index.html','app.js','kpi-range.js','chart-share.js','styles.css','features.json','historical-daily-kpi.json']
          git_paths=['dashboard_data.json','site_derived.json','alerts_combined.json','kyiv_threat_mix.json','sevastopol_events.json']
          def sha(b):return hashlib.sha256(b).hexdigest()
          def fetch(url):
           req=urllib.request.Request(url,headers={'User-Agent':'C3-prod-readonly-HTTP-SHA-snapshot/1.0'})
           with urllib.request.urlopen(req,timeout=40) as v:
            body=v.read()
            assert v.status==200,(v.status,url)
            return body,{'status':v.status,'bytes':len(body),'sha256':sha(body),'final_url':v.url,'content_type':v.headers.get('content-type'),'etag':v.headers.get('etag')}
          pin=os.environ['GIT_SHA']
          out=Path('/tmp/c3-prod-rollback');out.mkdir(parents=True,exist_ok=True)
          res={'schema':'c3-production-old-deploy-http-snapshot-v1','created_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'deployment_id':'6adb629bc3ebc570117d82e1','pinned_site_prod_sha':pin,'old_static':{},'runtime_git':{},'main_domain':{},'index_meta':{},'runtime_meta':{},'operator_publish_control_verified':False,'no_netlify_or_git_writes':True,'production_rollback_performed':False,'verdict':'BLOCKED'}
          try:
           assert len(pin)==40 and all(c in '0123456789abcdef' for c in pin)
           for p in paths:
            b,m=fetch(BASE+p)
            res['old_static'][p]=m
            if p=='historical-daily-kpi.json':
             j=json.loads(b);meta=j.get('meta',{})
             res['index_meta']={'schema':j.get('schema'),'source_ref':meta.get('source_ref'),'verified_count':meta.get('verified_count'),'expected_cities':meta.get('expected_cities'),'source_dashboard_generated_at':meta.get('source_dashboard_generated_at'),'generated_at':meta.get('generated_at'),'top_keys':list(j)[:20]}
            if p=='app.js':
             res['git_runtime_source_in_old_app']='raw.githubusercontent.com' in b.decode('utf8',errors='ignore')
           for p in git_paths:
            b,m=fetch(DATA+pin+'/kyiv-air-alerts-grafana/data/'+p)
            res['runtime_git'][p]=m
            if p=='dashboard_data.json':
             j=json.loads(b);res['runtime_meta']={'city_count':len(j.get('cities',{})),'generated_at':j.get('meta',{}).get('generated_at'),'sha256':m['sha256']}
             assert len(j.get('cities',{}))==23,'CITY_COUNT_NOT_23'
           for p in ['app.js','historical-daily-kpi.json','features.json']:
            b,m=fetch(PROD+p)
            assert m['sha256']==res['old_static'][p]['sha256'],('PRODUCTION_NOT_SAME_AS_OLD',p)
            res['main_domain'][p]=m
           for p in ['app.js','historical-daily-kpi.json']:
            b,m=fetch(BASE+p)
            assert m['sha256']==res['old_static'][p]['sha256'],('OLD_DEPLOY_CHANGED_DURING_READ',p)
           res['verdict']='PASS_HTTP_SHA_ONLY'
          except Exception as e:
           res['error']=str(e)
           res['traceback']=traceback.format_exc()
          finally:
           (out/'HTTP_SHA_REPORT.json').write_text(json.dumps(res,ensure_ascii=False,indent=2)+'\n')
          print('C3_HTTP_SHA='+res['verdict'],'old_static='+str(len(res['old_static'])),'git_runtime='+str(len(res['runtime_git'])))
          print('C3_INDEX_META='+json.dumps(res['index_meta']))
          if res['verdict']!='PASS_HTTP_SHA_ONLY':raise SystemExit(2)
          
          PY
      - name: Fail closed if Git JSON branch moved during snapshot
        if: always()
        run: |
          CURRENT=$(gh api repos/"$GITHUB_REPOSITORY"/branches/site-prod --jq .commit.sha)
          if [ "$CURRENT" != "$GIT_SHA" ]; then
            echo "::error::Git site-prod branch changed during evidence capture"
            exit 1
          fi
      - name: Preserve report even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-prod-old-deploy-http-sha-proof
          path: /tmp/c3-prod-rollback/
          retention-days: 30
          if-no-files-found: warn
