name: Kyiv immutable source eligibility expansion pilot

on:
  push:
    branches:
      - kyiv-immutable-source-eligibility-expansion-pilot-2026-10-09
    paths:
      - ".github/proof/kyiv_immutable_source_eligibility_expansion_pilot.py"
      - ".github/workflows/kyiv-immutable-source-eligibility-expansion-pilot.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: kyiv-immutable-source-eligibility-expansion-pilot-2026-10-09
  cancel-in-progress: false

jobs:
  offline-source-eligibility-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout frozen-base proof branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unchanged classifier dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Reject database credentials
        run: |
          python - <<'PY'
          import os
          denied=[k for k,v in os.environ.items() if v and (k in {"DATABASE_URL","DIRECT_URL","PGHOST","PGUSER","PGPASSWORD","PGDATABASE"} or k.startswith(("NEON_","POSTGRES_","SUPABASE_DB_")))]
          assert not denied, "DB_CREDENTIAL_PRESENT:"+",".join(sorted(denied))
          PY
      - name: Download only pre-existing frozen GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pilot-input
          python - <<'PY'
          import os,requests,zipfile
          from pathlib import Path
          repo="olegbalakin-cmyk/kyiv-air-alerts-grafana"
          sources=((11608819645,"acquisition"),(11609004684,"replay"))
          session=requests.Session()
          session.headers.update({"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                                  "Accept":"application/vnd.github+json",
                                  "X-GitHub-Api-Version":"2022-11-28"})
          for aid,name in sources:
              url=f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip"
              res=session.get(url,timeout=120)
              res.raise_for_status()
              path=Path("pilot-input")/f"{name}.zip"
              path.write_bytes(res.content)
              with zipfile.ZipFile(path) as z:z.extractall(Path("pilot-input")/name)
              print("FROZEN_GITHUB_ARTIFACT_DOWNLOADED",aid,name)
          PY
      - name: Run exact baseline plus bounded additions from frozen corpus
        run: |
          python -u .github/proof/kyiv_immutable_source_eligibility_expansion_pilot.py \
            --mode pilot --corpus-dir pilot-input/acquisition \
            --prior-replay pilot-input/replay/runner-replay-1.json \
            --output pilot-primary.json
      - name: Replay provisional best in clean process A
        run: |
          python -u .github/proof/kyiv_immutable_source_eligibility_expansion_pilot.py \
            --mode repeat --corpus-dir pilot-input/acquisition \
            --prior-replay pilot-input/replay/runner-replay-1.json \
            --selected-file pilot-primary.json --output pilot-repeat-a.json
      - name: Replay provisional best in clean process B
        run: |
          python -u .github/proof/kyiv_immutable_source_eligibility_expansion_pilot.py \
            --mode repeat --corpus-dir pilot-input/acquisition \
            --prior-replay pilot-input/replay/runner-replay-1.json \
            --selected-file pilot-primary.json --output pilot-repeat-b.json
      - name: Finalize safe offline pilot verdict
        run: |
          mkdir -p research
          python -u .github/proof/kyiv_immutable_source_eligibility_expansion_pilot.py \
            --mode finalize --selected-file pilot-primary.json \
            --repeat-a pilot-repeat-a.json --repeat-b pilot-repeat-b.json \
            --output research/kyiv_immutable_source_eligibility_expansion_pilot_2026-10-09.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("research/kyiv_immutable_source_eligibility_expansion_pilot_2026-10-09.json").read_text())
          assert doc["repeated_replay_proof"]["episode_verdicts_equal_count"]==67
          assert doc["evidence_network_fetches"]=={"publisher":0,"google_search":0,"telegram":0,"new_wrapper_resolutions":0,"new_native_acquisitions":0}
          assert doc["production_mutations"]==doc["neon_writes"]==0
          assert not doc["blind_per_episode_data_inspected"]
          print("SOURCE_EXPANSION_FINAL_VERDICT="+doc["verdict"])
          print("SOURCE_EXPANSION_BEST="+json.dumps(doc["provisional_best_expansion"],sort_keys=True))
          PY
      - name: Commit only frozen-corpus pilot artifact on isolated proof branch
        run: |
          git add research/kyiv_immutable_source_eligibility_expansion_pilot_2026-10-09.json
          test "$(git diff --cached --name-only)" = "research/kyiv_immutable_source_eligibility_expansion_pilot_2026-10-09.json"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Record offline immutable Kyiv source eligibility pilot proof"
          git push origin HEAD:kyiv-immutable-source-eligibility-expansion-pilot-2026-10-09
      - name: Verify branch proof commit and only bounded mutations
        run: |
          test "$(git status --porcelain)" = ""
          git diff --name-only 2a7b17c9514a43648e22eb795f0f2f7b65c3980f HEAD
          git rev-parse HEAD
          sha256sum research/kyiv_immutable_source_eligibility_expansion_pilot_2026-10-09.json
      - name: Upload pilot proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-immutable-source-eligibility-expansion-pilot
          path: |
            pilot-primary.json
            pilot-repeat-a.json
            pilot-repeat-b.json
            research/kyiv_immutable_source_eligibility_expansion_pilot_2026-10-09.json
          if-no-files-found: warn
          retention-days: 30
