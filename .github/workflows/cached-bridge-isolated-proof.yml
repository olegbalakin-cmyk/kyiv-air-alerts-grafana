name: Cached UkraineAlarm bridge isolated proof

on:
  push:
    branches: [proof-ukrainealarm-cached-bridge-2026-10-15]
    paths:
      - "kyiv-air-alerts-grafana/scripts/validate_cached_production_alerts.py"
      - "kyiv-air-alerts-grafana/scripts/test_cached_production_alerts.py"
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - ".github/workflows/cached-bridge-isolated-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PRODUCTION_ALERT_SOURCE_COMMIT: "97ec99389259f8d0cfcecc17a2ff77302bb0615f"
    steps:
      - name: Checkout exact proof code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic unit tests without credentials
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/test_cached_production_alerts.py -v
          python -m py_compile scripts/validate_cached_production_alerts.py scripts/monitor_explosion_candidates.py
      - name: Assert the consumer has zero UkraineAlarm network call on cached path
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")
          tree=ast.parse(p.read_text(encoding="utf-8"))
          main=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="main")
          text=ast.get_source_segment(p.read_text(encoding="utf-8"),main)
          assert "validate_snapshot(" in text
          assert "validate_episode_regression(" in text
          assert "args.local_only" in text
          assert "cached_source" in text
          assert "mode = \"cached_bridge\"" in text
          print("cached route source static checks PASS")
          PY
      - name: Checkout one pinned production snapshot read-only
        uses: actions/checkout@v4
        with:
          ref: 97ec99389259f8d0cfcecc17a2ff77302bb0615f
          path: pinned-prod
          persist-credentials: false
          fetch-depth: 1
      - name: Validate actual pinned 21-region source without UkraineAlarm requests
        run: |
          mkdir -p proof
          test "$(git -C pinned-prod rev-parse HEAD)" = "$PRODUCTION_ALERT_SOURCE_COMMIT"
          python kyiv-air-alerts-grafana/scripts/validate_cached_production_alerts.py \
            --bridge-file pinned-prod/kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json \
            --kyiv-alerts-file pinned-prod/kyiv-air-alerts-grafana/data/alerts_combined.json \
            --sevastopol-events-file pinned-prod/kyiv-air-alerts-grafana/data/sevastopol_events.json \
            --source-commit-sha "$PRODUCTION_ALERT_SOURCE_COMMIT" \
            --output proof/pinned-production-source.json
      - name: Read-only 23-city WIP state and cached episode regression probe
        working-directory: kyiv-air-alerts-grafana
        run: |
          pip install -r requirements.txt
          python - <<'PY'
          import json, sys, pathlib, datetime
          from unittest.mock import patch
          sys.path.insert(0, "scripts")
          import monitor_explosion_candidates as m
          import validate_cached_production_alerts as v
          prod=pathlib.Path("../pinned-prod/kyiv-air-alerts-grafana/data")
          original=pathlib.Path("data/explosion_candidate_monitor_state.json")
          queue=pathlib.Path("data/explosion_review_queue.json")
          hashes_before={p.name:__import__("hashlib").sha256(p.read_bytes()).hexdigest()
                         for p in (original,queue)}
          with patch.dict(__import__("os").environ, {"UKRAINEALARM_API_TOKEN": ""}):
              with patch.object(m.ua, "UkraineAlarmClient", side_effect=AssertionError("UkraineAlarm client attempted")):
                  snapshot=v.validate_snapshot(
                      prod/"ukrainealarm_bridge.json",prod/"alerts_combined.json",
                      prod/"sevastopol_events.json",now=datetime.datetime.now(datetime.timezone.utc),
                      source_commit_sha="97ec99389259f8d0cfcecc17a2ff77302bb0615f")
                  polled,errors=m.poll_cached_bridge(
                      prod/"ukrainealarm_bridge.json",datetime.datetime.now(datetime.timezone.utc),
                      prod/"alerts_combined.json",prod/"sevastopol_events.json")
          assert not errors, errors
          state=m.ensure_state()
          try:
              regression=v.validate_episode_regression(polled,state,snapshot,
                                                        is_proxy=m.is_raion_proxy_city)
              result={"status":"PASS","regression":regression}
          except v.CachedSnapshotError as exc:
              result={"status":"BLOCKED","reason":str(exc),
                      "episode_counts":{k:len(rows) for k,rows in polled.items()}}
          # Diagnose accepted WIP identities without modifying history or rules.
          mismatches={}
          for key,city_state in sorted(state.get("cities",{}).items()):
              if key not in polled:
                  continue
              now_rows=polled[key]
              ids={ep.get("episode_id") for ep in now_rows}
              if not now_rows:
                  continue
              oldest=min(m.parse_dt(ep.get("alert_end")) for ep in now_rows)
              newest=max(m.parse_dt(ep.get("alert_end")) for ep in now_rows)
              missed=[]
              for old in city_state.get("episodes") or []:
                  if old.get("identity_superseded_by_episode_id") or old.get("episode_id") in ids:
                      continue
                  old_end=m.parse_dt(old.get("alert_end"))
                  if not old_end or not oldest<=old_end<=newest:
                      continue
                  old_start=m.parse_dt(old.get("alert_start"))
                  nearest=min(now_rows,key=lambda ep:abs((m.parse_dt(ep["alert_end"])-old_end).total_seconds()))
                  missed.append({"episode_id":old["episode_id"],"start":old.get("alert_start"),
                                 "end":old.get("alert_end"),"nearest_id":nearest["episode_id"],
                                 "nearest_start":nearest["alert_start"],"nearest_end":nearest["alert_end"],
                                 "start_delta_seconds":round((m.parse_dt(nearest["alert_start"])-old_start).total_seconds(),3) if old_start else None,
                                 "end_delta_seconds":round((m.parse_dt(nearest["alert_end"])-old_end).total_seconds(),3)})
              if missed:
                  mismatches[key]={"count":len(missed),"examples":missed[:5]}
          result["identity_diagnostics"]=mismatches
          result["total_unmatched_within_snapshot_horizon"]=sum(x["count"] for x in mismatches.values())
          hashes_after={p.name:__import__("hashlib").sha256(p.read_bytes()).hexdigest()
                         for p in (original,queue)}
          assert hashes_before==hashes_after,"WIP data mutated by read-only proof"
          result.update({"cached_city_count":len(polled),
                         "cached_episode_count":sum(len(x) for x in polled.values()),
                         "source_validation_status":"PASS",
                         "zero_ukrainealarm_client_instantiations":True,
                         "WIP_state_and_queue_unchanged":True})
          pathlib.Path("../proof/wip-readonly-regression.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Emit synthetic proof receipt
        run: |
          mkdir -p proof
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path("kyiv-air-alerts-grafana/scripts")
          paths=[root/"validate_cached_production_alerts.py",root/"monitor_explosion_candidates.py",
                 root/"test_cached_production_alerts.py",pathlib.Path(".github/workflows/cached-bridge-isolated-proof.yml")]
          receipt={"kind":"isolated_offline_synthetic_cached_bridge",
                   "source_commit_frozen":"97ec99389259f8d0cfcecc17a2ff77302bb0615f",
                   "executed_commit":os.getenv("GITHUB_SHA"),
                   "run_id":os.getenv("GITHUB_RUN_ID"),
                   "job":"offline-proof",
                   "live_ukrainealarm_requests":0,
                   "production_database_writes":0,"production_git_writes":0,
                   "credentials_supplied":False,"network_isolation_scope":"UkraineAlarm transport not used in synthetic tests",
                   "fixtures":"in-memory deterministic 21-region JSON",
                   "files":[{"path":str(p),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                             "git_blob":subprocess.check_output(["git","hash-object",str(p)],text=True).strip()} for p in paths]}
          pathlib.Path("proof/cached-bridge-synthetic.json").write_text(json.dumps(receipt,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cached-bridge-isolated-proof
          path: proof/*.json
          retention-days: 30
