name: Historical blind freeze Ternopil proof

on:
  push:
    branches:
      - historical-blind-freeze-ternopil-proof-2026-10-02
    paths-ignore:
      - research/historical_blind_freeze_ternopil_2026-10-02.json

permissions:
  contents: write

concurrency:
  group: historical-blind-freeze-ternopil-proof-2026-10-02
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: historical-blind-freeze-ternopil-proof-2026-10-02

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded worker dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run Ternopil freeze
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/historical_blind_freeze_ternopil.py

      - name: Verify mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {"research/historical_blind_freeze_ternopil_2026-10-02.json"}
          rows = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = set()
          for line in rows:
              if not line.strip():
                  continue
              path = line[3:].strip()
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          assert not unexpected, f"unexpected mutations: {sorted(unexpected)}"
          assert allowed <= changed, f"freeze artifact missing: {sorted(changed)}"
          print("mutation allowlist PASS")
          PY

      - name: Commit compact freeze artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_blind_freeze_ternopil_2026-10-02.json
          git commit -m "Record Ternopil blind freeze proof"
          git push origin HEAD:historical-blind-freeze-ternopil-proof-2026-10-02

      - name: Emit compact result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("research/historical_blind_freeze_ternopil_2026-10-02.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "verdict": d["verdict"],
              "city": d["city"],
              "eligible_count_before_exclusions": d["eligible_count_before_exclusions"],
              "prior_episodes_excluded": d["prior_episodes_excluded"],
              "eligible_count_after_exclusions": d["eligible_count_after_exclusions"],
              "selected_cases": d["selected_cases"],
              "city_sample_sha256": d["city_sample_sha256"],
              "blockers": d["blockers"],
          }, ensure_ascii=False))
          PY
