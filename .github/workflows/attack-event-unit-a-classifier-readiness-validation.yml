name: Unit A classifier readiness validation

on:
  push:
    branches:
      - attack-event-unit-a-classifier-readiness-validation-2026-10-08

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[unit-a-readiness-artifact]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned authoritative implementation ref
        run: |
          git fetch origin 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453
      - name: Validate Unit A readiness twice
        run: python .github/proof/attack_event_unit_a_classifier_readiness_validation.py
      - name: Verify durable artifact is the only new output
        run: |
          test -f research/attack_event_execution_unit_a_classifier_readiness_validation_2026-10-08.json
          git status --short
          test "$(git status --short | grep '^?? research/attack_event_execution_unit_a_classifier_readiness_validation_2026-10-08.json$' | wc -l)" -eq 1
      - name: Freeze durable readiness artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/attack_event_execution_unit_a_classifier_readiness_validation_2026-10-08.json
          git commit -m "freeze: Unit A classifier readiness [unit-a-readiness-artifact]"
          git push origin HEAD:attack-event-unit-a-classifier-readiness-validation-2026-10-08
