name: H2 non-superuser ACL rollback PG18 synthetic A-B
on:
  push:
    branches: [research-h2-nonsuperuser-acl-rollback-pg18-2026-10-20-gpt6]
    paths:
      - '.github/workflows/h2-non-superuser-acl-rollback-2026-10-20.yml'
      - 'research/h2_non_superuser_guard_acl_2026-10-20/**'
permissions:
  contents: read
jobs:
  synthetic-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
      - name: Assert new harness Python syntax
        run: python -m py_compile research/h2_non_superuser_guard_acl_2026-10-20/test_non_superuser_acl_pg18.py
      - name: Execute non-superuser ACL and ownership tests in PostgreSQL 18.6
        run: python research/h2_non_superuser_guard_acl_2026-10-20/test_non_superuser_acl_pg18.py
      - name: Upload original JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-nonsuperuser-acl-${{ matrix.copy }}
          path: /tmp/h2_nonsuperuser_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
