name: Corrected 17-city historical baseline reconciliation

on:
  push:
    branches:
      - historical-17-city-corrected-baseline-2026-09-27
    paths:
      - .github/workflows/historical-17-city-corrected-baseline-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STARTING_HEAD: 29364ca6d1275e9fbbca657f5f20a2ec4f7eb179
      IMPLEMENTATION_COMMIT: 68f716be027d3a614bbee02878ecf23f6c80c993
      GAP_FORENSIC_SHA: 87c0993fe87037729a947a812cc70f8d8fac729a
      LAST_TWO_SHA: 2032e0ad826ed1becff3f10b1e99d7f7c26a1749
      PREVIOUS_RECON_SHA: 7490e4b271fec4512a69f6915e5ba08158b0d093
      UPSTREAM_BLOB_EXPECTED: 71d70c0ca54968f530d596cf315616fa858800e1
      OUTPUT_PATH: research/historical_17_city_corrected_baseline_reconciliation_2026-09-27.json
      TEMP_SCRIPT: kyiv-air-alerts-grafana/scripts/historical_17_city_corrected_baseline_reconciliation.py
      TEMP_WORKFLOW: .github/workflows/historical-17-city-corrected-baseline-reconciliation.yml

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: historical-17-city-corrected-baseline-2026-09-27
          fetch-depth: 0

      - name: Verify ancestry and authoritative artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$STARTING_HEAD" HEAD)" = "$STARTING_HEAD"
          test "$(git merge-base "$IMPLEMENTATION_COMMIT" HEAD)" = "$IMPLEMENTATION_COMMIT"

          for spec in             "$LAST_TWO_SHA:research/historical_17_city_last_two_discrepancies_forensic_2026-09-27.json"             "$PREVIOUS_RECON_SHA:research/historical_public_upstream_17_city_recovery_preflight_2026-09-27.json"             "$GAP_FORENSIC_SHA:research/historical_17_city_corpus_gap_forensic_inventory_2026-09-27.json"
          do
            sha="${spec%%:*}"
            path="${spec#*:}"
            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha:$path"
          done

          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path("kyiv-air-alerts-grafana")
          rows=list(csv.DictReader((root/"data/explosion_metric_handoff/RESEARCH_SLICES_2026-09-18.csv").open(encoding="utf-8-sig")))
          by={r["task_id"]:r for r in rows}
          assert by["chernihiv-P3"]["frozen_denominator"] == "560"
          assert by["chernihiv-P3"]["city_frozen_denominator"] == "1676"
          assert by["chernihiv-P1"]["city_frozen_denominator"] == "1676"
          assert by["chernihiv-P2"]["city_frozen_denominator"] == "1676"

          p3=json.load((root/"data/explosion_metric_handoff/chernihiv_P3_result.json").open(encoding="utf-8"))
          assert p3["denominator"] == 560

          status=json.load(Path("research/historical_replay_status_current.json").open(encoding="utf-8"))
          assert status["cities"]["chernihiv"]["expected_alert_episodes"] == 1676
          assert status["cities"]["kharkiv"]["expected_alert_episodes"] == 3565
          print("corrected_contract_verified")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4

      - name: Materialize exact public upstream blob
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ukrainian-air-raid-sirens-dataset.git
          git clone --mirror --quiet             https://github.com/Vadimkin/ukrainian-air-raid-sirens-dataset.git             /tmp/ukrainian-air-raid-sirens-dataset.git

          commits_file="/tmp/upstream_path_commits.txt"
          git -C /tmp/ukrainian-air-raid-sirens-dataset.git rev-list --all -- datasets/official_data_uk.csv > "$commits_file"

          upstream_commit=""
          actual=""
          while IFS= read -r commit; do
            candidate="$(git -C /tmp/ukrainian-air-raid-sirens-dataset.git rev-parse "$commit:datasets/official_data_uk.csv" 2>/dev/null || true)"
            if [ "$candidate" = "$UPSTREAM_BLOB_EXPECTED" ]; then
              upstream_commit="$commit"
              actual="$candidate"
              break
            fi
          done < "$commits_file"

          test -n "$upstream_commit"
          test "$actual" = "$UPSTREAM_BLOB_EXPECTED"

          git -C /tmp/ukrainian-air-raid-sirens-dataset.git cat-file blob "$actual" > /tmp/official_data_uk.csv
          materialized="$(git hash-object /tmp/official_data_uk.csv)"
          test "$materialized" = "$actual"

          echo "actual=$actual" >> "$GITHUB_OUTPUT"
          echo "commit=$upstream_commit" >> "$GITHUB_OUTPUT"

      - name: Materialize original gap forensic
        shell: bash
        run: |
          set -euo pipefail
          git show "$GAP_FORENSIC_SHA:research/historical_17_city_corpus_gap_forensic_inventory_2026-09-27.json"             > /tmp/historical_17_city_corpus_gap_forensic_inventory_2026-09-27.json

      - name: Run corrected one-shot reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python "$TEMP_SCRIPT"             --upstream /tmp/official_data_uk.csv             --upstream-blob-expected "$UPSTREAM_BLOB_EXPECTED"             --upstream-blob-actual "${{ steps.upstream.outputs.actual }}"             --upstream-commit "${{ steps.upstream.outputs.commit }}"             --forensic /tmp/historical_17_city_corpus_gap_forensic_inventory_2026-09-27.json             --output "$OUTPUT_PATH"             --starting-head "$STARTING_HEAD"             --workflow-run-id "$GITHUB_RUN_ID"

      - name: Verify acceptance and protected state
        shell: bash
        run: |
          set -euo pipefail
          find kyiv-air-alerts-grafana/scripts -type d -name __pycache__ -prune -exec rm -rf {} +

          python - <<'PY'
          import json
          p="research/historical_17_city_corrected_baseline_reconciliation_2026-09-27.json"
          d=json.load(open(p, encoding="utf-8"))
          a=d["aggregate"]
          v=d["verification"]
          c=d["contract_corrections"]

          assert d["acceptance_passed"] is True
          assert a["expected"] == 17086
          assert a["canonical_union_final_total"] == 17086
          assert a["unresolved"] == 0
          assert a["unexplained_excess_episodes"] == 0
          assert a["duplicate_canonical_ids"] == 0
          assert a["cities_fully_reconciled_count"] == 17
          assert v["other_15_unchanged"] is True
          assert v["chernihiv_reconstructed"] == 1676
          assert v["kharkiv_reconstructed"] == 3565
          assert c["chernihiv"]["synthetic_episode_added"] is False
          assert c["kharkiv"]["excluded_episode_id"] == "30e0080db2e490337f98d277"
          observed=c["kharkiv"]["observed_boundary_exclusion"]
          assert observed["parent_task_id"] == "kharkiv-P1"
          assert observed["alert_start"] == "2025-02-17T19:02:05Z"
          assert observed["alert_end"] == "2025-02-17T21:54:42Z"
          assert d["isolation"]["active_6863_campaign_unchanged_by_this_task"] is True
          assert d["isolation"]["protected_files_unchanged_except_intended_corpus_contract_changes"] is True
          print(json.dumps({
            "expected":a["expected"],
            "final":a["canonical_union_final_total"],
            "unresolved":a["unresolved"],
            "excess":a["unexplained_excess_episodes"],
            "duplicates":a["duplicate_canonical_ids"],
            "cities":a["cities_fully_reconciled_count"],
            "other_15_unchanged":v["other_15_unchanged"],
            "kharkiv_boundary":observed,
            "verdict":d["verdict"],
          }, ensure_ascii=False, indent=2))
          PY

          current_campaign="$(git ls-remote origin refs/heads/historical-attack-event-backfill-2026-09-27 | cut -f1)"
          test "$current_campaign" = "5809bd677a93e6c2f6a1bff9cb7f6b5bde0c7c1e"

      - name: Persist artifact and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_PATH"
          git rm "$TEMP_SCRIPT" "$TEMP_WORKFLOW"

          git commit -m "Prove corrected 17-city historical corpus baseline"
          artifact_commit="$(git rev-parse HEAD)"
          echo "artifact_commit=$artifact_commit"
          git push origin "HEAD:historical-17-city-corrected-baseline-2026-09-27"
