name: Deploy Netlify production site

on:
  workflow_dispatch:
    inputs:
      neon_release_mode:
        description: 'Owner-gated immutable six-JSON static KPI release (default OFF)'
        type: boolean
        required: true
        default: false
      c6_run_id:
        description: 'C6 preparation Actions run ID (Neon mode only)'
        type: string
        required: false
      c6_run_attempt:
        description: 'Exact C6 preparation run attempt'
        type: string
        required: false
      c6_artifact_id:
        description: 'Exact preparation artifact ID'
        type: string
        required: false
      c6_artifact_sha256:
        description: 'SHA-256 of immutable GitHub artifact ZIP'
        type: string
        required: false
      approved_kpi_sha256:
        description: 'SHA-256 of root historical-daily-kpi.json'
        type: string
        required: false
      approved_generation:
        description: 'Exact dashboard generation'
        type: string
        required: false
  push:
    branches: [site-prod]
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "kyiv-air-alerts-grafana/tests/test_chart_share.js"
      - "kyiv-air-alerts-grafana/tests/test_dynamic_city_kpi.js"
      - "kyiv-air-alerts-grafana/tests/test_city_period_kpi_sync.js"
      - "kyiv-air-alerts-grafana/tests/test_historical_max.js"
      - "kyiv-air-alerts-grafana/tests/test_kpi_interval_windows.js"
      - "kyiv-air-alerts-grafana/tests/test_all_time_period.js"
      - "kyiv-air-alerts-grafana/tests/test_live_history_binding.js"
      - "netlify.toml"
      - ".github/workflows/netlify-production.yml"
      - "netlify.toml"

concurrency:
  group: netlify-production-site
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/site-prod'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production site branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify frontend-only production bundle
        run: |
          test -s kyiv-air-alerts-grafana/pages-preview/index.html
          test -s kyiv-air-alerts-grafana/pages-preview/styles.css
          test -s kyiv-air-alerts-grafana/pages-preview/app.js
          test -s kyiv-air-alerts-grafana/pages-preview/features.json
          grep -q 'raw.githubusercontent.com/olegbalakin-cmyk/kyiv-air-alerts-grafana/site-prod/kyiv-air-alerts-grafana/data/' kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q '"attack_events": false' kyiv-air-alerts-grafana/pages-preview/features.json
          grep -q 'name="robots" content="index,follow,max-snippet:-1"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'rel="canonical" href="https://ukraine-air-alerts.netlify.app/"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'chart-share.js?v=20261019-share2-1' kyiv-air-alerts-grafana/pages-preview/index.html
          node --check kyiv-air-alerts-grafana/pages-preview/chart-share.js
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node --check kyiv-air-alerts-grafana/pages-preview/kpi-range.js
          node kyiv-air-alerts-grafana/tests/test_chart_share.js
          node kyiv-air-alerts-grafana/tests/test_calendar_week.js
          node kyiv-air-alerts-grafana/tests/test_daily28_rollover.js
          node kyiv-air-alerts-grafana/tests/test_dynamic_city_kpi.js
          node kyiv-air-alerts-grafana/tests/test_historical_max.js
          node kyiv-air-alerts-grafana/tests/test_city_period_kpi_sync.js
          node kyiv-air-alerts-grafana/tests/test_kpi_interval_windows.js
          node kyiv-air-alerts-grafana/tests/test_all_time_period.js
          node kyiv-air-alerts-grafana/tests/test_live_history_binding.js
          for asset in brand-mark.svg brand-horizontal-uk-dark.svg brand-horizontal-en-dark.svg favicon.svg favicon-32.png; do
            test -s "kyiv-air-alerts-grafana/pages-preview/$asset"
          done

      - name: Prepare immutable historical KPI bootstrap (Git-only default)
        if: ${{ !inputs.neon_release_mode }}
        run: |
          python -m pip install -r kyiv-air-alerts-grafana/requirements.txt
          python kyiv-air-alerts-grafana/tests/test_monthly_seconds.py
          python kyiv-air-alerts-grafana/scripts/build_preview_historical_daily.py \
            --production-root kyiv-air-alerts-grafana \
            --source-sha "$(git rev-parse HEAD)" \
            --output historical-daily-kpi.json
          python - <<'PY'
          import json
          with open("historical-daily-kpi.json", encoding="utf-8") as f:
              index = json.load(f)
          assert index["meta"]["verified_count"] == 23
          assert index["meta"]["expected_cities"] == 23
          assert index["cities"]["kyiv"]["status"] == "verified"
          print("Bootstrap index ready for 23 cities")
          PY

      - name: Select approved exact Neon KPI from pinned six-file artifact
        if: ${{ inputs.neon_release_mode }}
        env:
          GH_TOKEN: ${{ github.token }}
          C6_RELEASE_OWNER_APPROVED: ${{ vars.C6_NEON_RELEASE_OWNER_APPROVED }}
          C6_RUN_ID: ${{ inputs.c6_run_id }}
          C6_ATTEMPT: ${{ inputs.c6_run_attempt }}
          C6_ARTIFACT_ID: ${{ inputs.c6_artifact_id }}
          C6_ARTIFACT_SHA: ${{ inputs.c6_artifact_sha256 }}
          APPROVED_KPI_SHA: ${{ inputs.approved_kpi_sha256 }}
          APPROVED_GENERATION: ${{ inputs.approved_generation }}
        run: |
          set -euo pipefail
          # Separate owner action is mandatory. Default unset/OFF.
          test "$C6_RELEASE_OWNER_APPROVED" = "true"
          [[ "$C6_RUN_ID" =~ ^[0-9]+$ && "$C6_ATTEMPT" =~ ^[0-9]+$ && "$C6_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$C6_ARTIFACT_SHA" =~ ^[a-f0-9]{64}$ && "$APPROVED_KPI_SHA" =~ ^[a-f0-9]{64}$ ]]
          test -n "$APPROVED_GENERATION"
          mkdir -p _approved_c6
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$C6_RUN_ID" > _approved_c6/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$C6_ARTIFACT_ID" > _approved_c6/artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$C6_ARTIFACT_ID/zip" > _approved_c6/artifact.zip
          test "$(sha256sum _approved_c6/artifact.zip | cut -d ' ' -f1)" = "$C6_ARTIFACT_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads(Path('_approved_c6/run.json').read_text())
          art=json.loads(Path('_approved_c6/artifact.json').read_text())
          assert run['id']==int(os.environ['C6_RUN_ID'])
          assert run['run_attempt']==int(os.environ['C6_ATTEMPT'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/update-netlify-site.yml'
          assert art['id']==int(os.environ['C6_ARTIFACT_ID'])
          assert art['name']==f"c6-neon-git-preparation-{run['id']}-{run['run_attempt']}"
          assert art['workflow_run']['id']==run['id'] and not art['expired']
          assert art.get('digest')=='sha256:'+os.environ['C6_ARTIFACT_SHA']
          PY
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          target=Path('_approved_c6')
          with zipfile.ZipFile(target/'artifact.zip') as z:
              names=set(z.namelist())
              report_paths=[n for n in names if n.endswith('REPORT.json')]
              assert len(report_paths)==1
              report=json.loads(z.read(report_paths[0]))
              assert report['state']=='INTEGRATION_PREPARED_PUBLICATION_OFF'
              assert report['publication_allowed'] is False and report['production_git_push_executed'] is False
              assert report['prepared_files']==6
              files=report['files']
              expected={
                  'historical-daily-kpi.json',
                  'kyiv-air-alerts-grafana/data/dashboard_data.json',
                  'kyiv-air-alerts-grafana/data/site_derived.json',
                  'kyiv-air-alerts-grafana/data/alerts_combined.json',
                  'kyiv-air-alerts-grafana/data/kyiv_threat_mix.json',
                  'kyiv-air-alerts-grafana/data/sevastopol_events.json'}
              assert set(files)==expected
              def member(path):
                  candidates=[n for n in names if n.endswith('candidate/'+path)]
                  assert len(candidates)==1
                  raw=z.read(candidates[0])
                  assert hashlib.sha256(raw).hexdigest()==files[path]
                  return raw
              for path in expected:
                  member(path)
              raw=member('historical-daily-kpi.json')
              index=json.loads(raw)
              dashboard=json.loads(member('kyiv-air-alerts-grafana/data/dashboard_data.json'))
              meta=index['meta']
              assert files['historical-daily-kpi.json']==os.environ['APPROVED_KPI_SHA']
              assert meta['source_ref']=='neon:'+report['neon_branch']
              assert meta['source_dashboard_generated_at']==os.environ['APPROVED_GENERATION']
              assert dashboard['meta']['generated_at']==os.environ['APPROVED_GENERATION']
              assert dashboard['historical_daily_kpi']==index
              assert meta['expected_cities']==meta['verified_count']==23
              assert len(index['cities'])==23
              Path('historical-daily-kpi.json').write_bytes(raw)
          print('APPROVED_SIX_FILE_KPI_EXACT_SHA_SOURCE_GENERATION_PASS')
          PY

      - name: Build static frontend
        run: |
          rm -rf _site
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html kyiv-air-alerts-grafana/pages-preview/styles.css kyiv-air-alerts-grafana/pages-preview/app.js kyiv-air-alerts-grafana/pages-preview/features.json kyiv-air-alerts-grafana/pages-preview/chart-share.js kyiv-air-alerts-grafana/pages-preview/brand-mark.svg kyiv-air-alerts-grafana/pages-preview/brand-horizontal-uk-dark.svg kyiv-air-alerts-grafana/pages-preview/brand-horizontal-en-dark.svg kyiv-air-alerts-grafana/pages-preview/favicon.svg kyiv-air-alerts-grafana/pages-preview/favicon-32.png _site/
          cp kyiv-air-alerts-grafana/pages-preview/kpi-range.js historical-daily-kpi.json _site/
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 12

      - name: Deploy production to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=_site \
            --site=b5aafc46-7468-4070-baf1-db80a4d30501 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --json | tee netlify-production-deploy.json

      - name: Verify production HTTP KPI assets after publication
        run: |
          set -euo pipefail
          SITE="https://ukraine-air-alerts.netlify.app"
          for asset in kpi-range.js historical-daily-kpi.json app.js; do
            curl --fail --show-error --silent --location --retry 10 --retry-delay 3 \
              --retry-all-errors "$SITE/$asset?v=20261022-hotfix" -o "/tmp/production-$asset"
          done
          cmp kyiv-air-alerts-grafana/pages-preview/kpi-range.js /tmp/production-kpi-range.js
          cmp kyiv-air-alerts-grafana/pages-preview/app.js /tmp/production-app.js
          python - <<'PY'
          import json
          with open("/tmp/production-historical-daily-kpi.json", encoding="utf-8") as f:
              h=json.load(f)
          assert h["meta"]["verified_count"] == 23, h["meta"]
          assert len(h["cities"]) == 23
          assert all(row["status"]=="verified" for row in h["cities"].values())
          print("PASS: served production KPI JS and historical index, HTTP 200, 23/23 cities")
          PY

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v4
        with:
          name: netlify-production-deploy
          path: netlify-production-deploy.json
