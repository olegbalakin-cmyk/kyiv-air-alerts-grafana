name: Deploy Netlify production site

on:
  workflow_dispatch:
  push:
    branches: [site-prod]
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "kyiv-air-alerts-grafana/scripts/build_time_of_day_heatmap.py"
      - "kyiv-air-alerts-grafana/data/dashboard_data.json"
      - "kyiv-air-alerts-grafana/data/alerts_combined.json"
      - "kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json"
      - "kyiv-air-alerts-grafana/data/sevastopol_events.json"
      - "kyiv-air-alerts-grafana/data/alerts_in_ua_bridge_*.csv.gz.b64"
      - "kyiv-air-alerts-grafana/data/alerts_in_ua_bridge_*.meta.json"
      - ".github/workflows/netlify-production.yml"

concurrency:
  group: netlify-production-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production site branch
        uses: actions/checkout@v4
        with:
          ref: site-prod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Verify validated production dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("kyiv-air-alerts-grafana/data")
          qa = json.loads((root / "dashboard_qa.json").read_text(encoding="utf-8"))
          data = json.loads((root / "dashboard_data.json").read_text(encoding="utf-8"))
          keys = data.get("multicity_meta", {}).get("production_city_keys", [])
          assert qa.get("ok") is True, qa
          assert len(keys) == 23, len(keys)
          print("Validated production dataset:", len(keys), "rows")
          PY

      - name: Build derived production views
        run: |
          cp kyiv-air-alerts-grafana/data/dashboard_data.json /tmp/dashboard_data.json
          python kyiv-air-alerts-grafana/scripts/build_time_of_day_heatmap.py \
            --dashboard /tmp/dashboard_data.json \
            --kyiv-alerts kyiv-air-alerts-grafana/data/alerts_combined.json \
            --bridge-store kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json \
            --sevastopol-events kyiv-air-alerts-grafana/data/sevastopol_events.json \
            --explorations-output /tmp/explorations-test-data.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/dashboard_data.json").read_text(encoding="utf-8"))
          keys = data["multicity_meta"]["production_city_keys"]
          heat = data["time_of_day_heatmap_test"]
          explorations = json.loads(Path("/tmp/explorations-test-data.json").read_text(encoding="utf-8"))
          assert len(keys) == 23
          assert heat["meta"]["city_count"] == 23
          assert set(heat["cities"]) == set(keys)
          assert explorations["meta"]["city_count"] == 23
          assert set(explorations["cities"]) == set(keys)
          for key in keys:
              assert explorations["cities"][key]["monthly"], key
              assert explorations["cities"][key]["years"], key
          print("Derived production views verified for 23 cities")
          PY

      - name: Build Kyiv Digital alert-cause data
        run: |
          curl -fsS -H 'Accept: application/json' 'https://kyiv.digital/open-api/air-alert/history' -o /tmp/kyiv-air-alert-history.json
          python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SOURCE = "https://kyiv.digital/open-api/air-alert/history"
          TZ = ZoneInfo("Europe/Kyiv")
          FIRST_DIFFERENTIATED_DATE = "2026-09-07"
          raw = json.loads(Path("/tmp/kyiv-air-alert-history.json").read_text(encoding="utf-8"))
          if isinstance(raw, list):
              records = raw
          elif isinstance(raw, dict):
              lists = [v for v in raw.values() if isinstance(v, list)]
              if len(lists) != 1:
                  raise RuntimeError(f"Unexpected Kyiv history root: {sorted(raw.keys())}")
              records = lists[0]
          else:
              raise RuntimeError(f"Unexpected Kyiv history root type: {type(raw).__name__}")

          def parse_ts(value):
              if not value:
                  return None
              s = str(value).strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              dt = datetime.fromisoformat(s)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          def is_active(value):
              if isinstance(value, bool): return value
              if isinstance(value, (int, float)): return int(value) == 1
              return str(value).strip().lower() in {"1","true","active","alarm","on"}

          normalized = []
          for record in records:
              if not isinstance(record, dict):
                  continue
              ts = parse_ts(record.get("created_at"))
              if ts is None:
                  continue
              causes = record.get("causes")
              if not isinstance(causes, list):
                  causes = []
              normalized.append({
                  "created_at": ts,
                  "state": is_active(record.get("state")),
                  "causes": sorted({str(x).strip() for x in causes if str(x).strip()}),
              })
          normalized.sort(key=lambda x: x["created_at"])

          episodes, current = [], None
          duplicate_active_records = orphan_clear_records = 0
          for record in normalized:
              if record["state"]:
                  if current is None: current = record
                  else: duplicate_active_records += 1
              else:
                  if current is None:
                      orphan_clear_records += 1
                      continue
                  if record["created_at"] > current["created_at"]:
                      episodes.append({"start": current["created_at"], "end": record["created_at"], "causes": current["causes"]})
                  current = None

          differentiated = [e for e in episodes if e["causes"] and e["start"].astimezone(TZ).date().isoformat() >= FIRST_DIFFERENTIATED_DATE]

          def bucket_for(causes):
              values = set(causes)
              if len(values) >= 2 or "missile-drone" in values: return "combined"
              if not values: return "unknown"
              value = next(iter(values))
              return value if value in {"drone","massive-drone","missile","ballistic","mig"} else "unknown"

          minutes = defaultdict(lambda: defaultdict(float))
          first_day = last_day = None
          for episode in differentiated:
              start = episode["start"].astimezone(TZ)
              end = episode["end"].astimezone(TZ)
              bucket = bucket_for(episode["causes"])
              cursor = start
              while cursor < end:
                  day = cursor.date()
                  next_midnight = datetime.combine(day + timedelta(days=1), datetime.min.time(), TZ)
                  segment_end = min(end, next_midnight)
                  minutes[day.isoformat()][bucket] += max(0.0, (segment_end-cursor).total_seconds()/60.0)
                  first_day = day if first_day is None or day < first_day else first_day
                  last_day = day if last_day is None or day > last_day else last_day
                  cursor = segment_end

          today_local = datetime.now(TZ).date()
          last_completed = today_local - timedelta(days=1)
          if first_day is None:
              raise RuntimeError("No differentiated completed Kyiv episodes found")
          last_visible = min(last_day, last_completed)
          visible_start = max(first_day, last_visible - timedelta(days=27))
          buckets = ["drone","massive-drone","missile","ballistic","mig","combined","unknown"]
          rows = []
          day = visible_start
          while day <= last_visible:
              key = day.isoformat()
              by_bucket = {b: round(minutes[key].get(b,0.0),3) for b in buckets}
              total = round(sum(by_bucket.values()),3)
              shares = {b:(round(by_bucket[b]/total*100.0,6) if total>0 else 0.0) for b in buckets}
              rows.append({"date":key,"total_minutes":total,"minutes":by_bucket,"shares":shares})
              day += timedelta(days=1)

          output = {
              "meta":{
                  "source":SOURCE,
                  "timezone":"Europe/Kyiv",
                  "semantics":"episode_level_cause_assignment",
                  "first_differentiated_date":FIRST_DIFFERENTIATED_DATE,
                  "generated_at":datetime.now(timezone.utc).isoformat(),
                  "visible_start":visible_start.isoformat(),
                  "visible_end":last_visible.isoformat(),
                  "visible_day_count":len(rows),
                  "note":"Historical Kyiv Digital causes are assigned to the whole alert episode. Intra-alert cause transitions are not reconstructed."
              },
              "rows":rows,
          }
          Path("/tmp/kyiv-threat-mix-data.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Kyiv cause rows:", len(rows))
          PY

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/pages-preview/features.json _site/features.json
          cp /tmp/dashboard_data.json _site/data.json
          cp /tmp/explorations-test-data.json _site/explorations-test-data.json
          cp /tmp/kyiv-threat-mix-data.json _site/kyiv-threat-mix-data.json

      - name: Deploy production to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=_site \
            --site=b5aafc46-7468-4070-baf1-db80a4d30501 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --json | tee netlify-production-deploy.json

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v4
        with:
          name: netlify-production-deploy
          path: netlify-production-deploy.json
