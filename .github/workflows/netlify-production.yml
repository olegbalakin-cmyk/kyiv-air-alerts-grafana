name: Deploy Netlify production site

on:
  workflow_dispatch:
  push:
    branches: [site-prod]
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/index.html"
      - "kyiv-air-alerts-grafana/pages-preview/app.js"
      - "kyiv-air-alerts-grafana/pages-preview/styles.css"
      - "kyiv-air-alerts-grafana/pages-preview/features.json"

concurrency:
  group: netlify-production-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production site branch
        uses: actions/checkout@v4
        with:
          ref: site-prod

      - name: Verify frontend-only production bundle
        run: |
          test -s kyiv-air-alerts-grafana/pages-preview/index.html
          test -s kyiv-air-alerts-grafana/pages-preview/styles.css
          test -s kyiv-air-alerts-grafana/pages-preview/app.js
          test -s kyiv-air-alerts-grafana/pages-preview/features.json
          grep -q 'raw.githubusercontent.com/olegbalakin-cmyk/kyiv-air-alerts-grafana/site-prod/kyiv-air-alerts-grafana/data/' kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q '"attack_events": false' kyiv-air-alerts-grafana/pages-preview/features.json

      - name: Build static frontend
        run: |
          rm -rf _site
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/pages-preview/features.json _site/features.json

      - name: Deploy production to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=_site \
            --site=b5aafc46-7468-4070-baf1-db80a4d30501 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --json | tee netlify-production-deploy.json

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v4
        with:
          name: netlify-production-deploy
          path: netlify-production-deploy.json
