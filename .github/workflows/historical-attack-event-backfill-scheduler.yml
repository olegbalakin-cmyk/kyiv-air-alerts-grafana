name: Resume historical attack-event backfill

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: historical-attack-event-backfill-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out isolated campaign branch
        uses: actions/checkout@v4
        with:
          ref: historical-attack-event-backfill-2026-09-27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt
      - name: Resume only after campaign has been explicitly started
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/historical_attack_event_backfill_status.json")
          if not p.exists():
              print("0")
          else:
              doc = json.loads(p.read_text(encoding="utf-8"))
              scanned = sum(int((row or {}).get("scanned_episodes") or 0) for row in (doc.get("cities") or {}).values())
              print("1" if scanned > 0 else "0")
          PY
          )"
          if [ "$ACTIVE" != "1" ]; then
            echo "Campaign has not been explicitly started; scheduled resume is a no-op."
            exit 0
          fi

          BASE_HEAD="$(git rev-parse HEAD)"
          OUT="$(cd kyiv-air-alerts-grafana && python scripts/run_historical_attack_event_backfill_batch.py             --campaign-id historical-attack-events-v2-2026-09-27             --city-key auto             --batch-size 50             --output-dir ../research/historical_attack_event_backfill             --resume)"
          printf '%s\n' "$OUT"
          NEW_WORK="$(python -c 'import json,sys; print(json.load(sys.stdin).get("new_work",0))' <<<"$OUT")"
          if [ "$NEW_WORK" = "0" ]; then
            exit 0
          fi

          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_audited_baseline.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_review_queue.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosions_test.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/dashboard_data.json)"
          test -z "$(git status --porcelain -- 'kyiv-air-alerts-grafana/data/explosion_research/**/final_evidence.json')"

          git fetch origin historical-attack-event-backfill-2026-09-27
          test "$BASE_HEAD" = "$(git rev-parse origin/historical-attack-event-backfill-2026-09-27)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_attack_event_backfill_status.json research/historical_attack_event_backfill/
          git commit -m "Checkpoint historical attack-event backfill"
          git push origin HEAD:historical-attack-event-backfill-2026-09-27
