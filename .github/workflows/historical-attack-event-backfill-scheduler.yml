name: Resume historical attack-event backfill

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: historical-attack-event-backfill-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out scheduler/controller from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: scheduler
          fetch-depth: 1

      - name: Check out isolated campaign branch
        uses: actions/checkout@v4
        with:
          ref: historical-attack-event-backfill-2026-09-27
          path: campaign
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: campaign/kyiv-air-alerts-grafana/requirements.txt

      - name: Install campaign dependencies
        working-directory: campaign/kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Verify acceleration controller state machine
        run: |
          python scheduler/kyiv-air-alerts-grafana/scripts/historical_attack_event_acceleration_controller.py self-test

      - name: Inspect current campaign phase
        run: |
          python scheduler/kyiv-air-alerts-grafana/scripts/historical_attack_event_acceleration_controller.py inspect \
            --checkout-root campaign

      - name: Run bounded staged campaign resume
        env:
          SCHEDULER_EVENT_NAME: ${{ github.event_name }}
          SCHEDULER_RUN_ID: ${{ github.run_id }}
        run: |
          python scheduler/kyiv-air-alerts-grafana/scripts/historical_attack_event_acceleration_controller.py run \
            --checkout-root campaign \
            --event-name "$SCHEDULER_EVENT_NAME" \
            --run-id "$SCHEDULER_RUN_ID"
