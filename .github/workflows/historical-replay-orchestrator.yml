name: Historical explosion replay orchestrator

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to replay"
        required: true
        default: "source_ready"
        type: choice
        options:
          - source_ready
          - blocked
          - all
          - city
      city:
        description: "City key when scope=city"
        required: false
        default: "sumy"
        type: string
      through:
        description: "Inclusive historical replay end date"
        required: false
        default: "2026-09-17"
        type: string
  push:
    branches:
      - multicity-wip-2026-09-16
    paths:
      - ".github/workflows/historical-replay-city.yml"
      - ".github/workflows/historical-replay-orchestrator.yml"
      - "kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"
      - "kyiv-air-alerts-grafana/data/explosion_research/**/final_evidence.json"
      - "kyiv-air-alerts-grafana/data/explosion_metric_handoff/source_slices/**"
      - "kyiv-air-alerts-grafana/data/sevastopol_events.json"
      - "kyiv-air-alerts-grafana/data/alerts_combined.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: historical-explosion-replay-orchestrator
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      input_sha: ${{ steps.plan.outputs.input_sha }}
      through: ${{ steps.plan.outputs.through }}
      scope: ${{ steps.plan.outputs.scope }}
      requested_city: ${{ steps.plan.outputs.requested_city }}

    steps:
      - name: Checkout exact planning input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Run authoritative read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python kyiv-air-alerts-grafana/scripts/replay_explosion_history.py             --repo-root "$GITHUB_WORKSPACE/kyiv-air-alerts-grafana"             --through "${{ inputs.through || '2026-09-17' }}"             --input-head "${{ github.sha }}"             --read-only             --preflight             --output "$RUNNER_TEMP/orchestrator_preflight.json"
          rc=$?
          set -e
          test -f "$RUNNER_TEMP/orchestrator_preflight.json"
          echo "Preflight rc=$rc (nonzero is expected while blockers remain)."

      - name: Build replay matrix
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ inputs.scope }}
          DISPATCH_CITY: ${{ inputs.city }}
          DISPATCH_THROUGH: ${{ inputs.through }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          preflight = json.loads(Path(os.environ["RUNNER_TEMP"], "orchestrator_preflight.json").read_text(encoding="utf-8"))
          rows = preflight.get("cities") or []
          by_city = {row["city_key"]: row for row in rows}
          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              scope = os.environ.get("DISPATCH_SCOPE") or "source_ready"
              requested_city = os.environ.get("DISPATCH_CITY") or "sumy"
              through = os.environ.get("DISPATCH_THROUGH") or "2026-09-17"
          else:
              scope = "source_ready"
              requested_city = "sumy"
              through = "2026-09-17"

          previous_path = Path("research/historical_replay_status_current.json")
          previous = {}
          if previous_path.exists():
              try:
                  previous = json.loads(previous_path.read_text(encoding="utf-8")).get("cities") or {}
              except Exception:
                  previous = {}

          if scope == "city":
              if requested_city not in by_city:
                  raise SystemExit(f"Unknown city for scope=city: {requested_city}")
              selected = [by_city[requested_city]]
          elif scope == "source_ready":
              selected = [row for row in rows if row.get("source_status") == "READY"]
          elif scope == "all":
              selected = list(rows)
          elif scope == "blocked":
              blocked_keys = {city for city, status in previous.items() if isinstance(status, dict) and status.get("status") != "READY"}
              selected = [row for row in rows if row["city_key"] in blocked_keys] if blocked_keys else list(rows)
          else:
              raise SystemExit(f"Unsupported scope: {scope}")

          include = []
          for row in selected:
              blockers = [x.get("code") for x in row.get("blocking_reasons", []) if x.get("code")]
              include.append({
                  "city": row["city_key"],
                  "source_status": row.get("source_status") or "BLOCKED",
                  "expected_alert_episodes": str(row.get("expected_alert_episodes") or ""),
                  "reconstructed_alert_episodes": str(row.get("reconstructed_alert_episodes") or ""),
                  "blocker_codes_json": json.dumps(blockers, ensure_ascii=False, separators=(",", ":")),
              })

          matrix = json.dumps({"include": include}, ensure_ascii=False, separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write("matrix=" + matrix + "\n")
              f.write("input_sha=" + os.environ["GITHUB_SHA"] + "\n")
              f.write("through=" + through + "\n")
              f.write("scope=" + scope + "\n")
              f.write("requested_city=" + requested_city + "\n")
          print(f"scope={scope} selected={len(include)}")
          print([x["city"] for x in include])
          PY

      - name: Upload planning preflight
        uses: actions/upload-artifact@v4
        with:
          name: historical-replay-plan-${{ github.sha }}
          path: ${{ runner.temp }}/orchestrator_preflight.json
          if-no-files-found: error
          retention-days: 30

  replay:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/historical-replay-city.yml
    with:
      city: ${{ matrix.city }}
      input_sha: ${{ needs.plan.outputs.input_sha }}
      through: ${{ needs.plan.outputs.through }}
      source_status: ${{ matrix.source_status }}
      expected_alert_episodes: ${{ matrix.expected_alert_episodes }}
      reconstructed_alert_episodes: ${{ matrix.reconstructed_alert_episodes }}
      blocker_codes_json: ${{ matrix.blocker_codes_json }}

  aggregate:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs:
      - plan
      - replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INPUT_SHA: ${{ needs.plan.outputs.input_sha }}
      THROUGH: ${{ needs.plan.outputs.through }}
      SCOPE: ${{ needs.plan.outputs.scope }}
      REQUESTED_CITY: ${{ needs.plan.outputs.requested_city }}
      BRANCH: multicity-wip-2026-09-16

    steps:
      - name: Checkout branch for status publication
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Download plan preflight
        uses: actions/download-artifact@v4
        with:
          name: historical-replay-plan-${{ env.INPUT_SHA }}
          path: _orchestrator_plan

      - name: Download city status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: historical-replay-city-*-${{ env.INPUT_SHA }}
          path: _orchestrator_city
          merge-multiple: true

      - name: Build persistent status file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          preflight = json.loads(Path("_orchestrator_plan/orchestrator_preflight.json").read_text(encoding="utf-8"))
          current_rows = {row["city_key"]: row for row in preflight.get("cities") or []}
          status_path = Path("research/historical_replay_status_current.json")
          previous = {}
          if status_path.exists():
              try:
                  previous = json.loads(status_path.read_text(encoding="utf-8")).get("cities") or {}
              except Exception:
                  previous = {}
          results = {}
          for path in sorted(Path("_orchestrator_city").glob("status-*.json")):
              row = json.loads(path.read_text(encoding="utf-8"))
              results[row["city_key"]] = row
          cities = {}
          for city, source in current_rows.items():
              if city in results:
                  cities[city] = results[city]
                  continue
              blockers = [x.get("code") for x in source.get("blocking_reasons", []) if x.get("code")]
              if source.get("source_status") != "READY":
                  cities[city] = {
                      "schema_version": 1,
                      "city_key": city,
                      "input_head": os.environ["INPUT_SHA"],
                      "through": os.environ["THROUGH"],
                      "source_status": source.get("source_status"),
                      "status": "BLOCKED",
                      "manual_qa_count": 0,
                      "verdict": "SOURCE BLOCKED",
                      "expected_alert_episodes": source.get("expected_alert_episodes"),
                      "reconstructed_alert_episodes": source.get("reconstructed_alert_episodes"),
                      "blocker_codes": blockers,
                  }
              elif city in previous:
                  old = dict(previous[city])
                  old["source_status"] = "READY"
                  old["source_status_checked_at_head"] = os.environ["INPUT_SHA"]
                  cities[city] = old
              else:
                  cities[city] = {
                      "schema_version": 1,
                      "city_key": city,
                      "input_head": os.environ["INPUT_SHA"],
                      "through": os.environ["THROUGH"],
                      "source_status": "READY",
                      "status": "SOURCE_READY_NOT_REPLAYED",
                      "manual_qa_count": None,
                      "verdict": "SOURCE READY; REPLAY NOT INCLUDED IN THIS RUN",
                      "expected_alert_episodes": source.get("expected_alert_episodes"),
                      "reconstructed_alert_episodes": source.get("reconstructed_alert_episodes"),
                      "blocker_codes": [],
                  }
          counts = Counter(row.get("status") for row in cities.values())
          payload = {
              "schema_version": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "input_head": os.environ["INPUT_SHA"],
              "through": os.environ["THROUGH"],
              "scope": os.environ["SCOPE"],
              "requested_city": os.environ["REQUESTED_CITY"],
              "city_count": len(cities),
              "status_counts": dict(sorted(counts.items())),
              "live_controls_all_pass": (preflight.get("live_control_regressions") or {}).get("all_pass"),
              "protected_files_unchanged_in_preflight": preflight.get("protected_files_unchanged"),
              "cities": dict(sorted(cities.items())),
          }
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Historical replay status\n\n")
              f.write(f"Input: {payload['input_head']} through {payload['through']}\n\n")
              f.write("| City | Status | QA items | Source |\n")
              f.write("|---|---:|---:|---|\n")
              for city, row in sorted(cities.items()):
                  qa = row.get("manual_qa_count")
                  f.write(f"| {city} | {row.get('status')} | {'' if qa is None else qa} | {row.get('source_status')} |\n")
              f.write("\nCounts: " + json.dumps(payload["status_counts"], ensure_ascii=False) + "\n")
          print(json.dumps(payload["status_counts"], ensure_ascii=False, indent=2))
          PY
          git diff --check -- research/historical_replay_status_current.json

      - name: Commit only status file
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/historical_replay_status_current.json"
          git add -- "$TARGET"
          if git diff --cached --quiet -- "$TARGET"; then
            echo "Status file unchanged."
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --cached --name-only)
          printf '%s\n' "${CHANGED[@]}"
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update historical replay status"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
