name: C6 isolated read-only Neon shadow proof (manual, non-publishing)
on:
  workflow_dispatch:
    inputs:
      research_sha:
        description: Fresh owner-approved full HEAD on research-c6-work-l-recover-2026-11-13
        required: true
        type: string
      c2_artifact_run_id:
        description: Exact immutable C2 run 43321997695 (no rerun)
        required: true
        type: string
      c2_artifact_name:
        description: Exact c2-shadow-inputs-43321997695-1 artifact
        required: true
        type: string
      bundle_sha256:
        description: Independently verified inner C2 ZIP SHA-256
        required: true
        type: string
      writer_workflow_sha:
        description: Pinned main workflow SHA 712c9e...
        required: true
        type: string
      input_sha:
        description: Exact C2 input site-prod SHA
        required: true
        type: string
      db_branch:
        description: Exact existing Neon branch
        required: true
        type: string
      db_endpoint:
        description: Existing Neon endpoint hostname only (no credentials)
        required: true
        type: string
      owner_approval:
        description: Owner must separately enter APPROVE_ONE_READONLY_PROOF
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: c6-isolated-neon-shadow-readonly
  cancel-in-progress: false
jobs:
  proof:
    if: >-
      github.repository == 'olegbalakin-cmyk/kyiv-air-alerts-grafana' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'olegbalakin-cmyk' &&
      inputs.owner_approval == 'APPROVE_ONE_READONLY_PROOF' &&
      github.ref == 'refs/heads/research-c6-work-l-recover-2026-11-13' &&
      github.sha == inputs.research_sha
    environment: c6-neon-shadow-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require separate owner and environment SHA approval
        env:
          APPROVED_SHA: ${{ vars.C6_SHADOW_APPROVED_RESEARCH_SHA }}
          RESEARCH_SHA: ${{ inputs.research_sha }}
        run: |
          set -euo pipefail
          [[ "$RESEARCH_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RESEARCH_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_sha }}
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.input_sha }}
          path: pinned-site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch metadata and immutable GitHub artifact only; no source HTTP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work-l"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43321997695" > "$root/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43321997695/jobs?filter=all&per_page=100" > "$root/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13991878472" > "$root/artifact.json"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13991878472/zip" \
            --output "$root/c2-outer.zip"
      - name: Fail closed on exact run, attempt, all jobs, SHA and 23 receipts
        env:
          C2_RUN_ID: ${{ inputs.c2_artifact_run_id }}
          C2_NAME: ${{ inputs.c2_artifact_name }}
          C2_SHA: ${{ inputs.bundle_sha256 }}
          WRITER_SHA: ${{ inputs.writer_workflow_sha }}
          INPUT_SHA: ${{ inputs.input_sha }}
          DB_BRANCH: ${{ inputs.db_branch }}
          DB_ENDPOINT: ${{ inputs.db_endpoint }}
        run: |
          set -euo pipefail
          python research/scripts/c6_failed_c2_recovery_gate.py \
            --run "$RUNNER_TEMP/work-l/run.json" \
            --jobs "$RUNNER_TEMP/work-l/jobs.json" \
            --artifact "$RUNNER_TEMP/work-l/artifact.json" \
            --outer "$RUNNER_TEMP/work-l/c2-outer.zip" \
            --bundle-output existing-c2/c2-shadow-inputs.zip \
            --run-id "$C2_RUN_ID" --run-attempt "1" \
            --workflow-sha "$WRITER_SHA" --input-sha "$INPUT_SHA" \
            --corpus-sha "f855be9c2cfb8617903666d0d898c223c6a91ac0fc56029b5b036dc153db84d4" \
            --bundle-sha256 "$C2_SHA" --db-branch "$DB_BRANCH" \
            --db-endpoint "$DB_ENDPOINT" --artifact-id "13991878472" \
            --artifact-name "$C2_NAME"
      - name: Install previously accepted read-only proof dependencies
        run: python -m pip install -r research/research/neon_json_shadow_frontend_2026_10_31/offline_proof/requirements.lock.txt
      - name: Read existing Neon snapshot and generate isolated six JSON; never publish
        working-directory: research
        env:
          NEON_JSON_SHADOW_READONLY_DATABASE_URL: ${{ secrets.NEON_JSON_SHADOW_READONLY_DATABASE_URL }}
          BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
          WRITER_SHA: ${{ inputs.writer_workflow_sha }}
          INPUT_SHA: ${{ inputs.input_sha }}
          DB_BRANCH: ${{ inputs.db_branch }}
          DB_ENDPOINT: ${{ inputs.db_endpoint }}
          C2_RUN_ID: ${{ inputs.c2_artifact_run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m scripts.neon_json_shadow_physical_proof \
            --site ../pinned-site/kyiv-air-alerts-grafana \
            --bundle ../existing-c2/c2-shadow-inputs.zip \
            --bundle-sha256 "$BUNDLE_SHA" --workflow-sha "$WRITER_SHA" \
            --input-sha "$INPUT_SHA" --db-branch "$DB_BRANCH" \
            --db-endpoint "$DB_ENDPOINT" --c2-run-id "$C2_RUN_ID" --output ../research-evidence
      - name: Preserve research proof even on fail-closed rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-neon-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-evidence/
          retention-days: 7
          if-no-files-found: warn
