name: C6 isolated read-only Neon shadow proof (manual, non-publishing)
on:
  workflow_dispatch:
    inputs:
      archive_recovery:
        description: "Exact #43523629106 archive-only recovery; no C2, writer, push or deploy"
        required: true
        type: boolean
        default: false
      research_sha:
        description: Owner-approved exact full SHA on research-c6-unblock-shadow-proof-2026-11-01
        required: true
        type: string
      c2_artifact_run_id:
        description: Existing successful approved C2 artifact run; no new writer is invoked
        required: true
        type: string
      c2_artifact_name:
        description: Artifact containing c2-shadow-inputs.zip and its checksum sidecar
        required: true
        type: string
      bundle_sha256:
        description: Independently owner-verified SHA-256 of c2-shadow-inputs.zip
        required: true
        type: string
      writer_workflow_sha:
        description: Full original writer workflow SHA in the approved C2 receipt
        required: true
        type: string
      input_sha:
        description: Full site input SHA in that same C2 receipt
        required: true
        type: string
      db_branch:
        description: Existing owner-approved branch matching receipt and endpoint
        required: true
        type: string
      db_endpoint:
        description: Existing owner-approved Neon endpoint hostname (no credentials)
        required: true
        type: string
      owner_approval:
        description: Owner must explicitly enter APPROVE_ONE_READONLY_PROOF before dispatch
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: c6-isolated-neon-shadow-readonly
  cancel-in-progress: false
jobs:
  proof:
    if: >-
      github.repository == 'olegbalakin-cmyk/kyiv-air-alerts-grafana' &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.archive_recovery &&
      github.actor == 'olegbalakin-cmyk' &&
      inputs.owner_approval == 'APPROVE_ONE_READONLY_PROOF' &&
      github.ref == 'refs/heads/research-c6-unblock-shadow-proof-2026-11-01' &&
      github.sha == inputs.research_sha
    environment: c6-neon-shadow-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify pinned inputs and successful C2 run (GitHub metadata only)
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_SHA: ${{ inputs.research_sha }}
          WRITER_SHA: ${{ inputs.writer_workflow_sha }}
          INPUT_SHA: ${{ inputs.input_sha }}
          C2_RUN_ID: ${{ inputs.c2_artifact_run_id }}
          APPROVED_SHA: ${{ vars.C6_SHADOW_APPROVED_RESEARCH_SHA }}
        run: |
          python - <<'PY'
          import os, re
          assert all(re.fullmatch(r'[0-9a-f]{40}', os.environ[k]) for k in ('RESEARCH_SHA','WRITER_SHA','INPUT_SHA'))
          assert os.environ['RESEARCH_SHA'] == os.environ['APPROVED_SHA'], 'Environment SHA approval missing or mismatched'
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['C2_RUN_ID'])
          PY
          gh api "repos/olegbalakin-cmyk/kyiv-air-alerts-grafana/actions/runs/$C2_RUN_ID" > "$RUNNER_TEMP/c2-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'c2-run.json').read_text())
          assert run['id'] == int(os.environ['C2_RUN_ID'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/update-netlify-site.yml'
          assert run['head_sha'] == os.environ['WRITER_SHA']
          assert run['repository']['full_name'] == 'olegbalakin-cmyk/kyiv-air-alerts-grafana'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_sha }}
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.input_sha }}
          path: pinned-site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install previously tested dependencies
        run: python -m pip install -r research/research/neon_json_shadow_frontend_2026_10_31/offline_proof/requirements.lock.txt
      - name: Download existing owner-approved C2 artifact (GitHub only)
        uses: actions/download-artifact@v4
        with:
          repository: olegbalakin-cmyk/kyiv-air-alerts-grafana
          github-token: ${{ github.token }}
          run-id: ${{ inputs.c2_artifact_run_id }}
          name: ${{ inputs.c2_artifact_name }}
          path: existing-c2
      - name: Read existing Neon snapshot and generate isolated six-file artifact
        working-directory: research
        env:
          NEON_JSON_SHADOW_READONLY_DATABASE_URL: ${{ secrets.NEON_JSON_SHADOW_READONLY_DATABASE_URL }}
          BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
          WRITER_SHA: ${{ inputs.writer_workflow_sha }}
          INPUT_SHA: ${{ inputs.input_sha }}
          DB_BRANCH: ${{ inputs.db_branch }}
          DB_ENDPOINT: ${{ inputs.db_endpoint }}
          C2_RUN_ID: ${{ inputs.c2_artifact_run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m scripts.neon_json_shadow_physical_proof \
            --site ../pinned-site/kyiv-air-alerts-grafana \
            --bundle ../existing-c2/c2-shadow-inputs.zip \
            --bundle-sha256 "$BUNDLE_SHA" --workflow-sha "$WRITER_SHA" \
            --input-sha "$INPUT_SHA" --db-branch "$DB_BRANCH" \
            --db-endpoint "$DB_ENDPOINT" --c2-run-id "$C2_RUN_ID" --output ../research-evidence
      - name: Preserve research artifacts even on fail-closed rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-neon-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-evidence/
          retention-days: 30
          if-no-files-found: warn

  recovery-proof:
    # Branch- and owner-scoped use of the EXISTING read-only C6 proof workflow.
    # This is not the normal C2 workflow, a publisher, or a production release.
    if: >-
      github.repository == 'olegbalakin-cmyk/kyiv-air-alerts-grafana' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'olegbalakin-cmyk' &&
      inputs.archive_recovery &&
      inputs.owner_approval == 'APPROVE_ONE_READONLY_PROOF' &&
      github.ref == 'refs/heads/research-c6-fast-archive-recovery-2026-11-14' &&
      github.sha == inputs.research_sha &&
      inputs.c2_artifact_run_id == '43523629106' &&
      inputs.c2_artifact_name == 'c2-shadow-inputs-43523629106-1' &&
      inputs.bundle_sha256 == '9f4a7ccbb9f7468aa72b612cad512ecd0eb19ea8fd484146915ac07a08333493' &&
      inputs.writer_workflow_sha == '5606147a955b64e17474688c6a13596b21d93580' &&
      inputs.input_sha == '54079326ae2b4e691e2bfcf7cd1a51c9705404eb' &&
      inputs.db_branch == 'br-bold-mode-b5rub8pq' &&
      inputs.db_endpoint == 'ep-still-violet-b5bg6mhp.c-7.us-east-2.aws.neon.tech'
    environment: c6-neon-shadow-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact recovery verification code (no push token)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: integration
          persist-credentials: false
      - name: Checkout original C2 source Git baseline (no push token)
        uses: actions/checkout@v4
        with:
          ref: 54079326ae2b4e691e2bfcf7cd1a51c9705404eb
          path: pinned-site
          persist-credentials: false
      - name: Checkout existing physical C6 reader (no push token)
        uses: actions/checkout@v4
        with:
          ref: 82a7cc775ed2f2a6fd0134440db709690f0c04d1
          path: reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only the two immutable C2 artifacts and GitHub run metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43523629106" > evidence/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43523629106/jobs?per_page=100" > evidence/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14086255755" > evidence/bundle-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14085756162" > evidence/status-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          a={key:json.loads(Path('evidence/'+key+'-metadata.json').read_text())
             for key in ('bundle','status')}
          Path('evidence/artifacts.json').write_text(json.dumps(a,sort_keys=True))
          PY
          for id in 14086255755 14085756162; do
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "evidence/$id.zip"
          done
      - name: Restore archived five-file C2 delta in isolated original checkout
        shell: bash
        env:
          PYTHONPATH: integration
        run: |
          set -euo pipefail
          git -C pinned-site switch -c site-prod
          python -m scripts.c6_neon_archive_recovery \
            --outer evidence/14086255755.zip \
            --status-outer evidence/14085756162.zip \
            --run evidence/run.json --jobs evidence/jobs.json \
            --artifacts evidence/artifacts.json \
            --checkout pinned-site --delta evidence/c6-delta \
            --receipt-output evidence/reconstruction-receipt.json
      - name: Extract already-verified inner C2 archive for the existing reader
        shell: bash
        run: |
          mkdir -p evidence/extracted-c2
          unzip -p evidence/14086255755.zip c2-shadow-inputs.zip > evidence/extracted-c2/c2-shadow-inputs.zip
      - name: Preserve exact PR93 parser contract in the existing reader
        shell: bash
        run: |
          python integration/scripts/c6_pr93_generator_compat.py \
            --generator reader/scripts/neon_json_shadow_generator.py \
            --site-parser pinned-site/kyiv-air-alerts-grafana/scripts/add_sevastopol_exact.py
      - name: Install existing pinned reader dependencies
        run: python -m pip install -r reader/research/neon_json_shadow_frontend_2026_10_31/offline_proof/requirements.lock.txt
      - name: Run exactly one physical read-only Neon snapshot and six-JSON proof
        shell: bash
        working-directory: reader
        env:
          NEON_JSON_SHADOW_READONLY_DATABASE_URL: ${{ secrets.NEON_JSON_SHADOW_READONLY_DATABASE_URL }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m scripts.neon_json_shadow_physical_proof \
            --site ../pinned-site/kyiv-air-alerts-grafana \
            --bundle ../evidence/extracted-c2/c2-shadow-inputs.zip \
            --bundle-sha256 9f4a7ccbb9f7468aa72b612cad512ecd0eb19ea8fd484146915ac07a08333493 \
            --workflow-sha 5606147a955b64e17474688c6a13596b21d93580 \
            --input-sha 54079326ae2b4e691e2bfcf7cd1a51c9705404eb \
            --db-branch br-bold-mode-b5rub8pq \
            --db-endpoint ep-still-violet-b5bg6mhp.c-7.us-east-2.aws.neon.tech \
            --c2-run-id 43523629106 --output ../c6-live-proof
      - name: Fail closed on exact corpus, 23 receipts, at-use freshness and six hashes
        shell: bash
        env:
          PYTHONPATH: integration
        run: |
          set -euo pipefail
          python -m scripts.c6_neon_publication_gate \
            --proof-dir c6-live-proof --report evidence/proof-gate.json
          python -m scripts.c6_neon_git_candidate \
            --proof c6-live-proof --site pinned-site/kyiv-air-alerts-grafana \
            --output c6-prepared \
            --c2-corpus 123c515db11e0a22ede051c7b638df0242404190f553fb2daf292585731e1f00 \
            --db-branch br-bold-mode-b5rub8pq \
            --input-sha 54079326ae2b4e691e2bfcf7cd1a51c9705404eb \
            --workflow-sha 5606147a955b64e17474688c6a13596b21d93580 \
            --run-id 43523629106 --run-attempt 1 \
            --bundle-sha256 9f4a7ccbb9f7468aa72b612cad512ecd0eb19ea8fd484146915ac07a08333493
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.c6_neon_auto_git import verify_capture
          r=json.loads(Path("c6-prepared/REPORT.json").read_text())
          verify_capture(Path("evidence/c6-delta"),r,
              workflow_sha="5606147a955b64e17474688c6a13596b21d93580",
              run_id=43523629106,run_attempt=1)
          verdict=json.loads(Path("c6-live-proof/verdict.json").read_text())
          assert verdict["episode_count"] == 33450
          assert verdict["c2_corpus_sha256"] == "123c515db11e0a22ede051c7b638df0242404190f553fb2daf292585731e1f00"
          assert verdict["neon_writes"] == verdict["upstream_http_gets"] == verdict["production_file_writes"] == 0
          PY
      - name: Build immutable six JSON release binding without publication
        shell: bash
        env:
          PYTHONPATH: integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.c6_neon_release_binding import release_candidate
          root=Path("c6-prepared")
          report=json.loads((root/"REPORT.json").read_text())
          result=release_candidate(root,report,
              repository="olegbalakin-cmyk/kyiv-air-alerts-grafana",
              release_id="archive-43523629106-1",output=Path("c6-final"))
          assert len(result["files"]) == 6
          assert (Path("c6-final")/"RELEASE_MANIFEST.json").is_file()
          print("C6_ARCHIVE_RECOVERY_RELEASE_BYTES_PREPARED_NOT_PUBLISHED")
          PY
      - name: Upload evidence, full physical proof, original-identity delta and prepared bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-archive-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/reconstruction-receipt.json
            evidence/c6-delta/**
            evidence/proof-gate.json
            c6-live-proof/**
            c6-prepared/**
            c6-final/**
          if-no-files-found: warn
          retention-days: 30
