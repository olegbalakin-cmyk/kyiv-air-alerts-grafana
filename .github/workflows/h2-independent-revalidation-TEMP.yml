name: Isolated H2 independent source/key transport verification
on:
  push:
    branches:
      - neon-h2-independent-export-keys-crosswalk-2026-10-12
    paths:
      - .github/workflows/h2-independent-revalidation-TEMP.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Independent A and B from exact Git objects
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          mkdir -p "$RUNNER_TEMP/h2"
          PYTHONHASHSEED=17 python3 research/h2_independent_transport_verifier_TEMP.py --output "$RUNNER_TEMP/h2/a.json"
          PYTHONHASHSEED=997 python3 research/h2_independent_transport_verifier_TEMP.py --output "$RUNNER_TEMP/h2/b.json"
          python3 - "$RUNNER_TEMP/h2" <<'PY'
          import hashlib,json,pathlib,sys
          folder=pathlib.Path(sys.argv[1])
          a=(folder/"a.json").read_bytes()
          b=(folder/"b.json").read_bytes()
          if a!=b:
              raise SystemExit("INDEPENDENT_AB_BYTE_MISMATCH")
          proof=json.loads(a)
          print("A/B bytes",len(a),"sha256",hashlib.sha256(a).hexdigest())
          print("verdicts",json.dumps(proof.get("verdicts"),sort_keys=True))
          print("checks",json.dumps(proof.get("key_revalidation",{}).get("counts",{}),sort_keys=True))
          kr=proof.get("key_revalidation",{})
          print("SOURCE_ROW_ERRORS",json.dumps(kr.get("source_original_row_errors",[])[:40],sort_keys=True))
          print("SOURCE_LINK_MISMATCHES",json.dumps(kr.get("mismatches",{}).get("source",[])[:40],sort_keys=True))
          print("EVIDENCE_MEMBERSHIP_MISMATCHES",json.dumps(kr.get("mismatches",{}).get("evidence_membership",[])[:15],sort_keys=True))
          print("CHRONOLOGY_MISMATCHES",json.dumps(proof.get("chronology",{}).get("mismatches",[])[:35],sort_keys=True))
          print("CHRONOLOGY_PER_CITY",json.dumps({city:{"match":x.get("matching_reported_hash"),"sha256":x.get("recomputed_original_sha256"),"expected":x.get("expected_reported_original_sha256")} for city,x in proof.get("chronology",{}).get("cities",{}).items()},sort_keys=True))
          if proof.get("status")=="BLOCKED":
              print("BLOCKER",proof.get("failure_message"))
          PY
      - name: Upload compact A/B verification ledger
        uses: actions/upload-artifact@v4
        with:
          name: h2-independent-revalidation-ab
          path: ${{ runner.temp }}/h2/*.json
          retention-days: 21

      - name: Freeze compact result on research branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "neon-h2-independent-export-keys-crosswalk-2026-10-12"
          python3 - "$RUNNER_TEMP/h2/a.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          if d.get("status")=="BLOCKED":raise SystemExit("NO_FREEZE_FOR_BLOCKED_RUN")
          PY
          cp "$RUNNER_TEMP/h2/a.json" research/neon_h2_independent_export_keys_crosswalk_time_contract_2026-10-12.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/neon_h2_independent_export_keys_crosswalk_time_contract_2026-10-12.json
          git commit -m "research: freeze independent H2 export/key/crosswalk and timezone evidence"
          git push origin HEAD:refs/heads/neon-h2-independent-export-keys-crosswalk-2026-10-12
