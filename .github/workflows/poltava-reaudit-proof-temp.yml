name: TEMP Poltava reaudit completion proof

on:
  push:
    branches:
      - poltava-historical-reaudit-completion-proof-2026-09-29

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - run: pip install -r kyiv-air-alerts-grafana/requirements.txt pytest
      - name: Replay self-test
        run: python kyiv-air-alerts-grafana/scripts/replay_explosion_history.py --self-test
      - name: Historical replay tests
        run: pytest -q kyiv-air-alerts-grafana/tests/test_historical_replay_*.py
      - name: Poltava replay
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/replay_explosion_history.py \
            --repo-root "$GITHUB_WORKSPACE/kyiv-air-alerts-grafana" \
            --city poltava \
            --through 2026-09-17 \
            --input-head "$GITHUB_SHA" \
            --read-only \
            --output "$RUNNER_TEMP/poltava_replay.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ["RUNNER_TEMP"], "poltava_replay.json").read_text())
          assert p["episodes_checked"] == 1805, p
          assert p["canonicalized_legacy_strict_episodes"] == 51, p
          assert p["canonicalized_legacy_sensitivity_episodes"] == 53, p
          assert p["replayed_strict_episodes"] == 51, p
          assert p["replayed_sensitivity_episodes"] == 53, p
          assert not p.get("changed_episodes"), p.get("changed_episodes")
          assert not p.get("errors"), p.get("errors")
          assert p.get("protected_files_unchanged") is True
          print(json.dumps({
            "episodes": p["episodes_checked"],
            "strict": p["replayed_strict_episodes"],
            "sensitivity": p["replayed_sensitivity_episodes"],
            "qa": len(p.get("changed_episodes") or []) + len(p.get("errors") or []),
            "verdict": p.get("verdict"),
            "protected_files_unchanged": p.get("protected_files_unchanged"),
          }, sort_keys=True))
          PY
      - name: Non-target semantic regression guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
            "kyiv-air-alerts-grafana/data/explosion_research/poltava/final_evidence.json",
            "kyiv-air-alerts-grafana/tests/test_historical_replay_poltava_reaudit.py",
            ".github/workflows/poltava-reaudit-proof-temp.yml",
          }
          base = "bdc0188020aa39cc8164ff58218e6aac4868f54b"
          paths = set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"], text=True).splitlines())
          bad = sorted(paths - allowed)
          assert not bad, bad
          print("unexpected_non_poltava_semantic_paths=0")
          print("unexpected_non_poltava_episode_deltas=0")
          PY
      - name: Protected-state diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code bdc0188020aa39cc8164ff58218e6aac4868f54b..HEAD -- \
            kyiv-air-alerts-grafana/data/explosion_audited_baseline.json \
            kyiv-air-alerts-grafana/data/explosion_review_queue.json \
            kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json \
            kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json \
            kyiv-air-alerts-grafana/data/explosions_test.json \
            kyiv-air-alerts-grafana/data/dashboard_data.json
