name: Differentiated alert exact-replay correction proof

on:
  push:
    branches:
      - differentiated-alert-siteprod-executable-equivalence-v2-2026-09-29
    paths:
      - ".github/workflows/differentiated-alert-siteprod-equivalence-proof.yml"
      - "kyiv-air-alerts-grafana/scripts/proof_differentiated_alert_exact_replay_correction.py"
      - "kyiv-air-alerts-grafana/tests/test_differentiated_alert_exact_replay_correction.py"

permissions:
  contents: read

jobs:
  prove_exact_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated proof branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install proof dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements-db-phase1.txt

      - name: Run exact-replay gate regression tests
        working-directory: kyiv-air-alerts-grafana
        run: python -m unittest tests/test_differentiated_alert_exact_replay_correction.py -v

      - name: Run focused exact-replay correction proof
        run: python kyiv-air-alerts-grafana/scripts/proof_differentiated_alert_exact_replay_correction.py

      - name: Upload exact-replay correction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differentiated-alert-exact-replay-correction-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/differentiated_alert_exact_replay_correction_runtime.json
          if-no-files-found: warn
          retention-days: 30
