name: Differentiated alert site-prod equivalence proof

on:
  push:
    branches:
      - differentiated-alert-siteprod-executable-equivalence-v2-2026-09-29
    paths:
      - ".github/workflows/differentiated-alert-siteprod-equivalence-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install production proof dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements-db-phase1.txt

      - name: Run current site-prod OFF ON executable proof
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        run: python kyiv-air-alerts-grafana/scripts/proof_differentiated_alert_siteprod_equivalence.py

      - name: Upload proof result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differentiated-alert-siteprod-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/differentiated_alert_siteprod_executable_equivalence_runtime.json
          if-no-files-found: warn
          retention-days: 30
