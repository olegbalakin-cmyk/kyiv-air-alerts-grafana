name: Phase-1 Live Poll Persistence Adapter Proof

on:
  push:
    branches:
      - db-phase1-live-poll-persistence-2026-09-28
    paths-ignore:
      - kyiv-air-alerts-grafana/research/db_phase1_live_poll_persistence_adapter_proof_2026-09-28.json

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      EXPECTED_PROJECT_ID: green-cake-44216048
      BASE_GIT_SHA: 54aefb6f557c6a512a9213dee9971d2db26107e6
      OLD_PERSISTENCE_BLOB: 06f3098df63d7aaf2348c366b6a351901926cb53
      NEW_PERSISTENCE_BLOB: ed014e61fc6186fa9daf91c763c847e7df2f0306
      DDL_BLOB: 3b8af7940b23aae03a4f6b434d90d97dde10bfc0
      CANONICAL_BLOB: 2437cce7d434f34574b19dbd857ee9625de0e0b4
      IMPORTER_BLOB: 7f2c1d90fb719e296e4dbb2cc96c6ec492e25ad8
      PARENT_BRANCH_ID: br-young-feather-b5q19nli
      PRIMARY_BRANCH_ID: br-wandering-sunset-b5835alw
      LIVE_E2E_BRANCH_ID: br-still-sea-b5062r40
      PREVIOUS_CONCURRENCY_BRANCH_ID: br-small-wind-b5yah69o
      BLOCKED_BRANCH_ID: br-calm-cherry-b56fsh4i
      PROOF_BRANCH_NAME: lviv-phase1-live-poll-adapter-e2e-2026-09-28
      OWNED_PROOF_BRANCH_ID: br-cold-sky-b5jhai9p
      SUBSTANTIVE_WORKFLOW_RUN_ID: "36449303272"
      SUBSTANTIVE_IMPLEMENTATION_SHA: e5f396860d0effc4c7a85b24d3d73ec69706c322
      DB_NAME: neondb
      ROLE_NAME: neondb_owner

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set result paths and verify Git baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "PROOF_RESULT=$RUNNER_TEMP/db_phase1_live_poll_persistence_adapter_proof_2026-09-28.json" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = "$BASE_GIT_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin             +refs/heads/site-prod:refs/remotes/origin/site-prod             +refs/heads/main:refs/remotes/origin/main
          SITE_PROD_AT_START="$(git rev-parse origin/site-prod)"
          MAIN_AT_START="$(git rev-parse origin/main)"
          echo "SITE_PROD_AT_START=$SITE_PROD_AT_START" >> "$GITHUB_ENV"
          echo "MAIN_AT_START=$MAIN_AT_START" >> "$GITHUB_ENV"
          echo "site-prod at start = $SITE_PROD_AT_START"
          echo "main at start = $MAIN_AT_START"

      - name: Verify frozen files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql)" = "$DDL_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_lviv_canonical.py)" = "$CANONICAL_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_lviv_import.py)" = "$IMPORTER_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py)" = "$NEW_PERSISTENCE_BLOB"

      - name: Install Phase-1 DB requirements
        working-directory: kyiv-air-alerts-grafana
        run: python -m pip install -r requirements-db-phase1.txt

      - name: Run all Phase-1 tests
        working-directory: kyiv-air-alerts-grafana
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_db_phase1*.py" -v 2>&1 | tee "$RUNNER_TEMP/phase1_tests.log"
          count="$(grep -Eo 'Ran [0-9]+ tests?' "$RUNNER_TEMP/phase1_tests.log" | tail -1 | grep -Eo '[0-9]+')"
          test "$count" = "41"
          echo "PHASE1_TEST_COUNT=$count" >> "$GITHUB_ENV"
          echo "PHASE1_TEST_RESULT=PASS" >> "$GITHUB_ENV"

      - name: Verify secure Neon configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          test -n "${NEON_PROJECT_ID:-}"
          test "$NEON_PROJECT_ID" = "$EXPECTED_PROJECT_ID"

      - name: Resolve owned proof branch and inject direct masked connections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = "https://console.neon.tech/api/v2"
          key = os.environ["NEON_API_KEY"]
          project = os.environ["NEON_PROJECT_ID"]
          name = os.environ["PROOF_BRANCH_NAME"]
          owned_id = os.environ["OWNED_PROOF_BRANCH_ID"]
          parent = os.environ["PARENT_BRANCH_ID"]
          db = os.environ["DB_NAME"]
          role = os.environ["ROLE_NAME"]
          headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          existing = request(
              "GET",
              f"/projects/{project}/branches?search={urllib.parse.quote(name)}",
          ).get("branches", [])
          exact = [branch for branch in existing if branch.get("name") == name]
          if exact:
              if len(exact) != 1:
                  raise SystemExit("ambiguous proof branch name")
              branch = exact[0]
              if branch.get("id") != owned_id or branch.get("parent_id") != parent:
                  raise SystemExit(
                      "PHASE-1 LIVE POLL PERSISTENCE ADAPTER BLOCKED: "
                      "unexpected existing proof branch identity"
                  )
              branch_id = owned_id
              recovery_mode = True
          else:
              created = request(
                  "POST",
                  f"/projects/{project}/branches",
                  {
                      "branch": {"name": name, "parent_id": parent},
                      "endpoints": [{"type": "read_write"}],
                  },
              )
              branch = created["branch"]
              branch_id = branch["id"]
              if branch.get("parent_id") != parent:
                  raise SystemExit("created proof branch has wrong parent")
              recovery_mode = False

          def uri(branch_id):
              query = urllib.parse.urlencode({
                  "branch_id": branch_id,
                  "database_name": db,
                  "role_name": role,
                  "pooled": "false",
              })
              payload = request("GET", f"/projects/{project}/connection_uri?{query}")
              value = payload.get("uri") or payload.get("connection_uri")
              if not value:
                  raise SystemExit("empty Neon connection URI")
              parsed = urllib.parse.urlparse(value)
              if not parsed.hostname or "-pooler" in parsed.hostname:
                  raise SystemExit(
                      "PHASE-1 LIVE POLL PERSISTENCE ADAPTER BLOCKED: "
                      "direct connection unavailable"
                  )
              print(f"::add-mask::{value}")
              return value

          urls = {
              "PHASE1_PROOF_DATABASE_URL": uri(branch_id),
              "PHASE1_PRIMARY_DATABASE_URL": uri(os.environ["PRIMARY_BRANCH_ID"]),
              "PHASE1_BOOTSTRAP_DATABASE_URL": uri(parent),
              "PHASE1_LIVE_E2E_DATABASE_URL": uri(os.environ["LIVE_E2E_BRANCH_ID"]),
              "PHASE1_PREVIOUS_CONCURRENCY_DATABASE_URL": uri(os.environ["PREVIOUS_CONCURRENCY_BRANCH_ID"]),
              "PHASE1_BLOCKED_DATABASE_URL": uri(os.environ["BLOCKED_BRANCH_ID"]),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PHASE1_PROOF_BRANCH_ID={branch_id}\n")
              handle.write(f"PROOF_RECOVERY_MODE={'true' if recovery_mode else 'false'}\n")
              for key, value in urls.items():
                  handle.write(f"{key}={value}\n")
          Path(os.environ["RUNNER_TEMP"], "proof_branch_id.txt").write_text(branch_id + "\n")
          print(f"proof branch id = {branch_id}")
          print(f"proof recovery mode = {str(recovery_mode).lower()}")
          print("direct unpooled = true")
          PY

      - name: Capture Git refs immediately before proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin             +refs/heads/site-prod:refs/remotes/origin/site-prod             +refs/heads/main:refs/remotes/origin/main
          echo "SITE_PROD_AT_END=$(git rev-parse origin/site-prod)" >> "$GITHUB_ENV"
          echo "MAIN_AT_END=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Run real adapter live poll proof or artifact recovery
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/proof_db_phase1_live_poll_persistence_adapter.py

      - name: Reconfirm production refs and patch artifact isolation fields
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin             +refs/heads/site-prod:refs/remotes/origin/site-prod             +refs/heads/main:refs/remotes/origin/main
          SITE_PROD_FINAL="$(git rev-parse origin/site-prod)"
          MAIN_FINAL="$(git rev-parse origin/main)"
          python - "$PROOF_RESULT" "$SITE_PROD_FINAL" "$MAIN_FINAL" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          site_final = sys.argv[2]
          main_final = sys.argv[3]
          obj = json.loads(path.read_text())
          obj["site_prod_at_end"] = site_final
          obj["main_at_end"] = main_final
          obj["site_prod_modified"] = obj["site_prod_at_start"] != site_final
          obj["main_modified"] = obj["main_at_start"] != main_final
          if obj["site_prod_modified"] or obj["main_modified"]:
              obj["production_branch_movement_during_proof"] = {
                  "site_prod": [obj["site_prod_at_start"], site_final],
                  "main": [obj["main_at_start"], main_final],
              }
          obj["production_publication"] = False
          obj["credentials_exposed"] = False
          path.write_text(json.dumps(obj, indent=2, sort_keys=True, default=str) + "\n")
          print(f"site-prod modified = {obj['site_prod_modified']}")
          print(f"main modified = {obj['main_modified']}")
          PY

      - name: Verify final proof contract
        shell: bash
        run: |
          set -euo pipefail
          python - "$PROOF_RESULT" <<'PY'
          import json
          import sys
          from pathlib import Path
          obj = json.loads(Path(sys.argv[1]).read_text())
          assert obj["verdict"] == "PHASE-1 LIVE POLL PERSISTENCE ADAPTER PROVEN"
          assert obj["checkpoint_history"] == [1, 2, 3, 4, 5]
          assert obj["final_counts"] == {
              "ingestion_runs": 6,
              "alert_episodes": 126,
              "alert_episode_sources": 140,
              "ingestion_checkpoints": 5,
          }
          assert obj["poll_a_seq"] == 2
          assert obj["poll_a_retry_exact_retry"] is True
          assert obj["poll_b_seq"] == 3
          assert obj["writer_c_postlock_seq"] == 3
          assert obj["writer_c_committed_seq"] == 4
          assert obj["writer_d_postlock_seq"] == 4
          assert obj["writer_d_committed_seq"] == 5
          assert obj["canonical_episode_identity_stable"] is True
          assert obj["canonical_source_identity_stable"] is True
          assert all(obj["protected_branch_isolation"].values())
          assert obj["credentials_exposed"] is False
          assert obj["production_publication"] is False
          assert obj["test_count"] == 41
          assert obj["test_result"] == "PASS"
          if obj["proof_mode"] == "artifact_recovery":
              assert obj["substantive_workflow_run_id"] == "36449303272"
              assert obj["recovery_probe_rollback_only"] is True
              assert obj["recovery_probe_state_unchanged"] is True
              assert obj["recovery_probe_c_postlock_seq"] == 5
              assert obj["recovery_probe_d_postlock_seq"] == 5
          PY

      - name: Capture blocked proof state on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["PROOF_RESULT"])
          if path.exists():
              try:
                  obj = json.loads(path.read_text())
              except Exception:
                  obj = {}
          else:
              obj = {}
          obj["verdict"] = "PHASE-1 LIVE POLL PERSISTENCE ADAPTER BLOCKED"
          obj.setdefault("base_git_sha", os.environ.get("BASE_GIT_SHA"))
          obj.setdefault("implementation_sha", os.environ.get("GITHUB_SHA"))
          obj.setdefault("workflow_run_id", os.environ.get("GITHUB_RUN_ID"))
          obj.setdefault("neon_project_id", os.environ.get("NEON_PROJECT_ID"))
          obj.setdefault("proof_branch_id", os.environ.get("PHASE1_PROOF_BRANCH_ID"))
          obj.setdefault("proof_branch_name", os.environ.get("PROOF_BRANCH_NAME"))
          obj.setdefault("credentials_exposed", False)
          obj.setdefault("production_publication", False)
          path.write_text(json.dumps(obj, indent=2, sort_keys=True, default=str) + "\n")
          PY

      - name: Upload machine-readable proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-phase1-live-poll-persistence-adapter-proof
          path: |
            ${{ runner.temp }}/db_phase1_live_poll_persistence_adapter_proof_2026-09-28.json
            ${{ runner.temp }}/phase1_tests.log
            ${{ runner.temp }}/proof_branch_id.txt
          if-no-files-found: warn
          retention-days: 30
