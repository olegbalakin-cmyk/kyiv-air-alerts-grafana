name: Isolated H1 residual historical field-authority proof
on:
  push:
    branches:
      - neon-h1-residual-field-authority-2026-10-13
    paths:
      - .github/workflows/neon_h1_residual_field_authority.yml
permissions:
  contents: write
jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover pinned historical Git evidence
        shell: bash
        run: |
          set -euo pipefail
          for sha in 63c4cd062409862944102db1f95ecc99f8e243bf 71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 5d18ef85a66384f189ede5ca5654d750f60f088b 02ad2e8fadee78442753567bc2d3a540345d8e8a cbce9910a1a6b79753c06b0fe2cb2dffd84653dc 79d9fbbfffe64ba8be3535f78a47872b65092f5d b205d38dbc50bc502d10e682d4ae53491af542ea bd82a6c0a19aca4610a8af6df73a307a88c35bf6 0ae2b596ea38c80793c18884e747dceb66d91307 79f79b1a7ac610ef7f1093bea214cc44e15b70bd; do
            git fetch --no-tags --quiet --depth=1 origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
      - name: Deterministic A/B source-audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONHASHSEED=17 python .github/proof/neon_h1_residual_field_authority.py /tmp/residual_A.json
          PYTHONHASHSEED=91 python .github/proof/neon_h1_residual_field_authority.py /tmp/residual_B.json
          cmp /tmp/residual_A.json /tmp/residual_B.json
          sha256sum /tmp/residual_A.json /tmp/residual_B.json
      - name: Independent original Git, membership, and field verifier
        shell: bash
        run: |
          set -euo pipefail
          python .github/proof/neon_h1_residual_independent_verify.py /tmp/residual_A.json
          python .github/proof/neon_h1_residual_independent_verify.py /tmp/residual_B.json
      - name: Freeze exact standalone proof and remove staging tools
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/residual_A.json research/neon_h1_6863_residual_field_authority_2026-10-13.json
          rm .github/proof/neon_h1_residual_field_authority.py
          rm .github/proof/neon_h1_residual_independent_verify.py
          rm .github/workflows/neon_h1_residual_field_authority.yml
          git add -A .github/proof/neon_h1_residual_field_authority.py .github/proof/neon_h1_residual_independent_verify.py .github/workflows/neon_h1_residual_field_authority.yml research/neon_h1_6863_residual_field_authority_2026-10-13.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: freeze H1 6863 residual field-input authority'
          git push origin HEAD:neon-h1-residual-field-authority-2026-10-13
          git cat-file -e 63c4cd062409862944102db1f95ecc99f8e243bf^{commit}
          test "$(git diff --name-only 63c4cd062409862944102db1f95ecc99f8e243bf HEAD)" = 'research/neon_h1_6863_residual_field_authority_2026-10-13.json'
          git rev-parse HEAD
          git rev-parse HEAD:research/neon_h1_6863_residual_field_authority_2026-10-13.json
          wc -c research/neon_h1_6863_residual_field_authority_2026-10-13.json
          sha256sum research/neon_h1_6863_residual_field_authority_2026-10-13.json
