name: Isolated WIP S3 S4 executable proof 2026-10-18
on:
  push:
    branches: [proof-wip-trigger-safety-s3-s4-2026-10-18]
    paths:
      - ".github/workflows/proof-wip-trigger-s3-s4-executable-2026-10-18.yml"
      - "research/wip_workflow_trigger_safety_s3_s4_2026-10-18/**"
permissions:
  contents: read
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        replica: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only Git refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/main)" = "f6706a6691d786df2f1056045389964139dc1018"
          test "$(git rev-parse origin/multicity-wip-2026-09-16)" = "1a8b57553ba66319db326d65080ade93ae6ca01c"
      - name: Install proof-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2 wcmatch==10.1
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          "$(go env GOPATH)/bin/actionlint" -color=false -shellcheck= -pyflakes= .github/workflows/proof-wip-trigger-s3-s4-executable-2026-10-18.yml
      - name: Run executable safety tests
        run: python -m unittest discover -v -s research/wip_workflow_trigger_safety_s3_s4_2026-10-18 -p 'test_*.py'
      - name: Real ref and downstream matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/wip_workflow_trigger_safety_s3_s4_2026-10-18/executable_matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3s4-${{ matrix.replica }}
          path: /tmp/wip-s3s4-outputs/*.json
          if-no-files-found: warn
  compare:
    needs: ab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: s3s4-*
          path: proofs
      - name: Compare A/B semantic outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          a,b=Path("proofs/s3s4-A"),Path("proofs/s3s4-B")
          assert a.is_dir() and b.is_dir()
          files=sorted(p.name for p in a.glob("*.json"))
          assert files and files==sorted(p.name for p in b.glob("*.json"))
          for name in files:
              x=json.loads((a/name).read_text())
              y=json.loads((b/name).read_text())
              for z in (x,y):
                  z.pop("collected_at",None)
                  z.pop("run_id",None)
              assert x==y, name
              print(name,hashlib.sha256(json.dumps(x,sort_keys=True).encode()).hexdigest())
          print("A/B SEMANTIC DIFFERENCES = 0")
          PY
