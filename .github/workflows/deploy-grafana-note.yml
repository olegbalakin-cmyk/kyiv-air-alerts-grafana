name: Deploy Grafana site-link note

on:
  push:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "deploy/grafana-note-release.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grafana-note-release
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WIP
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Refresh Grafana casualty section and site link
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/add_casualty_panel.py

      - name: Verify site link panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("kyiv-air-alerts-grafana/grafana/dashboard.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          panels = obj.get("panels", [])
          note = next((x for x in panels if x.get("id") == 949), None)
          assert note is not None
          content = note.get("options", {}).get("content", "")
          assert "https://ukraine-air-alerts.netlify.app/" in content
          print("Grafana site-link panel verified")
          PY

      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/grafana/dashboard.json
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "Publish current site link in Grafana"
            git push origin HEAD:multicity-wip-2026-09-16
          fi

      - name: Deploy Grafana
        working-directory: kyiv-air-alerts-grafana
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          GRAFANA_DASHBOARD_UID: ${{ secrets.GRAFANA_DASHBOARD_UID }}
          GRAFANA_DASHBOARD_TITLE: ${{ vars.GRAFANA_DASHBOARD_TITLE }}
          GRAFANA_INFINITY_NAME: ${{ vars.GRAFANA_INFINITY_NAME }}
        run: python scripts/deploy_grafana.py
