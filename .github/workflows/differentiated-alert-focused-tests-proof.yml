name: Differentiated alert focused test rerun

on:
  push:
    branches:
      - differentiated-alert-shadow-runtime-gates-proof-2026-09-29
    paths:
      - ".github/workflows/differentiated-alert-focused-tests-proof.yml"

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: pip install -r kyiv-air-alerts-grafana/requirements.txt

      - name: Run repository and 25-case local focused suites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess,sys
          from pathlib import Path
          root=Path("kyiv-air-alerts-grafana")
          def run(cmd):
              p=subprocess.run(cmd,cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              m=re.search(r"Ran\s+(\d+)\s+tests?",p.stdout)
              n=int(m.group(1)) if m else None
              ok=p.returncode==0 and "OK" in p.stdout
              return {"command":" ".join(cmd),"tests_run":n,"passed":n if ok else None,"failed":0 if ok else None,"result":"PASS" if ok else "FAIL","output_tail":p.stdout[-4000:]}
          repo=run([sys.executable,"-m","unittest","tests/test_differentiated_alert_shadow_ingestion.py","-v"])
          local=run([sys.executable,"-m","unittest","discover","-s","tests","-p","test_differentiated_alert_shadow_*.py","-v"])
          out={"repository_suite":repo,"local_executable_suite":local}
          Path("/tmp/focused_tests.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"repository":repo["result"],"repository_tests":repo["tests_run"],"local":local["result"],"local_tests":local["tests_run"]},indent=2))
          raise SystemExit(0 if repo["result"]=="PASS" and local["result"]=="PASS" and repo["tests_run"]==18 and local["tests_run"]==25 else 1)
          PY

      - name: Patch proof artifact and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          art=Path("research/differentiated_alert_shadow_runtime_gates_2026-09-29.json")
          p=json.loads(art.read_text(encoding="utf-8"))
          p["focused_tests"]=json.loads(Path("/tmp/focused_tests.json").read_text(encoding="utf-8"))
          p["focused_test_correction"]={
              "scope":"test-only",
              "old_test_blob":"825214bd03b058d0c6cc3bea10ae3ec55957fc07",
              "new_test_blob":"5d1ae17014ed2182605adbd1a641ad84a66460c5",
              "reason":"stored raw Alerts.in.ua fixture carries numeric id 261769 and accepted adapter preserves the raw source_alert_id type; assertion previously expected a string",
              "implementation_blobs_changed":false,
              "runtime_gates_rerun":false
          }
          art.write_text(json.dumps(p,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          git rm .github/workflows/differentiated-alert-focused-tests-proof.yml
          git add research/differentiated_alert_shadow_runtime_gates_2026-09-29.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: record focused shadow test rerun"
          git push origin "HEAD:${GITHUB_REF_NAME}"
