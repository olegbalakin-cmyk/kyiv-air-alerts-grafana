      - name: Freeze durable artifact and remove temporary workflow
        shell: bash
        env:
          BASE_SHA: edd9aae8ce0cda7dfc9dc62b206e5ffbf3965405
          BRANCH_NAME: attack-event-provenance-cardinality-addendum-2026-10-05
          WORKFLOW_PATH: .github/workflows/attack-event-provenance-cardinality-addendum-freeze.yml
          OUTPUT_PATH: research/attack_event_provenance_cardinality_addendum_2026-10-05.json
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/attack-event-provenance-cardinality-addendum/attack_event_provenance_cardinality_addendum_2026-10-05.json" "${OUTPUT_PATH}"
          git rm "${WORKFLOW_PATH}"
          git add "${OUTPUT_PATH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze attack-event provenance cardinality schema addendum"

          mapfile -t diff_lines < <(git diff --name-status "${BASE_SHA}...HEAD")
          if [[ "${#diff_lines[@]}" -ne 1 || "${diff_lines[0]}" != $'A\tresearch/attack_event_provenance_cardinality_addendum_2026-10-05.json' ]]; then
            printf 'FINAL_DIFF_MISMATCH\n%s\n' "${diff_lines[*]}" >&2
            exit 1
          fi

          ARTIFACT_COMMIT="$(git rev-parse HEAD)"
          ARTIFACT_BLOB="$(git rev-parse "HEAD:${OUTPUT_PATH}")"
          ARTIFACT_SHA256="$(sha256sum "${OUTPUT_PATH}" | awk '{print $1}')"

          git push origin "HEAD:${BRANCH_NAME}"

          echo "ARTIFACT_COMMIT=${ARTIFACT_COMMIT}"
          echo "ARTIFACT_BLOB=${ARTIFACT_BLOB}"
          echo "ARTIFACT_SHA256=${ARTIFACT_SHA256}"
