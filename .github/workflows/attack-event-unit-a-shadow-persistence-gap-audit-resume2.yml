name: Unit A A4 resume2 offline shadow persistence gap audit

on:
  push:
    branches:
      - attack-event-unit-a-shadow-persistence-gap-audit-resume2-2026-10-09
    paths:
      - .github/workflows/attack-event-unit-a-shadow-persistence-gap-audit-resume2.yml

permissions:
  contents: write

jobs:
  unit-a-a4-resume2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch immutable Git objects only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin multicity-wip-2026-09-16
          for sha in \
            51adc76b715669e46e8c2c936906022d4d96ed44 \
            71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 \
            f54b0d6dcfcdd7e5b51a5b45b996273d1df72cff \
            1422e8482303ec9262647ca55fef753a9aa2b3ea \
            bc58ab0705699c1686d897f07852c3493b5eec16 \
            a0eb594dd4240d1d923ca5262725fc42f4807338 \
            bc53bb897a285338940714216240fc6e9ca65869; do
            git fetch --no-tags origin "$sha"
          done
          test "$(git merge-base HEAD 0b9d7c57bbd1ace9675890744fcb098776abd0b5)" = "0b9d7c57bbd1ace9675890744fcb098776abd0b5"
      - name: Offline immutable projection representability audit
        env:
          GIT_NO_LAZY_FETCH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B .github/proof/attack_event_unit_a_shadow_persistence_gap_audit_resume2.py
      - name: Freeze blocker artifact and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          artifact=research/attack_event_execution_unit_a_shadow_persistence_gap_audit_resume2_2026-10-09.json
          test -f "$artifact"
          python - "$artifact" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["verdict"] == "ATTACK-EVENT EXECUTION UNIT A SHADOW PERSISTENCE GAP AUDIT = BLOCKED"
          assert r["A5_PERSISTENCE_DELTA_GATE"] == "FAIL"
          assert r["first_failing_gate"] == "UNIT_A_SOURCE_ROW_PROJECTION_NOT_LOSSLESS"
          assert r["repaired_membership_occurrences"] == 1559
          assert r["source_membership_mismatches"] == {"missing":0,"extra":0,"affected_episodes":0}
          assert r["neon_contacted"] is False
          assert r["safety"]["sql_select_count"] == 0
          assert r["safety"]["attempted_db_writes"] == 0
          assert r["safety"]["actual_db_writes"] == 0
          assert r["safety"]["a5_executions"] == 0
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze Unit A A4 resume2 evidence-payload representability blocker"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          echo "ARTIFACT_SHA256=$(sha256sum "$artifact" | cut -d' ' -f1)"
          before="$(git hash-object "$artifact")"
          rm .github/proof/attack_event_unit_a_shadow_persistence_gap_audit_resume2.py
          rm .github/workflows/attack-event-unit-a-shadow-persistence-gap-audit-resume2.yml
          git add -A .github/proof/attack_event_unit_a_shadow_persistence_gap_audit_resume2.py .github/workflows/attack-event-unit-a-shadow-persistence-gap-audit-resume2.yml
          git commit -m "Remove temporary Unit A A4 resume2 execution files"
          test "$before" = "$(git hash-object "$artifact")"
          test ! -e .github/proof/attack_event_unit_a_shadow_persistence_gap_audit_resume2.py
          test ! -e .github/workflows/attack-event-unit-a-shadow-persistence-gap-audit-resume2.yml
          test "$(git diff --name-status 0b9d7c57bbd1ace9675890744fcb098776abd0b5..HEAD)" = "$(printf 'A\tresearch/attack_event_execution_unit_a_shadow_persistence_gap_audit_resume2_2026-10-09.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "TEMP_WORKFLOW_REMOVED=YES"
          echo "TEMP_HARNESS_REMOVED=YES"
          echo "PRODUCTION_MUTATION=NO"
          git push origin HEAD:attack-event-unit-a-shadow-persistence-gap-audit-resume2-2026-10-09
