name: Monitor near-duplicate temporal binding proof

on:
  pull_request:
    branches: [multicity-wip-2026-09-16]
    paths:
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/tests/test_monitor_near_duplicate_temporal_binding.py"
      - ".github/workflows/monitor-near-duplicate-proof.yml"
  push:
    branches: [monitor-near-duplicate-temporal-binding-repair-2026-09-30]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax and executable self-tests
        working-directory: kyiv-air-alerts-grafana
        run: |
          set -o pipefail
          python -m py_compile scripts/monitor_explosion_candidates.py
          python scripts/monitor_explosion_candidates.py --self-test | tee /tmp/monitor_selftest.txt
          python scripts/replay_explosion_history.py --self-test | tee /tmp/replay_selftest.txt

      - name: Focused and monitor tests
        working-directory: kyiv-air-alerts-grafana
        run: |
          set -o pipefail
          pytest -q tests/test_monitor_near_duplicate_temporal_binding.py | tee /tmp/focused_tests.txt
          pytest -q tests/test_*monitor*.py | tee /tmp/monitor_tests.txt

      - name: Historical replay tests
        working-directory: kyiv-air-alerts-grafana
        run: |
          set -o pipefail
          pytest -q tests/test_historical_replay_*.py | tee /tmp/historical_tests.txt

      - name: Before-after semantic audit
        working-directory: kyiv-air-alerts-grafana
        env:
          AUTHORITATIVE_HEAD: 2478faf4b0aa98a6e3ac11d41b42776d2e777161
        run: |
          git show "${AUTHORITATIVE_HEAD}:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py" > scripts/_monitor_old_for_audit.py
          python - <<'PY'
          from __future__ import annotations
          import copy
          import hashlib
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          SCRIPTS = ROOT / "scripts"
          sys.path.insert(0, str(SCRIPTS))

          def load_module(name: str, path: Path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              spec.loader.exec_module(mod)
              return mod

          old = load_module("monitor_old_audit", SCRIPTS / "_monitor_old_for_audit.py")
          new = load_module("monitor_new_audit", SCRIPTS / "monitor_explosion_candidates.py")

          state = json.loads((ROOT / "data" / "explosion_candidate_monitor_state.json").read_text(encoding="utf-8"))
          queue = json.loads((ROOT / "data" / "explosion_review_queue.json").read_text(encoding="utf-8"))

          target = "e97e6e816f96832d02c8b2cd"
          duplicate = "782041e0741ad4cee3d3180e"
          anchor_id = "73d817926f66c8dce397b91b"
          context_id = "4bdc4c0a5f95dc1e01632d22"

          by_candidate = {str(x.get("candidate_id") or ""): x for x in queue if isinstance(x, dict)}
          kyiv_eps = list((state.get("cities", {}).get("kyiv", {}) or {}).get("episodes") or [])
          by_kyiv_ep = {str(x.get("episode_id") or ""): x for x in kyiv_eps}
          anchor = by_candidate[anchor_id]
          context = by_candidate[context_id]

          old_match = old.match_candidate_to_episodes(anchor, kyiv_eps)
          new_match = new.match_candidate_to_episodes(anchor, kyiv_eps)
          old_dec = old.classify_candidate(anchor, "kyiv", kyiv_eps, old_match)
          new_dec = new.classify_candidate(anchor, "kyiv", kyiv_eps, new_match)
          old_comp = old.compose_episode_candidates("kyiv", by_kyiv_ep[target], [anchor, context], kyiv_eps)
          new_comp = new.compose_episode_candidates("kyiv", by_kyiv_ep[target], [anchor, context], kyiv_eps)
          published = new.parse_dt(anchor.get("published_at"))
          active = new.exact_active_episodes_at(published, kyiv_eps)
          active_target = [x for x in active if str(x.get("episode_id")) in {target, duplicate}]
          old_groups = [[str(ep.get("episode_id")) for ep in g] for g in old.episode_representation_clusters(active_target)]
          new_groups = [[str(ep.get("episode_id")) for ep in g] for g in new.episode_representation_clusters(active_target)]

          candidate_deltas = []
          for item in queue:
              if not isinstance(item, dict):
                  continue
              city = str(item.get("city_key") or "")
              episodes = list((state.get("cities", {}).get(city, {}) or {}).get("episodes") or [])
              if not episodes:
                  continue
              om = old.match_candidate_to_episodes(item, episodes)
              nm = new.match_candidate_to_episodes(item, episodes)
              od = old.classify_candidate(item, city, episodes, om)
              nd = new.classify_candidate(item, city, episodes, nm)
              before = {
                  "outcome": od.get("proposed_outcome"),
                  "episode_id": od.get("proposed_matched_episode_id"),
              }
              after = {
                  "outcome": nd.get("proposed_outcome"),
                  "episode_id": nd.get("proposed_matched_episode_id"),
              }
              if before != after:
                  pub = new.parse_dt(item.get("published_at"))
                  raw_active = new.exact_active_episodes_at(pub, episodes) if pub else []
                  groups = new.episode_representation_clusters(raw_active)
                  candidate_deltas.append({
                      "city": city,
                      "candidate_ids": [str(item.get("candidate_id") or "")],
                      "episode_id": str(item.get("matched_episode_id") or "") or None,
                      "before": before,
                      "after": after,
                      "raw_active_representations": [str(x.get("episode_id") or "") for x in raw_active],
                      "logical_clusters": [[str(x.get("episode_id") or "") for x in g] for g in groups],
                      "reason": "logical_representation_temporal_binding_change",
                  })

          composition_deltas = []
          for city, city_state in sorted((state.get("cities") or {}).items()):
              episodes = list((city_state or {}).get("episodes") or [])
              by_ep = {str(x.get("episode_id") or ""): x for x in episodes}
              groups = {}
              for item in queue:
                  if not isinstance(item, dict) or str(item.get("city_key") or "") != city:
                      continue
                  eid = str(item.get("matched_episode_id") or "")
                  if eid and str(item.get("status") or "") != "rejected":
                      groups.setdefault(eid, []).append(item)
              for eid, items in groups.items():
                  if len(items) < 2 or eid not in by_ep:
                      continue
                  oc = old.compose_episode_candidates(city, by_ep[eid], items, episodes)
                  nc = new.compose_episode_candidates(city, by_ep[eid], items, episodes)
                  before = {
                      "verdict": oc.get("final_composed_verdict"),
                      "anchor": oc.get("anchor_candidate_id"),
                      "contributors": oc.get("contributing_candidate_ids") or [],
                  }
                  after = {
                      "verdict": nc.get("final_composed_verdict"),
                      "anchor": nc.get("anchor_candidate_id"),
                      "contributors": nc.get("contributing_candidate_ids") or [],
                  }
                  if before != after:
                      raw_ids = []
                      logical = []
                      a_id = str(nc.get("anchor_candidate_id") or oc.get("anchor_candidate_id") or "")
                      a = by_candidate.get(a_id)
                      if a:
                          pub = new.parse_dt(a.get("published_at"))
                          raws = new.exact_active_episodes_at(pub, episodes) if pub else []
                          raw_ids = [str(x.get("episode_id") or "") for x in raws]
                          logical = [[str(x.get("episode_id") or "") for x in g] for g in new.episode_representation_clusters(raws)]
                      composition_deltas.append({
                          "city": city,
                          "episode_id": eid,
                          "candidate_ids": sorted(str(x.get("candidate_id") or "") for x in items),
                          "before": before,
                          "after": after,
                          "raw_active_representations": raw_ids,
                          "logical_clusters": logical,
                          "reason": "logical_representation_temporal_binding_change",
                      })

          ambiguity_signatures = {}
          ambiguity_changed = []
          for item in queue:
              if not isinstance(item, dict):
                  continue
              city = str(item.get("city_key") or "")
              episodes = list((state.get("cities", {}).get(city, {}) or {}).get("episodes") or [])
              pub = new.parse_dt(item.get("published_at"))
              if not pub or not episodes:
                  continue
              raw_active = new.exact_active_episodes_at(pub, episodes)
              logical = new.episode_representation_clusters(raw_active)
              if len(raw_active) < 2 or len(logical) < 2:
                  continue
              sig = (city, new.iso(pub), tuple(sorted(str(x.get("episode_id") or "") for x in raw_active)))
              ambiguity_signatures[sig] = {
                  "city": city,
                  "published_at": new.iso(pub),
                  "raw_active_representations": list(sig[2]),
                  "logical_clusters": [[str(x.get("episode_id") or "") for x in g] for g in logical],
              }
              strict_old = old.strict_explosion_evidence(city, item)
              strict_new = new.strict_explosion_evidence(city, item)
              ot = old.temporal_binding_evidence(item, strict_old, old.match_candidate_to_episodes(item, episodes), episodes)
              nt = new.temporal_binding_evidence(item, strict_new, new.match_candidate_to_episodes(item, episodes), episodes)
              if (not ot.get("episode_specific")) and nt.get("episode_specific"):
                  ambiguity_changed.append({
                      "candidate_id": str(item.get("candidate_id") or ""),
                      "city": city,
                      "published_at": new.iso(pub),
                      "old_temporal": ot,
                      "new_temporal": nt,
                  })

          def git_blob(ref: str, path: str) -> str:
              return subprocess.check_output(["git", "rev-parse", f"{ref}:{path}"], text=True).strip()

          auth = os.environ["AUTHORITATIVE_HEAD"]
          monitor_path = "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
          replay_path = "kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"
          report = {
              "authoritative_head": auth,
              "proof_head_at_audit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "monitor_blob_before": git_blob(auth, monitor_path),
              "monitor_blob_after": git_blob("HEAD", monitor_path),
              "replay_blob_before": git_blob(auth, replay_path),
              "replay_blob_after": git_blob("HEAD", replay_path),
              "representation_tolerance_seconds_old": old.MATCH_REPRESENTATION_TOLERANCE_SECONDS,
              "representation_tolerance_seconds_new": new.MATCH_REPRESENTATION_TOLERANCE_SECONDS,
              "known_kyiv": {
                  "raw_active_episode_ids": sorted(str(x.get("episode_id") or "") for x in active_target),
                  "old_logical_groups": old_groups,
                  "new_logical_groups": new_groups,
                  "old_temporal": old_dec.get("temporal_binding"),
                  "new_temporal": new_dec.get("temporal_binding"),
                  "old_composition": old_comp,
                  "new_composition": new_comp,
              },
              "candidate_status_delta_count": len(candidate_deltas),
              "candidate_status_deltas": candidate_deltas,
              "episode_composition_delta_count": len(composition_deltas),
              "episode_composition_deltas": composition_deltas,
              "genuine_ambiguity_cases_inspected": len(ambiguity_signatures),
              "genuine_ambiguity_cases_changed_to_specific": len(ambiguity_changed),
              "genuine_ambiguity_changed": ambiguity_changed,
          }
          Path("/tmp/semantic_audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("SEMANTIC_AUDIT_JSON_START")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("SEMANTIC_AUDIT_JSON_END")

          assert report["monitor_blob_before"] == "b55fe2ed082958917c74f95bca2fd6bc137bcaae"
          assert report["replay_blob_before"] == report["replay_blob_after"] == "816e2a13f66bb453fc4bd765318d15443121325e"
          assert report["representation_tolerance_seconds_old"] == report["representation_tolerance_seconds_new"] == 90.0
          assert old_comp.get("final_composed_verdict") == "no_composed_strict"
          assert new_comp.get("final_composed_verdict") == "approved_strict"
          assert new_comp.get("anchor_candidate_id") == anchor_id
          assert report["genuine_ambiguity_cases_changed_to_specific"] == 0
          PY
          rm scripts/_monitor_old_for_audit.py

      - name: Snapshot generated state before isolated refresh
        working-directory: kyiv-air-alerts-grafana
        run: |
          mkdir -p /tmp/generated-before
          for f in             data/explosion_candidate_monitor_last_run.json             data/explosion_candidate_monitor_state.json             data/explosion_review_queue.json             data/explosions_test.json             data/dashboard_data.json; do
            cp "$f" "/tmp/generated-before/$(basename "$f")"
          done

      - name: Isolated normal monitor refresh
        working-directory: kyiv-air-alerts-grafana
        run: |
          set -o pipefail
          timeout 1800 python scripts/monitor_explosion_candidates.py --local-only | tee /tmp/monitor_refresh.txt

      - name: Generated-state delta audit
        if: always()
        working-directory: kyiv-air-alerts-grafana
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          before_dir = Path("/tmp/generated-before")
          files = [
              "data/explosion_candidate_monitor_last_run.json",
              "data/explosion_candidate_monitor_state.json",
              "data/explosion_review_queue.json",
              "data/explosions_test.json",
              "data/dashboard_data.json",
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def diff_paths(a, b, prefix=""):
              out = []
              if type(a) is not type(b):
                  return [prefix or "/"]
              if isinstance(a, dict):
                  for key in sorted(set(a) | set(b)):
                      p = f"{prefix}/{key}"
                      if key not in a or key not in b:
                          out.append(p)
                      else:
                          out.extend(diff_paths(a[key], b[key], p))
              elif isinstance(a, list):
                  if len(a) != len(b):
                      out.append(f"{prefix}/length:{len(a)}->{len(b)}")
                  for i, (x, y) in enumerate(zip(a, b)):
                      out.extend(diff_paths(x, y, f"{prefix}/{i}"))
              elif a != b:
                  out.append(prefix or "/")
              return out

          rows = []
          for rel in files:
              after = ROOT / rel
              before = before_dir / Path(rel).name
              entry = {
                  "path": rel,
                  "before_sha256": sha(before),
                  "after_sha256": sha(after),
                  "before_bytes": before.stat().st_size,
                  "after_bytes": after.stat().st_size,
              }
              entry["changed"] = entry["before_sha256"] != entry["after_sha256"]
              try:
                  a = json.loads(before.read_text(encoding="utf-8"))
                  b = json.loads(after.read_text(encoding="utf-8"))
                  paths = diff_paths(a, b)
                  entry["json_diff_path_count"] = len(paths)
                  entry["json_diff_paths"] = paths[:300]
                  entry["json_diff_paths_truncated"] = len(paths) > 300
              except Exception as exc:
                  entry["json_diff_error"] = str(exc)
              rows.append(entry)

          semantic = {}
          p = Path("/tmp/semantic_audit.json")
          if p.exists():
              semantic = json.loads(p.read_text(encoding="utf-8"))
          semantic["generated_state_delta_inventory"] = rows
          semantic["generated_state_changed_files"] = [x["path"] for x in rows if x["changed"]]
          Path("/tmp/proof_audit.json").write_text(json.dumps(semantic, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("PROOF_AUDIT_JSON_START")
          print(json.dumps(semantic, ensure_ascii=False, indent=2))
          print("PROOF_AUDIT_JSON_END")
          PY

      - name: Collect proof outputs
        if: always()
        run: |
          mkdir -p proof-output
          cp /tmp/proof_audit.json proof-output/proof_audit.json 2>/dev/null || true
          cp /tmp/semantic_audit.json proof-output/semantic_audit.json 2>/dev/null || true
          cp /tmp/monitor_selftest.txt proof-output/monitor_selftest.txt 2>/dev/null || true
          cp /tmp/replay_selftest.txt proof-output/replay_selftest.txt 2>/dev/null || true
          cp /tmp/focused_tests.txt proof-output/focused_tests.txt 2>/dev/null || true
          cp /tmp/monitor_tests.txt proof-output/monitor_tests.txt 2>/dev/null || true
          cp /tmp/historical_tests.txt proof-output/historical_tests.txt 2>/dev/null || true
          cp /tmp/monitor_refresh.txt proof-output/monitor_refresh.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-near-duplicate-proof
          path: proof-output
