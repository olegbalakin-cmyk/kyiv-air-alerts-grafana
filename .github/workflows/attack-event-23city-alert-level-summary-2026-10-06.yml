  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize frozen snapshot and summarize
        id: summarize
        shell: bash
        run: |
          set -uo pipefail

          SOURCE_COMMIT="efefa399e69eadd3d7fc8393ac1553cfde35f138"
          SOURCE_PATH="research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json"
