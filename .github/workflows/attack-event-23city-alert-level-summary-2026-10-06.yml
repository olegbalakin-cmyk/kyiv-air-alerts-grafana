name: 23-city alert-level summary 2026-10-06

on:
  push:
    branches:
      - attack-event-23city-alert-level-summary-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run mechanical summary
        id: summarize
        shell: bash
        run: |
          set +e
          python .github/scripts/attack_event_23city_alert_level_summary_2026_10_06.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "summary_status=complete" >> "$GITHUB_OUTPUT"
          else
            echo "summary_status=blocked" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload summary artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack_event_23city_alert_level_summary_2026-10-06
          path: attack_event_23city_alert_level_summary_2026-10-06.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce validation verdict
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.summarize.outputs.summary_status }}" != "complete" ]; then
            echo "23-CITY ALERT-LEVEL SUMMARY = BLOCKED"
            exit 1
          fi
          echo "23-CITY ALERT-LEVEL SUMMARY = COMPLETE"
