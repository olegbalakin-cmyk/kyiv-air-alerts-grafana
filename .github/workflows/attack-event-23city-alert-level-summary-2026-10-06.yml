PY
            echo "summary_status=blocked" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "${SOURCE_COMMIT}:${SOURCE_PATH}" > "$SOURCE_FILE"

          python - <<'PY'
import json
import os
import re
from collections import Counter, defaultdict
from datetime import datetime, timezone

SOURCE_FILE = os.environ["SOURCE_FILE"]
OUTPUT_FILE = os.environ["OUTPUT_FILE"]
SOURCE_COMMIT = os.environ["SOURCE_COMMIT"]
SOURCE_PATH = os.environ["SOURCE_PATH"]
EXPECTED_BLOB = os.environ["EXPECTED_BLOB"]
ACTUAL_BLOB = os.environ["ACTUAL_BLOB"]

EXPECTED_TOTAL = 26405
EXPECTED = {
    "STRICT_EVENT_POSITIVE": 1017,
    "SENSITIVITY_EVENT_POSITIVE": 63,
    "NO_CONFIRMED_EVENT": 23530,
    "NEEDS_REVIEW": 1795,
}
ALLOWED = set(EXPECTED)

with open(SOURCE_FILE, "r", encoding="utf-8") as f:
    root = json.load(f)

def find_exact_key(obj, key, max_depth=6):
    def walk(x, depth):
        if depth > max_depth:
            return None
        if isinstance(x, dict):
            if key in x:
                return x[key]
            for v in x.values():
                if isinstance(v, (dict, list)):
                    got = walk(v, depth + 1)
                    if got is not None:
                        return got
        elif isinstance(x, list) and len(x) <= 50:
            for v in x:
                if isinstance(v, (dict, list)):
                    got = walk(v, depth + 1)
                    if got is not None:
                        return got
        return None
    return walk(obj, 0)

def find_by_keys(obj, keys, max_depth=6):
    for key in keys:
        got = find_exact_key(obj, key, max_depth=max_depth)
        if got is not None:
            return got
    return None

def find_verdict(obj):
    preferred = [
        "verdict", "classification_verdict", "final_verdict",
        "classification", "event_classification", "classification_status"
    ]
    v = find_by_keys(obj, preferred)
    if isinstance(v, str) and v in ALLOWED:
        return v
    found = []
    def walk(x, depth=0):
        if depth > 6:
            return
        if isinstance(x, str):
            if x in ALLOWED:
                found.append(x)
        elif isinstance(x, dict):
            for vv in x.values():
                walk(vv, depth + 1)
        elif isinstance(x, list) and len(x) <= 50:
            for vv in x:
                walk(vv, depth + 1)
    walk(obj)
    uniq = list(dict.fromkeys(found))
    return uniq[0] if len(uniq) == 1 else None

def sample_score(rec):
    if not isinstance(rec, dict):
        return -1
    score = 0
    city = find_exact_key(rec, "city_key")
    if isinstance(city, str) and city:
        score += 2
    if find_verdict(rec) in ALLOWED:
        score += 3
    return score

candidates = []
def scan_collections(node, path="$", depth=0):
    if depth > 5:
        return
    if isinstance(node, list):
        if len(node) == EXPECTED_TOTAL:
            sample = node[:3] + node[-3:]
            if sample and all(isinstance(x, dict) for x in sample):
                candidates.append((sum(sample_score(x) for x in sample), path, node))
        return
    if isinstance(node, dict):
        if len(node) == EXPECTED_TOTAL:
            vals = list(node.values())
            sample = vals[:3] + vals[-3:]
            if sample and all(isinstance(x, dict) for x in sample):
                candidates.append((sum(sample_score(x) for x in sample), path, vals))
        for k, v in node.items():
            if isinstance(v, (dict, list)):
                scan_collections(v, f"{path}.{k}", depth + 1)

scan_collections(root)
if not candidates:
    raise RuntimeError("Could not locate a 26,405-record classification collection in the frozen snapshot")
candidates.sort(key=lambda x: x[0], reverse=True)
best_score, collection_path, records = candidates[0]
if best_score <= 0:
    raise RuntimeError("Located a 26,405-record collection but could not mechanically identify city_key/verdict fields")

START_KEYS = [
    "alert_start", "alert_start_at", "alert_started_at", "alert_start_time",
    "alert_episode_start", "alert_episode_start_at", "episode_start",
    "started_at", "start_at", "start_time", "start"
]
END_KEYS = [
    "alert_end", "alert_end_at", "alert_ended_at", "alert_end_time",
    "alert_episode_end", "alert_episode_end_at", "episode_end",
    "ended_at", "end_at", "end_time", "end"
]

def find_time(rec, keys):
    alert_obj = find_by_keys(rec, ["alert_episode", "alert"])
    if isinstance(alert_obj, dict):
        v = find_by_keys(alert_obj, keys, max_depth=4)
        if v is not None:
            return v
    return find_by_keys(rec, keys, max_depth=6)

def parse_dt(v):
    if v is None:
        return None
    if isinstance(v, (int, float)):
        return datetime.fromtimestamp(v, tz=timezone.utc)
    s = str(v).strip()
    if not s:
        return None
    if re.fullmatch(r"\d{10}(?:\.\d+)?", s):
        return datetime.fromtimestamp(float(s), tz=timezone.utc)
    if re.fullmatch(r"\d{13}", s):
        return datetime.fromtimestamp(int(s) / 1000, tz=timezone.utc)
    ss = s.replace("Z", "+00:00")
    try:
        dt = datetime.fromisoformat(ss)
    except ValueError:
        return None
    if dt.tzinfo is None:
        dt = dt.replace(tzinfo=timezone.utc)
    return dt.astimezone(timezone.utc)

def month_from_raw(v, dt):
    if isinstance(v, str):
        m = re.match(r"^(\d{4})-(\d{2})", v.strip())
        if m:
            return f"{m.group(1)}-{m.group(2)}"
    return dt.strftime("%Y-%m") if dt else None

def date_from_raw(v, dt):
    if isinstance(v, str):
        m = re.match(r"^(\d{4}-\d{2}-\d{2})", v.strip())
        if m:
            return m.group(1)
    return dt.strftime("%Y-%m-%d") if dt else None

global_counts = Counter()
city = defaultdict(lambda: {
    "total_classifications": 0,
    "STRICT_EVENT_POSITIVE": 0,
    "SENSITIVITY_EVENT_POSITIVE": 0,
    "NO_CONFIRMED_EVENT": 0,
    "NEEDS_REVIEW": 0,
    "_earliest": None,
    "_earliest_raw": None,
    "_latest": None,
    "_latest_raw": None,
})
kyiv_monthly = defaultdict(lambda: {
    "total_alert_episodes": 0,
    "STRICT_EVENT_POSITIVE": 0,
    "SENSITIVITY_EVENT_POSITIVE": 0,
    "NO_CONFIRMED_EVENT": 0,
    "NEEDS_REVIEW": 0,
})
processing_errors = []
parsed_rows = []

for idx, rec in enumerate(records):
    city_key = find_exact_key(rec, "city_key")
    verdict = find_verdict(rec)
    start_raw = find_time(rec, START_KEYS)
    end_raw = find_time(rec, END_KEYS)
    start_dt = parse_dt(start_raw)
    end_dt = parse_dt(end_raw)

    if not isinstance(city_key, str) or not city_key:
        processing_errors.append(f"record {idx}: missing city_key")
        continue
    if verdict not in ALLOWED:
        processing_errors.append(f"record {idx}: unrecognized verdict")
        continue
    if start_dt is None:
        processing_errors.append(f"record {idx}: missing/unparseable alert start")
        continue
    if end_dt is None:
        processing_errors.append(f"record {idx}: missing/unparseable alert end")
        continue

    parsed_rows.append((city_key, verdict, start_raw, start_dt, end_raw, end_dt))
    global_counts[verdict] += 1
    c = city[city_key]
    c["total_classifications"] += 1
    c[verdict] += 1
    if c["_earliest"] is None or start_dt < c["_earliest"]:
        c["_earliest"] = start_dt
        c["_earliest_raw"] = start_raw
    if c["_latest"] is None or end_dt > c["_latest"]:
        c["_latest"] = end_dt
        c["_latest_raw"] = end_raw

city_keys = sorted(city)
kyiv_candidates = [k for k in city_keys if k.lower() == "kyiv"]
if not kyiv_candidates:
    kyiv_candidates = [k for k in city_keys if k.lower() in {"kyiv_city", "kyiv-city", "kiev"}]
if not kyiv_candidates:
    kyiv_candidates = [k for k in city_keys if "kyiv" in k.lower() and "oblast" not in k.lower() and "region" not in k.lower()]
if len(kyiv_candidates) != 1:
    processing_errors.append(f"could not uniquely identify Kyiv city_key; candidates={kyiv_candidates}")
    kyiv_key = None
else:
    kyiv_key = kyiv_candidates[0]

kyiv_last_positive = None
kyiv_last_positive_raw = None
if kyiv_key is not None:
    for city_key, verdict, start_raw, start_dt, end_raw, end_dt in parsed_rows:
        if city_key != kyiv_key:
            continue
        month = month_from_raw(start_raw, start_dt)
        m = kyiv_monthly[month]
        m["total_alert_episodes"] += 1
        m[verdict] += 1
        if verdict in {"STRICT_EVENT_POSITIVE", "SENSITIVITY_EVENT_POSITIVE"}:
            if kyiv_last_positive is None or start_dt > kyiv_last_positive:
                kyiv_last_positive = start_dt
                kyiv_last_positive_raw = start_raw

per_city = {}
for k in city_keys:
    c = city[k]
    per_city[k] = {
        "total_classifications": c["total_classifications"],
        "STRICT_EVENT_POSITIVE": c["STRICT_EVENT_POSITIVE"],
        "SENSITIVITY_EVENT_POSITIVE": c["SENSITIVITY_EVENT_POSITIVE"],
        "confirmed_positives": c["STRICT_EVENT_POSITIVE"] + c["SENSITIVITY_EVENT_POSITIVE"],
        "NO_CONFIRMED_EVENT": c["NO_CONFIRMED_EVENT"],
        "NEEDS_REVIEW": c["NEEDS_REVIEW"],
        "earliest_alert_start": c["_earliest_raw"],
        "latest_alert_end": c["_latest_raw"],
    }

monthly_out = []
for month in sorted(kyiv_monthly):
    m = kyiv_monthly[month]
    monthly_out.append({
        "month": month,
        "total_alert_episodes": m["total_alert_episodes"],
        "STRICT_EVENT_POSITIVE": m["STRICT_EVENT_POSITIVE"],
        "SENSITIVITY_EVENT_POSITIVE": m["SENSITIVITY_EVENT_POSITIVE"],
        "confirmed_positives": m["STRICT_EVENT_POSITIVE"] + m["SENSITIVITY_EVENT_POSITIVE"],
        "NO_CONFIRMED_EVENT": m["NO_CONFIRMED_EVENT"],
        "NEEDS_REVIEW": m["NEEDS_REVIEW"],
    })

actual_total = len(records)
global_confirmed = global_counts["STRICT_EVENT_POSITIVE"] + global_counts["SENSITIVITY_EVENT_POSITIVE"]
sum_city_totals = sum(v["total_classifications"] for v in per_city.values())
sum_city_confirmed = sum(v["confirmed_positives"] for v in per_city.values())

validation = {
    "source_blob_exact": {"passed": ACTUAL_BLOB == EXPECTED_BLOB, "expected": EXPECTED_BLOB, "actual": ACTUAL_BLOB},
    "classifications_count": {"passed": actual_total == EXPECTED_TOTAL, "expected": EXPECTED_TOTAL, "actual": actual_total},
    "aggregate_verdict_distribution": {
        "passed": all(global_counts[k] == v for k, v in EXPECTED.items()),
        "expected": EXPECTED,
        "actual": {k: global_counts[k] for k in EXPECTED},
    },
    "sum_city_totals": {"passed": sum_city_totals == EXPECTED_TOTAL, "expected": EXPECTED_TOTAL, "actual": sum_city_totals},
    "sum_city_confirmed_positives": {"passed": sum_city_confirmed == 1080, "expected": 1080, "actual": sum_city_confirmed},
    "mechanical_field_parse": {
        "passed": len(processing_errors) == 0 and len(parsed_rows) == EXPECTED_TOTAL,
        "parsed_rows": len(parsed_rows),
        "errors_count": len(processing_errors),
        "errors_sample": processing_errors[:20],
        "classification_collection_path": collection_path,
    },
}
ordered_gate_names = [
    "source_blob_exact",
    "classifications_count",
    "aggregate_verdict_distribution",
    "sum_city_totals",
    "sum_city_confirmed_positives",
    "mechanical_field_parse",
]
first_failing = next((g for g in ordered_gate_names if not validation[g]["passed"]), None)
validation["first_failing_gate"] = first_failing
complete = first_failing is None

kyiv_summary = None
if kyiv_key is not None and kyiv_key in per_city:
    kc = per_city[kyiv_key]
    last_positive_month = month_from_raw(kyiv_last_positive_raw, kyiv_last_positive) if kyiv_last_positive else None
    kyiv_summary = {
        "city_key": kyiv_key,
        "total_alert_episodes": kc["total_classifications"],
        "confirmed_positives": kc["confirmed_positives"],
        "STRICT_EVENT_POSITIVE": kc["STRICT_EVENT_POSITIVE"],
        "SENSITIVITY_EVENT_POSITIVE": kc["SENSITIVITY_EVENT_POSITIVE"],
        "earliest_alert_start": kc["earliest_alert_start"],
        "latest_alert_end": kc["latest_alert_end"],
        "last_confirmed_positive_alert_date": date_from_raw(kyiv_last_positive_raw, kyiv_last_positive) if kyiv_last_positive else None,
        "last_confirmed_positive_month": last_positive_month,
    }

out = {
    "verdict": "23-CITY ALERT-LEVEL SUMMARY = COMPLETE" if complete else "23-CITY ALERT-LEVEL SUMMARY = BLOCKED",
    "frozen_source": {
        "path": SOURCE_PATH,
        "commit": SOURCE_COMMIT,
        "expected_blob": EXPECTED_BLOB,
        "actual_blob": ACTUAL_BLOB,
        "blob_verified": ACTUAL_BLOB == EXPECTED_BLOB,
    },
    "validation": validation,
    "global_totals": {
        "total_classifications": actual_total,
        "STRICT_EVENT_POSITIVE": global_counts["STRICT_EVENT_POSITIVE"],
        "SENSITIVITY_EVENT_POSITIVE": global_counts["SENSITIVITY_EVENT_POSITIVE"],
        "confirmed_positives": global_confirmed,
        "NO_CONFIRMED_EVENT": global_counts["NO_CONFIRMED_EVENT"],
        "NEEDS_REVIEW": global_counts["NEEDS_REVIEW"],
    },
    "per_city_summary": per_city,
    "kyiv_summary": kyiv_summary,
    "kyiv_monthly_summary": monthly_out,
    "run": {
        "github_run_id": os.environ.get("GITHUB_RUN_ID"),
        "workflow_commit": os.environ.get("GITHUB_SHA"),
    },
    "mutation_confirmation": {
        "classifier_mutations": 0,
        "parser_mutations": 0,
        "source_mutations": 0,
        "alert_state_mutations": 0,
        "persistence_mutations": 0,
        "neon_db_queries": 0,
        "neon_db_writes": 0,
        "deployments": 0,
    },
}

with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
    json.dump(out, f, ensure_ascii=False, indent=2, default=str)
    f.write("\n")

with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
    f.write("summary_status=" + ("complete" if complete else "blocked") + "\n")
PY

      - name: Upload summary artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack_event_23city_alert_level_summary_2026-10-06
          path: attack_event_23city_alert_level_summary_2026-10-06.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce validation verdict
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.summarize.outputs.summary_status }}" != "complete" ]; then
            echo "23-CITY ALERT-LEVEL SUMMARY = BLOCKED"
            exit 1
          fi
          echo "23-CITY ALERT-LEVEL SUMMARY = COMPLETE"
