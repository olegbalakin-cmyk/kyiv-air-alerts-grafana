          OUTPUT_FILE="$GITHUB_WORKSPACE/attack_event_23city_alert_level_summary_2026-10-06.json"

          ACTUAL_BLOB="$(git rev-parse "${SOURCE_COMMIT}:${SOURCE_PATH}" 2>/dev/null || true)"
          export SOURCE_COMMIT SOURCE_PATH EXPECTED_BLOB ACTUAL_BLOB SOURCE_FILE OUTPUT_FILE GITHUB_RUN_ID GITHUB_SHA

          if [ "$ACTUAL_BLOB" != "$EXPECTED_BLOB" ]; then
            python - <<'PY'
import json, os
out = {
