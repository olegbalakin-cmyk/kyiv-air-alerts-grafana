name: Build Kharkiv P6 source slices

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kharkiv-p6:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana

    steps:
      - name: Check out multicity WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Kharkiv P6 source slices
        run: python scripts/build_explosion_source_slices.py --task kharkiv-P6 --max-episodes 250

      - name: Commit generated Kharkiv P6 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             data/explosion_metric_handoff/source_slices/kharkiv-P6*_alerts.json             data/explosion_metric_handoff/source_slices/kharkiv-P6_chunks_manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate Kharkiv P6 source slices"
          git push origin HEAD:multicity-wip-2026-09-16
