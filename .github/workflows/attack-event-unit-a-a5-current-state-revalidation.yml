name: Unit A A5 current-state read-only precondition revalidation
on:
  push:
    branches:
      - attack-event-unit-a-a5-current-state-revalidation-2026-10-10
    paths:
      - .github/workflows/attack-event-unit-a-a5-current-state-revalidation.yml
permissions:
  contents: write
jobs:
  a5-current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch exact accepted immutable artifacts
        shell: bash
        run: |
          set -euo pipefail
          for sha in 1b93d94cf9a11fd71b55483d9da0b443b954e25c 36a5989229ed5c1ad1cd07fbb61df5033af22681; do
            git fetch --no-tags origin "$sha"
          done
          test "$(git merge-base HEAD 5ec3a60938da7bad1b0bd364b01bb36d31b9a72f)" = 5ec3a60938da7bad1b0bd364b01bb36d31b9a72f
      - name: Install bounded read-only Postgres driver
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'
      - name: Run frozen manifest current-state revalidation
        shell: bash
        env:
          PHASE1_PROD_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          PHASE1_PROD_SHADOW_BRANCH_ID: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          python3 -B .github/proof/attack_event_unit_a_a5_current_state_revalidation.py
      - name: Freeze result and remove temporary proof infrastructure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact=research/attack_event_execution_unit_a_a5_current_state_revalidation_2026-10-10.json
          if ! test -f "$artifact"; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/attack_event_execution_unit_a_a5_current_state_revalidation_2026-10-10.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({"schema_version":1,"verdict":"A5_REVALIDATION_EXECUTION_BLOCKED","A5_CURRENT_STATE_GATE":"NOT_RUN","A5_MANIFEST_STILL_EXACT":"UNKNOWN","A5_READY_FOR_EXPLICIT_AUTHORIZATION":"NO","A5_AUTHORIZED":"NO","A5_EXECUTED":"NO","execution_base_commit":"5ec3a60938da7bad1b0bd364b01bb36d31b9a72f","failure":"RUNNER_STEP_FAILED_BEFORE_ARTIFACT","safety":{"attempted_db_writes":0,"committed_db_writes":0,"a5_actions_executed":0,"production_mutation":"NO","site_prod_mutation":"NO"}},indent=2,sort_keys=True)+"\n")
          PY
          fi
          python3 - <<'PY'
          import json
          r=json.load(open("research/attack_event_execution_unit_a_a5_current_state_revalidation_2026-10-10.json"))
          assert r["A5_AUTHORIZED"]=="NO" and r["A5_EXECUTED"]=="NO"
          if r["verdict"].endswith(" = PASS"):
              assert r["A5_CURRENT_STATE_GATE"]=="PASS"
              assert r["A5_PRECONDITIONS_VALID"]==3282
              assert r["A5_PRECONDITIONS_DRIFTED"]==0
              assert r["neon"]["read_only"]
              assert r["neon"]["transaction_rolled_back"]
          elif r["verdict"].endswith(" = BLOCKED"):
              assert r["A5_CURRENT_STATE_GATE"]=="FAIL"
              assert r["first_drift_category"]
          else:
              assert r["verdict"]=="A5_REVALIDATION_EXECUTION_BLOCKED"
              assert r["A5_CURRENT_STATE_GATE"]=="NOT_RUN"
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze Unit A A5 current-state read-only revalidation evidence"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          echo "ARTIFACT_SHA256=$(sha256sum "$artifact" | cut -d' ' -f1)"
          before="$(git hash-object "$artifact")"
          rm -f .github/proof/attack_event_unit_a_a5_current_state_revalidation.py
          rm -f .github/workflows/attack-event-unit-a-a5-current-state-revalidation.yml
          git add -A .github/proof/attack_event_unit_a_a5_current_state_revalidation.py .github/workflows/attack-event-unit-a-a5-current-state-revalidation.yml
          git commit -m "Remove temporary Unit A A5 read-only proof harness and workflow"
          test "$before" = "$(git hash-object "$artifact")"
          test "$(git diff --name-status 5ec3a60938da7bad1b0bd364b01bb36d31b9a72f..HEAD)" = "$(printf 'A\tresearch/attack_event_execution_unit_a_a5_current_state_revalidation_2026-10-10.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "WORKFLOW_REMOVED=YES"
          echo "HARNESS_REMOVED=YES"
          echo "PRODUCTION_MUTATION=NO"
          git push origin HEAD:attack-event-unit-a-a5-current-state-revalidation-2026-10-10
