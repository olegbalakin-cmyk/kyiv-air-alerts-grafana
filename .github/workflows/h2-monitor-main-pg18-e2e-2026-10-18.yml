name: H2 Real Monitor Main Offline PG18 E2E
on:
  push:
    branches: [research-h2-monitor-main-pg18-e2e-2026-10-18]
    paths:
      - "kyiv-air-alerts-grafana/tests/test_h2_monitor_main_pg18_e2e.py"
      - ".github/workflows/h2-monitor-main-pg18-e2e-2026-10-18.yml"
      - "research/h2_monitor_main_pg18_e2e_proof_2026-10-18.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-pg18-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: h2_offline
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U h2_local -d h2_offline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      H2_OFFLINE_POSTGRES_DSN: postgresql://h2_local:synthetic_only@127.0.0.1:5432/h2_offline
      ATTACK_EVENT_DATABASE_URL: postgresql://h2_local:synthetic_only@127.0.0.1:5432/h2_offline
      ATTACK_EVENT_ORIGIN_COMMIT_SHA: ffffffffffffffffffffffffffffffffffffffff
      ATTACK_EVENT_ORIGIN_REF: synthetic-pg18
      CANONICAL_PARENT_DB_BRANCH: synthetic-offline
      CANONICAL_PARENT_CONTRACT_DIR: /tmp/h2-parent-contract
      H2_MAIN_OUTPUT: /tmp/h2_monitor_main_report.json
      H2_OUTPUT: /tmp/h2_pg18_result.json
      H2_TEST_PHASE: post_fix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
      - name: Pin and verify exact accepted canonical parent contract
        run: |
          mkdir -p /tmp/h2-parent-contract
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/olegbalakin-cmyk/kyiv-air-alerts-grafana/41da789e61424c4f5b58d3b9fb8547ba98a194bf/kyiv-air-alerts-grafana/scripts/db_phase1_core.py -o /tmp/h2-parent-contract/db_phase1_core.py
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/olegbalakin-cmyk/kyiv-air-alerts-grafana/41da789e61424c4f5b58d3b9fb8547ba98a194bf/kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py -o /tmp/h2-parent-contract/db_phase1_persistence.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name, blob in [('db_phase1_core.py','dda23c268e08f74367f33b189a8bafc1358aadd2'),('db_phase1_persistence.py','ed014e61fc6186fa9daf91c763c847e7df2f0306')]:
              p=Path('/tmp/h2-parent-contract')/name
              raw=p.read_bytes()
              h=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert h==blob,(name,h,blob)
              print('VERIFIED_PARENT_CONTRACT_BLOB',name,h)
          PY
      - name: Exact real monitor and contract compile
        run: |
          python -m py_compile kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py
          python -m py_compile kyiv-air-alerts-grafana/tests/test_h2_monitor_main_pg18_e2e.py
          python -m py_compile /tmp/h2-parent-contract/db_phase1_core.py /tmp/h2-parent-contract/db_phase1_persistence.py
      - name: Run actual main PostgreSQL tests and writer regressions
        run: python kyiv-air-alerts-grafana/tests/test_h2_monitor_main_pg18_e2e.py
      - name: Run accepted I1-I15 integration regressions
        env:
          H2_CALLER_OUTPUT: /tmp/h2_caller_report.json
        run: python kyiv-air-alerts-grafana/tests/test_h2_operational_expected_tip_pg18.py
      - name: Independently check report and coverage
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/h2_monitor_main_report.json'))
          print('PG18_VERSION',p['postgres_version'])
          print('FULL_MONITOR_VERDICT',p['verdict'])
          print('CASE_RESULTS',{k:v['status'] for k,v in p['cases'].items()})
          assert p['verdict']=='PASS'
          assert p['postgres_version'].startswith('18.')
          assert p['network']['live_calls']==0
          assert all(p['cases'][x]['status']=='PASS' for x in ['M'+str(n) for n in range(1,11)])
          assert all(p['cases'][x]['status']=='PASS' for x in ['N1_BYPASS_PERSISTENCE_DETECTED','N2_BAD_PERSISTED_JSON_DETECTED','N3_DUPLICATE_CURRENT_TIP_DETECTED'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-monitor-main-pg18-e2e-sanitized
          path: |
            /tmp/h2_monitor_main_report.json
            /tmp/h2_caller_report.json
            /tmp/h2_pg18_result.json
          retention-days: 30
          if-no-files-found: ignore

# Independent B fresh PG18 repeat. Application/test blobs unchanged.
