name: Update explosion metric WIP

# Legacy/manual fallback only. The scheduled updater is explosion-monitor-wip.yml,
# which polls the audited city regionHistory series directly. Keeping two scheduled
# writers would race and could overwrite the live denominator with a stale bridge.
on:
  workflow_dispatch:

concurrency:
  group: explosion-metric-wip
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out explosion WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Get latest production alert bridge and city feeds
        run: |
          git fetch origin main
          git show origin/main:kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json > /tmp/latest-bridge.json
          rm -rf /tmp/prod-tree
          mkdir -p /tmp/prod-tree
          git archive origin/main kyiv-air-alerts-grafana/data/grafana/cities | tar -x -C /tmp/prod-tree
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("/tmp/latest-bridge.json").read_text(encoding="utf-8"))
          assert x.get("events"), "main bridge has no events"
          city_dir = Path("/tmp/prod-tree/kyiv-air-alerts-grafana/data/grafana/cities")
          assert city_dir.exists()
          print("bridge events:", len(x["events"]), "city feeds:", len(list(city_dir.glob("*.json"))))
          PY

      - name: Self-test explosion baseline sync
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/sync_explosion_audited_baseline.py --self-test

      - name: Sync newly audited cities into automatic baseline
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/sync_explosion_audited_baseline.py \
            --city-data-dir /tmp/prod-tree/kyiv-air-alerts-grafana/data/grafana/cities

      - name: Self-test explosion monitor
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/update_explosion_metric.py --self-test

      - name: Update explosion metric and candidate queue
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/update_explosion_metric.py --bridge-file /tmp/latest-bridge.json

      - name: Validate generated explosion metric
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("kyiv-air-alerts-grafana/data")
          x = json.loads((root / "explosions_test.json").read_text(encoding="utf-8"))
          base = json.loads((root / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          dash = json.loads((root / "dashboard_data.json").read_text(encoding="utf-8"))
          run = json.loads((root / "explosion_monitor_last_run.json").read_text(encoding="utf-8"))

          assert x["meta"]["automatic_updates"] is True
          assert x["meta"]["rolling_window_days"] == 90
          assert len(x["cities"]) >= 10
          assert x["meta"]["city_count"] == len(x["cities"])
          assert set(x["cities"]) == set(base["cities"])
          assert base["meta"]["city_count"] == len(base["cities"])
          for key, city in x["cities"].items():
              assert city["total_alerts"] >= base["cities"][key]["total_alerts"], key
              assert city["strict_n"] >= base["cities"][key]["strict_n"], key
              assert city["rolling90"], key
          assert dash["explosion_metric_test"]["meta"]["automatic_updates"] is True
          assert run["output_city_count"] == len(base["cities"])
          assert run["audited_city_count"] == len(base["cities"])
          print(json.dumps(run, ensure_ascii=False))
          PY

      - name: Detect UI changes
        id: ui
        run: |
          if git diff --quiet --             kyiv-air-alerts-grafana/data/explosions_test.json             kyiv-air-alerts-grafana/data/dashboard_data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit WIP monitor state and generated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             kyiv-air-alerts-grafana/data/explosions_test.json             kyiv-air-alerts-grafana/data/dashboard_data.json             kyiv-air-alerts-grafana/data/explosion_monitor_state.json             kyiv-air-alerts-grafana/data/explosion_review_queue.json             kyiv-air-alerts-grafana/data/explosion_monitor_last_run.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update explosion metric WIP"

          for attempt in 1 2 3; do
            git fetch origin multicity-wip-2026-09-16
            if git rebase origin/multicity-wip-2026-09-16 && git push origin HEAD:multicity-wip-2026-09-16; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Configure Pages
        if: steps.ui.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble stable WIP test site
        if: steps.ui.outputs.changed == 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: steps.ui.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy stable WIP test site
        if: steps.ui.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
