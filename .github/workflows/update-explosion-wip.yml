name: Update explosion metric WIP

# Legacy/manual fallback only. The scheduled updater is explosion-monitor-wip.yml,
# which polls the audited city regionHistory series directly. Keeping two scheduled
# writers would race and could overwrite the live denominator with a stale bridge.
on:
  workflow_dispatch:

concurrency:
  group: explosion-metric-wip
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out explosion WIP branch
        uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Get latest production alert inputs
        run: |
          git fetch origin site-prod
          git show origin/site-prod:kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json > /tmp/latest-bridge.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/dashboard_data.json > /tmp/prod-dashboard.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/alerts_combined.json > /tmp/prod-kyiv-alerts.json
          git show origin/site-prod:kyiv-air-alerts-grafana/data/sevastopol_events.json > /tmp/prod-sevastopol-events.json
          python - <<'PY'
          import json
          from pathlib import Path
          bridge = json.loads(Path("/tmp/latest-bridge.json").read_text(encoding="utf-8"))
          dashboard = json.loads(Path("/tmp/prod-dashboard.json").read_text(encoding="utf-8"))
          kyiv = json.loads(Path("/tmp/prod-kyiv-alerts.json").read_text(encoding="utf-8"))
          sev = json.loads(Path("/tmp/prod-sevastopol-events.json").read_text(encoding="utf-8"))
          assert bridge.get("events"), "production bridge has no events"
          assert dashboard.get("cities"), "production dashboard has no cities"
          assert isinstance(kyiv, list) and kyiv, "Kyiv alert store is empty"
          assert sev.get("pairs"), "Sevastopol event store is empty"
          print("bridge events:", len(bridge["events"]), "dashboard cities:", len(dashboard["cities"]))
          PY

      - name: Self-test explosion baseline sync
        working-directory: kyiv-air-alerts-grafana
        run: python scripts/sync_explosion_audited_baseline.py --self-test

      - name: Sync newly audited cities into automatic baseline
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/sync_explosion_audited_baseline.py \
            --dashboard-data /tmp/prod-dashboard.json

      - name: Self-test primary explosion monitor
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py --self-test
          python scripts/update_explosion_metric_live.py --self-test

      - name: Update explosion metric and candidate queue from cached production inputs
        working-directory: kyiv-air-alerts-grafana
        run: |
          python scripts/monitor_explosion_candidates.py \
            --local-only \
            --bridge-file /tmp/latest-bridge.json \
            --kyiv-alerts-file /tmp/prod-kyiv-alerts.json \
            --sevastopol-events-file /tmp/prod-sevastopol-events.json
          python scripts/update_explosion_metric_live.py

      - name: Validate generated explosion metric
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("kyiv-air-alerts-grafana/data")
          x = json.loads((root / "explosions_test.json").read_text(encoding="utf-8"))
          base = json.loads((root / "explosion_audited_baseline.json").read_text(encoding="utf-8"))
          dash = json.loads((root / "dashboard_data.json").read_text(encoding="utf-8"))
          run = json.loads((root / "explosion_candidate_monitor_last_run.json").read_text(encoding="utf-8"))

          assert x["meta"]["schema_version"] == 2
          assert x["meta"]["rolling_window_days"] == 90
          assert set(x["cities"]) == set(base["cities"])
          assert x["meta"]["city_count"] == len(base["cities"])
          assert dash["explosion_metric_test"]["meta"]["city_count"] == len(base["cities"])
          assert run["city_count"] == len(base["cities"])
          assert run["mode"] == "cached_bridge"
          for key, city in x["cities"].items():
              assert city["total_alerts"] >= base["cities"][key]["total_alerts"], key
              assert city["strict_n"] >= base["cities"][key]["strict_n"], key
              assert city["rolling90"], key
          print(json.dumps(run, ensure_ascii=False))
          PY

      - name: Detect UI changes
        id: ui
        run: |
          if git diff --quiet --             kyiv-air-alerts-grafana/data/explosions_test.json             kyiv-air-alerts-grafana/data/dashboard_data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit WIP monitor state and generated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kyiv-air-alerts-grafana/data/explosion_audited_baseline.json \
            kyiv-air-alerts-grafana/data/explosion_daily_alert_seed.json \
            kyiv-air-alerts-grafana/data/explosions_test.json \
            kyiv-air-alerts-grafana/data/dashboard_data.json \
            kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json \
            kyiv-air-alerts-grafana/data/explosion_review_queue.json \
            kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update explosion metric WIP"

          for attempt in 1 2 3; do
            git fetch origin multicity-wip-2026-09-16
            if git rebase origin/multicity-wip-2026-09-16 && git push origin HEAD:multicity-wip-2026-09-16; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Configure Pages
        if: steps.ui.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble stable WIP test site
        if: steps.ui.outputs.changed == 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/index.html _site/index.html
          cp kyiv-air-alerts-grafana/pages-preview/styles.css _site/styles.css
          cp kyiv-air-alerts-grafana/pages-preview/app.js _site/app.js
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: steps.ui.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy stable WIP test site
        if: steps.ui.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
