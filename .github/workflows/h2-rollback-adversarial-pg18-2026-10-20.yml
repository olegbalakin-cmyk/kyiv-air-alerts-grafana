name: H2 rollback adversarial PG18.6 AB synthetic only
on:
  push:
    branches: [research-h2-rollback-adversarial-pg18-2026-10-20-gpt6]
    paths:
      - '.github/workflows/h2-rollback-adversarial-pg18-2026-10-20.yml'
      - 'research/h2_rollback_adversarial_2026-10-20/*.py'
permissions:
  contents: read
jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
      PGCONNECT_TIMEOUT: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic postgres client only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12"
      - name: Check reference 001
        run: test -s reference/research/h2_pg18_revision_invariant_hardening_2026-10-19/001_revision_invariants.sql
      - name: Execute adversarial SQL and readback
        run: python research/h2_rollback_adversarial_2026-10-20/run_all.py
      - name: Preserve full original report even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-adversarial-${{ matrix.copy }}
          path: /tmp/h2_adversarial_${{ matrix.copy }}.json
          if-no-files-found: error
          retention-days: 30
