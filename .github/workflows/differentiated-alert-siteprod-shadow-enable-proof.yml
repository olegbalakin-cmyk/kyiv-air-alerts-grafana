name: Differentiated alert site-prod shadow enablement proof

on:
  push:
    branches:
      - differentiated-alert-siteprod-shadow-enable-proof-2026-09-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install dependencies
        run: pip install -r requirements-db-phase1.txt

      - name: Run current production OFF/ON durable-shadow proof
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
          DIFFERENTIATED_ALERT_SHADOW_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
          DIFFERENTIATED_ALERT_SHADOW_DB_BRANCH: ${{ vars.PHASE1_PROD_SHADOW_BRANCH_ID }}
          PROOF_SITEPROD_BASE: 9a0769ff49735cdb870abeb913ffb869f39e5e88
          PROOF_RESULT_PATH: ${{ runner.temp }}/differentiated_alert_shadow_proof.json
          PROOF_DIFFERENTIATED_SCHEMA: differentiated_alert_shadow_proof_${{ github.run_id }}
        run: python scripts/proof_differentiated_alert_siteprod_shadow_enablement.py

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differentiated-alert-shadow-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/differentiated_alert_shadow_proof.json
          if-no-files-found: warn
          retention-days: 30

      - name: Safe proof summary
        if: always()
        env:
          RESULT: ${{ runner.temp }}/differentiated_alert_shadow_proof.json
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RESULT"])
          if not p.exists():
              print("::warning::Differentiated proof artifact missing")
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          safe = {
              "verdict": d.get("verdict"),
              "gates": d.get("gates"),
              "publication": d.get("publication_comparison"),
              "parent_air": d.get("parent_air_comparison"),
              "attack_event": d.get("attack_event_comparison"),
              "tests": d.get("tests"),
              "credentials_exposure": d.get("credentials_exposure"),
          }
          print(json.dumps(safe, sort_keys=True))
          PY
