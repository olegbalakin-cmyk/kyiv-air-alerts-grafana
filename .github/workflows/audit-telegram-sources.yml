name: Audit Telegram alert sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/audit_telegram_sources.py"
      - ".github/workflows/audit-telegram-sources.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - uses: actions/checkout@v4
      - name: Sync main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Audit Telegram sources
        run: python scripts/audit_telegram_sources.py
      - name: Commit output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data/telegram_source_audit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Audit Telegram alert sources"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
