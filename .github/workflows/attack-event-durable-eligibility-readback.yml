name: Durable live eligibility Neon read-back
on:
  push:
    branches: [main]
    paths:
      - deploy/attack-event-durable-eligibility-readback-trigger.txt
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2,<4"
      - name: Read-only durable eligibility audit
        env:
          DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
        run: |
          python - <<'PY'
          import json, os
          import psycopg
          from psycopg.rows import dict_row

          OLD_CUTOFF = "2026-10-07T16:53:19Z"
          NEW_CUTOFF = "2026-10-07T19:05:00Z"
          OLD_RUNS = [37656124378, 37660054974]
          CANARY_RUN = 37671858818

          def clean(row):
              return {k: (v.isoformat() if hasattr(v, "isoformat") else str(v) if k.endswith("_uid") and v is not None else v)
                      for k, v in dict(row).items()}

          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("BEGIN TRANSACTION READ ONLY")
                  cur.execute("""
                    SELECT e.episode_uid::text, e.city_key, e.legacy_episode_id AS episode_id,
                           e.start_at::text, e.end_at::text,
                           e.created_by_run_id::text, ir.github_run_id,
                           ir.started_at::text,
                           (ir.parameters->>'city_key') AS provenance_city_key,
                           (ir.parameters->>'historical_episode_id') AS provenance_episode_id,
                           (SELECT count(*)::int FROM public.attack_event_classifications c
                            WHERE c.alert_episode_uid=e.episode_uid) AS dependent_classifications,
                           (SELECT count(*)::int FROM public.attack_events a
                            WHERE a.alert_episode_uid=e.episode_uid) AS dependent_events,
                           (SELECT count(*)::int
                            FROM public.attack_event_sources s
                            JOIN public.attack_event_classifications c
                              ON c.classification_uid=s.classification_uid
                            WHERE c.alert_episode_uid=e.episode_uid) AS dependent_evidence_rows
                    FROM public.alert_episodes e
                    JOIN public.ingestion_runs ir ON ir.run_id=e.created_by_run_id
                    WHERE ir.run_kind='live_parent_ordering_sync'
                      AND ir.github_run_id = ANY(%s)
                      AND e.end_at < %s::timestamptz
                    ORDER BY e.end_at,e.city_key,e.legacy_episode_id
                  """,(OLD_RUNS,OLD_CUTOFF))
                  old_rows=[clean(r) for r in cur.fetchall()]

                  cur.execute("""
                    SELECT e.episode_uid::text, e.city_key, e.legacy_episode_id AS episode_id,
                           e.start_at::text, e.end_at::text,
                           e.created_by_run_id::text, ir.github_run_id, ir.started_at::text
                    FROM public.alert_episodes e
                    JOIN public.ingestion_runs ir ON ir.run_id=e.created_by_run_id
                    WHERE ir.run_kind='live_parent_ordering_sync'
                      AND ir.github_run_id=%s
                    ORDER BY e.end_at,e.city_key,e.legacy_episode_id
                  """,(CANARY_RUN,))
                  new_parents=[clean(r) for r in cur.fetchall()]

                  cur.execute("""
                    SELECT c.classification_uid::text,c.classification_key,c.city_key,
                           c.historical_episode_id AS episode_id,
                           c.alert_start_at::text,c.alert_end_at::text,c.verdict,c.is_event,
                           c.positive_tier,c.event_types,c.qa_reasons,c.classifier_reason_codes,
                           c.classifier_blob_sha,c.origin_workflow_run_id,c.created_at::text,
                           c.alert_episode_uid::text,
                           e.episode_uid IS NOT NULL AS parent_present,
                           (e.city_key=c.city_key
                            AND e.legacy_episode_id=c.historical_episode_id
                            AND e.start_at=c.alert_start_at
                            AND e.end_at=c.alert_end_at) AS exact_parent_identity,
                           (SELECT count(*)::int FROM public.attack_event_sources s
                            WHERE s.classification_uid=c.classification_uid) AS evidence_linkage_count,
                           a.attack_event_uid::text,a.event_status
                    FROM public.attack_event_classifications c
                    LEFT JOIN public.alert_episodes e ON e.episode_uid=c.alert_episode_uid
                    LEFT JOIN public.attack_events a ON a.current_classification_uid=c.classification_uid
                    WHERE c.origin_workflow_run_id=%s
                    ORDER BY c.created_at,c.classification_uid
                  """,(CANARY_RUN,))
                  canary_cls=[clean(r) for r in cur.fetchall()]

                  cur.execute("""
                    SELECT count(*)::int AS n
                    FROM public.alert_episodes e
                    JOIN public.ingestion_runs ir ON ir.run_id=e.created_by_run_id
                    WHERE ir.run_kind='live_parent_ordering_sync'
                      AND ir.started_at >= %s::timestamptz
                      AND e.end_at < %s::timestamptz
                  """,(NEW_CUTOFF,NEW_CUTOFF))
                  new_bad_parents=cur.fetchone()["n"]

                  cur.execute("""
                    SELECT count(*)::int AS n
                    FROM public.attack_event_classifications c
                    WHERE c.created_at >= %s::timestamptz
                      AND c.origin_workflow_run_id IS NOT NULL
                      AND c.alert_end_at < %s::timestamptz
                      AND c.origin_repository='olegbalakin-cmyk/kyiv-air-alerts-grafana'
                  """,(NEW_CUTOFF,NEW_CUTOFF))
                  new_bad_cls=cur.fetchone()["n"]

                  cur.execute("""
                    SELECT count(*)::int AS n
                    FROM public.attack_events a
                    JOIN public.attack_event_classifications c
                      ON c.classification_uid=a.current_classification_uid
                    WHERE c.origin_workflow_run_id=%s
                      AND c.alert_end_at < %s::timestamptz
                  """,(CANARY_RUN,NEW_CUTOFF))
                  new_bad_events=cur.fetchone()["n"]

                  cur.execute("""
                    SELECT COALESCE(sum(n-1),0)::int AS n FROM (
                      SELECT count(*)::int AS n
                      FROM public.alert_episodes
                      GROUP BY city_key,legacy_episode_id,start_at,end_at
                      HAVING count(*)>1
                    ) q
                  """)
                  dup_parents=cur.fetchone()["n"]

                  cur.execute("""
                    WITH tips AS (
                      SELECT c.city_key,c.historical_episode_id,c.alert_start_at,c.alert_end_at,c.classification_uid
                      FROM public.attack_event_classifications c
                      WHERE NOT EXISTS (
                        SELECT 1 FROM public.attack_event_classifications n
                        WHERE n.supersedes_classification_uid=c.classification_uid
                      )
                    )
                    SELECT COALESCE(sum(n-1),0)::int AS n FROM (
                      SELECT count(*)::int AS n FROM tips
                      GROUP BY city_key,historical_episode_id,alert_start_at,alert_end_at
                      HAVING count(*)>1
                    ) q
                  """)
                  dup_cls=cur.fetchone()["n"]

                  cur.execute("""
                    SELECT COALESCE(sum(n-1),0)::int AS n FROM (
                      SELECT count(*)::int AS n FROM public.attack_events
                      GROUP BY city_key,historical_episode_id,alert_start_at,alert_end_at
                      HAVING count(*)>1
                    ) q
                  """)
                  dup_evt=cur.fetchone()["n"]
                  cur.execute("ROLLBACK")

          out={
            "old_cutoff_utc":OLD_CUTOFF,
            "new_cutoff_utc":NEW_CUTOFF,
            "old_canary_run_ids":OLD_RUNS,
            "new_canary_run_id":CANARY_RUN,
            "previous_unauthorized_parent_rows":old_rows,
            "previous_unauthorized_parent_count":len(old_rows),
            "new_canary_parent_rows":new_parents,
            "new_canary_classification_rows":canary_cls,
            "new_unauthorized_pre_cutoff_parent_writes":new_bad_parents,
            "new_unauthorized_pre_cutoff_classification_writes":new_bad_cls,
            "new_unauthorized_pre_cutoff_attack_event_writes":new_bad_events,
            "duplicate_parent_rows":dup_parents,
            "duplicate_classification_rows":dup_cls,
            "duplicate_attack_event_rows":dup_evt,
            "read_only":True
          }
          print("DURABLE_ELIGIBILITY_READBACK_JSON="+json.dumps(out,default=str,separators=(",",":")))
          PY
