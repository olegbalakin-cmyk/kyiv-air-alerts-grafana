name: Unit A frozen A3 episode aggregation membership repair

on:
  push:
    branches:
      - attack-event-unit-a-a3-aggregation-membership-repair-2026-10-09
    paths:
      - .github/workflows/attack-event-unit-a-a3-aggregation-membership-repair.yml

permissions:
  contents: write

concurrency:
  group: unit-a-a3-aggregation-membership-repair-2026-10-09
  cancel-in-progress: false

jobs:
  repair-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch only pinned historical code objects
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            1422e8482303ec9262647ca55fef753a9aa2b3ea \
            71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 \
            51adc76b715669e46e8c2c936906022d4d96ed44; do
            git fetch --no-tags origin "$sha"
          done
          test "$(git merge-base HEAD 87152684e694f8c0faed6e575c9f99c6d073423b)" = "87152684e694f8c0faed6e575c9f99c6d073423b"
          test "$(git rev-parse HEAD:research/attack_event_execution_unit_a_classification_replay_2026-10-09.json)" = "4dfc8aa7132706e2a3a4febd655ffa0a2bd71640"
          test "$(git rev-parse HEAD:research/attack_event_execution_unit_a_membership_semantics_diagnostic_2026-10-09.json)" = "a381a057e84a981707948d0b4cbce250b6304634"
      - name: Two independent offline reconstruction runs
        id: repair
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -uo pipefail
          python -B .github/proof/attack_event_unit_a_a3_aggregation_membership_repair.py
          code="$?"
          test -f research/attack_event_execution_unit_a_classification_aggregation_repair_2026-10-09.json || exit 1
          echo "repair_exit=$code" >> "$GITHUB_OUTPUT"
      - name: Freeze immutable result and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          artifact="research/attack_event_execution_unit_a_classification_aggregation_repair_2026-10-09.json"
          workflow=".github/workflows/attack-event-unit-a-a3-aggregation-membership-repair.yml"
          harness=".github/proof/attack_event_unit_a_a3_aggregation_membership_repair.py"
          test -s "$artifact"
          python - <<'PY'
          import json
          p='research/attack_event_execution_unit_a_classification_aggregation_repair_2026-10-09.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['verdict'] in (
            'ATTACK-EVENT EXECUTION UNIT A A3 AGGREGATION REPAIR = FROZEN',
            'ATTACK-EVENT EXECUTION UNIT A A3 AGGREGATION REPAIR = BLOCKED')
          if x['verdict'].endswith('FROZEN'):
            assert len(x['episode_results']) == 1713
            assert x['diagnostic_parity'] == 'YES'
            assert x['determinism']['run_a_repaired_aggregation_sha256'] == x['determinism']['run_b_repaired_aggregation_sha256']
          print('FREEZE_VERDICT='+x['verdict'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze corrected Unit A A3 episode aggregation membership"
          frozen_blob="$(git rev-parse "HEAD:$artifact")"
          frozen_sha="$(sha256sum "$artifact" | cut -d' ' -f1)"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$frozen_blob"
          echo "ARTIFACT_SHA256=$frozen_sha"
          rm "$workflow" "$harness"
          git add -A "$workflow" "$harness"
          git commit -m "Remove temporary Unit A A3 membership repair execution files"
          test ! -e "$workflow" && test ! -e "$harness"
          test "$(git rev-parse "HEAD:$artifact")" = "$frozen_blob"
          test "$(sha256sum "$artifact" | cut -d' ' -f1)" = "$frozen_sha"
          test "$(git diff --name-status 87152684e694f8c0faed6e575c9f99c6d073423b..HEAD)" = "$(printf 'A\tresearch/attack_event_execution_unit_a_classification_aggregation_repair_2026-10-09.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "TEMP_WORKFLOW_REMOVED=YES"
          echo "TEMP_HARNESS_REMOVED=YES"
          echo "ORIGINAL_A3_MODIFIED=NO"
          echo "PRODUCTION_MUTATION=NO"
          git push origin HEAD:attack-event-unit-a-a3-aggregation-membership-repair-2026-10-09
