name: Human casualty review operator (protected manual)

# Production-intended ONLY. Remains isolated until a separately authorized cutover.
on:
  push:
    branches: [integration-casualty-worky-code-off-2026-11-14]
    paths:
      - ".github/workflows/casualty-review-operator.yml"
      - ".github/workflows/update.yml"
      - "kyiv-air-alerts-grafana/scripts/casualty_review_operator.py"
      - "kyiv-air-alerts-grafana/scripts/review_casualty_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/update_casualties.py"
      - "research/casualty_workw_integration_2026_11_14/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "INSPECT reads only; REVIEW decides; PROMOTE requires a durable confirmation"
        type: choice
        required: true
        options:
          - INSPECT
          - REVIEW
          - PROMOTE
      candidate_id:
        description: "Exact authoritative multicity candidate_id (empty only for INSPECT inbox)"
        type: string
        required: false
      decision:
        description: "REVIEW only; REOPEN is permitted only after HOLD"
        type: choice
        required: true
        default: NONE
        options:
          - NONE
          - CONFIRM
          - REJECT
          - HOLD
          - REOPEN
      review_payload_json:
        description: "JSON object with city_key, note and (for CONFIRM) canonical details"
        type: string
        required: true
        default: "{}"

permissions:
  contents: read

concurrency:
  group: casualty-review-human-operator
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Immutable read-only preflight and human decision preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CASUALTY_MODE: ${{ inputs.mode }}
      CASUALTY_CANDIDATE_ID: ${{ inputs.candidate_id }}
      CASUALTY_DECISION: ${{ inputs.decision }}
      CASUALTY_REVIEW_PAYLOAD_JSON: ${{ inputs.review_payload_json }}
      QUEUE_GIT_PATH: kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json
      REVISIONS_GIT_PATH: kyiv-air-alerts-grafana/data/casualties/revisions.csv
      REVIEWER_GIT_PATH: kyiv-air-alerts-grafana/scripts/review_casualty_candidates.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read immutable authoritative snapshots; verify the production promotion pin
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/multicity-wip-2026-09-16:refs/remotes/origin/multicity-wip-2026-09-16 \
            +refs/heads/site-prod:refs/remotes/origin/site-prod
          wip=$(git rev-parse refs/remotes/origin/multicity-wip-2026-09-16)
          prod=$(git rev-parse refs/remotes/origin/site-prod)
          queue=$(git rev-parse "$wip:$QUEUE_GIT_PATH")
          revisions=$(git rev-parse "$prod:$REVISIONS_GIT_PATH")
          pinned=$(git rev-parse "$prod:$REVIEWER_GIT_PATH")
          test "$pinned" = "57c67af1ce108222c9a8dc0fefe34d67f9d0e23e"
          mkdir -p "$RUNNER_TEMP/casualty-operator"
          git show "$wip:$QUEUE_GIT_PATH" > "$RUNNER_TEMP/casualty-operator/queue.json"
          git show "$prod:$REVISIONS_GIT_PATH" > "$RUNNER_TEMP/casualty-operator/revisions.csv"
          # Exact production generator is read-only and SHA-pinned; no main fallback.
          gen_blob=$(git rev-parse "$prod:kyiv-air-alerts-grafana/scripts/update_casualties.py")
          test "$gen_blob" = "f5840c201c850b5312db611896b491a69f10e6ec"
          git show "$prod:kyiv-air-alerts-grafana/scripts/update_casualties.py" > "$RUNNER_TEMP/casualty-operator/pinned_generator.py"
          echo "GENERATOR_PATH=$RUNNER_TEMP/casualty-operator/pinned_generator.py" >> "$GITHUB_ENV"
          echo "WIP_HEAD=$wip" >> "$GITHUB_ENV"
          echo "PROD_HEAD=$prod" >> "$GITHUB_ENV"
          echo "QUEUE_BLOB=$queue" >> "$GITHUB_ENV"
          echo "REVISIONS_BLOB=$revisions" >> "$GITHUB_ENV"
      - name: Validate explicit payload and render escaped human decision preview
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/casualty_review_operator.py preview \
            --queue "$RUNNER_TEMP/casualty-operator/queue.json" \
            --revisions "$RUNNER_TEMP/casualty-operator/revisions.csv" \
            --generator "$GENERATOR_PATH" \
            --snapshot "$RUNNER_TEMP/casualty-operator/approved-preview.json" \
            --wip-head "$WIP_HEAD" --site-prod-head "$PROD_HEAD" \
            --queue-blob-sha "$QUEUE_BLOB" --revisions-blob-sha "$REVISIONS_BLOB"
      - name: Preserve preview for protected job (no write authority)
        uses: actions/upload-artifact@v4
        with:
          name: casualty-review-immutable-preview
          path: ${{ runner.temp }}/casualty-operator/approved-preview.json
          if-no-files-found: error
          retention-days: 1

  protected_mutation:
    name: Single-ref bounded approved write
    needs: preflight
    # Hard fail-closed rollout flag, independent of the GitHub environment.
    # An administrator must deliberately enable it only AFTER proving required reviewers.
    # Work W hard block; owner GO and new approval require separate authorized change.
    if: >-
      false &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode != 'INSPECT' &&
      vars.CASUALTY_OPERATOR_APPROVAL_VERIFIED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: casualty-review-approval
    permissions:
      contents: write
    env:
      QUEUE_GIT_PATH: kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json
      REVISIONS_GIT_PATH: kyiv-air-alerts-grafana/data/casualties/revisions.csv
      REVIEWER_GIT_PATH: kyiv-air-alerts-grafana/scripts/review_casualty_candidates.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: casualty-review-immutable-preview
          path: ${{ runner.temp }}/casualty-operator
      - name: Re-read refs and blobs immediately before guarded mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/multicity-wip-2026-09-16:refs/remotes/origin/multicity-wip-2026-09-16 \
            +refs/heads/site-prod:refs/remotes/origin/site-prod
          wip=$(git rev-parse refs/remotes/origin/multicity-wip-2026-09-16)
          prod=$(git rev-parse refs/remotes/origin/site-prod)
          queue=$(git rev-parse "$wip:$QUEUE_GIT_PATH")
          revisions=$(git rev-parse "$prod:$REVISIONS_GIT_PATH")
          pinned=$(git rev-parse "$prod:$REVIEWER_GIT_PATH")
          test "$pinned" = "57c67af1ce108222c9a8dc0fefe34d67f9d0e23e"
          git show "$wip:$QUEUE_GIT_PATH" > "$RUNNER_TEMP/casualty-operator/queue.json"
          git show "$prod:$REVISIONS_GIT_PATH" > "$RUNNER_TEMP/casualty-operator/revisions.csv"
          # Exact production generator is read-only and SHA-pinned; no main fallback.
          gen_blob=$(git rev-parse "$prod:kyiv-air-alerts-grafana/scripts/update_casualties.py")
          test "$gen_blob" = "f5840c201c850b5312db611896b491a69f10e6ec"
          git show "$prod:kyiv-air-alerts-grafana/scripts/update_casualties.py" > "$RUNNER_TEMP/casualty-operator/pinned_generator.py"
          echo "GENERATOR_PATH=$RUNNER_TEMP/casualty-operator/pinned_generator.py" >> "$GITHUB_ENV"
          echo "WIP_HEAD=$wip" >> "$GITHUB_ENV"
          echo "PROD_HEAD=$prod" >> "$GITHUB_ENV"
          echo "QUEUE_BLOB=$queue" >> "$GITHUB_ENV"
          echo "REVISIONS_BLOB=$revisions" >> "$GITHUB_ENV"
      - name: Verify approved snapshot and mutate only a scratch copy
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/casualty_review_operator.py apply \
            --queue "$RUNNER_TEMP/casualty-operator/queue.json" \
            --revisions "$RUNNER_TEMP/casualty-operator/revisions.csv" \
            --generator "$GENERATOR_PATH" \
            --snapshot "$RUNNER_TEMP/casualty-operator/approved-preview.json" \
            --wip-head "$WIP_HEAD" --site-prod-head "$PROD_HEAD" \
            --queue-blob-sha "$QUEUE_BLOB" --revisions-blob-sha "$REVISIONS_BLOB"
      - name: Commit exactly one authorized file; fast-forward push only
        shell: bash
        run: |
          set -euo pipefail
          mode=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["mode"])' \
            "$RUNNER_TEMP/casualty-operator/approved-preview.json")
          if [ "$mode" = "REVIEW" ]; then
            target_head="$WIP_HEAD"
            target_branch="multicity-wip-2026-09-16"
            target_path="$QUEUE_GIT_PATH"
            source_path="$RUNNER_TEMP/casualty-operator/queue.json"
          elif [ "$mode" = "PROMOTE" ]; then
            target_head="$PROD_HEAD"
            target_branch="site-prod"
            target_path="$REVISIONS_GIT_PATH"
            source_path="$RUNNER_TEMP/casualty-operator/revisions.csv"
          else
            echo "Refusing unexpected mode"
            exit 1
          fi
          git checkout --detach "$target_head"
          cp "$source_path" "$target_path"
          git add -- "$target_path"
          if git diff --cached --quiet; then
            echo "Exact idempotency: nothing to commit"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$target_path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Human casualty $mode: approved run $GITHUB_RUN_ID"
          # Never force, rebase, merge, amend, or retry by updating to a newer head.
          git push origin "HEAD:refs/heads/$target_branch"

  offline_contract:
    name: Work Y current-snapshot offline reviewer-operator-generator contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration-casualty-worky-code-off-2026-11-14'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 397125796252e17f1f7c856ebafdc0956678765e
          path: _site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6315c2db1d0b5171fe78fe758d867c6cc3d604d9
          path: _wip
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43290975899
          name: casualty-e2e-shadow-proof
          path: /tmp/casualty-pr105-proven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Verify snapshot SHAs and production-write safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 413d34acd3bf664aebb821ffe3c0b022906299e0)" = 413d34acd3bf664aebb821ffe3c0b022906299e0
          test "$(git -C _site rev-parse HEAD)" = 397125796252e17f1f7c856ebafdc0956678765e
          test "$(git -C _wip rev-parse HEAD)" = 6315c2db1d0b5171fe78fe758d867c6cc3d604d9
          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/scripts/review_casualty_candidates.py)" = fc2b7c3e5c1b54117f7a497edbf67c2244800ff2
          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/scripts/casualty_review_operator.py)" = 83c73ae38ec2fec044085c3b156f5ba45521a594
          test "$(git -C _site rev-parse HEAD:kyiv-air-alerts-grafana/scripts/update_casualties.py)" = f5840c201c850b5312db611896b491a69f10e6ec
          test "$(git -C _site rev-parse HEAD:kyiv-air-alerts-grafana/data/casualties/revisions.csv)" = 8d7a2e2540bf4bf0f8c6227023821390bf82ce13
          test "$(git -C _site rev-parse HEAD:kyiv-air-alerts-grafana/data/dashboard_data.json)" = 87e557c7579ef3166ddcb398c55f7f3ded7bef5a
          test "$(git -C _wip rev-parse HEAD:kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json)" = 63d4930b844f3dae13fd0c1a7f3754ff8e9a06bc
          python - <<'PY'
          from pathlib import Path
          import importlib.util, tempfile
          wf=Path(".github/workflows/casualty-review-operator.yml").read_text()
          old=Path(".github/workflows/update.yml").read_text()
          assert "      false &&" in wf
          assert "vars.CASUALTY_OPERATOR_APPROVAL_VERIFIED == 'true'" in wf
          assert wf.count('test "$gen_blob" = "f5840c201c850b5312db611896b491a69f10e6ec"') == 3
          assert wf.count('--generator "$GENERATOR_PATH"') == 3
          assert "if: $" + "{{ false }}" in old
          assert 'if: github.event_name == ' + "'workflow_dispatch'" + ' && github.ref == ' + "'refs/heads/main'" in wf
          legacy=Path("kyiv-air-alerts-grafana/scripts/update_casualties.py")
          spec=importlib.util.spec_from_file_location("workw_legacy_guard",legacy)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory(prefix="workw-legacy-deny-") as td:
              p=Path(td)/"revisions.csv"
              p.write_text("record_id,city_key,observed_at,attack_date,deaths_delta,status,incident_id,count_kind,baseline_credited,identity_proof,credited_proof\n",encoding="utf-8")
              mod.REVISIONS_FILE=p
              try: mod.load_revisions()
              except RuntimeError as exc: assert "LEGACY_CASUALTY_GENERATOR_BLOCKED" in str(exc)
              else: raise AssertionError("Legacy generator incorrectly allowed incident-aware schema")
          print("WORKY_PIN_WIRED_AND_MUTATION_HARD_OFF=PASS; LEGACY_FAIL_CLOSED=PASS")
          PY
      - name: Current immutable WIP queue and production ledger INSPECT only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          import json, sys, hashlib
          sys.path.insert(0,str(Path("kyiv-air-alerts-grafana/scripts").resolve()))
          import casualty_review_operator as op
          from review_casualty_candidates import validate_against_production_generator
          queue = Path("_wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json")
          revisions = Path("_site/kyiv-air-alerts-grafana/data/casualties/revisions.csv")
          generator = Path("_site/kyiv-air-alerts-grafana/scripts/update_casualties.py")
          state = {"wip_head":"6315c2db1d0b5171fe78fe758d867c6cc3d604d9",
                   "site_prod_head":"397125796252e17f1f7c856ebafdc0956678765e",
                   "queue_blob_sha":"63d4930b844f3dae13fd0c1a7f3754ff8e9a06bc",
                   "revisions_blob_sha":"8d7a2e2540bf4bf0f8c6227023821390bf82ce13"}
          before = {str(p):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in (queue,revisions,generator)}
          preview = op.build_preview(
              mode="INSPECT", candidate_id="", decision="", payload={},
              queue_path=queue, revisions_path=revisions, state=state,
              generator_path=generator)
          rows=op.load_queue(queue)
          effective=validate_against_production_generator(revisions,generator)
          assert len(rows)==1703 and preview["pending_count"]==1702
          assert sum(x.get("status")=="confirmed" for x in rows)==1
          assert len(effective)==1 and effective[0]["city_key"]=="sumy"
          assert effective[0]["deaths_delta"]==1
          assert all(hashlib.sha256(p.read_bytes()).hexdigest()==before[str(p)]
                     for p in (queue,revisions,generator))
          proof={"status":"PASS","kind":"READ_ONLY_ACTUAL_SNAPSHOTS",
                 **state,"queue_count":len(rows),"needs_review":preview["pending_count"],
                 "confirmed_queue_records":1,"existing_sumy_credit":1,
                 "real_promote":False,"production_mutations":0,
                 "file_sha256_unchanged":before}
          out=Path("/tmp/casualty-worky")
          out.mkdir(parents=True,exist_ok=True)
          (out/"snapshot_inspect.json").write_text(
              json.dumps(proof,indent=2,sort_keys=True)+"\n")
          print("WORKY_CURRENT_SNAPSHOTS_INSPECT=PASS; QUEUE=1703; NEEDS_REVIEW=1702; SUMY=1; WRITES=0")
          PY
      - name: Physical REVIEW, staged PROMOTE, cumulative dedup, actual production CLI
        shell: bash
        run: |
          set -euo pipefail
          proposal=$(find /tmp/casualty-pr105-proven -type f -path '*/casualty-first/proposals.json' -print -quit)
          if [ -z "$proposal" ]; then
            proposal=$(find /tmp/casualty-pr105-proven -type f -name proposals.json -print -quit)
          fi
          test -s "$proposal"
          mkdir -p /tmp/casualty-worky
          python research/casualty_workw_integration_2026_11_14/workv_contract_e2e.py \
            --site _site --proposal "$proposal" --output /tmp/casualty-worky
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          out=pathlib.Path('/tmp/casualty-worky')
          data=json.loads((out/'result.json').read_text())
          assert data['status']=='PASS' and data['latest_total']==23
          assert data['replay_increment']==0 and data['other_22_cities_unchanged']
          assert data['production_mutations']==0 and data['external_http_requests']==0
          assert all(x['result']=='BLOCKED' for x in data['blocked'].values())
          assert data['legacy_sumy_unchanged'] and data['generator_invoked']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert json.loads((out/'sha256_manifest.json').read_text())['result.json']==sha(out/'result.json')
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          proof={
            'status':'PASS','scope':'OFFLINE_SIMULATION_ONLY',
            'integration_head':git('rev-parse','HEAD'),
            'base_main_head':git('merge-base','HEAD','413d34acd3bf664aebb821ffe3c0b022906299e0'),
            'site_prod_head':git('-C','_site','rev-parse','HEAD'),
            'wip_head':git('-C','_wip','rev-parse','HEAD'),
            'production_generator_blob':git('-C','_site','rev-parse','HEAD:kyiv-air-alerts-grafana/scripts/update_casualties.py'),
            'wip_queue_blob':git('-C','_wip','rev-parse','HEAD:kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json'),
            'site_revisions_blob':git('-C','_site','rev-parse','HEAD:kyiv-air-alerts-grafana/data/casualties/revisions.csv'),
            'operator_blob':git('rev-parse','HEAD:kyiv-air-alerts-grafana/scripts/casualty_review_operator.py'),
            'reviewer_blob':git('rev-parse','HEAD:kyiv-air-alerts-grafana/scripts/review_casualty_candidates.py'),
            'effective_progression':data['effective_progression'],
            'replay_increment':0,'missing_proof_and_baseline':'BLOCKED',
            'T03_T05':'NEEDS_REVIEW_NO_REAL_CREDIT',
            'sumy_plus_1_preserved':True,'other_22_cities_unchanged':True,
            'update_yml_legacy_casualty_step':'DISABLED',
            'main_legacy_incident_schema':'FAIL_CLOSED',
            'protected_mutation':'HARD_DISABLED',
            'source_http_requests':0,'production_mutations':0,
            'current_snapshot_inspect_sha256':sha(out/'snapshot_inspect.json'),
            'workv_result_sha256':sha(out/'result.json')
          }
          (out/'integration_result.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          files=['result.json','integration_result.json','snapshot_inspect.json']
          (out/'sha256_manifest.json').write_text(json.dumps({p:sha(out/p) for p in files},indent=2,sort_keys=True)+'\n')
          assert all(sha(out/p)==v for p,v in json.loads((out/'sha256_manifest.json').read_text()).items())
          print('WORKY_PHYSICAL_OFFLINE_CODE_TRANSFER=PASS',sha(out/'integration_result.json'))
          PY
      - name: Upload offline proof and SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-worky-code-transfer-proof
          path: /tmp/casualty-worky/*.json
          if-no-files-found: error
          retention-days: 30
