name: C3 guarded Netlify KPI offline proof
on:
  push:
    branches: [research-c3-netlify-gated-kpi-2026-11-12]
    paths:
      - ".github/workflows/netlify-production.yml"
      - ".github/workflows/c3-gated-netlify-offline.yml"
      - "tests/test_c3_neon_netlify_binding.py"
      - "scripts/c3_final_neon_kpi_contract.py"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Pin actual PR95 final release binding (read-only)
        uses: actions/checkout@v4
        with:
          ref: 2064f38c86f28653bab0ee0255180ec740dfba31
          path: approved-pr95
          persist-credentials: false
      - name: Pin actual PR100 frontend consumer (read-only)
        uses: actions/checkout@v4
        with:
          ref: 19446ba9b9513ec962be08a128b4132de3f1912c
          path: approved-pr100
          persist-credentials: false
      - name: Verify immutable PR95/PR100 code identity
        run: |
          test "$(git -C approved-pr95 rev-parse HEAD)" = 2064f38c86f28653bab0ee0255180ec740dfba31
          test "$(git -C approved-pr100 rev-parse HEAD)" = 19446ba9b9513ec962be08a128b4132de3f1912c
          test "$(git hash-object approved-pr95/scripts/c6_neon_release_binding.py)" = f2aefc7280611e456dede640b641534662cbb5d0
          test "$(git hash-object approved-pr100/kyiv-air-alerts-grafana/pages-preview/app.js)" = bc869cb71b7ddb39489c989323b59fdb5b87d6b3
      - name: One end-to-end offline PR95 final binding to PR104 Netlify to PR100 consumer
        run: python -m unittest discover -s tests -p test_c3_neon_netlify_binding.py -v
      - name: Assert no Netlify credentials, deploy or Git writes in proof
        run: |
          test -z "${NETLIFY_AUTH_TOKEN:-}"
          git diff --exit-code
          echo "C3_OFFLINE_ONLY_NO_DEPLOY"
