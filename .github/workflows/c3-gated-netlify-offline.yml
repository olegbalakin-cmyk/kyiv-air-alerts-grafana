name: C3 guarded Netlify KPI offline proof
on:
  push:
    branches: [research-c3-netlify-gated-kpi-2026-11-12]
    paths:
      - ".github/workflows/netlify-production.yml"
      - ".github/workflows/c3-gated-netlify-offline.yml"
      - "tests/test_c3_neon_netlify_binding.py"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Offline exact static KPI artifact validation and negative cases
        run: python -m unittest discover -s tests -p test_c3_neon_netlify_binding.py -v
      - name: Assert no Netlify credentials, deploy or Git writes in proof
        run: |
          test -z "${NETLIFY_AUTH_TOKEN:-}"
          git diff --exit-code
          echo "C3_OFFLINE_ONLY_NO_DEPLOY"
