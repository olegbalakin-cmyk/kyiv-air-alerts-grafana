name: Monitor repair post-apply verification
on:
  push:
    branches: [monitor-near-duplicate-temporal-binding-repair-2026-09-30]
    paths:
      - ".github/workflows/monitor-repair-post-apply.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multicity-wip-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Verify authoritative HEAD and protected replay blob
        run: |
          test "$(git rev-parse HEAD)" = "8c5e18ec418a848a992f824d5094670af223559a"
          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/scripts/replay_explosion_history.py)" = "816e2a13f66bb453fc4bd765318d15443121325e"
          test "$(git rev-parse HEAD:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py)" = "927dc89df0b52edd52cb31a126b0d57ca492a278"
      - name: Fresh post-apply tests
        working-directory: kyiv-air-alerts-grafana
        run: |
          set -o pipefail
          python scripts/monitor_explosion_candidates.py --self-test | tee /tmp/monitor.txt
          python scripts/replay_explosion_history.py --self-test | tee /tmp/replay.txt
          pytest -q tests/test_historical_replay_*.py | tee /tmp/historical.txt
          pytest -q tests/test_monitor_near_duplicate_temporal_binding.py | tee /tmp/focused.txt
          pytest -q tests/test_*monitor*.py | tee /tmp/monitor_tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-repair-post-apply
          path: |
            /tmp/monitor.txt
            /tmp/replay.txt
            /tmp/historical.txt
            /tmp/focused.txt
            /tmp/monitor_tests.txt
