name: CASUALTY Work L controlled three-source one-shot (inert without fresh launch)
on:
  push:
    branches: [research-casualty-workr-identity-2026-11-14, research-casualty-workz-source-evidence-2026-11-14]
    paths:
      - research/casualty_one_time_capture_2026_11_13/launch.json
permissions:
  contents: read
  actions: read
concurrency:
  group: casualty-workl-unique-three-source
  cancel-in-progress: false
jobs:
  single-use:
    if: ${{ github.run_attempt == 1 && github.actor == 'olegbalakin-cmyk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          path: _pr102
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict pre-network owner grant, launch and exact commit checks
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = olegbalakin-cmyk
          test -f research/casualty_one_time_capture_2026_11_13/launch.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.casualty_one_time_capture_2026_11_13 import run_capture as r
          from review_casualty_candidates import load_queue
          q=load_queue(Path('_wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json'))
          plan,template=r.check_scope(q)
          launch=json.loads((r.HERE/'launch.json').read_text())
          r.validate_launch(launch,template,q)
          r.validate_one_launch_commit(launch,plan)
          print('WORKL_GRANT_AND_SINGLE_COMMIT_GATES_PASS')
          PY
      - name: Install pinned extraction dependencies (not source capture)
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Recheck all 68 offline safety tests with grant file restored before capture
        shell: bash
        run: bash research/casualty_workn_clean_rearm_2026_11_13/guarded_prehttp_regressions.sh
      - name: One approved source-only pilot; no publication
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workl-one-shot
          python research/casualty_one_time_capture_2026_11_13/run_capture.py \
            --launch research/casualty_one_time_capture_2026_11_13/launch.json \
            --queue _wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json \
            --output /tmp/workl-one-shot
      - name: Confirm immutable source checkout
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          git -C _wip diff --exit-code
          test "$(git -C _pr102 rev-parse HEAD)" = bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          test "$(git -C _site rev-parse HEAD)" = d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          git -C _pr102 diff --exit-code
          git -C _site diff --exit-code
      - name: Store research-only audit JSON; never article bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-workl-approved-three-source-research-only
          path: /tmp/workl-one-shot/*.json
          if-no-files-found: warn
          retention-days: 30
