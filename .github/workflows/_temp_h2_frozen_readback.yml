name: Temporary H2 Frozen Proof Independent Readback
on:
  push:
    branches: [neon-h2-field-authority-containment-proof-2026-10-12]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Independent frozen proof readback
        run: |
          python - <<'PY'
          import json,hashlib,os,collections
          path="research/neon_h2_19542_field_authority_containment_revalidation_2026-10-12.json"
          raw=open(path,"rb").read()
          j=json.loads(raw)
          print("FROZEN_BYTES",len(raw))
          print("FROZEN_SHA256",hashlib.sha256(raw).hexdigest())
          print("FROZEN_GIT_BLOB_SHA",__import__("subprocess").check_output(["git","hash-object",path],text=True).strip())
          print("MATRIX",json.dumps(j["authority_transition_matrix"],sort_keys=True))
          print("CITY_MATRIX",json.dumps(j["authority_transition_by_city"],sort_keys=True))
          print("PRIOR24_DECISIONS",json.dumps([{"city":x["city"],"bucket":x["bucket"],"row":x["original_row_index"],"observation":x["observation_id"],"previous":x["previous_authority"],"corrected":x["corrected_authority"],"reason":x["corrected_reason"],"clock_evidence":x["original_clock_evidence"]} for x in j["previous_24_reassessed"]],sort_keys=True,ensure_ascii=False))
          print("COUNTS",len(j["full_membership_regression"]),len(j["previous_24_reassessed"]))
          print("TRANSITIONS",json.dumps(collections.Counter((x["previous_authority"],x["corrected_authority"]) for x in j["full_membership_regression"]).__str__()))
          print("CHRONOLOGY_CROSSWALK",json.dumps({k:{"mode":v["episode_identity_crosswalk"],"count":v["crosswalk_count"]} for k,v in j["original_chronological_provenance"].items()},sort_keys=True))
          assert hashlib.sha256(raw).hexdigest()=="c3827de8c0574c0305e5da1efe619da678faaa2e8a201150ac8fe5fa7f57bd8c"
          assert len(j["full_membership_regression"])==1429
          PY
      - name: Delete temporary readback workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_h2_frozen_readback.yml
          git commit -m "research: remove temporary H2 proof readback"
          git push origin HEAD:neon-h2-field-authority-containment-proof-2026-10-12
