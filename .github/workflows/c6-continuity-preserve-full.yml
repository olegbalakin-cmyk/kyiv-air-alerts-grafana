name: Preserve complete C6 continuity evidence in research Git
on:
  push:
    branches: [research-neon-live-writer-freshness-2026-10-31]
    paths:
      - 'research/neon_23city_continuity_2026_10_31/preserve-request.txt'
permissions:
  contents: write
  actions: read
concurrency:
  group: c6-two-cycle-evidence-preservation
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'olegbalakin-cmyk/kyiv-air-alerts-grafana' && github.ref == 'refs/heads/research-neon-live-writer-freshness-2026-10-31' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-neon-live-writer-freshness-2026-10-31
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41208139352
          name: c6-two-cycle-continuity-41208139352-1
          path: full-evidence
      - name: Verify every evidence byte and build a deterministic complete archive
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          src=Path('full-evidence'); raw=(src/'sha256_manifest.json').read_bytes(); manifest=json.loads(raw)
          assert manifest['schema']=='c6-two-cycle-continuity-v1'
          for name,want in manifest['files'].items():
              p=(src/name).resolve()
              assert p.is_relative_to(src.resolve()) and p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==want,name
          verdict=json.loads((src/'machine_verdict.json').read_text())
          assert verdict['github_run_id']=='41208139352'
          assert verdict['http_gets_attempted']<=60 and verdict['elapsed_seconds']<=70*60
          assert verdict['production_mutations']==0 and not verdict['publication_allowed']
          target=Path('research/neon_23city_continuity_2026_10_31/proof/41208139352');target.mkdir(parents=True,exist_ok=True)
          archive=target/'full_evidence.zip'
          paths=sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in paths:
                  item=zipfile.ZipInfo(str(p.relative_to(src)),date_time=(1980,1,1,0,0,0));item.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(item,p.read_bytes())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for name,want in manifest['files'].items():assert hashlib.sha256(z.read(name)).hexdigest()==want,name
          index={'source_run_id':41208139352,'file_count':len(paths),'verified_manifest_members':len(manifest['files']),
                 'manifest_sha256':hashlib.sha256(raw).hexdigest(),'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                 'archive_bytes':archive.stat().st_size,'source_gets':verdict['source_gets'],'documentation_gets':verdict['documentation_gets'],
                 'http_gets_attempted':verdict['http_gets_attempted'],'scope':'Complete original evidence, raw HTTP entities, SQL receipts, both research candidates; no new HTTP source request or DB write'}
          (target/'full_evidence_index.json').write_text(json.dumps(index,sort_keys=True,indent=2)+'\n')
          print(json.dumps(index,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/neon_23city_continuity_2026_10_31/proof/41208139352/full_evidence.zip research/neon_23city_continuity_2026_10_31/proof/41208139352/full_evidence_index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(C6): retain complete immutable continuity evidence archive [skip netlify]"
          git push origin HEAD:research-neon-live-writer-freshness-2026-10-31
