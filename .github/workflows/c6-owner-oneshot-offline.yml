name: C6 owner-approved one-shot trigger offline validation

on:
  push:
    branches: [c6-oneshot-owner-approved-2026-11-15]
    paths:
      - ".github/workflows/update-netlify-site.yml"
      - "tests/test_c6_owner_oneshot_dispatch_contract.py"
      - ".github/workflows/c6-owner-oneshot-offline.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-netlify-site.yml"
      - "tests/test_c6_owner_oneshot_dispatch_contract.py"
      - ".github/workflows/c6-owner-oneshot-offline.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out accepted exact prior workflow for reverse-diff verification
        uses: actions/checkout@v4
        with:
          ref: 76c9e4537d2461a699653d47ce8991fa3111be09
          path: accepted-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One-shot recovery gate and no-Netlify exact static diff regression
        run: python -m unittest discover -s tests -p test_c6_owner_oneshot_dispatch_contract.py -v
      - name: Existing auto Git publisher tests (offline)
        run: python -m unittest discover -s tests -p test_c6_neon_auto_git.py -v
