          def sh(args, cwd=REPO, env=None, check=True, capture=True):
              p = subprocess.run(
                  [str(x) for x in args],
                  cwd=str(cwd),
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.PIPE if capture else None,
              )
              if check and p.returncode != 0:
                  raise RuntimeError(
                      f"command failed rc={p.returncode}: {' '.join(map(str,args))}\n"
                      f"stdout={p.stdout}\nstderr={p.stderr}"
                  )
              return p

          def git(*args, cwd=REPO):
              return sh(["git", *args], cwd=cwd).stdout.strip()

          def ensure_commit(sha, fallback_branch=None):
              if sh(["git","cat-file","-e",f"{sha}^{{commit}}"], check=False).returncode != 0:
                  p = sh(["git","fetch","--no-tags","origin",sha], check=False)
                  if p.returncode != 0 and fallback_branch:
                      sh([
                          "git","fetch","--no-tags","origin",
                          f"refs/heads/{fallback_branch}:refs/remotes/origin/{fallback_branch}"
                      ])
              resolved = git("rev-parse",f"{sha}^{{commit}}")
              if resolved != sha:
                  raise RuntimeError(f"commit resolution mismatch {sha} -> {resolved}")

          def blob_at(ref, path):
              return git("rev-parse",f"{ref}:{path}")

          def bytes_at(ref, path):
              p=sh(["git","show",f"{ref}:{path}"])
              return p.stdout.encode("utf-8")

          def json_at(ref, path):
              return json.loads(sh(["git","show",f"{ref}:{path}"]).stdout)

          def file_sha256(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          def verify_sha_map(wt, mapping, label):
              checked=0
              if not isinstance(mapping, dict):
                  return checked
              for rel, expected in mapping.items():
                  if not isinstance(rel,str) or not isinstance(expected,str) or len(expected)!=64:
                      continue
                  p=wt/rel
                  if not p.is_file():
                      raise RuntimeError(f"{label}: guarded file missing: {rel}")
                  actual=file_sha256(p)
                  if actual!=expected:
                      raise RuntimeError(f"{label}: sha256 mismatch {rel}: {actual}!={expected}")
                  checked+=1
              return checked

          def verify_recorded_guards(worker, proof, wt):
              checked=0
              mg=proof.get("mutation_guards") or {}
              checked+=verify_sha_map(wt,mg.get("guarded_input_sha256_before"),"guarded_input_sha256_before")
              checked+=verify_sha_map(wt,mg.get("assigned_evidence_sha256_before"),"assigned_evidence_sha256_before")

              classifier_path="kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
              replay_path="kyiv-air-alerts-grafana/scripts/replay_explosion_history.py"
              diagnostic=proof.get("diagnostic_hashes") or {}
              hashes=proof.get("hashes") or {}
              for obj,key,path in [
                  (diagnostic,"classifier_git_blob",classifier_path),
                  (diagnostic,"replay_helper_git_blob",replay_path),
                  (hashes,"classifier_blob",classifier_path),
                  (hashes,"replay_blob",replay_path),
              ]:
                  expected=obj.get(key) if isinstance(obj,dict) else None
                  if isinstance(expected,str) and len(expected)==40:
                      actual=blob_at(worker["tested_head"],path)
                      if actual!=expected:
                          raise RuntimeError(f"{worker['id']} {key} blob mismatch {actual}!={expected}")
                      checked+=1

              ci=proof.get("classifier_implementation_sha256")
              if isinstance(ci,str) and len(ci)==64:
                  actual=file_sha256(wt/classifier_path)
                  if actual!=ci:
                      raise RuntimeError(f"{worker['id']} classifier implementation sha mismatch")
                  checked+=1

              cities=proof.get("cities") or {}
              for city, row in cities.items():
                  if not isinstance(row,dict):
                      continue
                  ih=row.get("input_hashes")
                  if isinstance(ih,dict):
                      for rel,spec in ih.items():
                          if not isinstance(rel,str) or "/" not in rel or not isinstance(spec,dict):
                              continue
                          p=wt/rel
                          if not p.is_file():
                              raise RuntimeError(f"{worker['id']} input missing {rel}")
                          exp_sha=spec.get("sha256")
                          exp_blob=spec.get("git_blob_sha")
                          if isinstance(exp_sha,str) and len(exp_sha)==64:
                              actual=file_sha256(p)
                              if actual!=exp_sha:
                                  raise RuntimeError(f"{worker['id']} input sha mismatch {rel}")
                              checked+=1
                          if isinstance(exp_blob,str) and len(exp_blob)==40:
                              actual=blob_at(worker["tested_head"],rel)
                              if actual!=exp_blob:
                                  raise RuntimeError(f"{worker['id']} input blob mismatch {rel}")
                              checked+=1
                  ig=row.get("input_guards")
                  if isinstance(ig,dict):
                      rel=ig.get("evidence_path")
                      exp_blob=ig.get("evidence_tested_blob")
                      exp_sha=ig.get("evidence_runtime_sha_before")
                      if isinstance(rel,str):
                          p=wt/rel
                          if not p.is_file():
                              raise RuntimeError(f"{worker['id']} evidence missing {rel}")
                          if isinstance(exp_blob,str) and len(exp_blob)==40:
                              actual=blob_at(worker["tested_head"],rel)
                              if actual!=exp_blob:
                                  raise RuntimeError(f"{worker['id']} evidence blob mismatch {rel}")
                              checked+=1
                          if isinstance(exp_sha,str) and len(exp_sha)==64:
                              actual=file_sha256(p)
                              if actual!=exp_sha:
                                  raise RuntimeError(f"{worker['id']} evidence sha mismatch {rel}")
                              checked+=1
              return checked

          OBSERVER = r'''
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import traceback

          cfg=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          out=Path(sys.argv[2])
          os.chdir(cfg["cwd"])
          sys.path.insert(0,str(Path(cfg["script"]).parent))
          sys.path.insert(0,str(Path(cfg["worktree"])/"kyiv-air-alerts-grafana"/"scripts"))
          sys.path.insert(0,str(Path(cfg["worktree"])))
          sys.argv=[cfg["script"],*cfg["argv"]]

          spec=importlib.util.spec_from_file_location("accepted_worker_module",cfg["script"])
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          captures=[]

          def normalize(obj):
              if not isinstance(obj,list) or not obj:
                  return None
              rows=[]
              for r in obj:
                  if isinstance(r,dict) and "episode_id" in r and "state" in r:
                      rows.append({"episode_id":str(r["episode_id"]),"state":str(r["state"])})
                  elif isinstance(r,(tuple,list)) and len(r)>=2:
                      rows.append({"episode_id":str(r[0]),"state":str(r[1])})
                  else:
                      return None
              return rows

          def maybe_capture(obj,digest,kind,sort_rows=False):
              rows=normalize(obj)
              if rows is None:
                  return
              if sort_rows:
                  rows=sorted(rows,key=lambda r:r["episode_id"])
              captures.append({"kind":kind,"native_hash":str(digest),"target_rows":rows})

          if hasattr(mod,"target_state_sha"):
              orig=mod.target_state_sha
              def wrapped(rows,*a,**kw):
                  result=orig(rows,*a,**kw)
                  maybe_capture(rows,result,"target_state_sha",True)
                  return result
              mod.target_state_sha=wrapped
              hook="target_state_sha"
          elif hasattr(mod,"canonical_state_sha"):
              orig=mod.canonical_state_sha
              def wrapped(city,rows,*a,**kw):
                  result=orig(city,rows,*a,**kw)
                  maybe_capture(rows,result,"canonical_state_sha")
                  return result
              mod.canonical_state_sha=wrapped
              hook="canonical_state_sha"
          elif hasattr(mod,"canonical_json_sha"):
              orig=mod.canonical_json_sha
              def wrapped(value,*a,**kw):
                  result=orig(value,*a,**kw)
                  maybe_capture(value,result,"canonical_json_sha")
                  return result
              mod.canonical_json_sha=wrapped
              hook="canonical_json_sha"
          elif hasattr(mod,"json_sha"):
              orig=mod.json_sha
              def wrapped(value,*a,**kw):
                  result=orig(value,*a,**kw)
                  maybe_capture(value,result,"json_sha")
                  return result
              mod.json_sha=wrapped
              hook="json_sha"
          elif hasattr(mod,"sha256_bytes"):
              orig=mod.sha256_bytes
              def wrapped(data,*a,**kw):
                  result=orig(data,*a,**kw)
                  try:
                      value=json.loads(bytes(data).decode("utf-8"))
                  except Exception:
                      value=None
                  maybe_capture(value,result,"sha256_bytes")
                  return result
              mod.sha256_bytes=wrapped
              hook="sha256_bytes"
          else:
              orig=mod.hashlib.sha256
              def wrapped(data=b"",*a,**kw):
                  h=orig(data,*a,**kw)
                  try:
                      value=json.loads(bytes(data).decode("utf-8"))
                  except Exception:
                      value=None
                  rows=normalize(value)
                  if rows is not None:
                      captures.append({"kind":"hashlib.sha256","native_hash":h.copy().hexdigest(),"target_rows":rows})
                  return h
              mod.hashlib.sha256=wrapped
              hook="hashlib.sha256"

          rc=None
          error=None
          try:
              rc=mod.main()
              if rc not in (None,0):
                  raise RuntimeError(f"formalizer returned nonzero {rc}")
          except SystemExit as exc:
              code=exc.code
              if code not in (None,0):
                  error=f"SystemExit:{code}"
          except Exception:
              error=traceback.format_exc()

          payload={"hook":hook,"return_code":rc,"error":error,"captures":captures}
          out.write_text(json.dumps(payload,ensure_ascii=False,sort_keys=True),encoding="utf-8")
          if error:
              print(error,file=sys.stderr)
              raise SystemExit(1)
          '''

          def install_worker_env(worker, wt):
              venv=TMP/f"venv-{RUN_LABEL}-{worker['id']}"
              sh([sys.executable,"-m","venv",str(venv)],capture=False)
              py=venv/"bin"/"python"
              pip=venv/"bin"/"pip"
              if worker["install"]=="requirements":
                  req=wt/"kyiv-air-alerts-grafana"/"requirements.txt"
                  cwd=wt/"kyiv-air-alerts-grafana" if worker["id"] in {"CD","KM"} else wt
                  if worker["id"]=="OD":
                      sh([py,"-m","pip","install","-r",str(req)],cwd=cwd,capture=False)
                  else:
                      sh([pip,"install","-r",str(req)],cwd=cwd,capture=False)
              else:
                  sh([py,"-m","pip","install","--disable-pip-version-check","requests","beautifulsoup4"],cwd=wt,capture=False)
              return py

          def run_observer(worker, wt, py):
              observer=TMP/f"observer-{RUN_LABEL}-{worker['id']}.py"
              observer.write_text(OBSERVER,encoding="utf-8")
              cfg={
                  "script":str(wt/worker["script_path"]),
                  "worktree":str(wt),
                  "cwd":str(wt/"kyiv-air-alerts-grafana") if worker["cwd"]=="inner" else str(wt),
                  "argv":[x.format(tested_head=worker["tested_head"]) for x in worker["argv"]],
              }
              cfg_path=TMP/f"observer-{RUN_LABEL}-{worker['id']}.json"
              result_path=TMP/f"observer-result-{RUN_LABEL}-{worker['id']}.json"
              cfg_path.write_text(json.dumps(cfg),encoding="utf-8")
              env=os.environ.copy()
              env["GITHUB_SHA"]=worker["tested_head"]
              env["GITHUB_REF_NAME"]=worker["branch"]
              env["PYTHONDONTWRITEBYTECODE"]="1"
              if worker.get("proxy"):
                  env.update({
                      "HTTP_PROXY":"http://127.0.0.1:9",
                      "HTTPS_PROXY":"http://127.0.0.1:9",
                      "ALL_PROXY":"http://127.0.0.1:9",
                      "NO_PROXY":"*",
                  })
              p=sh([py,str(observer),str(cfg_path),str(result_path)],cwd=wt,env=env,check=False,capture=False)
              if not result_path.is_file():
                  raise RuntimeError(f"{worker['id']}: observer result missing")
              result=json.loads(result_path.read_text(encoding="utf-8"))
              if p.returncode!=0 or result.get("error"):
                  raise RuntimeError(f"{worker['id']}: formalizer failed: {result.get('error')}")
              return result

          def accepted_hash_from_proof(proof, city):
              cities=proof.get("cities")
              if isinstance(cities,dict) and isinstance(cities.get(city),dict):
                  h=cities[city].get("target_state_sha256")
                  if h:
                      return h
              if city=="odesa":
                  return proof.get("target_state_sha256")
              return None

          diag={
              "run_label":RUN_LABEL,
              "fresh_main":FRESH_MAIN,
              "acceptance_commit":ACCEPTANCE_COMMIT,
              "common_base":COMMON_BASE,
              "workers":[],
              "status":"running",
          }

          try:
              sh(["git","merge-base","--is-ancestor",FRESH_MAIN,"HEAD"])
              changed=git("diff","--name-only",f"{FRESH_MAIN}..HEAD").splitlines()
              if changed!=[".github/workflows/attack-event-18city-target-map-recovery-proof.yml"]:
                  raise RuntimeError(f"TEMP_BRANCH_PRE_REPLAY_DIFF_UNEXPECTED:{changed}")
              if blob_at(FRESH_MAIN,".github/workflows/update-netlify-site.yml")!=PROD_WORKFLOW_BLOB:
                  raise RuntimeError("PRODUCTION_WORKFLOW_BLOB_DRIFT")

              ensure_commit(ACCEPTANCE_COMMIT)
              ensure_commit(COMMON_BASE)
              if blob_at(ACCEPTANCE_COMMIT,ACCEPTANCE_PATH)!=ACCEPTANCE_BLOB:
                  raise RuntimeError("ACCEPTANCE_ARTIFACT_BLOB_MISMATCH")
              acceptance=json_at(ACCEPTANCE_COMMIT,ACCEPTANCE_PATH)
              if acceptance.get("common_baseline",{}).get("final_head")!=COMMON_BASE:
                  raise RuntimeError("ACCEPTANCE_COMMON_BASE_MISMATCH")

              city_results=[]
              for worker in WORKERS:
                  ensure_commit(worker["final_head"],worker["branch"])
                  ensure_commit(worker["tested_head"],worker["branch"])
                  if blob_at(worker["final_head"],worker["proof_path"])!=worker["proof_blob"]:
                      raise RuntimeError(f"{worker['id']}: ACCEPTED_PROOF_ARTIFACT_BLOB_MISMATCH")
                  proof=json_at(worker["final_head"],worker["proof_path"])
                  if proof.get("tested_head")!=worker["tested_head"]:
                      raise RuntimeError(f"{worker['id']}: TESTED_HEAD_MISMATCH")
                  if blob_at(worker["tested_head"],worker["workflow_path"])!=worker["workflow_blob"]:
                      raise RuntimeError(f"{worker['id']}: ACCEPTED_WORKFLOW_BLOB_MISMATCH")
                  if blob_at(worker["tested_head"],worker["script_path"])!=worker["script_blob"]:
                      raise RuntimeError(f"{worker['id']}: ACCEPTED_FORMALIZER_BLOB_MISMATCH")
                  sh(["git","merge-base","--is-ancestor",COMMON_BASE,worker["tested_head"]])

                  for city,expected_count,accepted_hash in worker["cities"]:
                      from_proof=accepted_hash_from_proof(proof,city)
                      if from_proof!=accepted_hash:
                          raise RuntimeError(f"{worker['id']}/{city}: ACCEPTED_TARGET_HASH_LINEAGE_MISMATCH")

                  wt=TMP/f"worktree-{RUN_LABEL}-{worker['id']}"
                  if wt.exists():
                      shutil.rmtree(wt)
                  sh(["git","worktree","add","--detach",str(wt),worker["tested_head"]],capture=False)
                  if git("rev-parse","HEAD",cwd=wt)!=worker["tested_head"]:
                      raise RuntimeError(f"{worker['id']}: GENUINE_CHECKOUT_HEAD_MISMATCH")
                  if git("status","--porcelain","--untracked-files=all",cwd=wt):
                      raise RuntimeError(f"{worker['id']}: DIRTY_GENUINE_CHECKOUT")

                  guard_count=verify_recorded_guards(worker,proof,wt)
                  py=install_worker_env(worker,wt)
                  result=run_observer(worker,wt,py)
                  captures=result.get("captures") or []
                  selected=[]
                  for city,expected_count,accepted_hash in worker["cities"]:
                      matches=[
                          cap for cap in captures
                          if cap.get("native_hash")==accepted_hash
                          and len(cap.get("target_rows") or [])==expected_count
                      ]
                      if len(matches)!=1:
                          raise RuntimeError(
                              f"{worker['id']}/{city}: PASSIVE_TARGET_CAPTURE_MATCH_COUNT "
                              f"{len(matches)}!=1; total_captures={len(captures)}; hook={result.get('hook')}"
                          )
                      selected.append(matches[0])
                  captures=selected

                  worker_diag={
                      "worker":worker["id"],
                      "tested_head":worker["tested_head"],
                      "genuine_checkout":True,
                      "frozen_guards_verified":guard_count,
                      "formalizer_executed":True,
                      "observer_hook":result.get("hook"),
                      "cities":[],
                  }

                  for idx,(city,expected_count,accepted_hash) in enumerate(worker["cities"]):
                      cap=captures[idx]
                      native_hash=cap["native_hash"]
                      rows=cap["target_rows"]
                      if native_hash!=accepted_hash:
                          raise RuntimeError(
                              f"{worker['id']}/{city}: NATIVE_TARGET_HASH_MISMATCH "
                              f"{native_hash}!={accepted_hash}"
                          )
                      if len(rows)!=expected_count:
                          raise RuntimeError(
                              f"{worker['id']}/{city}: TARGET_ROW_COUNT_MISMATCH "
                              f"{len(rows)}!={expected_count}"
                          )
                      ids=[r["episode_id"] for r in rows]
                      if len(ids)!=len(set(ids)):
                          raise RuntimeError(f"{worker['id']}/{city}: DUPLICATE_EPISODE_IDS")
                      bad_states=sorted({r["state"] for r in rows}-{
                          "STRICT_EVENT_POSITIVE","SENSITIVITY_EVENT_POSITIVE",
                          "NO_CONFIRMED_EVENT","NEEDS_REVIEW"
                      })
                      if bad_states:
                          raise RuntimeError(f"{worker['id']}/{city}: BAD_STATES:{bad_states}")
                      city_results.append({
                          "city_key":city,
                          "methodology":METHODOLOGY,
                          "tested_head":worker["tested_head"],
                          "accepted_target_state_sha256":accepted_hash,
                          "native_recovered_target_state_sha256":native_hash,
                          "target_rows":rows,
                      })
                      worker_diag["cities"].append({
                          "city_key":city,
                          "accepted_hash":accepted_hash,
                          "native_hash":native_hash,
                          "target_rows":len(rows),
                      })
                  diag["workers"].append(worker_diag)

                  sh(["git","worktree","remove","--force",str(wt)],capture=False)
                  shutil.rmtree(TMP/f"venv-{RUN_LABEL}-{worker['id']}",ignore_errors=True)

              city_results.sort(key=lambda x:x["city_key"])
              if len(city_results)!=18:
                  raise RuntimeError(f"CITY_COUNT_MISMATCH:{len(city_results)}")
              all_rows=[]
              for c in city_results:
                  all_rows.extend((c["city_key"],r["episode_id"],r["state"]) for r in c["target_rows"])
              if len(all_rows)!=19542:
                  raise RuntimeError(f"TARGET_ROW_TOTAL_MISMATCH:{len(all_rows)}")
              identities=[(c,e) for c,e,s in all_rows]
              if len(set(identities))!=19542:
                  raise RuntimeError(f"UNIQUE_TARGET_IDENTITY_MISMATCH:{len(set(identities))}")
              from collections import Counter
              dist=Counter(s for c,e,s in all_rows)
              expected_dist={
                  "STRICT_EVENT_POSITIVE":913,
                  "SENSITIVITY_EVENT_POSITIVE":48,
                  "NO_CONFIRMED_EVENT":18113,
                  "NEEDS_REVIEW":468,
              }
              if dict(dist)!=expected_dist:
                  raise RuntimeError(f"DISTRIBUTION_MISMATCH:{dict(dist)}")
              positive=dist["STRICT_EVENT_POSITIVE"]+dist["SENSITIVITY_EVENT_POSITIVE"]
              if positive!=961:
                  raise RuntimeError(f"POSITIVE_COUNT_MISMATCH:{positive}")

              payload={"cities":city_results}
              raw=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")
              TARGET_OUT.write_bytes(raw)
              sha=hashlib.sha256(raw).hexdigest()
              summary={
                  "run":RUN_LABEL,
                  "canonical_sha256":sha,
                  "byte_count":len(raw),
                  "city_count":18,
                  "target_row_count":19542,
                  "unique_target_identities":19542,
                  "distribution":expected_dist,
                  "positive_count":961,
                  "accepted_hashes_reproduced":18,
                  "hash_mismatches":0,
                  "exact_frozen_semantic_replay":True,
                  "new_semantic_classification":False,
                  "semantic_change":False,
                  "public_web_research":False,
                  "historical_source_network_requests":0,
                  "neon_mutations":0,
                  "production_mutations":0,
                  "credentials_exposed":False,
              }
              diag["status"]="passed"
              diag["summary"]=summary
              print("RECOVERY_SUMMARY="+json.dumps(summary,sort_keys=True))
          except Exception as exc:
              diag["status"]="blocked"
              diag["error"]=str(exc)
              diag["traceback"]=traceback.format_exc()
              DIAG_OUT.write_text(json.dumps(diag,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
              print("RECOVERY_BLOCKED="+json.dumps({"run":RUN_LABEL,"error":str(exc)},ensure_ascii=False,sort_keys=True),file=sys.stderr)
              raise
          PY

      - name: Upload independent recovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-18city-target-map-run-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/attack-event-18city-recovery-${{ matrix.run }}/target_map.json
            ${{ runner.temp }}/attack-event-18city-recovery-${{ matrix.run }}/diagnostic.json
          if-no-files-found: error
          retention-days: 30
