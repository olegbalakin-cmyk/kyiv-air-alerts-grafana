name: Attack-event human review state derivation proof

on:
  push:
    branches:
      - attack-event-human-review-state-derivation-addendum-2026-10-05
    paths:
      - .github/workflows/attack-event-human-review-state-derivation-proof.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      FRESH_MAIN_BASE: dff243dd505d20f86b85e761de5c4eb0160b0166
      SNAPSHOT_COMMIT: efefa399e69eadd3d7fc8393ac1553cfde35f138
      SNAPSHOT_PATH: research/attack_event_23city_persistence_snapshot_v2_2026-10-04.json
      SNAPSHOT_SHA256: 09458bcf0a019fa2939eb9dfa484da46cd8fa2be077343c5ba6d595c93d71788
      STEP1_COMMIT: b205d38dbc50bc502d10e682d4ae53491af542ea
      STEP1_PATH: research/attack_event_neon_persistence_contract_2026-10-02.json
      STEP1_SHA256: 02bfe8bb0420bcf1259b0c49a73ca76e8cc6488c1cd426be4dd8b28ad01b94c3
      IDENTITY_COMMIT: bd82a6c0a19aca4610a8af6df73a307a88c35bf6
      IDENTITY_PATH: research/attack_event_classification_identity_availability_addendum_2026-10-04.json
      IDENTITY_SHA256: a1ba446261625383650b781233fc4956290bffd1437756dca8d7883b24906017
      PROVENANCE_COMMIT: cafee4106d89f59d7f1020baef414ba4813ab29d
      PROVENANCE_PATH: research/attack_event_provenance_cardinality_addendum_2026-10-05.json
      PROVENANCE_SHA256: e7bb8eb181d152b9760a5d80dc46ce0e261146e7e14433b706989f30e7ffc068
      OUTPUT_PATH: research/attack_event_human_review_state_derivation_addendum_2026-10-05.json
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: attack-event-human-review-state-derivation-addendum-2026-10-05
          fetch-depth: 0

      - name: Fetch all repository refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Scan frozen corpus and materialize addendum on PASS
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          EXPECTED_ROWS = 26405
          ALLOWED_VERDICTS = (
              "STRICT_EVENT_POSITIVE",
              "SENSITIVITY_EVENT_POSITIVE",
              "NO_CONFIRMED_EVENT",
              "NEEDS_REVIEW",
          )
          ALLOWED_STATES = ("NONE", "NEEDS_REVIEW", "REVIEWED_EVIDENCE")
          EXPLICIT_STATE_KEYS = {
              "human_review_state",
              "human_review_status",
              "review_state",
              "review_status",
          }
          CURATED_MARKER_RE = re.compile(r"(review|repair|adjudicat|curat|frozen_case)", re.I)

          def sha256_bytes(b):
              return hashlib.sha256(b).hexdigest()

          def canonical_json_bytes(v):
              return json.dumps(
                  v,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          def git_show_bytes(commit, path):
              return subprocess.check_output(["git", "show", f"{commit}:{path}"])

          def verify_contract(commit_env, path_env, sha_env):
              b = git_show_bytes(os.environ[commit_env], os.environ[path_env])
              actual = sha256_bytes(b)
              expected = os.environ[sha_env]
              if actual != expected:
                  raise RuntimeError(f"{sha_env}_MISMATCH:{actual}")
              return json.loads(b.decode("utf-8")), actual

          def iter_key_hits(obj, path="$"):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = f"{path}.{k}"
                      yield p, k, v
                      yield from iter_key_hits(v, p)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      yield from iter_key_hits(v, f"{path}[{i}]")

          def shape_of(v):
              if v is None:
                  return "null"
              if isinstance(v, bool):
                  return "boolean"
              if isinstance(v, str):
                  return "string"
              if isinstance(v, (int, float)):
                  return "number"
              if isinstance(v, list):
                  return "array"
              if isinstance(v, dict):
                  return "object"
              return type(v).__name__

          def derive(verdict, rp_present):
              if rp_present:
                  return "REVIEWED_EVIDENCE"
              if verdict == "NEEDS_REVIEW":
                  return "NEEDS_REVIEW"
              return "NONE"

          status = "PASS"
          first_gate = None
          affected_count = 0
          affected_source_shape = None
          contradiction_kind = None

          try:
              step1, step1_sha = verify_contract("STEP1_COMMIT", "STEP1_PATH", "STEP1_SHA256")
              identity, identity_sha = verify_contract("IDENTITY_COMMIT", "IDENTITY_PATH", "IDENTITY_SHA256")
              provenance, provenance_sha = verify_contract("PROVENANCE_COMMIT", "PROVENANCE_PATH", "PROVENANCE_SHA256")
          except Exception as e:
              status = "BLOCKED"
              first_gate = "FROZEN_CONTRACT_IDENTITY_MISMATCH"
              affected_count = 1
              affected_source_shape = str(e)
              contradiction_kind = "review-provenance/hash consistency"

          semantic_checks = {}
          if status == "PASS":
              review_rule = step1.get("classification_identity", {}).get("review_provenance_rule")
              human_sem = step1.get("semantic_definitions", {}).get("HUMAN_REVIEW_OVERRIDE")
              ddl = step1.get("candidate_ddl", "")
              semantic_checks = {
                  "step1_review_provenance_rule": review_rule,
                  "step1_human_review_override": human_sem,
                  "step1_allowed_state_constraint_present": "human_review_state IN ('NONE', 'NEEDS_REVIEW', 'REVIEWED_EVIDENCE')" in ddl,
                  "identity_v2_preserves_review_provenance_input": "<review_provenance_sha256_or_null>" in identity.get("classification_identity_v2", {}).get("canonical_input_tuple", []),
                  "provenance_addendum_review_hashing_changed": provenance.get("identity_invariants", {}).get("review_provenance_hashing_changed"),
              }
              if not (
                  isinstance(review_rule, str)
                  and "sort_keys=true" in review_rule
                  and "otherwise null" in review_rule
                  and isinstance(human_sem, str)
                  and "review_provenance" in human_sem
                  and semantic_checks["step1_allowed_state_constraint_present"]
                  and semantic_checks["identity_v2_preserves_review_provenance_input"]
                  and semantic_checks["provenance_addendum_review_hashing_changed"] is False
              ):
                  status = "BLOCKED"
                  first_gate = "FROZEN_PRODUCER_SEMANTICS_INCOMPATIBLE"
                  affected_count = 1
                  affected_source_shape = semantic_checks
                  contradiction_kind = "curated/repair semantics"

          snapshot_tmp = pathlib.Path(".tmp_attack_event_23city_snapshot.json")
          snapshot_actual_sha = None
          if status == "PASS":
              with snapshot_tmp.open("wb") as fh:
                  subprocess.run(
                      ["git", "show", f"{os.environ['SNAPSHOT_COMMIT']}:{os.environ['SNAPSHOT_PATH']}"],
                      stdout=fh,
                      check=True,
                  )
              h = hashlib.sha256()
              with snapshot_tmp.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              snapshot_actual_sha = h.hexdigest()
              if snapshot_actual_sha != os.environ["SNAPSHOT_SHA256"]:
                  status = "BLOCKED"
                  first_gate = "SNAPSHOT_SHA_MISMATCH"
                  affected_count = 1
                  affected_source_shape = {"actual_sha256": snapshot_actual_sha}
                  contradiction_kind = "review-provenance/hash consistency"

          rows = []
          root_shape = None
          if status == "PASS":
              with snapshot_tmp.open("r", encoding="utf-8") as fh:
                  root = json.load(fh)
              root_shape = {"type": shape_of(root), "top_level_keys": sorted(root.keys()) if isinstance(root, dict) else None}
              rows = root.get("classifications") if isinstance(root, dict) else None
              if not isinstance(rows, list):
                  status = "BLOCKED"
                  first_gate = "SNAPSHOT_CLASSIFICATION_SHAPE_MISMATCH"
                  affected_count = 1
                  affected_source_shape = root_shape
                  contradiction_kind = "review-provenance/hash consistency"
              elif len(rows) != EXPECTED_ROWS:
                  status = "BLOCKED"
                  first_gate = "CLASSIFICATION_COUNT_MISMATCH"
                  affected_count = abs(len(rows) - EXPECTED_ROWS)
                  affected_source_shape = {"observed_classifications": len(rows)}
                  contradiction_kind = "review-provenance/hash consistency"

          cross = collections.Counter()
          derived = collections.Counter()
          rp_shapes = collections.Counter()
          hash_consistency = collections.Counter()
          explicit_key_shapes = collections.Counter()
          explicit_hits = collections.Counter()
          explicit_contradictions = collections.Counter()
          curated_key_shapes = collections.Counter()
          literal_human_review_state_present = 0
          derivation_nondeterminism = 0
          duplicate_key_same_state = 0
          missing_classification_key = 0
          state_by_key = {}
          malformed_rows = 0
          unknown_verdicts = collections.Counter()
          review_hash_mismatches = 0
          reviewed_rows = 0
          no_review_rows = 0
          top_level_review_provenance_missing = 0
          top_level_review_sha_missing = 0

          if status == "PASS":
              for row in rows:
                  if not isinstance(row, dict):
                      malformed_rows += 1
                      continue

                  verdict = row.get("verdict")
                  if verdict not in ALLOWED_VERDICTS:
                      unknown_verdicts[str(verdict)] += 1
                      continue

                  if "human_review_state" in row:
                      literal_human_review_state_present += 1
                  if "review_provenance" not in row:
                      top_level_review_provenance_missing += 1
                  if "review_provenance_sha256" not in row:
                      top_level_review_sha_missing += 1

                  rp = row.get("review_provenance")
                  rp_sha = row.get("review_provenance_sha256")
                  rp_present = bool(rp)
                  rp_shapes[(shape_of(rp), "nonempty" if rp_present else "empty")] += 1
                  cross[(verdict, "REVIEW_PROVENANCE_PRESENT" if rp_present else "NO_REVIEW_PROVENANCE")] += 1

                  if rp_present:
                      reviewed_rows += 1
                      expected_sha = sha256_bytes(canonical_json_bytes(rp))
                      if not isinstance(rp_sha, str) or rp_sha != expected_sha:
                          review_hash_mismatches += 1
                          hash_consistency["review_nonempty_hash_mismatch"] += 1
                      else:
                          hash_consistency["review_nonempty_hash_match"] += 1
                  else:
                      no_review_rows += 1
                      if rp_sha is not None:
                          review_hash_mismatches += 1
                          hash_consistency["review_empty_hash_nonnull"] += 1
                      else:
                          hash_consistency["review_empty_hash_null"] += 1

                  state = derive(verdict, rp_present)
                  if state != derive(verdict, rp_present):
                      derivation_nondeterminism += 1
                  derived[state] += 1

                  ckey = row.get("classification_key_v2")
                  if ckey is None:
                      ckey = row.get("classification_key")
                  if ckey is None:
                      missing_classification_key += 1
                  else:
                      prior = state_by_key.get(str(ckey))
                      if prior is None:
                          state_by_key[str(ckey)] = state
                      elif prior != state:
                          derivation_nondeterminism += 1
                      else:
                          duplicate_key_same_state += 1

                  for path, key, value in iter_key_hits(row):
                      if CURATED_MARKER_RE.search(key):
                          curated_key_shapes[(key, shape_of(value))] += 1
                      if key in EXPLICIT_STATE_KEYS:
                          explicit_key_shapes[(key, shape_of(value))] += 1
                          if isinstance(value, str) and value in ALLOWED_STATES:
                              explicit_hits[(key, value)] += 1
                              if value != state:
                                  explicit_contradictions[(key, value, state)] += 1
                          elif key == "human_review_state":
                              explicit_contradictions[(key, repr(value), state)] += 1

          if status == "PASS" and malformed_rows:
              status = "BLOCKED"
              first_gate = "MALFORMED_CLASSIFICATION_ROWS"
              affected_count = malformed_rows
              affected_source_shape = {"row_type": "non-object"}
              contradiction_kind = "review-provenance/hash consistency"

          if status == "PASS" and unknown_verdicts:
              status = "BLOCKED"
              first_gate = "UNEXPECTED_CLASSIFICATION_VERDICT"
              affected_count = sum(unknown_verdicts.values())
              affected_source_shape = dict(unknown_verdicts)
              contradiction_kind = "curated/repair semantics"

          if status == "PASS" and literal_human_review_state_present != 0:
              status = "BLOCKED"
              first_gate = "LITERAL_HUMAN_REVIEW_STATE_PRESENT"
              affected_count = literal_human_review_state_present
              affected_source_shape = {"key": "human_review_state", "scope": "classification top-level"}
              contradiction_kind = "explicit frozen review state"

          if status == "PASS" and review_hash_mismatches:
              status = "BLOCKED"
              first_gate = "REVIEW_PROVENANCE_HASH_CONSISTENCY_MISMATCH"
              affected_count = review_hash_mismatches
              affected_source_shape = dict(hash_consistency)
              contradiction_kind = "review-provenance/hash consistency"

          if status == "PASS" and explicit_contradictions:
              status = "BLOCKED"
              first_gate = "HUMAN_REVIEW_STATE_DERIVATION_CONTRADICTION"
              affected_count = sum(explicit_contradictions.values())
              affected_source_shape = {
                  "explicit_state_shapes": [
                      {"key": k, "shape": s, "count": n}
                      for (k, s), n in sorted(explicit_key_shapes.items())
                  ]
              }
              contradiction_kind = "explicit frozen review state"

          if status == "PASS" and derivation_nondeterminism:
              status = "BLOCKED"
              first_gate = "HUMAN_REVIEW_STATE_DERIVATION_NONDETERMINISM"
              affected_count = derivation_nondeterminism
              affected_source_shape = {
                  "classification_key_missing": missing_classification_key,
                  "duplicate_key_same_state": duplicate_key_same_state,
              }
              contradiction_kind = "derivation nondeterminism"

          derivation_coverage = sum(derived.values())
          if status == "PASS" and derivation_coverage != EXPECTED_ROWS:
              status = "BLOCKED"
              first_gate = "HUMAN_REVIEW_STATE_DERIVATION_COVERAGE_MISMATCH"
              affected_count = EXPECTED_ROWS - derivation_coverage
              affected_source_shape = {"derived": derivation_coverage, "required": EXPECTED_ROWS}
              contradiction_kind = "curated/repair semantics"

          if status == "PASS" and any(k not in ALLOWED_STATES for k in derived):
              status = "BLOCKED"
              first_gate = "HUMAN_REVIEW_STATE_INVALID_VALUE"
              affected_count = sum(v for k, v in derived.items() if k not in ALLOWED_STATES)
              affected_source_shape = dict(derived)
              contradiction_kind = "curated/repair semantics"

          curated_shapes = [
              {"key": k, "value_shape": s, "count": n}
              for (k, s), n in sorted(curated_key_shapes.items())
          ]
          explicit_shapes = [
              {"key": k, "value_shape": s, "count": n}
              for (k, s), n in sorted(explicit_key_shapes.items())
          ]

          if status == "PASS":
              artifact = {
                  "schema_version": "attack-event-human-review-state-derivation-addendum-v1",
                  "status": "PASS",
                  "verdict": "ATTACK-EVENT HUMAN REVIEW STATE DERIVATION ADDENDUM FROZEN",
                  "scope": "OFFLINE PERSISTENCE-SCHEMA REPRESENTABILITY CONTRACT REPAIR ONLY",
                  "accepted_blocker": {
                      "verdict": "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF BLOCKED",
                      "proof_branch": "attack-event-step2c-rollback-persistence-proof-resume-2026-10-05",
                      "proof_head": "7cf6e8807a2df24f9276fecae1954bf0414ef223",
                      "actions_run_id": 37325554293,
                      "job_id": 111815261974,
                      "first_failing_gate": "PERSISTENCE_SCHEMA_REPRESENTABILITY_MISMATCH",
                      "phase": "OFFLINE_PREFLIGHT",
                      "affected_table": "public.attack_event_classifications",
                      "affected_field": "human_review_state",
                      "affected_rows": 26405,
                      "db_preflight_ran": False,
                      "transaction_opened": False,
                      "committed_db_mutations": 0
                  },
                  "frozen_contracts": {
                      "step1_persistence_contract": {
                          "commit": os.environ["STEP1_COMMIT"],
                          "path": os.environ["STEP1_PATH"],
                          "sha256": step1_sha,
                          "verdict": step1.get("verdict")
                      },
                      "classification_identity_availability_addendum": {
                          "commit": os.environ["IDENTITY_COMMIT"],
                          "path": os.environ["IDENTITY_PATH"],
                          "sha256": identity_sha,
                          "verdict": identity.get("final_verdict") or identity.get("verdict")
                      },
                      "provenance_cardinality_addendum": {
                          "commit": os.environ["PROVENANCE_COMMIT"],
                          "path": os.environ["PROVENANCE_PATH"],
                          "sha256": provenance_sha,
                          "verdict": provenance.get("verdict")
                      },
                      "all_unchanged": True
                  },
                  "snapshot_identity": {
                      "commit": os.environ["SNAPSHOT_COMMIT"],
                      "path": os.environ["SNAPSHOT_PATH"],
                      "sha256": snapshot_actual_sha,
                      "sha256_verification": "PASS",
                      "classifications": EXPECTED_ROWS,
                      "changed": False
                  },
                  "accepted_producer_semantics": semantic_checks,
                  "candidate_derivation_rule": {
                      "precedence": [
                          "IF review_provenance is non-empty AND review_provenance_sha256 is non-null: REVIEWED_EVIDENCE",
                          "ELSE IF verdict = NEEDS_REVIEW: NEEDS_REVIEW",
                          "ELSE: NONE"
                      ],
                      "precedence_intent": "Accepted review evidence state takes precedence over NEEDS_REVIEW classification verdict because classification verdict and review-evidence state are distinct concepts.",
                      "contract_compatible": True
                  },
                  "verdict_x_review_provenance_cross_tab": {
                      verdict: {
                          "review_provenance_present": cross[(verdict, "REVIEW_PROVENANCE_PRESENT")],
                          "no_review_provenance": cross[(verdict, "NO_REVIEW_PROVENANCE")]
                      }
                      for verdict in ALLOWED_VERDICTS
                  },
                  "review_provenance_hash_consistency": {
                      "result": "PASS",
                      "records_scanned": EXPECTED_ROWS,
                      "review_provenance_nonempty": reviewed_rows,
                      "review_provenance_empty_or_absent": no_review_rows,
                      "top_level_review_provenance_key_missing": top_level_review_provenance_missing,
                      "top_level_review_provenance_sha256_key_missing": top_level_review_sha_missing,
                      "canonical_hash_match_nonempty": hash_consistency["review_nonempty_hash_match"],
                      "canonical_hash_mismatch_nonempty": hash_consistency["review_nonempty_hash_mismatch"],
                      "null_hash_when_no_review": hash_consistency["review_empty_hash_null"],
                      "nonnull_hash_when_no_review": hash_consistency["review_empty_hash_nonnull"],
                      "review_provenance_value_shapes": [
                          {"value_shape": s, "presence": p, "count": n}
                          for (s, p), n in sorted(rp_shapes.items())
                      ],
                      "canonicalization": {
                          "encoding": "UTF-8",
                          "ensure_ascii": False,
                          "sort_keys": True,
                          "separators": [",", ":"],
                          "trailing_newline": False,
                          "hash": "SHA-256 lower-case hex"
                      }
                  },
                  "native_contradiction_audit": {
                      "result": "PASS",
                      "searched_explicit_state_keys": sorted(EXPLICIT_STATE_KEYS),
                      "explicit_state_shapes": explicit_shapes,
                      "authoritative_allowed_state_hits": [
                          {"key": k, "value": v, "count": n}
                          for (k, v), n in sorted(explicit_hits.items())
                      ],
                      "contradictions": 0,
                      "literal_top_level_human_review_state_present": literal_human_review_state_present
                  },
                  "curated_repair_provenance_audit": {
                      "result": "PASS",
                      "method": "Inventory mechanically explicit review/repair/adjudication/curation/frozen-case marker key shapes without treating marker existence as human review. Only explicit review-state keys carrying an allowed state are authoritative for contradiction testing.",
                      "marker_key_shapes": curated_shapes,
                      "additional_authoritative_human_review_state_found": False if not explicit_hits else True,
                      "candidate_rule_incomplete_due_to_curated_or_repair_semantics": False
                  },
                  "derived_state_counts": {
                      "NONE": derived["NONE"],
                      "NEEDS_REVIEW": derived["NEEDS_REVIEW"],
                      "REVIEWED_EVIDENCE": derived["REVIEWED_EVIDENCE"]
                  },
                  "derivation_coverage": {
                      "derived": derivation_coverage,
                      "required": EXPECTED_ROWS,
                      "result": "PASS"
                  },
                  "idempotence": {
                      "result": "PASS",
                      "rule": "For the same frozen semantic inputs and classification key, derived human_review_state must be identical on replay.",
                      "derivation_recomputed_same_row_mismatches": 0,
                      "same_classification_key_different_state": 0,
                      "classification_key_missing_count": missing_classification_key,
                      "duplicate_classification_key_same_state_count": duplicate_key_same_state
                  },
                  "identity_invariants": {
                      "classification_verdict_changed": False,
                      "review_provenance_changed": False,
                      "review_provenance_sha256_changed": False,
                      "classification_identity_changed": False,
                      "classification_key_v3_introduced": False,
                      "attack_event_identity_changed": False,
                      "source_link_identity_changed": False,
                      "evidence_set_hash_changed": False,
                      "qa_availability_semantics_changed": False,
                      "binding_semantics_changed": False,
                      "human_review_state_is_classification_key_input": False
                  },
                  "future_schema_contract": {
                      "column": "human_review_state TEXT NOT NULL",
                      "allowed_values": list(ALLOWED_STATES),
                      "availability_column_required": False,
                      "persistence_adapter_rule": {
                          "derive_from_snapshot": True,
                          "expect_literal_snapshot_field": False,
                          "precedence": [
                              "non-empty review_provenance with non-null verified review_provenance_sha256 => REVIEWED_EVIDENCE",
                              "else verdict == NEEDS_REVIEW => NEEDS_REVIEW",
                              "else => NONE"
                          ],
                          "persisted_semantic_equality_includes_human_review_state": True,
                          "same_frozen_inputs_different_derived_state": "HUMAN_REVIEW_STATE_DERIVATION_NONDETERMINISM"
                      }
                  },
                  "fresh_base": {
                      "main_sha": os.environ["FRESH_MAIN_BASE"],
                      "branch": os.environ.get("GITHUB_REF_NAME"),
                      "temporary_workflow_commit": os.environ.get("GITHUB_SHA"),
                      "actions_run_id": int(os.environ["GITHUB_RUN_ID"])
                  },
                  "proof_gates": {
                      "snapshot_sha": "PASS",
                      "classifications_scanned": EXPECTED_ROWS,
                      "missing_literal_human_review_state": EXPECTED_ROWS,
                      "review_provenance_hash_consistency": "PASS",
                      "candidate_derivation_contradictions": 0,
                      "derivation_coverage": f"{derivation_coverage}/{EXPECTED_ROWS}",
                      "derived_values_allowed": "PASS",
                      "derivation_deterministic": "PASS",
                      "classification_identity_change": "NO",
                      "event_identity_change": "NO",
                      "source_link_identity_change": "NO",
                      "snapshot_mutation": "NO",
                      "neon_queries": 0,
                      "db_writes": 0
                  },
                  "mutation_scope": {
                      "step2c_rerun": False,
                      "neon_queries": 0,
                      "db_writes": 0,
                      "ddl_applied": False,
                      "attack_event_tables_created": False,
                      "public_alert_episodes_modified": False,
                      "frozen_snapshot_modified": False,
                      "frozen_parent_binding_map_modified": False,
                      "classification_modified": False,
                      "production_mutation": "NO",
                      "deployment": False,
                      "credentials_exposed": False
                  },
                  "safe_continuation_point": "A separate task may rerun STEP 2C from OFFLINE_PREFLIGHT using this frozen derivation addendum; STEP 2C was not rerun here."
              }
              out = pathlib.Path(os.environ["OUTPUT_PATH"])
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(artifact, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")

          compact = {
              "status": status,
              "verdict": "ATTACK-EVENT HUMAN REVIEW STATE DERIVATION ADDENDUM FROZEN" if status == "PASS" else "ATTACK-EVENT HUMAN REVIEW STATE DERIVATION ADDENDUM BLOCKED",
              "first_failing_gate": first_gate,
              "affected_count": affected_count,
              "affected_source_shape": affected_source_shape,
              "contradiction_kind": contradiction_kind,
              "snapshot_sha_intact": snapshot_actual_sha == os.environ["SNAPSHOT_SHA256"] if snapshot_actual_sha else False,
              "classifications_scanned": len(rows) if isinstance(rows, list) else 0,
              "literal_human_review_state_present": literal_human_review_state_present,
              "derived_counts": dict(derived),
              "derivation_coverage": derivation_coverage,
              "contradictions": sum(explicit_contradictions.values()),
              "review_hash_mismatches": review_hash_mismatches,
              "neon_queries": 0,
              "db_writes": 0,
              "safe_continuation_point": "Rerun STEP 2C separately from OFFLINE_PREFLIGHT using the frozen addendum." if status == "PASS" else "Correct only the first failing contract/derivation gate; do not rerun STEP 2C."
          }
          pathlib.Path(".human_review_state_proof_result.json").write_text(
              json.dumps(compact, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh:
              gh.write(f"status={status}\n")

          if snapshot_tmp.exists():
              snapshot_tmp.unlink()

          print("HUMAN_REVIEW_STATE_PROOF_RESULT=" + json.dumps(compact, ensure_ascii=False, sort_keys=True))
          if status != "PASS":
              sys.exit(1)
          PY

      - name: Commit durable addendum
        if: steps.audit.outputs.status == 'PASS'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git commit -m "Freeze attack-event human review state derivation addendum"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:${OUTPUT_PATH})"
          echo "ARTIFACT_SHA256=$(sha256sum "$OUTPUT_PATH" | awk '{print $1}')"

      - name: Summarize compact proof result
        if: always()
        shell: bash
        run: |
          if [ -f .human_review_state_proof_result.json ]; then
            cat .human_review_state_proof_result.json
          fi
