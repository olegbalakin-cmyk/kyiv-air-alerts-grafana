name: Frozen Kyiv 29 queue Git-only recovery
on:
  push:
    branches:
      - research-kyiv-live-29-queue-recovery-2026-10-12
    paths:
      - .github/workflows/kyiv-live-29-queue-schema-probe.yml
      - research/kyiv_live_29_queue_schema_probe_runner_2026-10-12.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/research-kyiv-live-29-queue-recovery-2026-10-12'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact immutable Git commit
        run: git fetch --no-tags origin 92d57bbbfad60e6c09bb92372b1e84f38fa6ced4
      - name: Recover original objects and inspect exact schema
        run: |
          python3 research/kyiv_live_29_queue_schema_probe_runner_2026-10-12.py
          echo "EXECUTED_HEAD=$(git rev-parse HEAD)"
          echo "SCHEMA_DETAIL_BEGIN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/kyiv_live_29_queue_schema_probe_2026-10-12.json").read_text())
          print(json.dumps({"objects":d["objects"],"schema":d["schema"],"report_meta":d["report_meta"]},ensure_ascii=False,sort_keys=True)[:27000])
          PY
          echo "SCHEMA_DETAIL_END"
      - name: Independent clean A/B reconstruction and byte comparison
        run: |
          mkdir -p /tmp/kyiv-a /tmp/kyiv-b
          cp -a research/kyiv_live_29_frozen_git_outputs/. /tmp/kyiv-a/
          rm -rf research/kyiv_live_29_frozen_git_outputs
          python3 research/kyiv_live_29_queue_schema_probe_runner_2026-10-12.py
          cp -a research/kyiv_live_29_frozen_git_outputs/. /tmp/kyiv-b/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          a=Path("/tmp/kyiv-a");b=Path("/tmp/kyiv-b")
          files=sorted(p.name for p in a.iterdir())
          assert files==sorted(p.name for p in b.iterdir())
          report={"byte_identical":True,"files":{}}
          for name in files:
           aa=(a/name).read_bytes();bb=(b/name).read_bytes()
           assert aa==bb,(name,"mismatch")
           report["files"][name]={"sha256":hashlib.sha256(aa).hexdigest(),"bytes":len(aa)}
          out=Path("research/kyiv_live_29_frozen_git_outputs/08_ab_comparison.json")
          out.write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("AB_BYTE_IDENTICAL",json.dumps(report,sort_keys=True))
          PY
      - name: Preserve compact deterministic research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-live-29-frozen-git-recovery
          path: |
            research/kyiv_live_29_queue_schema_probe_2026-10-12.json
            research/kyiv_live_29_frozen_git_outputs/
          if-no-files-found: warn
          retention-days: 90
