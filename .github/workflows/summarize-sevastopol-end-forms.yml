name: Summarize Sevastopol end forms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/summarize_sevastopol_end_forms.py"
      - ".github/workflows/summarize-sevastopol-end-forms.yml"

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/summarize_sevastopol_end_forms.py
