name: Test casualty review promotion isolation

on:
  push:
    branches:
      - casualty-review-promotion-isolated-2026-10-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run isolated casualty review/promotion proof
        run: python -m pytest -q -s tests/test_casualty_review_promotion.py
