name: Independent casualty end-to-end accuracy and compatibility audit
on:
  push:
    branches: [research-casualty-independent-e2e-audit-2026-11-12]
    paths:
      - "research/casualty_independent_e2e_2026_11_12/**"
      - ".github/workflows/research-casualty-independent-e2e.yml"
permissions:
  contents: read
  actions: read
jobs:
  independent-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6a0100b0937218c62c5c079fd46e80e5071783cb
          path: _worka
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          path: _matrix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 384fb8b8e087701f42510f68f19817d9732f883e
          path: _display
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43053796144
          name: casualty-three-new-original-publisher-excerpts-one-shot
          path: /tmp/independent-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43261676781
          name: casualty-zap11-approved-http-43261676781-1
          path: /tmp/independent-receipts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Existing dependency pins, no publisher access
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Exact-ref, receipt and offline provenance gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _worka rev-parse HEAD)" = 6a0100b0937218c62c5c079fd46e80e5071783cb
          test "$(git -C _wip rev-parse HEAD)" = 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          test "$(git -C _site rev-parse HEAD)" = d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          test "$(git -C _matrix rev-parse HEAD)" = 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          test "$(git -C _display rev-parse HEAD)" = 384fb8b8e087701f42510f68f19817d9732f883e
          echo "84ffea1315d41b8ec67b55a07273d6bbd7d6e8e14191801402168f7fddf4e5df  /tmp/independent-evidence/evidence.json" | sha256sum -c -
          echo "4c21321b8a75d57f60efc97f581e89604eaa03289bb64bfba26e491ac83a203b  /tmp/independent-receipts/capture_receipts.json" | sha256sum -c -
      - name: Independently rerun frozen Work A and audit all contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/independent-casualty-audit
          python research/casualty_independent_e2e_2026_11_12/audit.py --output /tmp/independent-casualty-audit --evidence /tmp/independent-evidence/evidence.json --receipts /tmp/independent-receipts/capture_receipts.json | tee /tmp/independent-casualty-audit/CHECKS.txt
          grep -q 'INDEPENDENT_AUDIT_PARTIAL_COMPLETE' /tmp/independent-casualty-audit/CHECKS.txt
          python -m json.tool /tmp/independent-casualty-audit/independent_results.json > /dev/null
          test -z "$(git status --porcelain)"
      - name: Upload independent evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-independent-e2e-audit
          path: |
            /tmp/independent-casualty-audit/independent_results.json
            /tmp/independent-casualty-audit/CHECKS.txt
            /tmp/independent-casualty-audit/actual_generator_month.json
            /tmp/independent-casualty-audit/first/*.json
            /tmp/independent-casualty-audit/replay/*.json
          if-no-files-found: warn
          retention-days: 30
