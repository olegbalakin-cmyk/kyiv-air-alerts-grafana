name: Unit A frozen membership semantics offline diagnostic

on:
  push:
    branches:
      - attack-event-unit-a-membership-semantics-diagnostic-2026-10-09
    paths:
      - .github/workflows/attack-event-unit-a-membership-semantics-diagnostic.yml

permissions:
  contents: write

jobs:
  membership-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Obtain existing pinned Git objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin multicity-wip-2026-09-16
          git fetch --no-tags origin attack-event-multicity-classifier-parity-2026-10-07
          for sha in \
            51adc76b715669e46e8c2c936906022d4d96ed44 \
            71cb6f6fbe856cc7b96759310fe9cc9c71cc0453 \
            1422e8482303ec9262647ca55fef753a9aa2b3ea \
            2c9f48febd00ef11d81cff06248e65ab4b769203 \
            f54b0d6dcfcdd7e5b51a5b45b996273d1df72cff \
            bc58ab0705699c1686d897f07852c3493b5eec16 \
            a0eb594dd4240d1d923ca5262725fc42f4807338; do
            git fetch --no-tags origin "$sha"
          done
          test "$(git merge-base HEAD 387f5ff5550d5ab5164e8f10fd776d9d6e7ec6cc)" = "387f5ff5550d5ab5164e8f10fd776d9d6e7ec6cc"
      - name: Two deterministic offline diagnostic passes
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B .github/proof/attack_event_unit_a_membership_semantics_diagnostic.py
      - name: Freeze diagnostic and clean temporary execution files
        shell: bash
        run: |
          set -euo pipefail
          artifact="research/attack_event_execution_unit_a_membership_semantics_diagnostic_2026-10-09.json"
          test -f "$artifact"
          test "$(git rev-parse HEAD:research/attack_event_execution_unit_a_classification_replay_2026-10-09.json)" = "4dfc8aa7132706e2a3a4febd655ffa0a2bd71640"
          test "$(git rev-parse HEAD:research/attack_event_execution_unit_a_shadow_persistence_gap_audit_resume_2026-10-09.json)" = "d7c938f2ee9b16e491ec53cbcb5781efa6bcff27"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          git commit -m "Freeze Unit A offline membership-semantics diagnostic"
          echo "ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          echo "ARTIFACT_BLOB=$(git rev-parse HEAD:$artifact)"
          echo "ARTIFACT_SHA256=$(sha256sum "$artifact" | cut -d' ' -f1)"
          before="$(git hash-object "$artifact")"
          rm .github/workflows/attack-event-unit-a-membership-semantics-diagnostic.yml
          rm .github/proof/attack_event_unit_a_membership_semantics_diagnostic.py
          git add -A .github/workflows/attack-event-unit-a-membership-semantics-diagnostic.yml .github/proof/attack_event_unit_a_membership_semantics_diagnostic.py
          git commit -m "Remove temporary membership diagnostic execution files"
          test "$before" = "$(git hash-object "$artifact")"
          test ! -e .github/workflows/attack-event-unit-a-membership-semantics-diagnostic.yml
          test ! -e .github/proof/attack_event_unit_a_membership_semantics_diagnostic.py
          test "$(git diff --name-status 387f5ff5550d5ab5164e8f10fd776d9d6e7ec6cc..HEAD)" = "$(printf 'A\tresearch/attack_event_execution_unit_a_membership_semantics_diagnostic_2026-10-09.json')"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_DIFF_FILE_COUNT=1"
          echo "TEMP_WORKFLOW_REMOVED=YES"
          echo "TEMP_HARNESS_REMOVED=YES"
          echo "PRODUCTION_MUTATION=NO"
          git push origin HEAD:attack-event-unit-a-membership-semantics-diagnostic-2026-10-09

# Fail-closed AST parity inspection retry.
