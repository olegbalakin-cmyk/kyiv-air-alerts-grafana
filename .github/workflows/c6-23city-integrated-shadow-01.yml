name: C6 23-city integrated Neon shadow research only

on:
  push:
    branches:
      - research-c6-runner02-isolated-2026-10-29
    paths:
      - .github/workflows/c6-23city-integrated-shadow-01.yml

permissions:
  contents: read

concurrency:
  group: c6-23city-integrated-shadow-01-research-exclusive
  cancel-in-progress: false

jobs:
  isolated-readonly-shadow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-c6-runner02-isolated-2026-10-29'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: c6-runner02-research
    steps:
      - name: Checkout exact research code
        uses: actions/checkout@v4
        with:
          path: research-src
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact site-prod immutable snapshot
        uses: actions/checkout@v4
        with:
          repository: olegbalakin-cmyk/kyiv-air-alerts-grafana
          ref: 09192a36dae49bd71e1042942481384a5e763086
          path: pinned-site
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned site dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Execute physical Python Neon reader and candidate consumer diff
        env:
          C6_B1_READONLY_DATABASE_URL: ${{ secrets.C6_B1_READONLY_DATABASE_URL }}
        shell: bash
        run: |
          python research-src/research/c6_23city_integrated_shadow_2026_10_30/integration.py
      - name: Preserve machine verdict and research-only bundle even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-23city-integrated-shadow-01-${{ github.run_id }}
          path: c6_23city_integrated_shadow01_proof/
          if-no-files-found: warn
          retention-days: 30
