name: C6 23-city integrated shadow 02 approved adapter research only

on:
  push:
    branches:
      - research-c6-runner02-isolated-2026-10-29
    paths:
      - .github/workflows/c6-23city-integrated-shadow-01.yml

permissions:
  contents: read

concurrency:
  group: c6-23city-integrated-shadow-01-research-exclusive
  cancel-in-progress: false

jobs:
  isolated-readonly-shadow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-c6-runner02-isolated-2026-10-29'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: c6-runner02-research
    steps:
      - name: Checkout pinned research source
        uses: actions/checkout@v4
        with:
          path: research-src
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable production reference
        uses: actions/checkout@v4
        with:
          repository: olegbalakin-cmyk/kyiv-air-alerts-grafana
          ref: 09192a36dae49bd71e1042942481384a5e763086
          path: pinned-site
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing approved Python dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify exact approved ZIP SHA, 17-file manifest and CRC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c6_23city_integrated_shadow02_proof/accepted-22city
          base64 -d research-src/research/c6_23city_integrated_shadow_2026_10_30/approved_22city_archive.b64 > /tmp/c6-22city-reader-accepted.zip
          printf '%s  %s\n' 'f6dda060a0ed48b01b4726625b36c33b472955f687be6877aef918fc3c8bddf2' '/tmp/c6-22city-reader-accepted.zip' | sha256sum -c -
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          z=pathlib.Path('/tmp/c6-22city-reader-accepted.zip')
          with zipfile.ZipFile(z) as src:
              assert src.testzip() is None, 'ZIP_CRC_MISMATCH'
              root='C6-22CITY-READER-01/'
              manifest=json.loads(src.read(root+'sha256_manifest.json'))['files']
              assert len(manifest)==17
              for name,sha in manifest.items():
                  assert hashlib.sha256(src.read(root+name)).hexdigest()==sha, 'FILE_SHA_MISMATCH: '+name
              assert len(src.namelist())==18
              print('APPROVED_ARCHIVE_VERIFIED_CRC_AND_MANIFEST 17/17',flush=True)
              src.extractall('/tmp/c6-22city-approved')
          p=pathlib.Path('c6_23city_integrated_shadow02_proof/accepted-22city/approved_adapter_archive.sha256')
          p.write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'\n')
          PY
      - name: Execute exact approved full Python psycopg 22-city adapter on protected read-only Neon replica
        id: adapter
        shell: bash
        env:
          C6_B1_READONLY_DATABASE_URL: ${{ secrets.C6_B1_READONLY_DATABASE_URL }}
        run: |
          set -uo pipefail
          target="c6_23city_integrated_shadow02_proof/accepted-22city"
          python research-src/research/c6_23city_integrated_shadow_2026_10_30/run_approved_adapter_pinned.py > "$target/adapter_execution.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$target/adapter_exit_code.txt"
          tail -n 50 "$target/adapter_execution.log"
          if [ ! -s "$target/machine_verdict.json" ]; then
            echo 'FAIL_CLOSED_APPROVED_ADAPTER_NO_MACHINE_VERDICT'
            exit 3
          fi
          python - <<'PY'
          import json
          p='c6_23city_integrated_shadow02_proof/accepted-22city/machine_verdict.json'
          j=json.load(open(p))
          r=j['receipt']
          assert r['physical_origin']=='ACTUAL_NEON_PSYCOG_READONLY'
          assert r['database']['recovery'] is True
          assert r['database']['read_only']=='on'
          assert r['database']['cities']==22
          print('PHYSICAL_NEON_READONLY_ADAPTER_EXECUTED count=',r['database']['row_count'],'diff=',j.get('blocking_differences'),flush=True)
          PY
      - name: Run established 23-city integration using approved adapter output and Kyiv B2
        if: steps.adapter.outcome == 'success'
        shell: bash
        env:
          C6_B1_READONLY_DATABASE_URL: ${{ secrets.C6_B1_READONLY_DATABASE_URL }}
          C6_APPROVED_22CITY_DIR: /tmp/c6-22city-approved/C6-22CITY-READER-01
        run: |
          python research-src/research/c6_23city_integrated_shadow_2026_10_30/integration.py
      - name: Preserve research artifacts and machine verdict on PARTIAL/failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-23city-integrated-shadow-02-${{ github.run_id }}
          path: c6_23city_integrated_shadow02_proof/
          if-no-files-found: warn
          retention-days: 30
