name: Kyiv historical development classifier replay

on:
  push:
    branches: [kyiv-historical-development-classifier-replay-2026-10-08]
    paths:
      - ".github/proof/kyiv_historical_discovery_development_classifier_replay.py"
      - ".github/workflows/kyiv-historical-development-classifier-replay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyiv-historical-development-classifier-replay-2026-10-08
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: kyiv-historical-development-classifier-replay-2026-10-08
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded proof dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Assert zero database configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB environment variable: $key"; exit 1; }
          done

      - name: Run development-only classifier replay
        run: python .github/proof/kyiv_historical_discovery_development_classifier_replay.py

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-historical-development-classifier-replay-${{ github.run_id }}
          path: |
            research/kyiv_historical_discovery_development_classifier_input_2026-10-08.json
            research/kyiv_historical_discovery_development_classifier_replay_2026-10-08.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit only proof artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/kyiv_historical_discovery_development_classifier_input_2026-10-08.json
          git add research/kyiv_historical_discovery_development_classifier_replay_2026-10-08.json
          if git diff --cached --quiet; then
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          git commit -m "Record Kyiv development classifier replay"
          git push origin HEAD:kyiv-historical-development-classifier-replay-2026-10-08
