name: C4 archived Lviv bridge verification (research only)
on:
  push:
    branches:
      - research-c4-25-individual-boundaries-2026-10-27-gpt6
    paths:
      - "research/c4_25_individual_boundaries_2026_10_27/verify_archived_bridge.py"
      - ".github/workflows/c4-archived-bridge-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-pinned-public-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned production data in temporary job workspace
        uses: actions/checkout@v4
        with:
          ref: 634fc6beffbcdf76026d64b9866314fdb53ab0e4
          path: site-prod-snapshot
          persist-credentials: false
      - name: Recheck existing bridge (read-only)
        run: |
          python3 research/c4_25_individual_boundaries_2026_10_27/verify_archived_bridge.py
