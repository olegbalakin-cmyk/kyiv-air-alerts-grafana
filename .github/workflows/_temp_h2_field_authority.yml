name: Temporary H2 independent audit - exact exceptions freeze
on:
  push:
    branches: [neon-h2-field-authority-successor-proof-2026-10-12]
    paths: ['.github/workflows/_temp_h2_field_authority.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen inputs and independent A-B
        run: |
          python3 research/_temp_h2_field_authority_reconstruct.py --prepare
          PYTHONHASHSEED=17 python3 research/_temp_h2_field_authority_reconstruct.py --audit /tmp/h2_a.json
          PYTHONHASHSEED=997 python3 research/_temp_h2_field_authority_reconstruct.py --audit /tmp/h2_b.json
          cmp /tmp/h2_a.json /tmp/h2_b.json
          sha256sum /tmp/h2_a.json /tmp/h2_b.json
          wc -c /tmp/h2_a.json /tmp/h2_b.json
      - name: Upload proof candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-audit-candidate
          path: /tmp/h2_a.json
          retention-days: 7

      - name: Freeze reconciled candidate on isolated proof branch
        run: |
          test "$(git branch --show-current)" = "neon-h2-field-authority-successor-proof-2026-10-12"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/h2_a.json'))
          assert x['verdicts']['H2_19542_FIELD_AUTHORITY_AUDIT']=='PARTIAL'
          assert not x['transport_exception_rows'] and not x['other_exception_rows'] and not x['affirmative_historical_contradictions']
          assert x['key_recalculation']['classification']['matches']==19542
          assert x['key_recalculation']['event']['matches']==961
          assert x['key_recalculation']['source_link']['matches']==1429
          assert x['coverage']['normalized_observations']==1503
          assert sum(x['membership_authority_totals'].values())==1429
          assert len(x['unresolved_bound_source_memberships'])==24
          assert x['membership_authority_totals']['REPLAY_DERIVED_ONLY']==24
          PY
          cp /tmp/h2_a.json research/neon_h2_19542_field_authority_audit_2026-10-12.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/neon_h2_19542_field_authority_audit_2026-10-12.json
          git commit -m 'research(proof): freeze H2 field-authority PARTIAL A/B result'
          git push origin HEAD:refs/heads/neon-h2-field-authority-successor-proof-2026-10-12
