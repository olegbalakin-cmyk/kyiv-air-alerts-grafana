name: C6 frozen B2 with append-only later snapshot offline
on:
  push:
    branches: [research-c6-postc2-append-only-2026-11-12]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-canonical-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout immutable C2 input containing merged PR93 Sevastopol parser
        uses: actions/checkout@v4
        with:
          ref: 68629fdae5534ec3a136e666bcb7d5c84dcd05aa
          path: approved-site
          persist-credentials: false
      - name: Exact PR93 generator allowlist offline acceptance and rejection
        env:
          C6_PR93_SITE_PARSER: approved-site/kyiv-air-alerts-grafana/scripts/add_sevastopol_exact.py
        run: python -m unittest discover -s tests -p 'test_c6_pr93_exact_generator_pin.py' -v
      - name: Offline UkraineAlarm open-end sentinel regression
        run: python -m unittest discover -s tests -p 'test_c6_capture_active_enddate.py' -v
      - name: Frozen B2 382-parent evidence / 198 canonical display regression
        run: python -m unittest discover -s tests -p 'test_c6_frozen_b2_evidence.py' -v
      - name: Offline overlapping-event regression
        run: python -m unittest discover -s tests -p 'test_c6_exact_canonical_selection.py' -v
      - uses: actions/checkout@v4
        with:
          ref: 2fe50c323171393ab2fa725010bf3d203416af6b
          path: work-b-evidence
          persist-credentials: false
      - name: Download immutable existing C2 bundle
        uses: actions/download-artifact@v4
        with:
          repository: olegbalakin-cmyk/kyiv-air-alerts-grafana
          run-id: 43055353190
          name: c2-shadow-inputs-43055353190-1
          github-token: ${{ github.token }}
          path: existing-c2
      - name: Verify ZIP checksum and extract inner archive (no HTTP to original source)
        run: |
          python - <<'PY'
          import hashlib, zipfile, pathlib
          outer = pathlib.Path("existing-c2")
          raw = (outer / "c2-shadow-inputs.zip").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "ebcf2b6a94080f7a374b0897715c732846c5bd55eb4127f79d202cf8fec04c1d"
          pathlib.Path("verified-c2.zip").write_bytes(raw)
          PY
      - name: Exact 23-city real corpus offline reproduction
        env:
          C6_REAL_C2_BUNDLE: verified-c2.zip
          C6_WORK_B_STALE_CSV: work-b-evidence/research/c6_work_b_exact_corpus_2026_11_11/STALE_262_EPISODES.csv
        run: python -m unittest discover -s tests -p 'test_c6_exact_corpus_real.py' -v

      - name: Real C2 21-city captured UkraineAlarm completed-interval replay
        env:
          C6_REAL_C2_BUNDLE: verified-c2.zip
        run: python -m unittest discover -s tests -p 'test_c6_integrated_ua_real_receipts.py' -v
