name: Historical v2 formalization Chernihiv Dnipro proof

on:
  push:
    branches:
      - historical-v2-formalization-chernihiv-dnipro-proof-2026-10-02
    paths:
      - "kyiv-air-alerts-grafana/scripts/formalize_historical_v2_chernihiv_dnipro.py"
      - ".github/workflows/historical-v2-formalization-chernihiv-dnipro-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact proof branch
        uses: actions/checkout@v4
        with:
          ref: historical-v2-formalization-chernihiv-dnipro-proof-2026-10-02
          fetch-depth: 0

      - name: Verify exact common-base ancestry
        shell: bash
        run: |
          set -euo pipefail
          base=fb563dc410fe6614263bdc8d4eb55025a987e950
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base")" = "$base"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install local classifier dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt

      - name: Run bounded two-city formalization
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/formalize_historical_v2_chernihiv_dnipro.py
          cp research/historical_v2_formalization_chernihiv_dnipro_proof_2026-10-02.json "$RUNNER_TEMP/proof.json"

      - name: Verify compact proof and hard invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("research/historical_v2_formalization_chernihiv_dnipro_proof_2026-10-02.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["mode"] == "REBIND_EXISTING_EVIDENCE"
          assert d["methodology_version"] == "historical-attack-event-air-defense-action-v2"
          assert d["city_set"] == ["chernihiv", "dnipro"]

          expected = {"chernihiv": 1676, "dnipro": 2259}
          for city, n in expected.items():
              row = d["cities"][city]
              assert row["canonical_episodes"] == n
              assert row["missing_targets"] == 0
              assert row["duplicate_targets"] == 0
              assert row["extra_targets"] == 0
              assert row["target_state_sha256"] and len(row["target_state_sha256"]) == 64
              assert (
                  row["strict_positives"]
                  + row["sensitivity_positives"]
                  + row["no_confirmed_event"]
                  + row["needs_review"]
              ) == n
              assert row["unbound_counted_evidence"] == 0
              assert row["normalization_failures"] == 0
              assert row["classification_failures"] == 0
              assert row["verdict"] == "CITY V2 FORMALIZATION PROVEN"

          g = d["mutation_guards"]
          assert g["authoritative_evidence_inputs_unchanged"] is True
          assert g["historical_source_slices_unchanged"] is True
          assert g["authoritative_evidence_mutations"] == 0
          assert g["historical_source_slice_mutations"] == 0
          assert g["canonical_data_mutations"] == 0
          assert g["production_dashboard_mutations"] == 0
          assert g["db_neon"] == "UNTOUCHED"
          assert g["deploy"] == "NO"
          assert g["network_during_formalization"] == "BLOCKED"
          assert g["public_web_research"] == "NO"
          assert g["source_discovery"] == "NO"
          assert g["incorporation"] == "NO"
          assert d["overall_verdict"] == "HISTORICAL V2 FORMALIZATION PROVEN"
          print("hard invariants = PASS")
          PY

      - name: Mutation scope guard
        shell: bash
        run: |
          set -euo pipefail
          base=fb563dc410fe6614263bdc8d4eb55025a987e950

          test -z "$(git diff --name-only "$base"...HEAD -- 'kyiv-air-alerts-grafana/data/explosion_research/**')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'kyiv-air-alerts-grafana/data/explosion_metric_handoff/source_slices/**')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'kyiv-air-alerts-grafana/data/**')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'deploy/**')"
          test -z "$(git diff --name-only "$base"...HEAD -- 'research/historical_attack_event_backfill/**')"

          unexpected="$(git diff --name-only "$base"...HEAD | grep -Ev '^(kyiv-air-alerts-grafana/scripts/formalize_historical_v2_chernihiv_dnipro\.py|\.github/workflows/historical-v2-formalization-chernihiv-dnipro-proof\.yml|research/historical_v2_formalization_chernihiv_dnipro_proof_2026-10-02\.json)$' || true)"
          test -z "$unexpected"

          dirty="$(git status --porcelain --untracked-files=all | grep -Ev '^(\?\?| M) research/historical_v2_formalization_chernihiv_dnipro_proof_2026-10-02\.json$' || true)"
          test -z "$dirty"

          echo "authoritative evidence mutations = 0"
          echo "historical source slice mutations = 0"
          echo "canonical/data mutations = 0"
          echo "production/dashboard mutations = 0"
          echo "DB/Neon = untouched"
          echo "scope allowlist = PASS"

      - name: Print compact proof artifact
        shell: bash
        run: |
          echo '__PROOF_JSON_BEGIN__'
          cat research/historical_v2_formalization_chernihiv_dnipro_proof_2026-10-02.json
          echo '__PROOF_JSON_END__'

      - name: Upload compact proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-v2-formalization-chernihiv-dnipro-proof-2026-10-02
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          retention-days: 30
