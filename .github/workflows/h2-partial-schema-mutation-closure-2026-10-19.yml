name: H2 partial observed schema mutation K1 K2 and exact A B retention
on:
  push:
    branches: [research-h2-partial-schema-mutation-closure-2026-10-19]
    paths:
      - 'kyiv-air-alerts-grafana/tests/test_h2_partial_schema_mutation_controls_pg18.py'
      - 'research/h2_observed_neon_partial_pg18_AB_reports_2026-10-19.json.xz.b64'
      - 'research/h2_observed_neon_partial_pg18_AB_retention_manifest_2026-10-19.json'
      - 'research/h2_verify_observed_partial_AB_retention_2026-10-19.py'
      - '.github/workflows/h2-partial-schema-mutation-closure-2026-10-19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-mutant-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: h2_seed
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U h2_local -d h2_seed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      H2_OFFLINE_POSTGRES_DSN: postgresql://h2_local:synthetic_only@127.0.0.1:5432/h2_legacy
      H2_OBSERVED_POSTGRES_DSN: postgresql://h2_local:synthetic_only@127.0.0.1:5432/h2_observed
      ATTACK_EVENT_DATABASE_URL: postgresql://h2_local:synthetic_only@127.0.0.1:5432/h2_legacy
      ATTACK_EVENT_ORIGIN_COMMIT_SHA: ffffffffffffffffffffffffffffffffffffffff
      ATTACK_EVENT_ORIGIN_REF: synthetic-pg18
      CANONICAL_PARENT_DB_BRANCH: synthetic-offline
      CANONICAL_PARENT_CONTRACT_DIR: /tmp/h2-parent-contract
      H2_MAIN_OUTPUT: /tmp/h2_legacy_main_report.json
      H2_CALLER_OUTPUT: /tmp/h2_legacy_caller_report.json
      H2_OBSERVED_REPORT: /tmp/h2_observed_result.json
      H2_MUTATION_REPORT: /tmp/h2_mutation_result.json
      H2_TEST_PHASE: post_fix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted code and observed fixture exact blobs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          pinned={
            'kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py':'a94741aa3a65c18d7bffb846a2c26973564c7812',
            'kyiv-air-alerts-grafana/scripts/attack_event_canonical_persistence.py':'2a5354aa4ad2bc67893ffa40589024ecb84fa15e',
            'kyiv-air-alerts-grafana/scripts/attack_event_tip_snapshot.py':'4e8890c88381fad5af3ecc4721ff435c0dd958f5',
            'kyiv-air-alerts-grafana/scripts/live_parent_ordering.py':'d43ee3573d78e70e4d9fa3559e81cf950799db0b',
            'research/h2_neon_catalog_reconciliation_2026-10-18/neon_observed_partial_schema_fixture_v1.sql':'09f9c5a2f0c4eeddaba63e7c9c5834cce85f7ab3'
          }
          for path,expected in pinned.items():
            raw=Path(path).read_bytes()
            actual=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
            assert actual==expected,(path,actual,expected)
            print('PINNED_BLOB',path,actual)
          PY
      - name: Git-only exact A B report restore and corruption negative controls
        run: python research/h2_verify_observed_partial_AB_retention_2026-10-19.py
      - name: Install offline dependencies and create independent synthetic DBs
        run: |
          python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
          docker run --rm --network host -e PGPASSWORD=synthetic_only postgres:18             psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U h2_local -d h2_seed             -c 'CREATE DATABASE h2_legacy' -c 'CREATE DATABASE h2_observed'
      - name: Download and pin accepted parent contract (read-only public Git)
        run: |
          mkdir -p /tmp/h2-parent-contract
          for item in db_phase1_core.py db_phase1_persistence.py; do
            curl --fail --location --silent --show-error               https://raw.githubusercontent.com/olegbalakin-cmyk/kyiv-air-alerts-grafana/41da789e61424c4f5b58d3b9fb8547ba98a194bf/kyiv-air-alerts-grafana/scripts/$item               -o /tmp/h2-parent-contract/$item
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name,expected in [('db_phase1_core.py','dda23c268e08f74367f33b189a8bafc1358aadd2'),('db_phase1_persistence.py','ed014e61fc6186fa9daf91c763c847e7df2f0306')]:
            raw=(Path('/tmp/h2-parent-contract')/name).read_bytes()
            h=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
            assert h==expected,(name,h)
          PY
      - name: Accepted M N I T regressions
        run: |
          python kyiv-air-alerts-grafana/tests/test_h2_monitor_main_pg18_e2e.py
          python kyiv-air-alerts-grafana/tests/test_h2_operational_expected_tip_pg18.py
      - name: Accepted E1-E15 on original observed fixture
        run: python kyiv-air-alerts-grafana/tests/test_h2_observed_neon_partial_pg18_e2e.py
      - name: Test-only K1 K2 mutations original monitor writer PG18
        run: python kyiv-air-alerts-grafana/tests/test_h2_partial_schema_mutation_controls_pg18.py
      - name: Inspect independent stored report verdicts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['/tmp/h2_legacy_main_report.json','/tmp/h2_legacy_caller_report.json','/tmp/h2_observed_result.json','/tmp/h2_mutation_result.json']:
            p=Path(name)
            if not p.exists():
              print('MISSING_REPORT',name)
              continue
            d=json.loads(p.read_bytes())
            print('REPORT',name,'BYTES',p.stat().st_size,'VERDICT',d.get('verdict'))
          PY
      - name: Upload sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-partial-schema-mutation-${{ matrix.copy }}
          path: |
            /tmp/h2_legacy_main_report.json
            /tmp/h2_legacy_caller_report.json
            /tmp/h2_observed_result.json
            /tmp/h2_mutation_result.json
          if-no-files-found: warn
          retention-days: 30
