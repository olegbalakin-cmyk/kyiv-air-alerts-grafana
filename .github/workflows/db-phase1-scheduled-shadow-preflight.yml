name: Phase-1 Scheduled Shadow Preflight

on:
  push:
    branches:
      - db-phase1-scheduled-shadow-enable-2026-09-28

permissions:
  contents: read

concurrency:
  group: phase1-scheduled-shadow-preflight-fixture-v2
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
      CANONICAL_BLOB: 2437cce7d434f34574b19dbd857ee9625de0e0b4
      PERSISTENCE_BLOB: ed014e61fc6186fa9daf91c763c847e7df2f0306
      DDL_BLOB: 3b8af7940b23aae03a4f6b434d90d97dde10bfc0

    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install Phase-1 requirements
        working-directory: kyiv-air-alerts-grafana
        run: python -m pip install -r requirements-db-phase1.txt

      - name: Verify frozen blobs and production files untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_lviv_canonical.py)" = "$CANONICAL_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/scripts/db_phase1_persistence.py)" = "$PERSISTENCE_BLOB"
          test "$(git hash-object kyiv-air-alerts-grafana/db/migrations/001_phase1_core.sql)" = "$DDL_BLOB"
          git diff --exit-code 0882f07f7427f39b79f8af40280f97871cf72db7 --             kyiv-air-alerts-grafana/data/dashboard_data.json             kyiv-air-alerts-grafana/data/ukrainealarm_bridge.json             kyiv-air-alerts-grafana/pages-preview

      - name: Run all Phase-1 tests
        working-directory: kyiv-air-alerts-grafana
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_db_phase1*.py" -v 2>&1 | tee "$RUNNER_TEMP/phase1_tests.log"
          count="$(grep -Eo 'Ran [0-9]+ tests?' "$RUNNER_TEMP/phase1_tests.log" | tail -1 | grep -Eo '[0-9]+')"
          test "$count" -gt 51
          echo "PHASE1_TEST_COUNT=$count" >> "$GITHUB_ENV"

      - name: Run bridge dedup regressions
        working-directory: kyiv-air-alerts-grafana
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_ukrainealarm_bridge_dedup.py')
          tests = sorted((n, f) for n, f in ns.items() if n.startswith('test_') and callable(f))
          for name, fn in tests:
              fn()
              print('PASS', name)
          assert len(tests) == 9
          PY

      - name: Confirm deterministic fail-open and fail-closed regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "test_real_bridge_fail_open_forced_db_failure_preserves_product_bytes" "$RUNNER_TEMP/phase1_tests.log"
          grep -q "test_shadow_fail_closed_remains_default_and_propagates" "$RUNNER_TEMP/phase1_tests.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "fail_open_fault_injection_test": "PASS",
              "fail_closed_regression": "PASS",
              "product_json_byte_equality_under_forced_db_failure": "PASS",
              "credentials_exposed": False,
          }
          Path(os.environ["RUNNER_TEMP"], "scheduled_shadow_preflight.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-scheduled-shadow-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/phase1_tests.log
            ${{ runner.temp }}/scheduled_shadow_preflight.json
          if-no-files-found: warn
          retention-days: 30
