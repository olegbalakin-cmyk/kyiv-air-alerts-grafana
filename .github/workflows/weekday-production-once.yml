name: Owner-approved weekday one-shot locked Netlify release
on:
  push:
    branches: [site-prod]
    paths:
      - ".github/workflows/weekday-production-once.yml"
permissions:
  contents: read
concurrency:
  group: netlify-production-site
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/site-prod' && startsWith(github.event.head_commit.message, 'Release weekday statistics 2026-11-19') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact approved production branch
        uses: actions/checkout@v4
        with:
          ref: site-prod
          fetch-depth: 2
          persist-credentials: false
      - name: Gate branch source, owner GO and proof-tested components
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/site-prod"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 148c545d12aa1a2b03202ef89f21e108c98241c0 HEAD
          test -s kyiv-air-alerts-grafana/pages-preview/weekday-distribution.js
          test -s kyiv-air-alerts-grafana/pages-preview/weekday-ui.js
          test -s kyiv-air-alerts-grafana/pages-preview/weekday-dayparts.json
          test -s kyiv-air-alerts-grafana/scripts/build_time_of_day_heatmap.py
          grep -q 'weekday-local-five-bands-union-v1' kyiv-air-alerts-grafana/scripts/build_time_of_day_heatmap.py
          grep -q 'selector:"#weekdaySection"' kyiv-air-alerts-grafana/pages-preview/app.js
          grep -q 'id="weekdaySection"' kyiv-air-alerts-grafana/pages-preview/index.html
          echo "OWNER_GO_RELEASE_GATE_SOURCE_PIN_PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify aggregation and translated source scripts
        run: |
          set -euo pipefail
          node --check kyiv-air-alerts-grafana/pages-preview/weekday-ui.js
          node --check kyiv-air-alerts-grafana/pages-preview/weekday-distribution.js
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node --test tests/test_weekday_distribution.cjs
          python3 -m pip install -r kyiv-air-alerts-grafana/requirements.txt
          python3 -m unittest discover -s tests -p test_weekday_local_bands.py -v
      - name: Rebuild only the frontend and same-generation verified static archive
        run: |
          set -euo pipefail
          python3 kyiv-air-alerts-grafana/scripts/export_verified_neon_historical_kpi.py --dashboard kyiv-air-alerts-grafana/data/dashboard_data.json --output /tmp/weekday-verified-index.json
          mv /tmp/weekday-verified-index.json historical-daily-kpi.json
          rm -rf _site
          mkdir _site
          for f in index.html styles.css app.js features.json chart-share.js kpi-range.js weekday-distribution.js weekday-ui.js weekday-dayparts.json brand-mark.svg brand-horizontal-uk-dark.svg brand-horizontal-en-dark.svg favicon.svg favicon-32.png; do
            cp "kyiv-air-alerts-grafana/pages-preview/$f" "_site/$f"
          done
          cp historical-daily-kpi.json _site/historical-daily-kpi.json
          python3 kyiv-air-alerts-grafana/scripts/build_bilingual_html.py --source kyiv-air-alerts-grafana/pages-preview/index.html --output-dir _site
          python3 -m unittest discover -s tests -p test_seo_full_history_archive.py -v
          python3 kyiv-air-alerts-grafana/scripts/build_historical_static_archive.py --source historical-daily-kpi.json --output-dir _site
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 18
          test -s _site/index.html
          test -s _site/en/index.html
          test -s _site/stats/index.html
          test -s _site/en/stats/index.html
          test -s _site/sitemap.xml
          test -s _site/robots.txt
          grep -q 'weekday-distribution.js' _site/index.html
          grep -q 'weekday-ui.js' _site/en/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path("_site/historical-daily-kpi.json").read_text())
          dashboard=json.loads(Path("kyiv-air-alerts-grafana/data/dashboard_data.json").read_text())
          assert index["meta"]["verified_count"]==23
          assert index["meta"]["source_dashboard_generated_at"]==dashboard["meta"]["generated_at"]
          assert set(index["cities"])==set(dashboard["multicity_meta"]["production_city_keys"])
          print("PRODUCTION_SAME_GENERATION_23_CITY_KPI_PASS")
          PY
          echo "WEEKDAY_STATIC_18_FILES_WITH_SEO_PASS"
      - name: One gated Netlify publish, automatic relock, exact readback
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          python3 kyiv-air-alerts-grafana/scripts/one_shot_locked_netlify_deploy.py
      - name: Verify served live assets and locked production deployment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          url="https://ukraine-air-alerts.netlify.app"
          for asset in weekday-distribution.js weekday-ui.js weekday-dayparts.json app.js; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$url/$asset?v=weekday-prod-20261119" -o "/tmp/weekday-live-$asset"
          done
          cmp _site/weekday-distribution.js /tmp/weekday-live-weekday-distribution.js
          cmp _site/weekday-ui.js /tmp/weekday-live-weekday-ui.js
          cmp _site/weekday-dayparts.json /tmp/weekday-live-weekday-dayparts.json
          cmp _site/app.js /tmp/weekday-live-app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/weekday-live-weekday-dayparts.json").read_text())
          assert len(j["cities"])==23
          assert j["meta"]["timezone"]=="Europe/Kyiv"
          print("LIVE_WEEKDAY_23_CITY_STATIC_FALLBACK_PASS")
          PY
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          receipt=json.loads(Path("netlify-production-deploy.json").read_text())
          did=receipt.get("deploy_id") or receipt.get("id")
          headers={"Authorization":"Bearer "+os.environ["NETLIFY_AUTH_TOKEN"]}
          def read(path):
              with urllib.request.urlopen(urllib.request.Request("https://api.netlify.com/api/v1"+path,headers=headers),timeout=25) as r:return json.load(r)
          site=read("/sites/b5aafc46-7468-4070-baf1-db80a4d30501")
          deploy=read("/deploys/"+did)
          assert (site.get("published_deploy") or {}).get("id")==did
          assert deploy["state"]=="ready" and deploy["locked"] is True
          print("WEEKDAY_PRODUCTION_PUBLISHED_LOCKED_PASS",did)
          PY
      - name: Keep exact deploy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekday-one-shot-production-proof
          path: netlify-production-deploy.json
          if-no-files-found: warn
