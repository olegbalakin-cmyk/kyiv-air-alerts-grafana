name: Historical v2 formalization Vinnytsia Zhytomyr proof

on:
  pull_request:
    branches:
      - historical-23city-repaired-baseline-proof-2026-10-02
    paths:
      - "kyiv-air-alerts-grafana/scripts/historical_v2_formalize_stream09.py"
      - ".github/workflows/historical-v2-formalization-vinnytsia-zhytomyr-proof.yml"

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify frozen base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fb563dc410fe6614263bdc8d4eb55025a987e950 HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run bounded stream-09 worker
        shell: bash
        run: |
          set -euo pipefail
          python kyiv-air-alerts-grafana/scripts/historical_v2_formalize_stream09.py

      - name: Commit compact proof artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="research/historical_v2_formalization_vinnytsia_zhytomyr_proof_2026-10-02.json"
          test -f "$artifact"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$artifact"
          if git diff --cached --quiet; then
            echo "artifact unchanged"
          else
            git commit -m "Record Vinnytsia Zhytomyr v2 formalization proof"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
