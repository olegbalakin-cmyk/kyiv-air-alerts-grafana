name: Historical attack-event backfill
# air-defense-action-methodology-v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "foundation_acceptance or backfill"
        required: false
        default: "backfill"
        type: choice
        options: [backfill, foundation_acceptance]
      campaign_id:
        description: "Frozen campaign identifier"
        required: false
        default: "historical-attack-events-v2-2026-09-27"
        type: string
      city_key:
        description: "auto, all, or one discovery-ready city"
        required: false
        default: "auto"
        type: string
      batch_size:
        description: "Episodes per batch"
        required: false
        default: "50"
        type: string
      max_batches_per_run:
        description: "Bounded batches this workflow run may commit"
        required: false
        default: "1"
        type: string
      resume:
        description: "Resume from durable checkpoint"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [historical-attack-event-backfill-2026-09-27]
    paths:
      - ".github/workflows/historical-attack-event-backfill.yml"
      - "kyiv-air-alerts-grafana/scripts/run_historical_attack_event_backfill_batch.py"
      - "kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py"
      - "kyiv-air-alerts-grafana/scripts/audit_attack_event_classifier.py"
      - "kyiv-air-alerts-grafana/scripts/discover_historical_attack_events.py"
      - "kyiv-air-alerts-grafana/scripts/run_historical_attack_event_source_adapter_pilot.py"
      - "research/historical_attack_event_source_registry.json"

concurrency:
  group: historical-attack-event-backfill-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  foundation-acceptance:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, 'Run autonomous attack-event backfill foundation acceptance')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'foundation_acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historical-attack-event-backfill-2026-09-27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt
      - name: Run bounded foundation acceptance
        working-directory: kyiv-air-alerts-grafana
        env:
          FOUNDATION_STARTING_HEAD: "b5ee67c95f8adedd217e8b6efae415f5322d7337"
        run: |
          python scripts/run_historical_attack_event_backfill_batch.py \
            --foundation-acceptance \
            --foundation-output ../research/historical_attack_event_autonomous_backfill_foundation_2026-09-27.json
      - name: Guard protected evidence and stale writer
        run: |
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_audited_baseline.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_review_queue.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosions_test.json)"
          test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/dashboard_data.json)"
          test -z "$(git status --porcelain -- 'kyiv-air-alerts-grafana/data/explosion_research/**/final_evidence.json')"
          BASE_HEAD="$(git rev-parse HEAD)"
          git fetch origin historical-attack-event-backfill-2026-09-27
          test "$BASE_HEAD" = "$(git rev-parse origin/historical-attack-event-backfill-2026-09-27)"
      - name: Commit foundation artifact
        run: |
          find kyiv-air-alerts-grafana/scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          CHANGED="$(git status --porcelain --untracked-files=all | awk '{print $2}' | sort)"
          EXPECTED="$(printf '%s\n' \
            research/historical_attack_event_air_defense_action_methodology_update_2026-09-27.json \
            research/historical_attack_event_autonomous_backfill_foundation_2026-09-27.json | sort)"
          test "$CHANGED" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_attack_event_air_defense_action_methodology_update_2026-09-27.json \
            research/historical_attack_event_autonomous_backfill_foundation_2026-09-27.json
          git commit -m "Record air-defense action methodology acceptance"
          git push origin HEAD:historical-attack-event-backfill-2026-09-27

  backfill:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CAMPAIGN_BRANCH: historical-attack-event-backfill-2026-09-27
      CAMPAIGN_ID: ${{ inputs.campaign_id || 'historical-attack-events-v2-2026-09-27' }}
      CITY_KEY: ${{ inputs.city_key || 'auto' }}
      BATCH_SIZE: ${{ inputs.batch_size || '50' }}
      MAX_BATCHES: ${{ inputs.max_batches_per_run || '1' }}
      RESUME: ${{ inputs.resume == false && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historical-attack-event-backfill-2026-09-27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt
      - name: Install dependencies
        working-directory: kyiv-air-alerts-grafana
        run: pip install -r requirements.txt
      - name: Process bounded batches with atomic checkpoints
        shell: bash
        run: |
          set -euo pipefail
          for ((i=1; i<=MAX_BATCHES; i++)); do
            git fetch origin "$CAMPAIGN_BRANCH"
            git rebase "origin/$CAMPAIGN_BRANCH"
            BASE_HEAD="$(git rev-parse HEAD)"
            RESUME_ARG="--resume"
            if [ "$RESUME" = "false" ]; then RESUME_ARG="--no-resume"; fi
            OUT="$(cd kyiv-air-alerts-grafana && python scripts/run_historical_attack_event_backfill_batch.py \
              --campaign-id "$CAMPAIGN_ID" \
              --city-key "$CITY_KEY" \
              --batch-size "$BATCH_SIZE" \
              --output-dir ../research/historical_attack_event_backfill \
              "$RESUME_ARG")"
            printf '%s\n' "$OUT"
            NEW_WORK="$(python -c 'import json,sys; print(json.load(sys.stdin).get("new_work",0))' <<<"$OUT")"
            if [ "$NEW_WORK" = "0" ]; then
              break
            fi
            test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_audited_baseline.json)"
            test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_review_queue.json)"
            test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json)"
            test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosion_candidate_monitor_last_run.json)"
            test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/explosions_test.json)"
            test -z "$(git status --porcelain -- kyiv-air-alerts-grafana/data/dashboard_data.json)"
            test -z "$(git status --porcelain -- 'kyiv-air-alerts-grafana/data/explosion_research/**/final_evidence.json')"
            git fetch origin "$CAMPAIGN_BRANCH"
            test "$BASE_HEAD" = "$(git rev-parse origin/$CAMPAIGN_BRANCH)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/historical_attack_event_backfill_status.json research/historical_attack_event_backfill/
            git commit -m "Checkpoint historical attack-event backfill"
            git push origin "HEAD:$CAMPAIGN_BRANCH"
          done
