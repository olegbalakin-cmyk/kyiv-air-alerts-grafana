name: CASUALTY Work L offline launch-safety and evidence proof
on:
  push:
    branches: [research-casualty-workn-clean-rearm-2026-11-13]
    paths-ignore:
      - research/casualty_one_time_capture_2026_11_13/launch.json
  pull_request:
    branches: [research-casualty-workm-prehttp-ci-fix-2026-11-13]
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 34bc539d0c7abb8af4f699b2e2c9ecec4b668397
          path: _matrix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          path: _pr102
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43053796144
          name: casualty-three-new-original-publisher-excerpts-one-shot
          path: /tmp/casualty-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43261676781
          name: casualty-zap11-approved-http-43261676781-1
          path: /tmp/casualty-receipts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned offline dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Scope, no live launch, all Work E G I J K L tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/casualty_one_time_capture_2026_11_13/launch.json
          test "$(git -C _wip rev-parse HEAD)" = 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          echo '84ffea1315d41b8ec67b55a07273d6bbd7d6e8e14191801402168f7fddf4e5df  /tmp/casualty-original/evidence.json' | sha256sum -c -
          echo '4c21321b8a75d57f60efc97f581e89604eaa03289bb64bfba26e491ac83a203b  /tmp/casualty-receipts/capture_receipts.json' | sha256sum -c -
          mkdir -p /tmp/workl/preflight /tmp/workl/synthetic /tmp/workl/original /tmp/workl/generator /tmp/workl/strict
          python -m unittest research.casualty_evidence_ingestion_2026_11_13.test_ingest research.casualty_controlled_capture_preflight_2026_11_13.test_preflight research.casualty_strict_redirect_2026_11_13.test_redirect research.casualty_fact_retention_workj_2026_11_13.test_workj research.casualty_one_time_capture_2026_11_13.test_workk research.casualty_one_time_capture_2026_11_13.test_workl -v 2>&1 | tee /tmp/workl/tests.log
          python research/casualty_strict_redirect_2026_11_13/verify_offline.py /tmp/workl/strict/redirect.json
          python research/casualty_one_time_capture_2026_11_13/run_capture.py --preflight-only --queue _wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json --output /tmp/workl/preflight
          python -m research.casualty_one_time_capture_2026_11_13.verify_workk --output /tmp/workl/synthetic
      - name: Retained real-original 18 to 20 to 23 generator regression
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --queue _wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json
            --evidence /tmp/casualty-original/evidence.json
            --receipts /tmp/casualty-receipts/capture_receipts.json
            --matrix _matrix/research/casualty_zaporizhzhia_additional_events_2026_11_12/verification_matrix.json
          )
          python research/casualty_evidence_ingestion_2026_11_13/ingest.py "${common[@]}" --output /tmp/workl/original
          python research/casualty_e2e_shadow_2026_11_12/pipeline.py "${common[@]}" \
            --revisions _site/kyiv-air-alerts-grafana/data/casualties/revisions.csv \
            --baseline research/casualty_automated_review_2026_11_10/baseline_coverage.json \
            --city-manifest _site/kyiv-air-alerts-grafana/data/casualties/cities/zaporizhzhia/manifest.json \
            --city-csv _site/kyiv-air-alerts-grafana/data/casualties/cities/zaporizhzhia/zaporizhzhia_air_attack_deaths_monthly.csv \
            --generator _site/kyiv-air-alerts-grafana/scripts/update_casualties.py \
            --dashboard _site/kyiv-air-alerts-grafana/data/dashboard_data.json \
            --ingested-reports /tmp/workl/original/work_a_reports.json \
            --output /tmp/workl/generator
          python research/casualty_evidence_ingestion_2026_11_13/verify_proof.py /tmp/workl/original /tmp/workl/generator
          python research/casualty_one_time_capture_2026_11_13/verify_workl.py --output /tmp/workl
          git diff --exit-code
          git -C _wip diff --exit-code
          git -C _site diff --exit-code
      - name: Upload synthetic proof only (never publisher source HTTP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-workl-three-source-offline-preflight
          path: |
            /tmp/workl/workl-proof.json
            /tmp/workl/tests.log
            /tmp/workl/preflight/*.json
            /tmp/workl/synthetic/*.json
            /tmp/workl/strict/*.json
            /tmp/workl/original/summary.json
            /tmp/workl/generator/summary.json
            /tmp/workl/generator/generator_probe.json
          retention-days: 30
          if-no-files-found: warn

  pre-http:
    name: Exact live-checkout pre-HTTP mock and full safety regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          path: _wip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          path: _pr102
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          path: _site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed without owner launch (before dependency install)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/casualty_one_time_capture_2026_11_13/launch.json
          python - <<'PY'
          from pathlib import Path
          from research.casualty_one_time_capture_2026_11_13 import run_capture as r
          from review_casualty_candidates import load_queue
          q=load_queue(Path('_wip/kyiv-air-alerts-grafana/data/casualties/multicity_review_queue.json'))
          _,template=r.check_scope(q)
          assert template['status']=='NOT_AUTHORIZED'
          try:
              r.validate_launch({},template,q)
          except RuntimeError as exc:
              assert 'NEW_OWNER_GRANT_SCOPE_INVALID' in str(exc), str(exc)
          else:
              raise AssertionError('MISSING_AUTHORIZATION_ACCEPTED')
          print('WORKM_MISSING_OWNER_GRANT_FAIL_CLOSED')
          PY
      - name: Install exact live pre-HTTP extraction dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Full E G I J K L tests, mock owner gates and three-card evidence (sockets blocked)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workm-prehttp
          python -m research.casualty_workm_prehttp_ci_fix_2026_11_13.verify_prehttp --output /tmp/workm-prehttp
      - name: Work N clean branch and fresh owner-gate mock proof (zero GET)
        shell: bash
        run: |
          set -euo pipefail
          python -m research.casualty_workn_clean_rearm_2026_11_13.verify_rearm --output /tmp/workm-prehttp
      - name: Verify immutable checkouts and no launch file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/casualty_one_time_capture_2026_11_13/launch.json
          test "$(git -C _wip rev-parse HEAD)" = 43b580491d54d1df3bd84a0ae59a6987f8ea4d03
          test "$(git -C _pr102 rev-parse HEAD)" = bb553f9285eaa5a9b55f8cf92b3dcb0bbbce97ee
          test "$(git -C _site rev-parse HEAD)" = d0a7d22de2828c93236562cccc9d2e68c6a66e3d
          git diff --exit-code
          git -C _wip diff --exit-code
          git -C _pr102 diff --exit-code
          git -C _site diff --exit-code
      - name: Upload pre-HTTP research-only offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-workm-prehttp-exact-live-checkout
          path: |
            /tmp/workm-prehttp/workm-prehttp-proof.json
            /tmp/workm-prehttp/workn-rearm-proof.json
            research/casualty_workn_clean_rearm_2026_11_13/FINAL_REPORT.md
            /tmp/workm-prehttp/tests.log
            /tmp/workm-prehttp/workk-proof.json
            /tmp/workm-prehttp/workl-proof.json
            /tmp/workm-prehttp/synthetic/*.json
          if-no-files-found: warn
          retention-days: 30
