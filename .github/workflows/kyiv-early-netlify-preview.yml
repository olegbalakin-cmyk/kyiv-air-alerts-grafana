name: Kyiv early 2022 one-shot Netlify PREVIEW browser QA
on:
  push:
    branches:
      - research/kyiv-early-ui-integration-20261117
    paths:
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "kyiv-air-alerts-grafana/tests/kyiv_early_2022_browser_check.cjs"
      - ".github/workflows/kyiv-early-netlify-preview.yml"

permissions:
  contents: read

concurrency:
  group: kyiv-early-2022-one-shot-preview
  cancel-in-progress: false

jobs:
  isolated-preview:
    if: github.ref == 'refs/heads/research/kyiv-early-ui-integration-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_ALIAS: kyiv-early-pr199-20261118
      NETLIFY_SITE: b5aafc46-7468-4070-baf1-db80a4d30501
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      KYIV_EARLY_TEST_PREVIEW_URL: https://kyiv-early-pr199-20261118--ukraine-air-alerts.netlify.app/
      KYIV_EARLY_BROWSER_PROOF_DIR: _preview-proof
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source, offline tests and Netlify production lock
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          node --check kyiv-air-alerts-grafana/pages-preview/kyiv-early-2022-preview.js
          node --check kyiv-air-alerts-grafana/tests/kyiv_early_2022_browser_check.cjs
          node kyiv-air-alerts-grafana/tests/test_kyiv_early_2022_ui_preview.js
          python3 - <<'PY'
          import json, os, urllib.request
          api="https://api.netlify.com/api/v1"
          token=os.environ["NETLIFY_AUTH_TOKEN"]
          site=os.environ["NETLIFY_SITE"]
          def get(path):
              req=urllib.request.Request(api+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as res:return json.load(res)
          current=get("/sites/"+site)
          dep=(current.get("published_deploy") or {}).get("id")
          assert dep and get("/deploys/"+dep).get("locked") is True,"PRODUCTION_NOT_LOCKED"
          from pathlib import Path
          Path("/tmp/kyiv_original_published_deploy.txt").write_text(dep)
          print("NETLIFY_CURRENT_PRODUCTION_LOCKED",dep)
          PY
      - name: Build separate bilingual preview, preserving actual site code
        run: |
          set -euo pipefail
          mkdir -p _site _preview-proof
          for f in index.html styles.css app.js features.json chart-share.js kpi-range.js brand-mark.svg brand-horizontal-uk-dark.svg brand-horizontal-en-dark.svg favicon.svg favicon-32.png kyiv-early-2022-preview.js kyiv-early-2022-preview.json; do
            cp "kyiv-air-alerts-grafana/pages-preview/$f" "_site/$f"
          done
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _site/data.json
          python3 kyiv-air-alerts-grafana/scripts/build_bilingual_html.py --source kyiv-air-alerts-grafana/pages-preview/index.html --output-dir _site
          test -s _site/index.html
          test -s _site/en/index.html
          test -s _site/kyiv-early-2022-preview.json
          test -s _site/kyiv-early-2022-preview.js
          python3 kyiv-air-alerts-grafana/tests/test_bilingual_static_seo.py
          echo "$GITHUB_SHA" > _preview-proof/source_head.sha
      - name: Deploy only disposable preview alias, never production
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest deploy --dir=_site --alias="$PREVIEW_ALIAS" --site="$NETLIFY_SITE" --json > _preview-proof/netlify-preview-deploy.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads(Path("_preview-proof/netlify-preview-deploy.json").read_text())
          assert not receipt.get("production"),"UNEXPECTED_PRODUCTION_DEPLOY"
          target=receipt.get("deploy_url") or receipt.get("url") or ""
          expected=os.environ["KYIV_EARLY_TEST_PREVIEW_URL"].rstrip("/")
          assert target.rstrip("/")==expected,"PREVIEW_ALIAS_URL_DRIFT"
          print("NETLIFY_PREVIEW_URL",expected)
          PY
      - name: Check published production deploy ID and lock unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          previous=Path("/tmp/kyiv_original_published_deploy.txt")
          assert previous.exists(),"PREFLIGHT_DID_NOT_RUN"
          token=os.environ["NETLIFY_AUTH_TOKEN"]
          site=os.environ["NETLIFY_SITE"]
          def get(path):
              req=urllib.request.Request("https://api.netlify.com/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as res:return json.load(res)
          current=get("/sites/"+site)
          published=(current.get("published_deploy") or {}).get("id")
          assert published==previous.read_text(),"PRODUCTION_DEPLOY_CHANGED"
          assert get("/deploys/"+published).get("locked") is True,"PRODUCTION_AUTO_PUBLISH_LOCK_CHANGED"
          print("NETLIFY_PRODUCTION_ID_AND_LOCK_UNCHANGED",published)
          PY
      - name: Browser QA on real preview — UA EN mobile and city switching
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node kyiv-air-alerts-grafana/tests/kyiv_early_2022_browser_check.cjs
      - name: Final immutable production ID and lock readback
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          previous=Path("/tmp/kyiv_original_published_deploy.txt")
          assert previous.exists(),"MISSING_PRODUCTION_SNAPSHOT"
          token=os.environ["NETLIFY_AUTH_TOKEN"]
          site=os.environ["NETLIFY_SITE"]
          def get(path):
              req=urllib.request.Request("https://api.netlify.com/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as res:return json.load(res)
          current=get("/sites/"+site)
          published=(current.get("published_deploy") or {}).get("id")
          assert published==previous.read_text(),"PRODUCTION_DEPLOY_CHANGED"
          assert get("/deploys/"+published).get("locked") is True,"PRODUCTION_AUTO_PUBLISH_LOCK_CHANGED"
          print("FINAL_PRODUCTION_UNCHANGED_LOCKED",published)
          PY
      - name: Upload preview browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-2022-netlify-preview-browser-proof
          path: _preview-proof/
          if-no-files-found: warn
