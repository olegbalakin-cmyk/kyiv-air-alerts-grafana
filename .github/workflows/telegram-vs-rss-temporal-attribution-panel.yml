name: Telegram RSS temporal attribution 14-window panel

on:
  schedule:
    - cron: "45 8 * * *"
    - cron: "45 20 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram-rss-temporal-attribution-panel
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PRODUCTION_CODE_COMMIT: "c26307efcea065813870dc27901dbd225f4f3e33"
      PREDECESSOR_PROOF_HEAD: "636840bf255cdb54d3dae346bb7ef65897405c6b"
      PROOF_TOOLING_COMMIT: "cc8d93bc32689fa657155a0fbbc2eafa8fc7002b"
      LIVE_STATE_BRANCH: "multicity-wip-2026-09-16"
      PANEL_TOOL: ".github/proof/telegram_vs_rss_temporal_attribution_panel.py"
      AUDIT_TOOL: ".github/proof/telegram_vs_rss_temporal_attribution_audit.py"

    steps:
      - name: Check out frozen proof tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_TOOLING_COMMIT }}
          fetch-depth: 0
          path: proofsrc

      - name: Check out latest production monitor state read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIVE_STATE_BRANCH }}
          fetch-depth: 1
          path: live-state

      - name: Resolve pre-registered observation window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python "proofsrc/$PANEL_TOOL" resolve             --now "$now"             --cron '${{ github.event.schedule }}'             --github-output "$GITHUB_OUTPUT"

      - name: Suppress duplicate observation after any valid artifact
        id: prior
        if: steps.window.outputs.in_panel == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="telegram-rss-temporal-panel-window-${{ steps.window.outputs.window_id }}"
          mkdir -p /tmp/panel/prior
          response="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100")"
          found_valid=false
          for id in $(printf '%s' "$response" | jq -r '.artifacts[] | select(.expired == false) | .id'); do
            zip="/tmp/panel/prior/$id.zip"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$zip"
            entry="$(unzip -Z1 "$zip" | grep -E 'window_.*\.json$' | head -n 1 || true)"
            [ -n "$entry" ] || continue
            manifest="/tmp/panel/prior/$id.json"
            unzip -p "$zip" "$entry" > "$manifest"
            status="$(python - "$manifest" <<'PY'
          import json, sys
          obj=json.load(open(sys.argv[1], encoding="utf-8"))
          print((obj.get("window") or {}).get("status") or "")
          PY
            )"
            if [ "$status" = "VALID" ]; then
              found_valid=true
              break
            fi
          done
          if [ "$found_valid" = true ]; then
            echo "should_observe=false" >> "$GITHUB_OUTPUT"
            echo "Valid artifact already exists; suppressing duplicate live observation."
          else
            echo "should_observe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert frozen production code and inject only latest read-only state
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/panel
          test -z "$(git -C proofsrc diff --name-only "$PRODUCTION_CODE_COMMIT"...HEAD -- kyiv-air-alerts-grafana)"
          test "$(git -C proofsrc rev-parse "$PRODUCTION_CODE_COMMIT:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")" = "$(git -C proofsrc rev-parse "HEAD:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")"
          test "$(git -C proofsrc rev-parse "$PREDECESSOR_PROOF_HEAD:.github/proof/telegram_vs_rss_temporal_attribution_audit.py")" = "$(git -C proofsrc rev-parse "HEAD:.github/proof/telegram_vs_rss_temporal_attribution_audit.py")"

          state_src="live-state/kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json"
          state_dst="proofsrc/kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json"
          test -s "$state_src"
          cp "$state_src" "$state_dst"

          live_commit="$(git -C live-state rev-parse HEAD)"
          expected_monitor_blob="$(git -C proofsrc rev-parse "$PRODUCTION_CODE_COMMIT:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")"
          actual_monitor_blob="$(git -C proofsrc rev-parse "HEAD:kyiv-air-alerts-grafana/scripts/monitor_explosion_candidates.py")"
          state_sha256="$(sha256sum "$state_dst" | awk '{print $1}')"

          python - "$live_commit" "$expected_monitor_blob" "$actual_monitor_blob" "$state_sha256" <<'PY'
          import json, sys
          from pathlib import Path
          live_commit, expected_blob, actual_blob, state_sha = sys.argv[1:]
          payload = {
              "expected_production_code_commit": "c26307efcea065813870dc27901dbd225f4f3e33",
              "proof_tooling_commit": "cc8d93bc32689fa657155a0fbbc2eafa8fc7002b",
              "production_code_byte_identical": expected_blob == actual_blob,
              "production_tree_diff_paths": [],
              "monitor_blob_expected": expected_blob,
              "monitor_blob_actual": actual_blob,
              "live_state_source_branch": "multicity-wip-2026-09-16",
              "live_state_source_commit": live_commit,
              "live_state_file": "kyiv-air-alerts-grafana/data/explosion_candidate_monitor_state.json",
              "live_state_sha256": state_sha,
              "live_state_injected_read_only_into_disposable_checkout": True,
              "source_coverage_baseline_frozen_to_production_code_commit": True,
          }
          Path("/tmp/panel/code_identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Database environment unexpectedly present: $key"; exit 1; }
          done

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          roots = [
              Path("proofsrc/kyiv-air-alerts-grafana/data"),
              Path("proofsrc/kyiv-air-alerts-grafana/research"),
              Path("proofsrc/research"),
          ]
          manifest = {}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  manifest[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path("/tmp/panel/protected.before.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Set up Python
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proofsrc/kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        working-directory: proofsrc/kyiv-air-alerts-grafana
        run: python -m pip install -r requirements.txt

      - name: Validate frozen harness and production monitor
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "proofsrc/$PANEL_TOOL" "proofsrc/$AUDIT_TOOL"
          (cd proofsrc/kyiv-air-alerts-grafana && python scripts/monitor_explosion_candidates.py --self-test)

      - name: Run exactly one live non-persisting observation
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        id: observation
        shell: bash
        run: |
          set +e
          (
            cd proofsrc
            PRODUCTION_CODE_COMMIT="$PRODUCTION_CODE_COMMIT"             GITHUB_SHA="$PROOF_TOOLING_COMMIT"             GITHUB_REF_NAME="telegram-vs-rss-temporal-attribution-panel-2026-10-05"             python "$AUDIT_TOOL"
          )
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/panel/observation_rc.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove zero mutation after observation
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          roots = [
              Path("proofsrc/kyiv-air-alerts-grafana/data"),
              Path("proofsrc/kyiv-air-alerts-grafana/research"),
              Path("proofsrc/research"),
          ]
          after = {}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  after[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()

          before = json.loads(Path("/tmp/panel/protected.before.json").read_text(encoding="utf-8"))
          changed = sorted(
              key for key in set(before) | set(after) if before.get(key) != after.get(key)
          )
          Path("/tmp/panel/protected.after.json").write_text(
              json.dumps(after, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          scripts_dirty = subprocess.run(
              ["git", "-C", "proofsrc", "diff", "--quiet", "--", "kyiv-air-alerts-grafana/scripts"],
              check=False,
          ).returncode != 0
          live_state_dirty = bool(
              subprocess.check_output(
                  ["git", "-C", "live-state", "status", "--porcelain=v1"],
                  text=True,
              ).strip()
          )

          def changed_suffix(suffix):
              return any(path.endswith(suffix) for path in changed)

          persisted = bool(changed)
          historical = changed_suffix("explosion_candidate_monitor_state.json")
          review = changed_suffix("explosion_review_queue.json")
          canonical = changed_suffix("alerts_combined.json")
          mutation = {
              "production_code_mutations": int(scripts_dirty),
              "classifier_mutations": int(scripts_dirty),
              "temporal_parser_policy_mutations": int(scripts_dirty),
              "discovery_mutations": int(scripts_dirty),
              "source_adapter_mutations": int(scripts_dirty),
              "persisted_evidence_mutations": int(persisted or live_state_dirty),
              "historical_state_queue_mutations": int(historical or live_state_dirty),
              "review_queue_mutations": int(review),
              "canonical_alerts_mutations": int(canonical),
              "neon_db_mutations": 0,
              "deployments": 0,
              "changed_protected_paths": changed,
              "live_state_checkout_dirty": live_state_dirty,
          }
          Path("/tmp/panel/mutation_proof.json").write_text(
              json.dumps(mutation, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(mutation, sort_keys=True))
          PY

      - name: Build immutable window manifest
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          rc="$(cat /tmp/panel/observation_rc.txt)"
          failure=""
          if [ "$rc" -ne 0 ]; then
            failure="EXECUTION_FAILURE"
          elif [ ! -s /tmp/telegram-vs-rss-temporal-audit/telegram_vs_rss_temporal_attribution_live_audit_v1.json ]; then
            failure="NO_VALID_OBSERVATION_ARTIFACT"
          elif ! python - <<'PY'
          import json
          p=json.load(open("/tmp/panel/mutation_proof.json", encoding="utf-8"))
          keys=[
            "production_code_mutations","classifier_mutations","temporal_parser_policy_mutations",
            "discovery_mutations","source_adapter_mutations","persisted_evidence_mutations",
            "historical_state_queue_mutations","review_queue_mutations",
            "canonical_alerts_mutations","neon_db_mutations","deployments",
          ]
          raise SystemExit(0 if all(int(p.get(k,0) or 0)==0 for k in keys) else 1)
          PY
          then
            failure="MUTATION_PROOF_FAILED"
          fi

          out="/tmp/panel/window_${{ steps.window.outputs.window_id }}.json"
          python "proofsrc/$PANEL_TOOL" window             --window-index "${{ steps.window.outputs.window_index }}"             --scheduled-utc "${{ steps.window.outputs.scheduled_utc }}"             --scheduled-local "${{ steps.window.outputs.scheduled_local }}"             --cron "${{ steps.window.outputs.cron }}"             --raw-audit /tmp/telegram-vs-rss-temporal-audit/telegram_vs_rss_temporal_attribution_live_audit_v1.json             --mutation-proof /tmp/panel/mutation_proof.json             --code-identity /tmp/panel/code_identity.json             --observation-exit-code "$rc"             --failure-reason "$failure"             --actions-run-id "$GITHUB_RUN_ID"             --run-attempt "$GITHUB_RUN_ATTEMPT"             --workflow-sha "$GITHUB_SHA"             --proof-tooling-commit "$PROOF_TOOLING_COMMIT"             --out "$out"
          echo "window_manifest=$out" >> "$GITHUB_OUTPUT"

      - name: Gather all prior window attempts without new fetching
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/panel/history /tmp/panel/downloads
          for i in $(seq -w 1 14); do
            wid="W$i"
            name="telegram-rss-temporal-panel-window-$wid"
            response="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100")"
            for id in $(printf '%s' "$response" | jq -r '.artifacts[] | select(.expired == false) | .id'); do
              zip="/tmp/panel/downloads/$id.zip"
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$zip"
              entry="$(unzip -Z1 "$zip" | grep -E 'window_.*\.json$' | head -n 1 || true)"
              [ -n "$entry" ] || continue
              unzip -p "$zip" "$entry" > "/tmp/panel/history/window_${wid}_artifact_${id}.json"
            done
          done
          cp "${{ steps.manifest.outputs.window_manifest }}"              "/tmp/panel/history/window_${{ steps.window.outputs.window_id }}_current_${GITHUB_RUN_ID}.json"

      - name: Build cumulative unique-evidence and matched-cluster panel
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python "proofsrc/$PANEL_TOOL" aggregate             --input-dir /tmp/panel/history             --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --out /tmp/panel/telegram_vs_rss_temporal_attribution_multiwindow_panel_v1.json             --summary-out /tmp/panel/summary.json

      - name: Upload immutable window artifact
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-rss-temporal-panel-window-${{ steps.window.outputs.window_id }}
          path: |
            ${{ steps.manifest.outputs.window_manifest }}
            ${{ steps.manifest.outputs.window_manifest }}.sha256
            /tmp/panel/code_identity.json
            /tmp/panel/mutation_proof.json
            /tmp/panel/protected.before.json
            /tmp/panel/protected.after.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload cumulative panel artifact
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-rss-temporal-panel-cumulative-${{ steps.window.outputs.window_id }}
          path: |
            /tmp/panel/telegram_vs_rss_temporal_attribution_multiwindow_panel_v1.json
            /tmp/panel/telegram_vs_rss_temporal_attribution_multiwindow_panel_v1.json.sha256
            /tmp/panel/summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark invalid scheduled observation as failed
        if: steps.window.outputs.in_panel == 'true' && steps.prior.outputs.should_observe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.manifest.outputs.window_manifest }}" <<'PY'
          import json, sys
          obj=json.load(open(sys.argv[1], encoding="utf-8"))
          status=(obj.get("window") or {}).get("status")
          print("WINDOW_STATUS="+str(status))
          raise SystemExit(0 if status == "VALID" else 1)
          PY
