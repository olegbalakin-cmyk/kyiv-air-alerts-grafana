name: H2 ACL physical semantic decision PG18 A B
on:
  push:
    branches: [research-h2-acl-physical-semantic-dossier-2026-10-21-gpt6]
    paths:
      - '.github/workflows/h2-acl-physical-semantic-dossier-2026-10-21.yml'
      - 'research/h2_acl_physical_dossier_2026_10_21/**'
permissions:
  contents: read
jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12" requests beautifulsoup4
      - name: Execute seven ACL physical and semantic A B
        run: python research/h2_acl_physical_dossier_2026_10_21/test_dossier.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-acl-decision-${{ matrix.copy }}
          path: /tmp/h2_acl_decision_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
