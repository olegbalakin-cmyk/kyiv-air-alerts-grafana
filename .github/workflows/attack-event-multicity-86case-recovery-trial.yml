name: Attack-event multicity 86-case factual recovery trial

on:
  push:
    branches:
      - attack-event-multicity-86case-representability-recovery-2026-10-07
    paths:
      - ".github/proof/attack_event_multicity_86case_recovery_trial.py"
      - ".github/workflows/attack-event-multicity-86case-recovery-trial.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attack-event-multicity-86case-representability-recovery-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Assert no database configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL NEON_DATABASE_URL NEON_URL PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            test -z "${!key-}" || { echo "Unexpected DB environment variable: $key"; exit 1; }
          done
      - name: Run recovery trial
        run: python .github/proof/attack_event_multicity_86case_recovery_trial.py /tmp/recovery-trial.json
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-trial-${{ github.run_id }}
          path: /tmp/recovery-trial.json
          if-no-files-found: error
          retention-days: 30
