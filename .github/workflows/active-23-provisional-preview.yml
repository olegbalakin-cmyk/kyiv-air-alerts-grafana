name: C2 provisional 23-city proof + draft preview (TEST ONLY)
on:
  push:
    branches: [test/active-provisional-23-20261120]
    paths:
      - "kyiv-air-alerts-grafana/scripts/build_active_23_preview.py"
      - "kyiv-air-alerts-grafana/pages-preview/**"
      - "tests/test_active_23_provisional.cjs"
      - ".github/workflows/active-23-provisional-preview.yml"
      - "netlify.toml"
permissions:
  contents: read
  actions: read
concurrency:
  group: active-23-provisional-test-only
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parser dependencies
        run: python -m pip install -r kyiv-air-alerts-grafana/requirements.txt
      - name: Download exact immutable C2 archive; no source HTTP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/active23
          gh run download 44680696823 -R "$GITHUB_REPOSITORY" -n c2-shadow-inputs-44680696823-1 -D /tmp/active23
          test -s /tmp/active23/c2-shadow-inputs.zip
          python kyiv-air-alerts-grafana/scripts/build_active_23_preview.py \
            --bundle /tmp/active23/c2-shadow-inputs.zip \
            --expected-sha256 3f822042ceaaea06746dca2683f5fcc7eabf1dc6539752db2069f9aaf464d641 \
            --run-id 44680696823 --attempt 1 \
            --output /tmp/active23/active-23-provisional-test.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/active23/active-23-provisional-test.json'))
          assert d['count_cities'] == 23
          assert d['count_source_open'] == 22
          assert d['count_source_no_open'] == 1
          assert d['cities']['sevastopol']['state'] == 'no_open_at_source_capture'
          assert d['cities']['kyiv']['state'] == 'open_at_source_capture'
          assert d['publication_allowed'] is False
          print("23_CITY_PILOT_PROVENANCE_AND_COUNTS_PASS",d['count_source_open'])
          PY
      - name: Upload test JSON proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-23-provisional-proof-${{ github.run_id }}
          path: /tmp/active23/active-23-provisional-test.json
          if-no-files-found: warn
          retention-days: 7
