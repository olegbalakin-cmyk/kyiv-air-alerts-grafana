name: H2 isolated integrated H11 R09 PG18 A B
on:
  push:
    branches: [research-h2-integrated-failclosed-preflight-2026-10-21-gpt6]
    paths:
      - '.github/workflows/h2-integrated-h11-r09-2026-10-21.yml'
      - 'research/h2_integrated_preflight_2026-10-21/**'
permissions:
  contents: read
jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: h2_local
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h2_local -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      H2_COPY: ${{ matrix.copy }}
      H2_PG18_OWNER_DSN: postgresql://h2_local:synthetic_only@127.0.0.1:5432/postgres
      H2_PG18_WRITER_DSN: postgresql://h2_app_ingest_writer_test:synthetic_only_local_role@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1cf86ac0eaee1b1de246022c19acbb58037948
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]==3.2.12"
      - name: Confirm pinned accepted original H11 R09 ACL ZIP and JSON evidence
        run: python research/h2_six_original_ab_evidence_2026-10-20/verify_git_only.py
      - name: Integrated executable fail-closed migration and adversarial cases
        run: python research/h2_integrated_preflight_2026-10-21/test_gate.py
      - name: Original CAS 77 plus 67 topology checks on accepted 007
        if: always()
        run: python research/h2_full_cas_007_2026-10-20/test_integrated_007_cas.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-integrated-h11-r09-${{ matrix.copy }}
          path: |
            /tmp/h2_integrated_preflight_${{ matrix.copy }}.json
            /tmp/h2_integrated_007_${{ matrix.copy }}.json
          if-no-files-found: warn
          retention-days: 30
