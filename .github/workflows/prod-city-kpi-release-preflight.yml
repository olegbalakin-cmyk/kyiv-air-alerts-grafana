name: Verify production-ready city KPI release (isolated)
on:
  push:
    branches: [release-city-kpi-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact production SEO and excluded WIP
        run: |
          grep -q 'name="robots" content="index,follow,max-snippet:-1"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q 'rel="canonical" href="https://ukraine-air-alerts.netlify.app/"' kyiv-air-alerts-grafana/pages-preview/index.html
          grep -q '"attack_events": false' kyiv-air-alerts-grafana/pages-preview/features.json
          ! grep -q 'chart-share-test-20261019--ukraine-air-alerts.netlify.app' kyiv-air-alerts-grafana/pages-preview/index.html
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node --check kyiv-air-alerts-grafana/pages-preview/kpi-range.js
          node kyiv-air-alerts-grafana/tests/test_chart_share.js
          node kyiv-air-alerts-grafana/tests/test_calendar_week.js
          node kyiv-air-alerts-grafana/tests/test_daily28_rollover.js
          node kyiv-air-alerts-grafana/tests/test_dynamic_city_kpi.js
          node kyiv-air-alerts-grafana/tests/test_historical_max.js
          node kyiv-air-alerts-grafana/tests/test_city_period_kpi_sync.js
          node kyiv-air-alerts-grafana/tests/test_kpi_interval_windows.js
          node kyiv-air-alerts-grafana/tests/test_all_time_period.js
          node kyiv-air-alerts-grafana/tests/test_live_history_binding.js
          grep -q "historical-daily-kpi.json" .github/workflows/netlify-production.yml
          grep -q "kpi-range.js" .github/workflows/netlify-production.yml
          grep -q "data\\[\\\"historical_daily_kpi\\\"\\]" kyiv-air-alerts-grafana/scripts/apply_site_rolling_7d.py
      - name: Install dependencies and prove independent historical KPI generation
        run: |
          python -m pip install -r kyiv-air-alerts-grafana/requirements.txt
          python kyiv-air-alerts-grafana/tests/test_monthly_seconds.py
          python kyiv-air-alerts-grafana/scripts/build_preview_historical_daily.py \
            --production-root kyiv-air-alerts-grafana \
            --source-sha "$(git rev-parse HEAD)" \
            --output historical-daily-kpi.json
          python - <<'PY'
          import json
          with open("historical-daily-kpi.json", encoding="utf-8") as f:
              index=json.load(f)
          assert index["meta"]["verified_count"] == 23
          assert len(index["cities"]) == 23
          assert index["cities"]["kyiv"]["status"] == "verified"
          print("PASS RELEASE data and source parity: 23/23")
          PY
      - name: Verify production build contract without deployment
        run: |
          mkdir -p _site
          cp kyiv-air-alerts-grafana/pages-preview/{index.html,styles.css,app.js,kpi-range.js,features.json,chart-share.js,brand-mark.svg,brand-horizontal-uk-dark.svg,brand-horizontal-en-dark.svg,favicon.svg,favicon-32.png} historical-daily-kpi.json _site/
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 12
          test -s _site/historical-daily-kpi.json
          test -s _site/kpi-range.js
          echo "PASS: production-shaped static bundle; no deploy or branch writes"
