name: Casualty October partial-month UI isolated preview (NO PUBLISH)
on:
  push:
    branches: [research-casualty-october-ui-preview-2026-11-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.ref == 'refs/heads/research-casualty-october-ui-preview-2026-11-22'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and 23-city semantic safeguards
        run: |
          set -euo pipefail
          node --check kyiv-air-alerts-grafana/pages-preview/casualty-partial-preview.js
          node --check kyiv-air-alerts-grafana/pages-preview/app.js
          node tests/test_casualty_partial_preview.cjs
          python kyiv-air-alerts-grafana/scripts/build_bilingual_html.py --source kyiv-air-alerts-grafana/pages-preview/index.html --output-dir /tmp/casualty-uaen
          test "$(grep -c 'casualty-partial-preview.js' /tmp/casualty-uaen/index.html)" -eq 1
          test "$(grep -c 'casualty-partial-preview.js' /tmp/casualty-uaen/en/index.html)" -eq 1
          ! grep -R 'netlify deploy --prod' .github/workflows/casualty-partial-ui-preview.yml
          echo CASUALTY_ISOLATED_UI_OFFLINE_PASS
      - name: Verify production data and protected branches were not used as output
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- kyiv-air-alerts-grafana/data/dashboard_data.json kyiv-air-alerts-grafana/data/casualties/
          test -f kyiv-air-alerts-grafana/pages-preview/casualty-october-2026-preview.json
          python - <<'PY'
          import json
          p=json.load(open('kyiv-air-alerts-grafana/pages-preview/casualty-october-2026-preview.json',encoding='utf-8'))
          assert p['promotion']=='OFF'
          assert p['display_policy']=='PREVIEW_ONLY_NO_SITE_MUTATION'
          assert p['known_civilian_fatalities_from_these_events']==11
          PY

      - name: Assemble isolated immutable Netlify preview (not production)
        run: |
          set -euo pipefail
          mkdir -p _casualty239_site
          cp kyiv-air-alerts-grafana/pages-preview/{index.html,styles.css,app.js,features.json,chart-share.js,kpi-range.js,weekday-distribution.js,weekday-ui.js,weekday-dayparts.json,active-23-provisional.js,active-23-chart-overlay.js,brand-mark.svg,brand-horizontal-uk-dark.svg,brand-horizontal-en-dark.svg,favicon.svg,favicon-32.png,casualty-partial-preview.js,casualty-october-2026-preview.json,kyiv_threat_mix_archive.json} _casualty239_site/
          cp kyiv-air-alerts-grafana/data/dashboard_data.json _casualty239_site/data.json
          python kyiv-air-alerts-grafana/scripts/build_bilingual_html.py --source kyiv-air-alerts-grafana/pages-preview/index.html --output-dir _casualty239_site
          printf 'User-agent: *\nDisallow: /\n' > _casualty239_site/robots.txt
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("_casualty239_site")
          sidecar=root/"casualty-october-2026-preview.json"
          blob=b"blob "+str(len(sidecar.read_bytes())).encode()+b"\0"+sidecar.read_bytes()
          assert hashlib.sha1(blob).hexdigest()=="9ebeacf2e32e1023766f64ddfadf2ba3b8dbab55"
          assert json.loads((root/"features.json").read_text())["casualty_partial_preview"] is True
          bundle={f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob("*") if f.is_file()}
          pathlib.Path("casualty-239-bundle-sha256.json").write_text(json.dumps(bundle,indent=2,sort_keys=True)+"\n")
          print("CASUALTY_239_FROZEN_BUNDLE_PASS",len(bundle))
          PY
      - name: Deploy only to separate preview site (draft URL, no --prod)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest deploy --dir=_casualty239_site --site=42159ba4-a142-4c7b-ad42-9b6ba4de4dcb --auth="$NETLIFY_AUTH_TOKEN" --json > casualty-239-preview-deploy.json
          python - <<'PY'
          import json
          x=json.load(open("casualty-239-preview-deploy.json"))
          u=x.get("deploy_url")
          assert u and "casualty-partial-239-draft-preview.netlify.app" in u,u
          assert x.get("site_id") in (None,"42159ba4-a142-4c7b-ad42-9b6ba4de4dcb")
          print("ISOLATED_CASUALTY_DRAFT_URL",u)
          PY
      - name: Real browser QA UA and EN (desktop and mobile)
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/casualty239-puppeteer
          npm --prefix /tmp/casualty239-puppeteer install --no-audit --no-fund --no-save puppeteer-core@24
          export NODE_PATH=/tmp/casualty239-puppeteer/node_modules
          export PREVIEW_URL="$(python - <<'PY'
          import json
          x=json.load(open("casualty-239-preview-deploy.json"))
          print(x["deploy_url"].replace("http://","https://",1))
          PY
          )"
          node tests/smoke_casualty_partial_239.cjs
      - name: Preserve exact proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casualty-239-draft-browser-proof
          path: |
            casualty-239-preview-deploy.json
            casualty-239-bundle-sha256.json
            casualty-239-browser.json
            casualty-239-uk.png
            casualty-239-en.png
          if-no-files-found: ignore
          retention-days: 30
