              event_sem_cols = EVENT_COLS
              source_sem_cols = SOURCE_COLS

              def compare_table(table, key_col, cols, expected_rows, expected_key, transform_expected):
                  cur.execute("SELECT " + ",".join(cols) + f" FROM public.{table} ORDER BY {key_col}")
                  db_rows = cur.fetchall()
                  exp = sorted(expected_rows, key=lambda r: str(r[expected_key]))
                  if len(db_rows) != len(exp):
                      return len(exp)
                  mismatches = 0
                  for dbrow, erow in zip(db_rows, exp):
                      ex = transform_expected(erow)
                      if normalize(list(dbrow)) != normalize([ex[c] for c in cols]):
                          mismatches += 1
                  return mismatches

              class_conflicts = compare_table(
                  "attack_event_classifications","classification_key",class_sem_cols,class_rows,"classification_key",lambda r:r
              )
              event_conflicts = compare_table(
                  "attack_events","attack_event_key",event_sem_cols,event_rows,"attack_event_key",
                  lambda r: {**r, "current_classification_uid": uid_map[r["classification_key_v2"]]}
              )
              source_conflicts = compare_table(
                  "attack_event_sources","source_link_key",source_sem_cols,source_rows,"source_link_key",
                  lambda r: {**r, "classification_uid": uid_map[r["classification_key_v2"]]}
              )
              semantic_conflicts = class_conflicts + event_conflicts + source_conflicts
              if semantic_conflicts:
                  fail("PASS_B_SEMANTIC_CONFLICT", phase=phase, count=semantic_conflicts)

              before = {}
              for t in ("attack_event_classifications","attack_events","attack_event_sources"):
                  cur.execute(f"SELECT count(*) FROM public.{t}")
                  before[t] = int(cur.fetchone()[0])
              cur.executemany(class_sql + " ON CONFLICT DO NOTHING", [class_params(r) for r in class_rows])
              cur.executemany(event_sql + " ON CONFLICT DO NOTHING", [event_params(r, uid_map) for r in event_rows])
              cur.executemany(source_sql + " ON CONFLICT DO NOTHING", [source_params(r, uid_map) for r in source_rows])
              after = {}
              for t in ("attack_event_classifications","attack_events","attack_event_sources"):
                  cur.execute(f"SELECT count(*) FROM public.{t}")
                  after[t] = int(cur.fetchone()[0])
              replay = {k: after[k]-before[k] for k in before}
              if any(replay.values()):
                  fail("PASS_B_NON_IDEMPOTENT_INSERT", phase=phase, detail=str(replay))
              result["replay_inserts"] = {
                  "classifications": replay["attack_event_classifications"],
                  "events": replay["attack_events"],
                  "source_links": replay["attack_event_sources"],
              }
              result["semantic_conflicts"] = 0

              # PHASE 6: explicit outer rollback via client transaction rollback; no COMMIT is issued.
              phase = "OUTER_ROLLBACK"
              rollback_outer()
              write_conn.close()
              write_conn = None

              # PHASE 7: fresh read-only post-rollback verification.
              phase = "POST_ROLLBACK"
              post_rollback_safety()
              if result.get("attack_event_tables_after_rollback") != 0:
                  fail("POST_ROLLBACK_ATTACK_EVENT_TABLES_REMAIN", phase=phase)
              if result.get("committed_attack_event_rows") != 0:
                  fail("POST_ROLLBACK_COMMITTED_ROWS_PRESENT", phase=phase)
              if result.get("ingestion_runs_delta") != 0:
                  fail("POST_ROLLBACK_INGESTION_RUNS_DELTA", phase=phase, count=result.get("ingestion_runs_delta"))
              if result.get("protected_alert_episodes_unchanged") is not True:
                  fail("POST_ROLLBACK_PROTECTED_PARENT_STATE_CHANGED", phase=phase)
              result["committed_db_mutations"] = 0
              result["committed_ddl_mutations"] = 0
              result["verdict"] = "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF PASSED"
              result["first_failing_gate"] = None
              result["phase"] = "COMPLETE"
              result["remaining_representability_gaps"] = []
              result["safe_continuation_point"] = "Proof complete. Do not proceed to real persistence in this task."
              PROOF_PATH.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print("VERDICT=" + result["verdict"])
              print("EXHAUSTIVE_OFFLINE_REPRESENTABILITY=PASS")
              print("REMAINING_REPRESENTABILITY_GAPS=0")
              print("EFFECTIVE_CANDIDATE_DDL_SHA256=" + result["effective_candidate_ddl_sha256"])
              print("PARENT_VALIDATION=PASS")
              print("FORCED_FAILURE_ATOMICITY=PASS")
              print("PASS_A_CLASSIFICATIONS=26405")
              print("PASS_A_EVENTS=1080")
              print("PASS_A_SOURCES=3769")
              print("REPLAY_CLASSIFICATION_INSERTS=0")
              print("REPLAY_EVENT_INSERTS=0")
              print("REPLAY_SOURCE_INSERTS=0")
              print("SEMANTIC_CONFLICTS=0")
              print("OUTER_ROLLBACK=PASS")
              print("COMMITTED_NEON_MUTATIONS=0")

          except GateError as exc:
              try:
                  rollback_outer()
              except Exception as rb_exc:
                  result["rollback_error_type"] = type(rb_exc).__name__
              if write_conn is not None:
                  try:
                      write_conn.close()
                  except Exception:
                      pass
                  write_conn = None
              if result.get("db_preflight_ran"):
                  try:
                      post_rollback_safety()
                  except Exception as safety_exc:
                      result["post_rollback_safety_error"] = type(safety_exc).__name__ + ":" + safe_error(safety_exc)
              result.update({
                  "verdict": "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF BLOCKED",
                  "first_failing_gate": exc.gate,
                  "phase": exc.phase or phase,
                  "affected_table_or_contract_field": {"table": exc.table, "field": exc.field} if (exc.table or exc.field) else None,
                  "affected_row_count": exc.count,
                  "committed_db_mutations": 0 if result.get("attack_event_tables_after_rollback") in (0, None) else None,
                  "production_mutation": "NO",
                  "safe_continuation_point": (
                      "Do not repair this blocker in the same task. Resume only from the reported gate after a separately frozen contract/addendum if required."
                  ),
              })
              if exc.detail is not None:
                  result["compact_diagnostic"] = str(exc.detail)[:500]
              PROOF_PATH.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print("VERDICT=" + result["verdict"], file=sys.stderr)
              print("FIRST_FAILING_GATE=" + exc.gate, file=sys.stderr)
              print("PHASE=" + str(result["phase"]), file=sys.stderr)
              if exc.table:
                  print("AFFECTED_TABLE=" + str(exc.table), file=sys.stderr)
              if exc.field:
                  print("AFFECTED_FIELD=" + str(exc.field), file=sys.stderr)
              if exc.count is not None:
                  print("AFFECTED_COUNT=" + str(exc.count), file=sys.stderr)
              for i, gap in enumerate(result.get("remaining_representability_gaps", [])[:10], 1):
                  print(
                      "REPRESENTABILITY_GAP_" + str(i) + "=" +
                      str(gap.get("table")) + "." + str(gap.get("field")) +
                      ";count=" + str(gap.get("affected_count")) +
                      ";reason=" + re.sub(r"[^A-Za-z0-9_ .,:;=/+-]", "?", str(gap.get("reason")))[:220],
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          except Exception as exc:
              try:
                  rollback_outer()
              except Exception:
                  pass
              if write_conn is not None:
                  try:
                      write_conn.close()
                  except Exception:
                      pass
              if result.get("db_preflight_ran"):
                  try:
                      post_rollback_safety()
                  except Exception:
                      pass
              result.update({
                  "verdict": "ATTACK-EVENT 23-CITY ROLLBACK-ONLY PERSISTENCE PROOF BLOCKED",
                  "first_failing_gate": "EXECUTION_HARNESS_FAILURE",
                  "phase": phase,
                  "affected_table_or_contract_field": None,
                  "affected_row_count": None,
                  "compact_diagnostic": type(exc).__name__ + ":" + safe_error(exc),
                  "production_mutation": "NO",
                  "safe_continuation_point": "Fix proof tooling only; do not repair frozen data and do not proceed to real persistence.",
              })
              PROOF_PATH.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              print("VERDICT=" + result["verdict"], file=sys.stderr)
              print("FIRST_FAILING_GATE=EXECUTION_HARNESS_FAILURE", file=sys.stderr)
              print("PHASE=" + phase, file=sys.stderr)
              print("ERROR_TYPE=" + type(exc).__name__, file=sys.stderr)
              raise SystemExit(1)
          PY

