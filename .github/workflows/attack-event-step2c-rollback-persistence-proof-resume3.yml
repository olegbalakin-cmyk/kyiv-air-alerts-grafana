              "production_mutation": x.get("production_mutation"),
              "credentials_exposed": x.get("credentials_exposed"),
              "safe_continuation_point": x.get("safe_continuation_point"),
          }
          print("PROOF_METADATA=" + json.dumps(compact, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Persist durable proof artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/attack-event-step2c-rollback-persistence-proof-resume3/attack_event_23city_rollback_persistence_proof_2026-10-06.json"
          dst="research/attack_event_23city_rollback_persistence_proof_2026-10-06.json"
          test -s "$src"
          mkdir -p research
          cp "$src" "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -m "Freeze 23-city rollback persistence proof"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "DURABLE_ARTIFACT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload rollback persistence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-event-23city-rollback-persistence-proof-2026-10-06
          path: ${{ runner.temp }}/attack-event-step2c-rollback-persistence-proof-resume3/attack_event_23city_rollback_persistence_proof_2026-10-06.json
          if-no-files-found: error
          retention-days: 30
