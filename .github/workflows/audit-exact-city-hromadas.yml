name: Audit exact-city hromada coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/audit_exact_city_hromadas.py"
      - ".github/workflows/audit-exact-city-hromadas.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install "requests>=2.32,<3"

      - name: Audit exact-city hromadas
        run: python scripts/audit_exact_city_hromadas.py

      - name: Commit outputs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data/exact_city_hromada_audit.csv kyiv-air-alerts-grafana/data/exact_city_hromada_audit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update exact-city hromada audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
