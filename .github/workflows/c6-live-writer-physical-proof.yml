name: C6 protected child physical writer proof
on:
  push:
    branches: [research-neon-live-writer-freshness-2026-10-31]
    paths:
      - '.github/workflows/c6-live-writer-physical-proof.yml'
permissions:
  contents: read
concurrency:
  group: c6-existing-child-physical-proof
  cancel-in-progress: false
jobs:
  physical-proof:
    if: github.repository == 'olegbalakin-cmyk/kyiv-air-alerts-grafana' && github.ref == 'refs/heads/research-neon-live-writer-freshness-2026-10-31'
    environment: c6-live-writer-proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: research-repo
      - name: Immutable original Phase-1 code and consumer builder; no deploy
        uses: actions/checkout@v4
        with:
          ref: c6636e838cc5ca1da3f250091bb1c5c0ff08229e
          persist-credentials: false
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install writer and pure builder dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Child credential preflight then original COMMIT crash retry readback and bounded JSON
        env:
          NEON_ISOLATED_PROOF_DATABASE_URL: ${{ secrets.NEON_ISOLATED_PROOF_DATABASE_URL }}
        run: |
          python research-repo/research/neon_live_writer_freshness_2026_10_31/run_physical_03.py \
            --site site/kyiv-air-alerts-grafana \
            --output physical-proof
      - name: Preserve proof even when credential or writer gate blocks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-child-physical-proof-${{ github.run_id }}
          path: physical-proof/
          if-no-files-found: warn
          retention-days: 30
  save-proof:
    needs: physical-proof
    if: always() && github.ref == 'refs/heads/research-neon-live-writer-freshness-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-neon-live-writer-freshness-2026-10-31
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: c6-child-physical-proof-${{ github.run_id }}
          path: research/neon_live_writer_freshness_2026_10_31/proof/physical_03/runs/${{ github.run_id }}
      - name: Verify manifest then save only proof with a non-force research push
        env:
          PROOF_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('research/neon_live_writer_freshness_2026_10_31/proof/physical_03/runs')/os.environ['PROOF_RUN_ID']
          manifest=json.loads((root/'sha256_manifest.json').read_text())
          assert manifest['schema']=='c6-physical-03-artifact-manifest-v1'
          for relative, expected in manifest['files'].items():
              path=(root/relative).resolve()
              assert path.is_relative_to(root.resolve()) and path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected
          print('ARTIFACT_MANIFEST_VERIFIED')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "research/neon_live_writer_freshness_2026_10_31/proof/physical_03/runs/$PROOF_RUN_ID"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(C6): save protected child physical proof [skip netlify]"
          git push origin HEAD:research-neon-live-writer-freshness-2026-10-31
