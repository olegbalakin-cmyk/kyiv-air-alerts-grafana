name: Audit city alert-source coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]
    paths:
      - "kyiv-air-alerts-grafana/scripts/audit_city_sources.py"
      - ".github/workflows/audit-city-sources.yml"

permissions:
  contents: write

concurrency:
  group: city-alert-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit oblast-center sources
        run: python scripts/audit_city_sources.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-source-audit
          path: |
            kyiv-air-alerts-grafana/data/city_source_audit.csv
            kyiv-air-alerts-grafana/data/city_source_audit.json
          if-no-files-found: error

      - name: Commit audit outputs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyiv-air-alerts-grafana/data/city_source_audit.csv kyiv-air-alerts-grafana/data/city_source_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Update city alert-source audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
