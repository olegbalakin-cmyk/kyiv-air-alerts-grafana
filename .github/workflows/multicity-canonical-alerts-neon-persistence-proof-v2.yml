name: Multicity canonical alerts Neon persistence proof v2

on:
  push:
    branches:
      - multicity-canonical-alerts-neon-persistence-proof-v2-2026-10-01

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    env:
      SITE_PROD_SHA: 928a566b7a8dc7916c93810eaafe319da3b28ee4
      VADIMKIN_SHA: 58ee75bc20113181b9ddf8029d4cbf3a62d8cd10
      CHILD_BRANCH_ID: br-icy-forest-b5mfyezq
      CHILD_DB_HOST: ep-shy-truth-b5ngaye8-pooler.c-7.us-east-2.aws.neon.tech
      PROOF_RESULT: ${{ runner.temp }}/multicity_canonical_alerts_neon_persistence_runtime.json
      BOUNDARY_RESULT: ${{ runner.temp }}/multicity_canonical_boundary.json

    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install dependencies
        run: pip install -r requirements-db-phase1.txt

      - name: Freeze accepted production artifacts
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            data/dashboard_data.json \
            data/alerts_combined.json \
            data/ukrainealarm_bridge.json \
            data/alerts_in_ua_bridge_2026-09-07_16.csv.gz.b64 \
            data/alerts_in_ua_bridge_2026-09-07_16.meta.json \
            data/alerts_in_ua_bridge_additional_2026-09-07_16.csv.gz.b64 \
            data/alerts_in_ua_bridge_additional_2026-09-07_16.meta.json \
            data/sevastopol_events.json
          do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SITE_PROD_SHA}/kyiv-air-alerts-grafana/${path}" \
              --output "${path}"
          done
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Vadimkin/ukrainian-air-raid-sirens-dataset/${VADIMKIN_SHA}/datasets/official_data_uk.csv" \
            --output "${RUNNER_TEMP}/official_data_uk.csv"

      - name: Regenerate exact frozen corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_multicity_canonical.py \
            --vadimkin-csv "${RUNNER_TEMP}/official_data_uk.csv" \
            --site-prod-sha "${SITE_PROD_SHA}" \
            --vadimkin-sha "${VADIMKIN_SHA}" \
            --output "${BOUNDARY_RESULT}"

      - name: Derive disposable target URL
        env:
          BASE_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit
          p=urlsplit(os.environ["BASE_DATABASE_URL"])
          if not p.username:
              raise SystemExit("missing DB username")
          auth=p.username + ((":"+p.password) if p.password is not None else "")
          port=f":{p.port}" if p.port else ""
          child=urlunsplit((p.scheme,f"{auth}@{os.environ['CHILD_DB_HOST']}{port}",p.path,p.query,p.fragment))
          print("::add-mask::"+child)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("CHILD_DATABASE_URL="+child+"\n")
          print("Disposable target URL derived; credentials not printed.")
          PY

      - name: Run focused and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/test_multicity_canonical_postgres.py -v
          python -m unittest tests/test_db_phase1_persistence.py -v
          python -m unittest tests/test_lviv_canonical_boundary_repair.py -v
          python -m unittest tests/test_differentiated_alert_postgres.py -v

      - name: Run real disposable Neon proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/proof_multicity_canonical_postgres.py prove \
            --boundary "${BOUNDARY_RESULT}" \
            --result "${PROOF_RESULT}"

      - name: Run fresh-process replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/proof_multicity_canonical_postgres.py retry \
            --boundary "${BOUNDARY_RESULT}" \
            --result "${PROOF_RESULT}"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multicity-canonical-alerts-neon-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/multicity_canonical_alerts_neon_persistence_runtime.json
            ${{ runner.temp }}/multicity_canonical_boundary.json
          if-no-files-found: warn
          retention-days: 30
