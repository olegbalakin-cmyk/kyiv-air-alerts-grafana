name: Multicity canonical alerts Neon persistence proof resume

on:
  push:
    branches:
      - multicity-canonical-alerts-neon-persistence-proof-resume-2026-10-01
    paths:
      - ".github/workflows/multicity-canonical-alerts-neon-persistence-proof-resume.yml"
      - "kyiv-air-alerts-grafana/scripts/proof_multicity_canonical_alerts_neon_persistence_resume.py"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kyiv-air-alerts-grafana
    env:
      CHILD_BRANCH_ID: br-icy-forest-b5mfyezq
      CHILD_DB_HOST: ep-shy-truth-b5ngaye8-pooler.c-7.us-east-2.aws.neon.tech

    steps:
      - name: Check out isolated continuation proof branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kyiv-air-alerts-grafana/requirements-db-phase1.txt

      - name: Install PostgreSQL proof dependencies
        run: pip install -r requirements-db-phase1.txt

      - name: Download accepted frozen 23-city canonical corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: multicity-canonical-boundary-36816630480-1
          path: ${{ runner.temp }}/accepted-boundary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: olegbalakin-cmyk/kyiv-air-alerts-grafana
          run-id: 36816630480

      - name: Prepare proof paths
        shell: bash
        run: |
          echo "CANONICAL_CORPUS_PATH=${RUNNER_TEMP}/accepted-boundary/multicity_canonical_boundary.json" >> "$GITHUB_ENV"
          echo "PROOF_RESULT_PATH=${RUNNER_TEMP}/multicity_canonical_alerts_neon_persistence_runtime.json" >> "$GITHUB_ENV"

      - name: Derive disposable child URL without printing credentials
        env:
          BASE_DATABASE_URL: ${{ secrets.PHASE1_PROD_SHADOW_DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          base = os.environ["BASE_DATABASE_URL"]
          child_host = os.environ["CHILD_DB_HOST"]
          parts = urlsplit(base)
          if not parts.username:
              raise SystemExit("database secret has no username")
          userinfo = parts.username
          if parts.password is not None:
              userinfo += ":" + parts.password
          port = f":{parts.port}" if parts.port else ""
          child = urlunsplit((parts.scheme, f"{userinfo}@{child_host}{port}", parts.path, parts.query, parts.fragment))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("CHILD_DATABASE_URL=" + child + "\n")
          print("Disposable child URL derived; credentials not printed.")
          PY

      - name: Run existing Phase-1 persistence regression tests
        run: python -m unittest tests/test_db_phase1_persistence.py -v

      - name: Gates A through G
        run: >-
          python scripts/proof_multicity_canonical_alerts_neon_persistence_resume.py
          --phase primary
          --corpus "$CANONICAL_CORPUS_PATH"
          --result "$PROOF_RESULT_PATH"

      - name: Gate H fresh-process exact replay
        run: >-
          python scripts/proof_multicity_canonical_alerts_neon_persistence_resume.py
          --phase fresh-replay
          --corpus "$CANONICAL_CORPUS_PATH"
          --result "$PROOF_RESULT_PATH"

      - name: Gates I through K and final verdict
        run: >-
          python scripts/proof_multicity_canonical_alerts_neon_persistence_resume.py
          --phase finalize
          --corpus "$CANONICAL_CORPUS_PATH"
          --result "$PROOF_RESULT_PATH"

      - name: Upload runtime proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multicity-canonical-alerts-neon-persistence-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multicity_canonical_alerts_neon_persistence_runtime.json
          if-no-files-found: warn
          retention-days: 30
