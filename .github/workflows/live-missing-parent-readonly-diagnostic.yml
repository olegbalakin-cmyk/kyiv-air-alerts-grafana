name: Read-only live missing-parent family sample

on:
  push:
    branches:
      - attack-event-live-missing-parent-diagnosis-2026-10-07
    paths:
      - ".github/workflows/live-missing-parent-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read recent UkraineAlarm family identities
        env:
          UKRAINEALARM_API_TOKEN: ${{ secrets.UKRAINEALARM_API_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          targets = [
              ("kharkiv", "1293", "exact-hromada"),
              ("zaporizhzhia", "564", "exact-hromada"),
              ("poltava", "109", "raion-proxy"),
              ("sumy", "114", "raion-proxy"),
          ]
          token = os.environ["UKRAINEALARM_API_TOKEN"].strip()

          def dt(v):
              x=datetime.fromisoformat(str(v).strip().replace("Z","+00:00"))
              if x.tzinfo is None: x=x.replace(tzinfo=timezone.utc)
              return x.astimezone(timezone.utc)
          def iso(x): return x.isoformat().replace("+00:00","Z")

          out=[]
          for city,rid,family in targets:
              url="https://api.ukrainealarm.com/api/v3/alerts/regionHistory?"+urllib.parse.urlencode({"regionId":rid})
              req=urllib.request.Request(url,headers={"Accept":"application/json","Authorization":token,"User-Agent":"kyiv-air-alerts-grafana/read-only-family-diagnostic"})
              with urllib.request.urlopen(req,timeout=60) as resp: payload=json.load(resp)
              groups=[payload] if isinstance(payload,dict) else [x for x in payload if isinstance(x,dict)]
              rows=[]
              for g in groups:
                  for a in g.get("alarms") or []:
                      if str(a.get("alertType") or "").upper()!="AIR" or not a.get("startDate") or not a.get("endDate"): continue
                      s,e=dt(a["startDate"]),dt(a["endDate"])
                      if e<=s: continue
                      si,ei=iso(s),iso(e)
                      eid=hashlib.sha256(f"{city}|{si}|{ei}".encode()).hexdigest()[:24]
                      rows.append({"city_key":city,"family":family,"region_id":rid,"historical_episode_id":eid,"start_at":si,"end_at":ei})
              rows.sort(key=lambda x:x["start_at"])
              out.append({"city_key":city,"family":family,"completed_count":len(rows),"recent":rows[-3:]})
          print("READ_ONLY_FAMILY_RESULT="+json.dumps(out,sort_keys=True))
          PY
